        const pageDivs = pages.map(function (pg, pIdx) {
            const isLastTablePage = (pIdx === pages.length - 1);
            const trsHtml = pg.map(function (item) { return renderRowTr(item.row, item.idx); }).join('');
            const pbStyle = (forExport === 'print' && pIdx > 0) ? 'page-break-before:always;break-before:page;' : '';
            return `<div class="tvr-page" style="${pbStyle}">
                ${header4LinesHtml}
                <table style="width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #000;">
                    ${tableHeadHtml}
                    <tbody>${trsHtml}</tbody>
                </table>
                ${isLastTablePage && !separateSignPage ? signHtml : ''}
            </div>`;
        });

        if (separateSignPage) {
            const pbStyle = (forExport === 'print') ? 'page-break-before:always;break-before:page;' : '';
            pageDivs.push(`<div class="tvr-page" style="${pbStyle}">${header4LinesHtml}<div style="margin-top:42px;">${signHtml}</div></div>`);
        }

        return `<div class="tvr-doc" style="font-family:'TH SarabunIT๙','TH SarabunPSK','TH Sarabun New',sans-serif;color:#000;width:100%;">${pageDivs.join(pageBreakHtml)}</div>`;
    }

    function refreshPlanLinkBanner() {
        const banner = document.getElementById('tv-plan-link-banner');
        const textEl = document.getElementById('tv-plan-link-text');
        const syncBtn = document.getElementById('btn-sync-claim-to-plan');
        if (!banner || !textEl) return;
        const plan = tvrLoadPlan();
        if (!plan || !Array.isArray(plan.items) || !plan.items.length) {
            banner.className = 'mb-2.5 p-2.5 rounded-lg border border-sky-300 bg-sky-50/90 text-[11px] text-sky-950 flex flex-wrap items-center justify-between gap-2';
            textEl.innerHTML = '📅 <b>แผน T&amp;V:</b> ยังไม่ได้สร้างหรือแนบไฟล์แผน — กรุณากด <b>✨ สร้างแผน</b> หรือ <b>📎 แนบไฟล์แผน (.docx)</b> ก่อนเพื่อให้การเบิกจ่ายสัมพันธ์กับแผน';
            if (syncBtn) syncBtn.classList.add('hidden');
            return;
        }

        const planFieldKeys = new Set();
        const planAllKeys = new Set();
        plan.items.forEach(function (it) {
            const k = tvrNormDateKey(it.dateDisplay || it.dateRaw);
            if (!k) return;
            planAllKeys.add(k);
            if (it.isFieldTrip) planFieldKeys.add(k);
        });

        const claimedRows = Array.from(document.querySelectorAll('#travel-days-list .travel-day-row'));
        const claimedKeys = new Set();
        const extraDates = [];
        claimedRows.forEach(function (r) {
            const dt = (r.querySelector('.day-date')?.value || '').trim();
            if (!dt) return;
            const k = tvrNormDateKey(dt);
            claimedKeys.add(k);
            if (!planAllKeys.has(k)) extraDates.push(dt);
        });

        let matchedCount = 0;
        planFieldKeys.forEach(function (k) { if (claimedKeys.has(k)) matchedCount++; });
        const totalPlanField = planFieldKeys.size;
        const planLabel = plan.monthHeader || plan.fileName || 'แผนที่แนบไว้';

        if (extraDates.length === 0 && totalPlanField > 0 && matchedCount === totalPlanField) {
            banner.className = 'mb-2.5 p-2.5 rounded-lg border border-emerald-300 bg-emerald-50/90 text-[11px] text-emerald-950 flex flex-wrap items-center justify-between gap-2';
            textEl.innerHTML = '✅ <b>การเบิกจ่ายตรงกับแผน T&amp;V 100%</b> (' + escH(planLabel) + ' · ออกพื้นที่ ' + matchedCount + '/' + totalPlanField + ' วัน)';
            if (syncBtn) syncBtn.classList.add('hidden');
        } else {
            banner.className = 'mb-2.5 p-2.5 rounded-lg border border-amber-300 bg-amber-50/90 text-[11px] text-amber-950 flex flex-wrap items-center justify-between gap-2';
            const warnParts = [];
            if (matchedCount < totalPlanField) warnParts.push('เบิกแล้ว ' + matchedCount + '/' + totalPlanField + ' วันตามแผน');
            if (extraDates.length) warnParts.push('มีวันที่ไม่อยู่ในแผน: ' + escH(extraDates.slice(0, 4).join(', ')) + (extraDates.length > 4 ? ' ...' : ''));
            textEl.innerHTML = '⚠️ <b>แผน T&amp;V (' + escH(planLabel) + '):</b> ' + warnParts.join(' · ');
            if (syncBtn) syncBtn.classList.remove('hidden');
        }
    }

    function tvrCollectFontStyles() {
        let out = '';
        try {
            document.querySelectorAll('style').forEach(function (st) {

    function tvrTriggerPrintWhenReady(w) {
        let printed = false;
        const doPrint = function () {
            if (printed) return;
            printed = true;
            try { w.focus(); w.print(); } catch (e) { /* ignore */ }
        };
        try {
            if (w.document && w.document.fonts && w.document.fonts.ready) {
                w.document.fonts.ready.then(function () {
                    setTimeout(doPrint, 180);
                });
            }
        } catch (e) { /* ignore */ }
        setTimeout(doPrint, 900);
    }

    async function tvrExportHtmlToPdfDirect(bodyHtml, opts) {
        const jsPDFCtor = (global.jspdf && global.jspdf.jsPDF) || global.jsPDF;
        if (typeof global.html2canvas !== 'function' || typeof jsPDFCtor !== 'function') {
            return false;
        }
        const orientation = (opts && opts.orientation) || 'landscape';
        const pageSelector = (opts && opts.pageSelector) || '.tvr-page';
        const fileName = ((opts && opts.fileName) || 'document').replace(/[^\u0E00-\u0E7Fa-zA-Z0-9_-]+/g, '_');
        const isLand = orientation === 'landscape';
        const marginX = isLand ? 8 : 12;
        const marginY = isLand ? 10 : 12;
        const stagePx = isLand ? 1060 : 720;

        if (typeof global.showToast === 'function') global.showToast('📄 กำลังสร้างไฟล์ PDF โดยตรง (ไม่ต้องรอเครื่องปริ้นท์)...');

        const stage = document.createElement('div');
        stage.style.cssText = 'position:absolute;left:-10000px;top:0;width:' + stagePx + 'px;background:#ffffff;color:#000000;padding:0;margin:0;box-sizing:border-box;font-family:"TH SarabunIT๙","TH SarabunPSK","TH Sarabun New",sans-serif;pointer-events:none;opacity:1;';
        stage.innerHTML = bodyHtml;
        document.body.appendChild(stage);

        try {
            if (document.fonts && document.fonts.ready) {
                try { await document.fonts.ready; } catch (e) { /* ignore */ }
            }
            const imgs = Array.from(stage.querySelectorAll('img'));
            await Promise.all(imgs.map(function (im) {
                if (im.complete) return Promise.resolve();
                return new Promise(function (res) {
                    im.onload = res; im.onerror = res;
                    setTimeout(res, 3000);
                });
            }));
            await new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); });

            let pageEls = Array.from(stage.querySelectorAll(pageSelector));
            if (!pageEls.length) pageEls = [stage];

            const pdf = new jsPDFCtor({ unit: 'mm', format: 'a4', orientation: orientation, compress: true });
            const pageW = pdf.internal.pageSize.getWidth();
            const pageH = pdf.internal.pageSize.getHeight();
            const maxW = pageW - marginX * 2;
            const maxH = pageH - marginY * 2;

            for (let i = 0; i < pageEls.length; i++) {
                if (typeof global.showToast === 'function') global.showToast('📄 กำลังสร้าง PDF หน้า ' + (i + 1) + '/' + pageEls.length + '...');
                const el = pageEls[i];
                const canvas = await global.html2canvas(el, {
                    scale: 2,
                    useCORS: true,
                    allowTaint: false,
                    backgroundColor: '#ffffff',
                    logging: false,
                    imageTimeout: 0,
                    windowWidth: stagePx + 40
                });
                const imgData = canvas.toDataURL('image/jpeg', 0.94);
                let drawW = maxW;
                let drawH = (canvas.height * drawW) / canvas.width;
                if (drawH > maxH) {
                    const ratio = maxH / drawH;
                    drawH = maxH;
                    drawW = drawW * ratio;
                }
                const offsetX = marginX + (maxW - drawW) / 2;
                if (i > 0) pdf.addPage();
                pdf.addImage(imgData, 'JPEG', offsetX, marginY, drawW, drawH, undefined, 'FAST');
            }
            pdf.save(fileName + '.pdf');
            if (typeof global.showToast === 'function') global.showToast('✅ ดาวน์โหลด ' + fileName + '.pdf (' + pageEls.length + ' หน้า) เรียบร้อยแล้ว!');
            return true;
        } catch (err) {
            console.error('Direct PDF export error:', err);
            return false;
        } finally {
            stage.remove();
        }
    }

    function tvrEnsurePlanItems() {
        let plan = tvrLoadPlan();
        if (plan && Array.isArray(plan.items) && plan.items.length) return plan;
        const cfg = getActiveOrgConfig();
        const items = [];
        document.querySelectorAll('#travel-days-list .travel-day-row').forEach(function (r, idx) {
            const dt = (r.querySelector('.day-date')?.value || '').trim();
            const dest = (r.querySelector('.day-dest')?.value || '').trim();
            if (!dt) return;
            const parsed = parseThaiDateCell(dt);
            const cleanLoc = dest.replace(new RegExp('\\s*อำเภอ' + cfg.amphoe.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*จังหวัด' + cfg.province.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*$', 'g'), '').trim() || cfg.officeName;
            items.push({
                seqNum: idx + 1,
                category: 'การเยี่ยมเยียน (VISITING)',
                activity: 'ปฏิบัติงานส่งเสริมการเกษตรในพื้นที่',
                detail: 'ติดตามเยี่ยมเยียนและให้คำแนะนำเกษตรกร',
                dateDisplay: parsed.display8708 || dt,

                dateIso: parsed.iso || '',
                dateParsed: parsed && parsed.day ? { day: parsed.day, monthAbbr: parsed.monthAbbr, monthFull: parsed.monthFull, yearBE: parsed.yearBE } : null,
                locationRaw: cleanLoc,
                targetCount: '',
                note: '',
                isFieldTrip: true
            });
        });
        plan = { fileName: 'manual', items: items };
        global.__tvPlanStore = plan;
        try { localStorage.setItem(TVR_STORAGE_KEY, JSON.stringify(plan)); } catch (e) { /* ignore */ }

    function applyChiefPlan(mode) {
        const chief = tvrLoadChiefPlan();
        if (!chief || !Array.isArray(chief.items) || !chief.items.length) {
            if (typeof global.showToast === 'function') global.showToast('ยังไม่มีแผนของเกษตรอำเภอที่บันทึกไว้ กรุณาให้เกษตรอำเภอสร้าง/แนบแผน หรือกด "💾 บันทึกเป็นแผนเกษตรอำเภอ" ก่อนครับ');
            return;
        }
        const cfg = getActiveOrgConfig();
        const officeName = cfg.officeName || ('สำนักงานเกษตรอำเภอ' + (cfg.amphoe || 'สีดา'));
        const allTambons = Array.isArray(cfg.tambons) && cfg.tambons.length ? cfg.tambons : [{ name: cfg.amphoe || 'สีดา', mooCount: 10 }];
        const selTambonVal = document.getElementById('tv-chief-random-tambon')?.value || '__ALL__';
        const poolTambons = (selTambonVal && selTambonVal !== '__ALL__')
            ? allTambons.filter(function (t) { return t.name === selTambonVal; })
            : allTambons;
        const activePool = poolTambons.length ? poolTambons : allTambons;

        let rr = Math.floor(Math.random() * 10);
        let plantHealthIdx = 0;
        const newItems = chief.items.map(function (src, idx) {
            const copy = Object.assign({}, src, { seqNum: idx + 1 });
            if (mode === 'random_tambon') {
                const rawLoc = String(copy.locationRaw || '');
                const rawAct = String(copy.activity || '') + ' ' + String(copy.category || '');
                const isOffice = /สำนักงาน|สนง\.|DM|WM|ประจำสัปดาห์|TRAINING|ถ่ายทอดความรู้/i.test(rawLoc + ' ' + rawAct) && !copy.isFieldTrip;
                if (isOffice) {
                    copy.locationRaw = officeName;
                    copy.isFieldTrip = false;
                } else {
                    const tam = activePool[(rr++) % activePool.length];
                    const locked = resolveSidaLockedPlace(copy.activity, copy.detail, tam.name, /สุขภาพพืช/i.test(rawAct) ? (plantHealthIdx++) : rr, true);
                    if (locked) {
                        copy.locationRaw = locked.locationRaw;
                        if (locked.targetCount) copy.targetCount = locked.targetCount;
                        if (locked.detail) copy.detail = locked.detail;
                        copy.isFieldTrip = true;
                    } else {
                        const maxMoo = Math.max(1, parseInt(tam.mooCount, 10) || 10);
                        const m1 = 1 + Math.floor(Math.random() * maxMoo);
                        let m2 = 1 + Math.floor(Math.random() * maxMoo);
                        if (maxMoo > 1 && m2 === m1) m2 = (m1 % maxMoo) + 1;
                        const moos = (maxMoo > 1 && Math.random() > 0.35) ? [m1, m2].sort(function (a, b) { return a - b; }) : [m1];
                        copy.locationRaw = 'หมู่ ' + moos.join(', ') + ' ตำบล' + tam.name;
                        copy.isFieldTrip = true;
                    }
                }
            }
            const resolved = resolveTvLocationRaw(copy.locationRaw || '');
            copy.isFieldTrip = resolved.isFieldTrip;
            copy.destOrder = resolved.destOrder;
            copy.destText = resolved.destText;
            copy.customStops = resolved.customStops;
            copy.stops = resolved.stops;
            copy.routeSummary = resolved.routeSummary;
            return copy;
        });

        const newPlan = {
            fileName: mode === 'random_tambon' ? 'linked_chief_random_tambon' : 'linked_chief_same_plan',
            monthHeader: chief.monthHeader || '',
            items: newItems
        };
        global.__tvPlanStore = newPlan;
        try { localStorage.setItem(TVR_STORAGE_KEY, JSON.stringify(newPlan)); } catch (e) { /* ignore */ }
        renderTvPlan();
        renderTvReport(true);
        refreshPlanLinkBanner();
        if (typeof global.switchDocFilter === 'function') global.switchDocFilter('tvplan');
        if (typeof global.showToast === 'function') {
            global.showToast(mode === 'random_tambon'
                ? '🎲 ลิงก์กิจกรรมตามแผนเกษตรอำเภอ + สุ่มสถานที่ใน' + (selTambonVal === '__ALL__' ? 'ทุกตำบล' : ('ตำบล' + selTambonVal)) + ' แล้ว (' + newItems.length + ' รายการ)'
                : '🤝 คัดลอกแผนไปด้วยกันตามเกษตรอำเภอเรียบร้อยแล้ว (' + newItems.length + ' รายการ)');
        }
    }

                        <div style="font-weight:700;">ผู้บังคับบัญชา/ผู้รับรอง</div>
                        <div style="margin-top:18px;">........................................................</div>
                        <div>( ${planRightNameHtml} )</div>

                </tr>

        const renderPlanRow = function (r) {
            const editAttr = function (field) {
                return isScreen ? (` contenteditable="true" spellcheck="false" onblur="window.__tvReport.updatePlanField(${r.idx}, '${field}', this.innerText)"`) : '';
            };
            const delBtn = isScreen ? `<div class="no-print" style="margin-top:4px;"><button type="button" onclick="window.__tvReport.deletePlanRow(${r.idx})" style="font-size:10px;color:#dc2626;background:#fef2f2;border:1px solid #fecaca;border-radius:4px;padding:1px 5px;cursor:pointer;" title="ลบแถวนี้">ลบ</button></div>` : '';
            const dateCellContent = r.dateHtml;
            const locCellContent = tvrFormatLocationHtml(r.location);
            return `<tr>
                <td style="${tdStyle}text-align:center;">${r.seq}${delBtn}</td>
                <td style="${tdStyle}"${editAttr('category')}>${escH(r.category)}</td>
                <td style="${tdStyle}"${editAttr('activity')}>${escH(r.activity)}</td>
                <td style="${tdStyle}"${editAttr('detail')}>${tvrFormatDetailHtml(r.detail)}</td>
                <td style="${tdStyle}text-align:center;"${editAttr('date')}>${dateCellContent}</td>
                <td style="${tdStyle}"${editAttr('location')}>${locCellContent}</td>
                <td style="${tdStyle}text-align:right;"${editAttr('targetCount')}>${escH(r.targetCount)}</td>
                <td style="${tdStyle}"${editAttr('note')}>${escH(r.note)}</td>
            </tr>`;
        };

        if (!items.length) {
            return `<div class="tvr-doc" style="font-family:'TH SarabunIT๙','TH SarabunPSK','TH Sarabun New',sans-serif;color:#000;width:100%;">
                <div class="tvr-page">${header4LinesHtml}
                    <table style="width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #000;">
                        ${tableHeadHtml}
                        <tbody><tr><td colspan="8" style="${tdStyle}text-align:center;padding:16px;color:#64748b;">ยังไม่มีข้อมูลแผนดำเนินงาน (นำเข้าไฟล์ .docx หรือกด "➕ เพิ่มแถวแผน")</td></tr></tbody>
                    </table>
                    ${signHtml}
                </div>
            </div>`;
        }

        const MAX_WEIGHT_PER_PAGE = 15;
        const pages = [];
        let curPage = [];
        let curWeight = 0;
        items.forEach(function (r) {
            const actLines = Math.max(1, Math.ceil(String(r.activity || '').length / 22));
            const detLines = Math.max(1, Math.ceil(String(r.detail || '').length / 28));
            const locLines = Math.max(2, Math.ceil(String(r.location || '').length / 22));
            const w = Math.max(2, actLines, detLines, locLines);
            if (curPage.length > 0 && (curWeight + w > MAX_WEIGHT_PER_PAGE || curPage.length >= 6)) {
                pages.push(curPage);
                curPage = [];
                curWeight = 0;
            }
            curPage.push({ row: r, weight: w });
            curWeight += w;
        });
        if (curPage.length) pages.push(curPage);

        const lastPageWeight = pages[pages.length - 1].reduce(function (acc, x) { return acc + x.weight; }, 0);
        const separateSignPage = lastPageWeight > 9;
        const pageBreakHtml = (mode === 'word')
            ? '<br clear="all" style="page-break-before:always;mso-break-type:page-break;mso-special-character:line-break" />'

            const isLastTablePage = (pIdx === pages.length - 1);
            const trsHtml = pg.map(function (item) { return renderPlanRow(item.row); }).join('');

                    ${tableHeadHtml}
                    <tbody>${trsHtml}</tbody>
                </table>
                ${isLastTablePage && !separateSignPage ? signHtml : ''}
            </div>`;
        });

        if (separateSignPage) {
            const pbStyle = (mode === 'print') ? 'page-break-before:always;break-before:page;' : '';
            pageDivs.push(`<div class="tvr-page" style="${pbStyle}">${header4LinesHtml}<div style="margin-top:42px;">${signHtml}</div></div>`);
        }

        return `<div class="tvr-doc" style="font-family:'TH SarabunIT๙','TH SarabunPSK','TH Sarabun New',sans-serif;color:#000;width:100%;">${pageDivs.join(pageBreakHtml)}</div>`;
    }

    function renderTvPlan() {
        const paper = document.getElementById('tv-plan-paper');
        if (!paper) return;
        paper.innerHTML = tvrBuildPlanDocumentHtml('screen');
    }

    function updatePlanField(idx, field, val) {
        const plan = tvrEnsurePlanItems();
        const it = plan.items[idx];
        if (!it) return;
        const cleanVal = (field === 'detail' || field === 'location' || field === 'activity' || field === 'note')
            ? String(val || '').replace(/\r\n/g, '\n').replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim()
            : String(val || '').replace(/\s+/g, ' ').trim();
        const oldDateKey = tvrNormDateKey(it.dateDisplay || it.dateRaw);

        if (field === 'date') {
            const parsed = parseThaiDateCell(cleanVal);
            it.dateRaw = cleanVal;
            it.dateDisplay = parsed.display8708 || cleanVal;
            it.dateIso = parsed.iso || '';
            it.dateParsed = parsed && parsed.day ? { day: parsed.day, monthAbbr: parsed.monthAbbr, monthFull: parsed.monthFull, yearBE: parsed.yearBE } : null;
        } else if (field === 'location') {
            it.locationRaw = cleanVal;
            const resolved = resolveTvLocationRaw(cleanVal);
            it.isFieldTrip = resolved.isFieldTrip;
        } else {
            it[field] = cleanVal;
        }
        tvrSavePlanStore(plan);

        // ลิงก์อัปเดตไปที่แถวในตัวเบิก 8708 + บก.111 ทันทีเมื่อแก้วันที่หรือสถานที่!
        if (field === 'date' || field === 'location') {
            let linkedRow = null;
            document.querySelectorAll('#travel-days-list .travel-day-row').forEach(function (r) {
                const k = tvrNormDateKey(r.querySelector('.day-date')?.value || '');
                if (!linkedRow && oldDateKey && k === oldDateKey) linkedRow = r;
            });
            if (linkedRow) {
                if (field === 'date') {
                    const dtInp = linkedRow.querySelector('.day-date');
                    if (dtInp) dtInp.value = it.dateDisplay;
                } else if (field === 'location') {
                    const resolved = resolveTvLocationRaw(it.locationRaw);
                    const destInp = linkedRow.querySelector('.day-dest');
                    if (destInp) destInp.value = resolved.destText;
                    linkedRow.dataset.customStops = resolved.customStops.length ? JSON.stringify(resolved.customStops) : '';
                    if (typeof global.setRowDestOrder === 'function') {
                        global.setRowDestOrder(linkedRow, resolved.destOrder || []);
                    }
                    const fuelChk = linkedRow.querySelector('.day-fuel-chk');
                    if (fuelChk) fuelChk.checked = !!resolved.isFieldTrip;
                    renderRowDohStops(linkedRow);
                }
                if (typeof global.syncRowsToSummaryAndTotals === 'function') global.syncRowsToSummaryAndTotals();
                if (typeof global.updatePreview === 'function') global.updatePreview();
                if (typeof global.scheduleSave === 'function') global.scheduleSave();
                if (typeof global.showToast === 'function') global.showToast('อัปเดตแผนและลิงก์เข้าตัวเบิก 8708 + บก.111 เรียบร้อยแล้ว');
            }
        }
        // อัปเดตรายงานผล T&V ให้ตรงกันทันที
        renderTvReport(false);
    }

    function addPlanRow() {
        const plan = tvrEnsurePlanItems();
        const cfg = getActiveOrgConfig();
        const last = plan.items[plan.items.length - 1];
        const defaultDate = (last && last.dateDisplay) ? last.dateDisplay : '1 พ.ย. 69';
        const parsed = parseThaiDateCell(defaultDate);
        plan.items.push({
            seqNum: plan.items.length + 1,
            category: 'การเยี่ยมเยียน (VISITING)',
            activity: 'ปฏิบัติงานส่งเสริมการเกษตรในพื้นที่',
            detail: 'ติดตามเยี่ยมเยียนเกษตรกร',
            dateDisplay: parsed.display8708 || defaultDate,
            dateRaw: defaultDate,
            dateIso: parsed.iso || '',
            dateParsed: parsed && parsed.day ? { day: parsed.day, monthAbbr: parsed.monthAbbr, monthFull: parsed.monthFull, yearBE: parsed.yearBE } : null,
            locationRaw: 'หมู่ 1 ตำบล' + (cfg.officeTambon || cfg.amphoe),
            targetCount: '10',
            note: '',

    function deletePlanRow(idx) {
        const plan = tvrEnsurePlanItems();
        if (!plan.items[idx]) return;
        const removed = plan.items.splice(idx, 1)[0];
        plan.items.forEach(function (it, i) { it.seqNum = i + 1; });
        tvrSavePlanStore(plan);
        renderTvPlan();
        renderTvReport(false);
        if (typeof global.showToast === 'function') {
            global.showToast('ลบแถวแผนวันที่ ' + (removed.dateDisplay || '') + ' แล้ว (กด "🔄 ซิงก์เข้าตัวเบิก 8708" เพื่ออัปเดตตารางเบิกทั้งหมด)');
        }
    }

    function syncPlanToClaim8708() {
        const plan = tvrEnsurePlanItems();
        const fieldItems = (plan.items || []).map(function (it) {
            const parsed = parseThaiDateCell(it.dateDisplay || it.dateRaw);
            const resolved = resolveTvLocationRaw(it.locationRaw);
            return Object.assign({}, it, {
                dateParsed: parsed,
                dateDisplay: parsed.display8708 || it.dateDisplay || it.dateRaw,
                dateIso: parsed.iso || it.dateIso || '',
                isFieldTrip: resolved.isFieldTrip,
                destOrder: resolved.destOrder,
                destText: resolved.destText,
                customStops: resolved.customStops
            });
        }).filter(function (it) { return it.isFieldTrip; }).sort(function (a, b) {
            return (a.dateIso || '9999-99-99').localeCompare(b.dateIso || '9999-99-99');
        });

        if (!fieldItems.length) {
            if (typeof global.showToast === 'function') global.showToast('ไม่พบวันออกพื้นที่ในแผนสำหรับซิงก์เข้าตัวเบิก');
            return;
        }

        const existingMap = {};
        document.querySelectorAll('#travel-days-list .travel-day-row').forEach(function (r) {
            const k = tvrNormDateKey(r.querySelector('.day-date')?.value || '');
            if (!k) return;
            existingMap[k] = {
                km: r.querySelector('.day-km')?.value || '',
                amount: r.querySelector('.day-amount')?.value || '',
                mapDataUrl: r.querySelector('.day-map-data')?.value || '',
                dohOpened: r.dataset.dohOpened === '1',
                out: r.querySelector('.day-out')?.value || '',
                inn: r.querySelector('.day-in')?.value || ''
            };
        });

        const list = document.getElementById('travel-days-list');
        if (list && typeof global.createTravelDayRow === 'function') {
            list.innerHTML = '';
            fieldItems.forEach(function (it, i) {
                const prev = existingMap[tvrNormDateKey(it.dateDisplay)] || null;
                const tOut = (prev && prev.out) ? prev.out : '09.00';
                const tIn = (prev && prev.inn) ? prev.inn : '16.00';
                const sumT = typeof global.calcTimeDiff === 'function' ? global.calcTimeDiff(tOut, tIn) : '7.00';
                const row = global.createTravelDayRow({
                    date: it.dateDisplay,
                    out: tOut,
                    inn: tIn,
                    sum: sumT,
                    dest: it.destText,
                    destOrder: it.destOrder,
                    km: prev ? prev.km : '',
                    amount: prev ? prev.amount : '',
                    mapDataUrl: prev ? prev.mapDataUrl : '',
                    fuelChecked: true
                });
                if (it.customStops && it.customStops.length) row.dataset.customStops = JSON.stringify(it.customStops);
                if (prev && prev.dohOpened) row.dataset.dohOpened = '1';
                list.appendChild(row);
                renderRowDohStops(row);
            });
            document.querySelectorAll('.travel-day-row').forEach(function (row, idx) {
                const num = row.querySelector('.day-row-num');
                if (num) num.textContent = (idx + 1) + '.';
            });
        }
        if (typeof global.syncRowsToSummaryAndTotals === 'function') global.syncRowsToSummaryAndTotals();
        if (typeof global.updatePreview === 'function') global.updatePreview();
        if (typeof global.scheduleSave === 'function') global.scheduleSave();
        renderTvReport(false);
        if (typeof global.showToast === 'function') {
            global.showToast('ซิงก์แผนดำเนินงาน ' + fieldItems.length + ' วัน เข้าตัวเบิก 8708 + บก.111 เรียบร้อยแล้ว (คง กม. และรูปแผนที่เดิมไว้ครบ)');
        }
    }

    function tvrDownloadExcelFile(sheetName, tableInnerHtml, fileBaseName) {
        const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">' +
            '<head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>' +

            '<x:WorksheetOptions><x:PageSetup><x:Layout x:Orientation="Landscape"/><x:PageMargins x:Bottom="0.5" x:Left="0.4" x:Right="0.4" x:Top="0.5"/></x:PageSetup><x:Print><x:ValidPrinterInfo/><x:PaperSizeIndex>9</x:PaperSizeIndex><x:FitWidth>1</x:FitWidth><x:FitHeight>0</x:FitHeight></x:Print><x:FitToPage/></x:WorksheetOptions>' +
            '</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->' +
            '<style>' +
            'body, table, td, th { font-family: "TH SarabunIT๙", "TH SarabunPSK", "TH Sarabun New", sans-serif; font-size: 14pt; color: #000; }' +

            '.xl-sign { border: none; text-align: center; font-size: 15pt; padding-top: 8px; }' +
            '</style></head><body>' + tableInnerHtml + '</body></html>';
        const blob = new Blob(['\ufeff', html], { type: 'application/vnd.ms-excel;charset=utf-8' });

    /**
     * เงื่อนไขล็อกพื้นที่จริงของ อ.สีดา (ต.หนองตาดใหญ่ + ศจช./ศดปช./สุขภาพพืช)
     * รองรับการขยายเพิ่มตำบลอื่นในอนาคตได้ง่าย
     */
    function pickFromPool(pool, count, seed, randomMode) {
        if (!pool || !pool.length) return [];
        const arr = pool.slice();
        if (randomMode) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
            }
            return arr.slice(0, Math.min(count, arr.length)).sort(function (a, b) { return a - b; });
        }
        const out = [];
        const s = Math.abs(seed || 0);
        for (let k = 0; k < Math.min(count, arr.length); k++) {
            const v = arr[(s + k) % arr.length];
            if (out.indexOf(v) === -1) out.push(v);
        }
        return out.sort(function (a, b) { return a - b; });
    }

    function resolveSidaLockedPlace(actText, detText, tambonName, seed, randomMode) {
        const cfg = getActiveOrgConfig();
        if (!cfg || !cfg.isSida) return null;
        const txt = (String(actText || '') + ' ' + String(detText || '')).toLowerCase();

        // 1) เงื่อนไขระดับอำเภอสีดา (ข้ามตำบล — ล็อกจุดจริง)
        if (/สุขภาพพืช/.test(txt)) {
            const sites = [
                { locationRaw: 'หมู่ 7 ตำบลโพนทอง', targetCount: '1' },
                { locationRaw: 'หมู่ 4 ตำบลสามเมือง', targetCount: '1' }
            ];
            return sites[Math.abs(seed || 0) % sites.length];
        }
        if (/ศดปช|ดินปุ๋ย/.test(txt)) {
            return { locationRaw: 'หมู่ 4 ตำบลสามเมือง', targetCount: '10' };
        }
        if (/ศจช|ศูนย์จัดการศัตรูพืช/.test(txt)) {
            const sites = ['หมู่ 4 ตำบลสามเมือง', 'หมู่ 7 ตำบลโพนทอง'];
            const idx = randomMode ? Math.floor(Math.random() * sites.length) : (Math.abs(seed || 0) % sites.length);
            return { locationRaw: sites[idx], targetCount: '30' };
        }

        // 1.5) ด้านข้อมูลสารสนเทศ (DATA MANAGEMENT): สุ่ม 2-4 หมู่บ้านในตำบลตัวเอง บ้านละ 50 คน
        if (/ข้อมูลสารสนเทศ|ทะเบียนเกษตรกร|data management/.test(txt) && tambonName) {
            const tamObj = (cfg.tambons || []).find(function (t) { return t && t.name === tambonName; });
            const maxMoo = Math.max(1, parseInt(tamObj && tamObj.mooCount, 10) || 10);
            const allMoos = [];
            for (let m = 1; m <= maxMoo; m++) allMoos.push(m);
            const pickCnt = Math.min(maxMoo, 2 + Math.floor(Math.random() * 3)); // 2-4 บ้าน
            const moos = pickFromPool(allMoos, pickCnt, seed, true);
            return {
                locationRaw: 'หมู่ ' + moos.join(', ') + ' ตำบล' + tambonName,
                targetCount: String(moos.length * 50)
            };
        }

        // 1.6) เกษตรที่เป็นมิตรกับสิ่งแวดล้อม: ทุกหมู่บ้านในอำเภอสีดา (สุ่ม 3-4 หมู่บ้านในตำบลที่สุ่มได้)
        if (/มิตรกับสิ่งแวดล้อม|หยุดเผา/.test(txt)) {
            const allTams = (cfg.tambons && cfg.tambons.length) ? cfg.tambons : [{ name: tambonName || 'สีดา', mooCount: 10 }];
            const tIdx = randomMode ? Math.floor(Math.random() * allTams.length) : (Math.abs(seed || 0) % allTams.length);
            const tObj = allTams[tIdx];
            const maxMoo = Math.max(1, parseInt(tObj.mooCount, 10) || 10);
            const pool = [];
            for (let m = 1; m <= maxMoo; m++) pool.push(m);
            const pickCnt = Math.min(maxMoo, 3 + Math.floor(Math.random() * 2)); // 3-4 บ้าน
            const moos = pickFromPool(pool, pickCnt, seed, true);
            return {
                locationRaw: 'หมู่ ' + moos.join(', ') + ' ตำบล' + tObj.name,
                targetCount: '30'
            };
        }

        // 1.7) เกษตรอินทรีย์ & พัฒนาคุณภาพสินค้าเกษตร (GAP): ทุกหมู่บ้านในตำบลที่เลือก สุ่ม 3-4 บ้าน บ้านละ 5 คน
        if (/เกษตรอินทรีย์|พัฒนาคุณภาพสินค้าเกษตร|\bgap\b/.test(txt) && tambonName) {
            const tamObj = (cfg.tambons || []).find(function (t) { return t && t.name === tambonName; });
            const maxMoo = Math.max(1, parseInt(tamObj && tamObj.mooCount, 10) || 10);
            const pool = [];
            for (let m = 1; m <= maxMoo; m++) pool.push(m);
            const pickCnt = Math.min(maxMoo, 3 + Math.floor(Math.random() * 2)); // 3-4 บ้าน
            const moos = pickFromPool(pool, pickCnt, seed, true);
            return {
                locationRaw: 'หมู่ ' + moos.join(', ') + ' ตำบล' + tambonName,
                targetCount: String(moos.length * 5)
            };
        }

        // 1.8) ศพก. (หลัก / เครือข่าย): หลักอยู่หมู่ 4 ต.สามเมือง, เครือข่ายอยู่หมู่ 4 ต.หนองตาดใหญ่
        if (/ศพก/.test(txt)) {
            if (String(tambonName || '').trim() === 'สามเมือง') {
                return {
                    locationRaw: 'หมู่ 4 ตำบลสามเมือง',
                    targetCount: '10',
                    detail: 'ติดตามเยี่ยมเยียนศูนย์เรียนรู้การเพิ่มประสิทธิภาพการผลิตสินค้าเกษตร (ศพก. หลัก)'
                };
            }
            if (String(tambonName || '').trim() === 'หนองตาดใหญ่') {
                return {
                    locationRaw: 'หมู่ 4 ตำบลหนองตาดใหญ่',
                    targetCount: '10',
                    detail: 'ติดตามเยี่ยมเยียนศูนย์เรียนรู้การเพิ่มประสิทธิภาพการผลิตสินค้าเกษตร (ศพก. เครือข่าย)'
                };
            }
        }

        // 2) เงื่อนไขล็อกเฉพาะตำบลหนองตาดใหญ่
        if (String(tambonName || '').trim() === 'หนองตาดใหญ่') {
            if (/แปลงใหญ่|เมล็ดพันธุ์ข้าว|ศูนย์ข้าว/.test(txt)) {
                const moos = pickFromPool([5, 6], 1, seed, randomMode);
                return { locationRaw: 'หมู่ ' + moos.join(', ') + ' ตำบลหนองตาดใหญ่', targetCount: '30' };
            }
            if (/smart farmer|ysf|young smart/.test(txt)) {
                const moos = pickFromPool([3, 5], 1, seed, randomMode);
                return { locationRaw: 'หมู่ ' + moos.join(', ') + ' ตำบลหนองตาดใหญ่', targetCount: '2' };
            }
            if (/เกษตรอินทรีย์|พัฒนาคุณภาพสินค้าเกษตร|\bgap\b/.test(txt)) {
                const moos = pickFromPool([1, 2, 3, 4, 5, 6, 7, 8, 9], 1, seed, randomMode);
                return { locationRaw: 'หมู่ ' + moos.join(', ') + ' ตำบลหนองตาดใหญ่', targetCount: String(moos.length * 5) };
            }
            if (/วิสาหกิจ|แม่บ้าน|กลุ่มเกษตรกร/.test(txt)) {
                const moos = pickFromPool([2, 3, 4, 5, 8, 9], 2, seed, randomMode);
                return { locationRaw: 'หมู่ ' + moos.join(', ') + ' ตำบลหนองตาดใหญ่', targetCount: '30' };
            }
            if (/มูลค่าสูง/.test(txt)) {
                const moos = pickFromPool([2, 3, 8, 9], 2, seed, randomMode);
                return { locationRaw: 'หมู่ ' + moos.join(', ') + ' ตำบลหนองตาดใหญ่', targetCount: '10' };
            }
            if (/zoning|agri-map|agrimap/.test(txt)) {
                const pickCnt = 2 + Math.floor(Math.random() * 3); // 2-4 บ้านจากหมู่ 2, 3, 8, 9
                const moos = pickFromPool([2, 3, 8, 9], pickCnt, seed, true);
                return { locationRaw: 'หมู่ ' + moos.join(', ') + ' ตำบลหนองตาดใหญ่', targetCount: String(moos.length * 2) };
            }
        }
        return null;
    }

    const TVB_FIXED_THAI_HOLIDAYS = {
        1: [1],
        4: [6, 13, 14, 15],
        5: [4],
        6: [3],
        7: [28],
        8: [12],
        10: [13, 23],
        12: [5, 10, 31]
    };
    let _tvbHolidaySet = new Set();
    let _tvbLastCalKey = '';

    function renderBuilderHolidayCalendar(forceResetDefaults) {
        const calHost = document.getElementById('tvb-holiday-calendar');
        const sumHost = document.getElementById('tvb-holiday-summary');
        const hid = document.getElementById('tvb-holidays');
        if (!calHost) return;
        const month = parseInt(document.getElementById('tvb-month')?.value || '11', 10);
        const yearBE = parseInt(document.getElementById('tvb-year')?.value || '2569', 10);
        const yearCE = yearBE > 2400 ? (yearBE - 543) : yearBE;
        const fiscalBE = (month >= 10) ? (yearBE + 1) : yearBE;
        const fyBadge = document.getElementById('tvb-fiscal-badge');
        if (fyBadge) fyBadge.textContent = 'ปีงบประมาณ พ.ศ. ' + fiscalBE;
        const calKey = yearBE + '-' + month;
        if (forceResetDefaults || calKey !== _tvbLastCalKey) {
            _tvbLastCalKey = calKey;
            _tvbHolidaySet = new Set(TVB_FIXED_THAI_HOLIDAYS[month] || []);
        }

        const daysInMonth = new Date(yearCE, month, 0).getDate();
        const firstDow = new Date(yearCE, month - 1, 1).getDay();
        const dNames = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
        let html = dNames.map(function (dn, i) {
            const cls = (i === 0 || i === 6) ? 'text-rose-600 font-bold pb-1' : 'text-slate-600 font-bold pb-1';
            return `<div class="${cls}">${dn}</div>`;
        }).join('');

        for (let b = 0; b < firstDow; b++) {
            html += '<div></div>';
        }

        let meetCount = 0;
        let fieldCount = 0;
        const includeMeetings = !!(document.getElementById('tvb-include-meetings')?.checked);

        for (let d = 1; d <= daysInMonth; d++) {
            const dow = new Date(yearCE, month - 1, d).getDay();
            const isWknd = (dow === 0 || dow === 6);
            const isHol = _tvbHolidaySet.has(d);
            if (isWknd) {
                html += `<div class="py-1 rounded bg-slate-100 text-slate-400 select-none" title="เสาร์-อาทิตย์ (หยุดอัตโนมัติ)">${d}</div>`;
            } else {
                if (!isHol) {
                    if (dow === 1 && includeMeetings) meetCount++;
                    else fieldCount++;
                }
                const btnCls = isHol
                    ? 'py-1 rounded bg-rose-600 text-white font-bold shadow-sm cursor-pointer hover:bg-rose-700'
                    : (dow === 1 && includeMeetings
                        ? 'py-1 rounded bg-indigo-50 text-indigo-800 border border-indigo-200 font-semibold cursor-pointer hover:bg-rose-100'
                        : 'py-1 rounded bg-emerald-50/70 text-emerald-900 border border-emerald-200 font-medium cursor-pointer hover:bg-rose-100');
                const title = isHol ? 'วันหยุดราชการ/วันลา (คลิกเพื่อยกเลิก)' : (dow === 1 && includeMeetings ? 'วันประชุม สนง. (คลิกเพื่อติ๊กเป็นวันหยุด)' : 'วันออกพื้นที่ (คลิกเพื่อติ๊กเป็นวันหยุด)');
                html += `<button type="button" onclick="window.__tvReport?.toggleBuilderHoliday(${d})" class="${btnCls}" title="${title}">${d}${isHol ? '✕' : ''}</button>`;
            }
        }
        calHost.innerHTML = html;

        const sortedHols = Array.from(_tvbHolidaySet).filter(function (d) {
            if (d < 1 || d > daysInMonth) return false;
            const dw = new Date(yearCE, month - 1, d).getDay();
            return dw !== 0 && dw !== 6;
        }).sort(function (a, b) { return a - b; });
        if (hid) hid.value = sortedHols.join(', ');
        if (sumHost) {
            const holText = sortedHols.length
                ? ('<span class="text-rose-700 font-semibold">วันหยุดที่ติ๊ก: วันที่ ' + sortedHols.join(', ') + ' (' + sortedHols.length + ' วัน)</span>')
                : '<span class="text-slate-500">ยังไม่ได้ติ๊กวันหยุดราชการเพิ่ม</span>';
            sumHost.innerHTML = holText + ' · <span class="text-indigo-800 font-semibold">ประชุม สนง. ' + meetCount + ' วัน</span> · <span class="text-emerald-800 font-semibold">ออกพื้นที่ ' + fieldCount + ' วัน</span>';
        }
    }

    function toggleBuilderHoliday(dayNum) {

                    <span class="leading-tight"><b class="text-slate-800">${escH(a.activity)}</b> <span class="text-[10px] text-slate-500">(${escH(a.target)} ราย)</span></span>

    function generateFromBuilder(alsoSyncClaim) {
        const month = parseInt(document.getElementById('tvb-month')?.value || '11', 10);
        const yearBE = parseInt(document.getElementById('tvb-year')?.value || '2569', 10);
        const yearCE = yearBE > 2400 ? (yearBE - 543) : yearBE;
        const fiscalBE = (month >= 10) ? (yearBE + 1) : yearBE;
        const fyBadge = document.getElementById('tvb-fiscal-badge');
        if (fyBadge) fyBadge.textContent = 'ปีงบประมาณ พ.ศ. ' + fiscalBE;
        const holidayRaw = (document.getElementById('tvb-holidays')?.value || '');
        const holidays = new Set((holidayRaw.match(/\d+/g) || []).map(function (x) { return parseInt(x, 10); }));
        const includeMeetings = !!(document.getElementById('tvb-include-meetings')?.checked);
        const meetingCount = String(document.getElementById('tvb-meeting-count')?.value || '7').trim() || '7';
        const mooPerDay = parseInt(document.getElementById('tvb-moo-per-day')?.value || '3', 10);

        const selTambons = Array.from(document.querySelectorAll('#tvb-tambon-list .tvb-tambon-chk:checked')).map(function (el) {
            return { name: el.getAttribute('data-name') || '', mooCount: parseInt(el.getAttribute('data-moos') || '10', 10) || 10 };
        }).filter(function (t) { return !!t.name; });
        const selActs = Array.from(document.querySelectorAll('#tvb-activity-list .tvb-act-chk:checked')).map(function (el) {
            return TVB_STANDARD_ACTIVITIES[parseInt(el.getAttribute('data-idx'), 10)];
        }).filter(Boolean);

        if (!selTambons.length) {
            if (typeof global.showToast === 'function') global.showToast('กรุณาเลือกอย่างน้อย 1 ตำบลครับ');
            return;
        }
        if (!selActs.length) {
            if (typeof global.showToast === 'function') global.showToast('กรุณาเลือกอย่างน้อย 1 กิจกรรมครับ');
            return;
        }

        const mAbbr = ['', 'ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
        const mFull = ['', 'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        const daysInMonth = new Date(yearCE, month, 0).getDate();
        const cfg = getActiveOrgConfig();
        const shortOffice = cfg.isSida ? 'สนง.กษอ.สีดา' : cfg.officeName;

        const meetingDays = [];
        const fieldDays = [];
        for (let d = 1; d <= daysInMonth; d++) {
            if (holidays.has(d)) continue;
            const dow = new Date(yearCE, month - 1, d).getDay();
            if (dow === 0 || dow === 6) continue; // เว้น เสาร์-อาทิตย์
            const y2 = String(yearBE).slice(-2);
            const dateDisplay = d + ' ' + mAbbr[month] + ' ' + y2;
            const dateIso = String(yearCE).padStart(4, '0') + '-' + String(month).padStart(2, '0') + '-' + String(d).padStart(2, '0');
            const dateParsed = { day: d, monthAbbr: mAbbr[month], monthFull: mFull[month], yearBE: yearBE };
            if (dow === 1 && includeMeetings) {
                meetingDays.push({ day: d, dateDisplay: dateDisplay, dateIso: dateIso, dateParsed: dateParsed });
            } else {
                fieldDays.push({ day: d, dateDisplay: dateDisplay, dateIso: dateIso, dateParsed: dateParsed });
            }
        }

        const builtItems = [];
        // 1. หมวด TRAINING (DM / WM วันจันทร์)
        meetingDays.forEach(function (md, idx) {
            const isDm = (idx === 0);
            builtItems.push({
                seqNum: builtItems.length + 1,
                category: 'การถ่ายทอดความรู้ (TRAINING)',
                activity: isDm ? 'District Meeting : DM' : 'Weekly Meeting : WM',
                detail: isDm ? 'ประชุมสนง.กษอ.\nประจำเดือน (DM)' : 'ประชุมสนง.กษอ.\nประจำสัปดาห์ (WM)',
                dateDisplay: md.dateDisplay,
                dateRaw: md.dateDisplay,
                dateIso: md.dateIso,
                dateParsed: md.dateParsed,
                locationRaw: shortOffice,
                targetCount: meetingCount,
                note: '',
                isFieldTrip: false
            });
        });

        // 2. แยกกิจกรรม VISITING กับ DATA MANAGEMENT แล้วกระจายตามวันออกพื้นที่และหมู่บ้าน
        const plantHealthAct = selActs.find(function (a) { return /สุขภาพพืช/.test(a.activity); }) || null;
        const visitingActs = selActs.filter(function (a) { return a.category.indexOf('DATA') === -1 && a !== plantHealthAct; });
        const dataActs = selActs.filter(function (a) { return a.category.indexOf('DATA') !== -1; });
        const orderedFieldActs = visitingActs.length ? visitingActs : selActs;
        let mooCursor = 0;

        // ล็อกวันลงพื้นที่ "สุขภาพพืช" (อ.สีดา): อยู่ระหว่างวันที่ 10-20 ของทุกเดือน แยก 2 วัน วันละหมู่ (ม.7 โพนทอง 1 คน, ม.4 สามเมือง 1 คน)
        const plantHealthDayMap = {};
        if (cfg.isSida && plantHealthAct) {
            const in10to20Idx = [];
            const fallbackBefore20 = [];
            fieldDays.forEach(function (fd, idx) {
                if (fd.day >= 10 && fd.day <= 20) in10to20Idx.push(idx);
                if (fd.day <= 20) fallbackBefore20.push(idx);
            });
            const cand = in10to20Idx.length >= 2 ? in10to20Idx : fallbackBefore20;
            if (cand.length >= 2) {
                const i1 = cand[0];
                const i2 = cand[Math.min(Math.max(1, Math.floor(cand.length / 2)), cand.length - 1)];
                plantHealthDayMap[i1] = { locationRaw: 'หมู่ 7 ตำบลโพนทอง', targetCount: '1' };
                plantHealthDayMap[i2] = { locationRaw: 'หมู่ 4 ตำบลสามเมือง', targetCount: '1' };
            } else if (cand.length === 1) {
                plantHealthDayMap[cand[0]] = { locationRaw: 'หมู่ 7 ตำบลโพนทอง', targetCount: '1' };
            }
        }

        let normalActIdx = 0;
        const fieldEntries = fieldDays.map(function (fd, idx) {
            if (plantHealthDayMap[idx] && plantHealthAct) {
                return {
                    category: plantHealthAct.category,
                    activity: plantHealthAct.activity,
                    detail: plantHealthAct.detail,
                    dateDisplay: fd.dateDisplay,
                    dateRaw: fd.dateDisplay,
                    dateIso: fd.dateIso,
                    dateParsed: fd.dateParsed,
                    locationRaw: plantHealthDayMap[idx].locationRaw,
                    targetCount: plantHealthDayMap[idx].targetCount,
                    note: '',
                    isFieldTrip: true
                };
            }
            const isLastAndHasData = (dataActs.length > 0 && idx === fieldDays.length - 1);
            const actObj = isLastAndHasData ? dataActs[0] : orderedFieldActs[(normalActIdx++) % orderedFieldActs.length];
            const tam = selTambons[idx % selTambons.length];
            const locked = resolveSidaLockedPlace(actObj.activity, actObj.detail, tam.name, idx, false);
            if (locked) {
                return {
                    category: actObj.category,
                    activity: actObj.activity,
                    detail: locked.detail || actObj.detail,
                    dateDisplay: fd.dateDisplay,
                    dateRaw: fd.dateDisplay,
                    dateIso: fd.dateIso,
                    dateParsed: fd.dateParsed,
                    locationRaw: locked.locationRaw,
                    targetCount: locked.targetCount || actObj.target,
                    note: '',
                    isFieldTrip: true
                };
            }
            const countThisDay = Math.min(tam.mooCount, Math.max(2, (mooPerDay === 3 ? (idx % 2 === 0 ? 2 : 3) : mooPerDay)));
            const chosenMoos = [];
            for (let k = 0; k < countThisDay; k++) {
                const mNo = ((mooCursor + k) % tam.mooCount) + 1;
                if (chosenMoos.indexOf(mNo) === -1) chosenMoos.push(mNo);
            }
            mooCursor += countThisDay;
            chosenMoos.sort(function (a, b) { return a - b; });
            return {
                category: actObj.category,
                activity: actObj.activity,
                detail: actObj.detail,
                dateDisplay: fd.dateDisplay,
                dateRaw: fd.dateDisplay,
                dateIso: fd.dateIso,
                dateParsed: fd.dateParsed,
                locationRaw: 'หมู่ ' + chosenMoos.join(', ') + ' ตำบล' + tam.name,
                targetCount: actObj.target,
                note: '',
                isFieldTrip: true
            };
        });

        // เรียง VISITING ก่อน แล้วตามด้วย DATA MANAGEMENT (เหมือนรูปแบบกรมฯ)
        fieldEntries.filter(function (x) { return x.category.indexOf('DATA') === -1; }).forEach(function (x) {
            builtItems.push(Object.assign({ seqNum: builtItems.length + 1 }, x));
        });
        fieldEntries.filter(function (x) { return x.category.indexOf('DATA') !== -1; }).forEach(function (x) {
            builtItems.push(Object.assign({ seqNum: builtItems.length + 1 }, x));
        });

        tvrSavePlanStore({
            fileName: 'generated_tv_plan_' + month + '_' + yearBE,
            monthHeader: 'ประจำเดือน ' + mFull[month] + ' พ.ศ. ' + yearBE,
            items: builtItems
        });

        // อัปเดตเดือน/ปีเอกสาร + วันออก-วันกลับในแบบ 8708 ให้ตรงกับเดือนที่สร้างแผนด้วย
        const docMonthEl = document.getElementById('in-doc-month');
        const docYearEl = document.getElementById('in-doc-year');
        const docDayEl = document.getElementById('in-doc-day');
        if (docMonthEl) docMonthEl.value = mFull[month];
        if (docYearEl) docYearEl.value = String(yearBE);
        if (docDayEl) docDayEl.value = String(daysInMonth);
        if (fieldDays.length) {
            const depDayEl = document.getElementById('in-dep-day');
            const depMyEl = document.getElementById('in-dep-my');
            const retDayEl = document.getElementById('in-ret-day');
            const retMyEl = document.getElementById('in-ret-my');
            if (depDayEl) depDayEl.value = String(fieldDays[0].day);
            if (depMyEl) depMyEl.value = mFull[month] + ' ' + yearBE;
            if (retDayEl) retDayEl.value = String(fieldDays[fieldDays.length - 1].day);
            if (retMyEl) retMyEl.value = mFull[month] + ' ' + yearBE;
        }

        closeBuilderModal();
        renderTvPlan();
        renderTvReport(true);
        if (alsoSyncClaim) {
            syncPlanToClaim8708();
        } else if (typeof global.showToast === 'function') {
            global.showToast('✨ สร้างแผน T&V ประจำเดือน' + mFull[month] + ' ' + yearBE + ' จำนวน ' + builtItems.length + ' รายการเรียบร้อยแล้ว!');
        }
    }

    function sortPlanByCategory() {
        const plan = tvrEnsurePlanItems();
        const rank = function (cat) {
            if (cat.indexOf('TRAINING') !== -1 || cat.indexOf('ถ่ายทอด') !== -1) return 1;
            if (cat.indexOf('DATA') !== -1 || cat.indexOf('ข้อมูล') !== -1) return 3;
            return 2;
        };
        plan.items.sort(function (a, b) {
            const ra = rank(a.category || '');
            const rb = rank(b.category || '');
            if (ra !== rb) return ra - rb;
            return (a.dateIso || '9999-99-99').localeCompare(b.dateIso || '9999-99-99');
        });
        plan.items.forEach(function (it, i) { it.seqNum = i + 1; });
        tvrSavePlanStore(plan);
        renderTvPlan();
        renderTvReport(false);
        if (typeof global.showToast === 'function') global.showToast('เรียงแผนตามหมวด T&V (DM/WM → เยี่ยมเยียน → ข้อมูล) เรียบร้อยแล้ว');
    }

    function setTvPlanSendStatus(msg, tone, resetLog) {
        const el = document.getElementById('tv-plan-send-status');
        if (!el) return;
        if (!msg) { el.classList.add('hidden'); return; }
        el.classList.remove('hidden', 'bg-sky-50', 'border-sky-300', 'text-sky-900', 'bg-emerald-50', 'border-emerald-300', 'text-emerald-900', 'bg-amber-50', 'border-amber-300', 'text-amber-950', 'bg-rose-50', 'border-rose-300', 'text-rose-900');
        if (tone === 'ok') el.classList.add('bg-emerald-50', 'border-emerald-300', 'text-emerald-900');
        else if (tone === 'warn') el.classList.add('bg-amber-50', 'border-amber-300', 'text-amber-950');
        else if (tone === 'err') el.classList.add('bg-rose-50', 'border-rose-300', 'text-rose-900');
        else el.classList.add('bg-sky-50', 'border-sky-300', 'text-sky-900');

        let head = el.querySelector('.tv-send-head');
        let logBox = el.querySelector('.tv-send-log-box');
        if (!head || !logBox) {
            el.innerHTML = '<div class="tv-send-head font-bold"></div>' +
                '<div class="tv-send-log-box mt-1.5 max-h-36 overflow-y-auto rounded bg-white/80 border border-slate-200 p-2 font-mono text-[11px] leading-relaxed text-slate-700 space-y-0.5"></div>';
            head = el.querySelector('.tv-send-head');
            logBox = el.querySelector('.tv-send-log-box');
        }
        if (resetLog) logBox.innerHTML = '';
        head.textContent = msg;
        const ts = new Date().toLocaleTimeString('th-TH', { hour12: false });
        const line = document.createElement('div');
        line.textContent = '[' + ts + '] ' + msg;
        logBox.appendChild(line);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function sendPlanToTvWeb() {
        const plan = tvrEnsurePlanItems();
        if (!plan || !Array.isArray(plan.items) || !plan.items.length) {
            if (typeof global.showToast === 'function') global.showToast('ยังไม่มีรายการแผนดำเนินงานที่จะส่ง (กรุณากด "✨ สร้างแผน T&V อัตโนมัติ" ก่อนครับ)');
            return;
        }
        if (!_botState.connected) {
            openInstallModal();
            if (typeof global.showToast === 'function') global.showToast('กรุณาติดตั้ง/อัปเดตส่วนเสริม DOH Auto-Bot (v1.2.4) เพื่อส่งแผนเข้าเว็บ tandv.doae.go.th อัตโนมัติครับ');
            return;
        }
        const verParts = String(_botState.version || '0.0.0').split('.').map(function (x) { return parseInt(x, 10) || 0; });
        const verNum = verParts[0] * 10000 + verParts[1] * 100 + verParts[2];
        if (verNum < 10204) {
            setTvPlanSendStatus('⚠️ ส่วนเสริมของคุณยังเป็นเวอร์ชัน v' + (_botState.version || '?') + ' (เก่าเกินไป) — กรุณาไปที่ chrome://extensions แล้วกด Reload (↻) ให้เป็น v1.2.4 ก่อนส่งแผนครับ', 'warn', true);
            if (typeof global.showToast === 'function') global.showToast('กรุณากด Reload ส่วนเสริมให้เป็น v1.2.4 ก่อนส่งแผนเข้า T&V ครับ');
            return;
        }

        const meta = tvrGetFormMeta();
        const mFullMap = {
            'มกราคม': 1, 'กุมภาพันธ์': 2, 'มีนาคม': 3, 'เมษายน': 4, 'พฤษภาคม': 5, 'มิถุนายน': 6,
            'กรกฎาคม': 7, 'สิงหาคม': 8, 'กันยายน': 9, 'ตุลาคม': 10, 'พฤศจิกายน': 11, 'ธันวาคม': 12
        };
        let monthFull = '';
        let yearBE = 2569;
        const firstP = plan.items[0] && plan.items[0].dateParsed;
        if (firstP && firstP.monthFull) {
            monthFull = firstP.monthFull;
            yearBE = firstP.yearBE || 2569;
        } else {
            const m = String(meta.monthYear || '').match(/ประจำเดือน\s+([ก-ฮ]+)\s+พ\.ศ\.\s*(\d{4})/);
            if (m) { monthFull = m[1]; yearBE = parseInt(m[2], 10) || 2569; }
        }
        const mNum = mFullMap[monthFull] || 11;
        // ปีงบประมาณไทย: ต.ค. (10), พ.ย. (11), ธ.ค. (12) = พ.ศ. + 1
        const fiscalYearBE = (mNum >= 10) ? (yearBE + 1) : yearBE;

        const sortedPlanItems = plan.items.slice().sort(function (a, b) {
            const ia = tvrToIso(a.dateIso, a.dateParsed, a.dateDisplay, a.dateRaw) || '9999-99-99';
            const ib = tvrToIso(b.dateIso, b.dateParsed, b.dateDisplay, b.dateRaw) || '9999-99-99';
            return ia === ib ? ((a.seqNum || 0) - (b.seqNum || 0)) : ia.localeCompare(ib);
        });

        const payloadItems = sortedPlanItems.map(function (it) {
            const p = it.dateParsed || parseThaiDateCell(it.dateDisplay || it.dateRaw);
            const isoM = String(it.dateIso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
            const dd = (p && p.day) ? String(p.day).padStart(2, '0') : (isoM ? isoM[3] : '01');
            const moNum = (p && p.monthFull && mFullMap[p.monthFull]) ? mFullMap[p.monthFull] : (isoM ? parseInt(isoM[2], 10) : mNum);
            const mm = String(moNum).padStart(2, '0');
            const yy = (p && p.yearBE) ? String(p.yearBE) : (isoM ? String(parseInt(isoM[1], 10) + 543) : String(yearBE));
            return {
                category: it.category || '',
                activity: it.activity || '',
                detail: it.detail || it.activity || '',
                dateDMY: dd + '/' + mm + '/' + yy,
                location: it.locationRaw || '',
                targetCount: it.targetCount || '0',
                note: it.note || ''
            };
        });

        const isChiefOfficer = String(meta.officerPos || '').indexOf('เกษตรอำเภอ') !== -1;
        const tvApproverName = isChiefOfficer
            ? ((meta.officerName && meta.officerName.indexOf('....') === -1) ? meta.officerName : (meta.bossName || ''))
            : (meta.bossName || '');

        setTvPlanSendStatus('🚀 เริ่มส่งแผน ' + payloadItems.length + ' รายการ (ปีงบประมาณ พ.ศ. ' + fiscalYearBE + ' · เดือน ' + monthFull + ' · ผู้อนุมัติ: ' + (tvApproverName || '-') + (isChiefOfficer ? ' [ตัวเอง]' : '') + ') ไปยัง tandv.doae.go.th...', 'info', true);
        sendBotMessage({
            type: 'START_TV_SEND',
            jobId: 'tvjob_' + Date.now(),
            plan: {
                fiscalYearBE: fiscalYearBE,
                monthFull: monthFull,
                approverName: tvApproverName,
                items: payloadItems
            }
        });
    }

    if (typeof window !== 'undefined') {
        window.addEventListener('message', function (ev) {
            const d = ev && ev.data;
            if (!d || d.channel !== 'SIDA_DOH_BOT_FROM_EXT') return;
            if (d.type === 'TV_SEND_PROGRESS') {
                setTvPlanSendStatus('⏳ ' + (d.message || 'กำลังส่งแผนเข้าเว็บ T&V...'), 'info');
            } else if (d.type === 'TV_SEND_AUTH_REQUIRED') {
                setTvPlanSendStatus('🔐 ' + (d.message || 'กรุณาเข้าสู่ระบบ DOAE Pass / T&V ก่อน แล้วกดส่งแผนอีกครั้ง'), 'warn');
                if (typeof global.showToast === 'function') global.showToast(d.message || 'กรุณาล็อกอินเว็บ T&V ก่อน');
            } else if (d.type === 'TV_SEND_DONE') {
                setTvPlanSendStatus(d.message || '✅ ส่งแผนเข้าเว็บ T&V เรียบร้อยแล้ว', 'ok');
                if (typeof global.showToast === 'function') global.showToast(d.message || '✅ ส่งแผนเข้าเว็บ T&V เรียบร้อยแล้ว');
            } else if (d.type === 'TV_SEND_ERROR') {
                setTvPlanSendStatus('❌ ' + (d.error || 'ส่งแผนไม่สำเร็จ'), 'err');
                if (typeof global.showToast === 'function') global.showToast('ส่งแผนไม่สำเร็จ: ' + (d.error || ''));
            }
        });
    }

    global.__tvReport = {
        refreshPlanLinkBanner: refreshPlanLinkBanner,
        renderChiefPlanPanel: renderChiefPlanPanel,
        saveCurrentAsChiefPlan: saveCurrentAsChiefPlan,
        applyChiefPlan: applyChiefPlan,
        toggleChiefList: toggleChiefList,
        setDistrictChiefName: setDistrictChiefName,
        render: renderTvReport,
        renderPlan: renderTvPlan,
        updatePlanField: updatePlanField,
        addPlanRow: addPlanRow,
        deletePlanRow: deletePlanRow,
        syncPlanToClaim8708: syncPlanToClaim8708,
        sendPlanToTvWeb: sendPlanToTvWeb,
        exportPlanWord: exportPlanWord,
        exportPlanExcel: exportPlanExcel,
        openBuilderModal: openBuilderModal,
        closeBuilderModal: closeBuilderModal,
        renderBuilderHolidayCalendar: renderBuilderHolidayCalendar,
        toggleBuilderHoliday: toggleBuilderHoliday,
        clearBuilderHolidays: clearBuilderHolidays,
        generateFromBuilder: generateFromBuilder,
        sortPlanByCategory: sortPlanByCategory,
        toggleDone: toggleTvReportDone,
        updateField: updateTvReportField,
        exportWord: exportTvReportWord,
        exportExcel: exportTvReportExcel,
        printPdf: printTvReportPdf,
        printPlanPdf: printPlanPdf,
        printMapsPdf: printMapsPdf
    };

    if (typeof document !== 'undefined') {
        const initAllTvPanels = function () {
            initDohBotOnLoad();
            renderChiefPlanPanel();
            try {
                const savedDc = (localStorage.getItem(DISTRICT_CHIEF_STORAGE_KEY) || '').trim();
                const dcInp = document.getElementById('in-district-chief-name');
                if (dcInp && !dcInp.value && savedDc) dcInp.value = savedDc;
            } catch (e) { /* ignore */ }
        };
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initAllTvPanels);
        } else {
            initAllTvPanels();
        }
    }
})(typeof window !== 'undefined' ? window : globalThis);

</script>
