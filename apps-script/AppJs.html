<script>
const ORG = window.ORG || {};
    let DRAFT_KEY = ORG.draftKey || 'form8708_draft_sida_v1';
    let BUDGET_PROFILE_PREFIX = ORG.budgetPrefix || 'budget_profile_sida_v1:';
    const BUDGET_SKIP_WEEKDAYS = [0, 1, 6]; // อา. จ. ส.
    let DEFAULT_OFFICE = ORG.officeName || 'สำนักงานเกษตรอำเภอสีดา';
    let OLD_OFFICE_ALIASES = Array.isArray(ORG.officeAliases) ? ORG.officeAliases.slice() : [];
    const DOH_MAP_URL = 'https://dohgis.doh.go.th/dohtotravel/';
    const AREA_PICK_KEY = 'form8708_area_pick_sida_v1';
    const DEFAULT_MOO_WHEN_UNKNOWN = 10;

    /** ปลายทางตามอำเภอสีดา — ติ๊กหลายหมู่ได้ · ลำดับติ๊ก = ลำดับไป */
    let DEST_SUFFIX = ORG.destSuffix || (' อำเภอสีดา จังหวัด' + (ORG.province || 'นครราชสีมา'));
    let DEST_TAMBONS = Array.isArray(ORG.tambons) ? ORG.tambons.slice() : [];
    let OFFICE_TAMBON = ORG.officeTambon || ORG.amphoe || 'สีดา';
    let OFFICE_WITH_TAMBON = ORG.officeWithTambon || (DEFAULT_OFFICE + ' ตำบล' + OFFICE_TAMBON);
    let DEST_PLACES = [];
    let DEST_PRESETS = [];
    let DEST_BY_ID = {};

    function mooNumbersForTambon(t) {
        if (!t) return [];
        if (Array.isArray(t.moos) && t.moos.length) {
            return t.moos.map(Number).filter(function (n) { return n > 0; }).sort(function (a, b) { return a - b; });
        }
        var n = t.mooCount;
        if (n == null || n === '' || !(+n > 0)) n = DEFAULT_MOO_WHEN_UNKNOWN;
        n = Math.floor(+n);
        var list = [];
        for (var m = 1; m <= n; m++) list.push(m);
        return list;
    }

    function normalizeTambonList(list) {
        return (Array.isArray(list) ? list : []).map(function (t) {
            if (typeof t === 'string') {
                var sName = t.replace(/^(ตำบล|ต\.|แขวง)\s*/g, '').trim();
                t = { name: sName, mooCount: DEFAULT_MOO_WHEN_UNKNOWN };
            }
            if (!t || !t.name) return null;
            var moos = mooNumbersForTambon(t);
            var mooCount = moos.length ? moos[moos.length - 1] : DEFAULT_MOO_WHEN_UNKNOWN;
            return { name: t.name, mooCount: mooCount, moos: moos };
        }).filter(function (t) { return !!(t && t.name); });
    }

    function buildDestPlaces() {
        const isSida = (ORG.amphoe === 'สีดา' && ORG.province === 'นครราชสีมา');
        const tvMetaFn = isSida && window.__tvDoh && typeof window.__tvDoh.getSidaVillageMeta === 'function'
            ? window.__tvDoh.getSidaVillageMeta
            : null;
        const amp = ORG.amphoe || 'สีดา';
        const prov = ORG.province || 'นครราชสีมา';
        const list = [];
        DEST_TAMBONS.forEach(function (t) {
            mooNumbersForTambon(t).forEach(function (m) {
                const id = t.name + '-m' + m;
                const meta = tvMetaFn ? tvMetaFn(id) : null;
                list.push({
                    id: id,
                    tambon: t.name,
                    moo: m,
                    short: 'หมู่ ' + m + ' ตำบล' + t.name,
                    label: 'ม.' + m,
                    full: 'หมู่ ' + m + ' ตำบล' + t.name + DEST_SUFFIX,
                    villageName: meta ? meta.villageName : ('หมู่ ' + m + ' ตำบล' + t.name),
                    searchKeyword: meta ? meta.searchKeyword : ('หมู่ที่ ' + m + ' ต.' + t.name + ' อ.' + amp + ' จ.' + prov),
                    fullAddress: meta ? meta.fullAddress : ('หมู่ ' + m + ' ตำบล' + t.name + DEST_SUFFIX)
                });
            });
        });
        const officeMeta = isSida && tvMetaFn ? tvMetaFn('office') : null;
        list.push({
            id: 'office',
            tambon: OFFICE_TAMBON,
            moo: 0,
            short: DEFAULT_OFFICE,
            label: 'สนง.เกษตร',
            full: OFFICE_WITH_TAMBON + DEST_SUFFIX,
            villageName: officeMeta ? officeMeta.villageName : DEFAULT_OFFICE,
            searchKeyword: officeMeta ? officeMeta.searchKeyword : DEFAULT_OFFICE,
            fullAddress: officeMeta ? officeMeta.fullAddress : (OFFICE_WITH_TAMBON + DEST_SUFFIX)
        });
        return list;
    }

    function rebuildDestRuntime() {
        DEST_TAMBONS = normalizeTambonList(ORG.tambons);
        DEST_SUFFIX = ORG.destSuffix || (' อำเภอ' + (ORG.amphoe || 'สีดา') + ' จังหวัด' + (ORG.province || 'นครราชสีมา'));
        DEFAULT_OFFICE = ORG.officeName || 'สำนักงานเกษตรอำเภอสีดา';
        OLD_OFFICE_ALIASES = Array.isArray(ORG.officeAliases) ? ORG.officeAliases.slice() : [];
        OFFICE_TAMBON = ORG.officeTambon || ORG.amphoe || 'สีดา';
        OFFICE_WITH_TAMBON = ORG.officeWithTambon || (DEFAULT_OFFICE + ' ตำบล' + OFFICE_TAMBON);
        DEST_PLACES = buildDestPlaces();
        DEST_PRESETS = DEST_PLACES.map(function (p) { return p.full; });
        DEST_BY_ID = DEST_PLACES.reduce(function (acc, p) { acc[p.id] = p; return acc; }, {});
        window.DEST_BY_ID = DEST_BY_ID;
        window.DEST_SUFFIX = DEST_SUFFIX;
        DRAFT_KEY = ORG.draftKey || 'form8708_draft_sida_v1';
        BUDGET_PROFILE_PREFIX = ORG.budgetPrefix || 'budget_profile_sida_v1:';
        var dl = document.getElementById('dest-suggest-list');
        if (dl) dl.dataset.filled = '';
        fillDestSuggestList();
        document.querySelectorAll('.travel-day-row').forEach(function (row) {
            var inp = row.querySelector('.day-dest');
            var order = getRowDestOrder(row).filter(function (id) { return !!DEST_BY_ID[id]; });
            setRowDestOrder(row, order);
            var panel = row.querySelector('.day-dest-multi');
            if (panel) {
                var open = panel.open;
                panel.outerHTML = destMultiPanelHtml(inp ? inp.value : '', order);
                var anew = row.querySelector('.day-dest-multi');
                if (anew) anew.open = open;
                setRowDestOrder(row, order);
            }
            if (window.__tvDoh && typeof window.__tvDoh.renderRowDohStops === 'function') {
                window.__tvDoh.renderRowDohStops(row);
            }
        });
    }

    rebuildDestRuntime();

    /** เชื่อมรายการไทย: ก, ข และ ค — 「และ」เฉพาะตัวสุดท้าย */
    function joinThaiList(parts) {
        if (!parts || !parts.length) return '';
        if (parts.length === 1) return parts[0];
        if (parts.length === 2) return parts[0] + ' และ ' + parts[1];
        return parts.slice(0, -1).join(', ') + ' และ ' + parts[parts.length - 1];
    }

    /**
     * รวมปลายทางตามลำดับติ๊ก (orderIds) — ไม่เรียงเลขหมู่
     * กลุ่มตำบลต่อเนื่องตามลำดับไป เช่น
     * หมู่ 3, หมู่ 1 และ หมู่ 2 ตำบลก และ หมู่ 5, หมู่ 2 ตำบลข
     */
    function combineDestFromOrder(orderIds) {
        if (!orderIds || !orderIds.length) return '';
        const places = orderIds.map(function (id) { return DEST_BY_ID[id]; }).filter(Boolean);
        if (!places.length) return '';

        // กลุ่มต่อเนื่องตามลำดับไป (ไม่ยุบตำบลที่ไม่ติดกัน — ลำดับติ๊ก = เส้นทาง)
        const groups = [];
        places.forEach(function (p) {
            if (p.id === 'office') {
                groups.push({ items: [p], isOffice: true });
                return;
            }
            const last = groups.length ? groups[groups.length - 1] : null;
            if (last && !last.isOffice && last.tambon === p.tambon) {
                last.items.push(p);
            } else {
                groups.push({ tambon: p.tambon, items: [p], isOffice: false });
            }
        });

        const groupTexts = groups.map(function (g) {
            if (g.isOffice) return OFFICE_WITH_TAMBON;
            const mooParts = g.items.map(function (p) { return 'หมู่ ' + p.moo; });
            return joinThaiList(mooParts) + ' ตำบล' + g.tambon;
        });

        return joinThaiList(groupTexts) + DEST_SUFFIX;
    }

    /**
     * กู้ลำดับจากข้อความ — จับกลุ่ม「หมู่…ตำบล…」ทั้งก้อน
     * (ห้าม split ด้วย「และ」อย่างเดียว เพราะ「และ」อยู่ในกลุ่มหมู่ด้วย)
     */
    function parseDestOrderFromText(text) {
        const cur = (text || '').trim();
        if (!cur) return [];
        const order = [];
        const body = cur.replace(DEST_SUFFIX, '');
        const tambonAlt = DEST_TAMBONS.map(function (t) { return t.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|');
        const officeEsc = String(DEFAULT_OFFICE).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const officeTambonEsc = String(OFFICE_TAMBON).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const groupRe = new RegExp(
            officeEsc + '(?:\\s*ตำบล' + officeTambonEsc + ')?|' +
            'หมู่\\s*\\d+(?:\\s*,\\s*หมู่\\s*\\d+)*(?:\\s+และ\\s+หมู่\\s*\\d+)?\\s*ตำบล(' + tambonAlt + ')',
            'g'
        );
        let m;
        while ((m = groupRe.exec(body)) !== null) {
            if (m[0].indexOf(DEFAULT_OFFICE) >= 0) {
                if (order.indexOf('office') < 0) order.push('office');
                continue;
            }
            const tambon = m[1];
            const mooRe = /หมู่\s*(\d+)/g;
            let mm;
            while ((mm = mooRe.exec(m[0])) !== null) {
                const id = tambon + '-m' + mm[1];
                if (DEST_BY_ID[id] && order.indexOf(id) < 0) order.push(id);
            }
        }
        return order;
    }

    function getRowDestOrder(row) {
        if (!row) return [];
        try {
            const raw = row.dataset.destOrder || '[]';
            const arr = JSON.parse(raw);
            return Array.isArray(arr) ? arr : [];
        } catch (e) {
            return [];
        }
    }

    function setRowDestOrder(row, order) {
        if (!row) return;
        row.dataset.destOrder = JSON.stringify(order || []);
    }

    function destMultiPanelHtml(currentDest, orderIds) {
        const order = Array.isArray(orderIds) ? orderIds.slice() : parseDestOrderFromText(currentDest);
        let html = '<details class="day-dest-multi border border-emerald-200 rounded bg-emerald-50/40 px-2 py-1">';
        html += '<summary class="cursor-pointer text-[11px] text-emerald-900 font-medium select-none">เลือกปลายทาง (ติ๊กตามลำดับที่ไป — ได้หลายหมู่/ตำบล)</summary>';
        html += '<p class="text-[9px] text-slate-500 mt-1 mb-1">ลำดับติ๊ก = ลำดับเส้นทาง · คำว่า「และ」ใส่ตัวสุดท้าย · ไม่เรียงเลขหมู่</p>';
        DEST_TAMBONS.forEach(function (t) {
            const moos = mooNumbersForTambon(t);
            html += '<div class="mb-1.5">';
            html += '<div class="text-[10px] font-semibold text-emerald-800 mb-0.5">ตำบล' + escHtml(t.name) + ' (' + moos.length + ' หมู่)</div>';
            html += '<div class="flex flex-wrap gap-x-1.5 gap-y-0.5">';
            moos.forEach(function (m) {
                const id = t.name + '-m' + m;
                const seqIdx = order.indexOf(id);
                const checked = seqIdx >= 0;
                const seq = checked ? (seqIdx + 1) : '';
                html += '<label class="inline-flex items-center gap-0.5 text-[10px] text-slate-800 cursor-pointer whitespace-nowrap px-1 rounded ' +
                    (checked ? 'bg-emerald-100' : '') + '" title="ลำดับไป">' +
                    '<input type="checkbox" class="day-dest-chk rounded border-emerald-400" data-dest-id="' + escAttr(id) + '"' +
                    (checked ? ' checked' : '') + ' onchange="onDayDestMultiChange(this)">' +
                    'ม.' + m +
                    (seq ? '<span class="text-[9px] text-emerald-700 font-bold">(' + seq + ')</span>' : '') +
                    '</label>';
            });
            html += '</div></div>';
        });
        const officeSeqIdx = order.indexOf('office');
        const officeChecked = officeSeqIdx >= 0;
        const officeSeq = officeChecked ? (officeSeqIdx + 1) : '';
        html += '<div class="mb-1"><label class="inline-flex items-center gap-1 text-[10px] cursor-pointer ' +
            (officeChecked ? 'bg-emerald-100 px-1 rounded' : '') + '">' +
            '<input type="checkbox" class="day-dest-chk rounded border-emerald-400" data-dest-id="office"' +
            (officeChecked ? ' checked' : '') + ' onchange="onDayDestMultiChange(this)">' +
            escHtml(DEFAULT_OFFICE) +
            (officeSeq ? ' <span class="text-[9px] text-emerald-700 font-bold">(' + officeSeq + ')</span>' : '') +
            '</label></div>';
        html += '</details>';
        return html;
    }

    function onDayDestMultiChange(chk) {
        const row = chk && chk.closest('.travel-day-row');
        if (!row) return;
        const inp = row.querySelector('.day-dest');
        if (!inp) return;
        const id = chk.getAttribute('data-dest-id');
        let order = getRowDestOrder(row);
        if (!order.length) order = parseDestOrderFromText(inp.value);

        if (chk.checked) {
            if (order.indexOf(id) < 0) order.push(id);
        } else {
            order = order.filter(function (x) { return x !== id; });
        }
        setRowDestOrder(row, order);
        row.dataset.dohCopied = '{}';

        // sync checkbox UI sequence badges by re-rendering panel is heavy — update text + lightly refresh badges
        inp.value = combineDestFromOrder(order);
        const panel = row.querySelector('.day-dest-multi');
        if (panel) {
            const open = panel.open;
            panel.outerHTML = destMultiPanelHtml(inp.value, order);
            const anew = row.querySelector('.day-dest-multi');
            if (anew) anew.open = open;
            setRowDestOrder(row, order);
        }
        if (window.__tvDoh && typeof window.__tvDoh.renderRowDohStops === 'function') {
            window.__tvDoh.renderRowDohStops(row);
        }
        inp.dispatchEvent(new Event('input', { bubbles: true }));
        updatePreview();
        scheduleSave();
    }

    function fillDestSuggestList() {
        const dl = document.getElementById('dest-suggest-list');
        if (!dl) return;
        if (dl.dataset.filled === '1') return;
        dl.innerHTML = DEST_PRESETS.map(function (d) {
            return '<option value="' + escAttr(d) + '">';
        }).join('');
        dl.dataset.filled = '1';
    }

    function getAreaData() {
        return (window.TH_AREA && window.TH_AREA.data) ? window.TH_AREA.data : null;
    }

    function listProvinces() {
        const data = getAreaData();
        if (!data) return [];
        return Object.keys(data).sort(function (a, b) { return a.localeCompare(b, 'th'); });
    }

    function listAmphoes(province) {
        const data = getAreaData();
        if (!data || !data[province]) return [];
        return Object.keys(data[province]).sort(function (a, b) { return a.localeCompare(b, 'th'); });
    }

    function listTambons(province, amphoe) {
        const data = getAreaData();
        if (!data || !data[province] || !data[province][amphoe]) return [];
        return normalizeTambonList(data[province][amphoe]);
    }

    function finalizeOrgDerived() {
        function trim(s) { return String(s == null ? '' : s).trim(); }
        ORG.amphoe = trim(ORG.amphoe) || 'สีดา';
        ORG.province = trim(ORG.province) || 'นครราชสีมา';
        ORG.officeTambon = trim(ORG.officeTambon) || 'สีดา';
        ORG.officeName = trim(ORG.officeName) || ('สำนักงานเกษตรอำเภอ' + ORG.amphoe);
        ORG.toTitle = trim(ORG.toTitle) || ('ผู้ว่าราชการจังหวัด' + ORG.province);
        ORG.bossTitle = trim(ORG.bossTitle) || ('เกษตรอำเภอ' + ORG.amphoe);
        ORG.destSuffix = ' อำเภอ' + ORG.amphoe + ' จังหวัด' + ORG.province;
        ORG.officeShort = ORG.officeName;
        ORG.officeWithTambon = ORG.officeName + (ORG.officeTambon ? (' ตำบล' + ORG.officeTambon) : '');
        ORG.officeFull = ORG.officeWithTambon + ORG.destSuffix;
        ORG.vehicleFrom = trim(ORG.vehicleFrom) || ORG.officeFull;
        ORG.tambons = normalizeTambonList(ORG.tambons);
        if (!Array.isArray(ORG.people)) ORG.people = [];
        if (!Array.isArray(ORG.officeAliases)) ORG.officeAliases = [];
        var names = ORG.tambons.map(function (t) { return 'ตำบล' + t.name; });
        var joined;
        if (!names.length) joined = '';
        else if (names.length === 1) joined = names[0];
        else if (names.length === 2) joined = names[0] + ' และ' + names[1];
        else joined = names.slice(0, -1).join(' ') + ' และ' + names[names.length - 1];
        ORG.destinationArea = joined
            ? ('พื้นที่' + joined + ORG.destSuffix)
            : ('พื้นที่........' + ORG.destSuffix);
        var slug = trim(ORG.id) || 'sida';
        ORG.draftKey = 'form8708_draft_' + slug + '_v1';
        ORG.budgetPrefix = 'budget_profile_' + slug + '_v1:';
    }

    var CUSTOM_AREA_STORAGE_KEY = 'form8708_custom_area_v1';
    var DEFAULT_SIDA_BOSS = 'นางอรอนงค์ สูญกลาง';
    var DEFAULT_SIDA_CHECKER = 'นางสาวหนึ่งนภา ปัจจัยโย';

    function slugifyAreaId(province, amphoe) {
        if (province === 'นครราชสีมา' && amphoe === 'สีดา') return 'sida';
        var raw = (String(province || '') + '_' + String(amphoe || '')).trim();
        var hash = 0;
        for (var i = 0; i < raw.length; i++) {
            hash = ((hash << 5) - hash + raw.charCodeAt(i)) | 0;
        }
        return 'area_' + Math.abs(hash).toString(36);
    }

    function parseCustomTambonsInput(text) {
        return String(text || '')
            .split(/[,\n、;]+/)
            .map(function (s) { return s.replace(/^(ตำบล|ต\.)\s*/g, '').trim(); })
            .filter(Boolean)
            .map(function (name) { return { name: name, mooCount: 15 }; });
    }

    function applyAreaSelection(customArea, opts) {
        var o = opts || {};
        var prevAmphoe = ORG.amphoe || 'สีดา';
        var prevProvince = ORG.province || 'นครราชสีมา';
        var prevOffice = ORG.officeName || '';
        var prevToTitle = ORG.toTitle || '';
        var prevBossTitle = ORG.bossTitle || '';
        var prevVehicleFrom = ORG.vehicleFrom || '';
        var prevDestArea = ORG.destinationArea || '';

        if (customArea && typeof customArea === 'object') {
            var prov = String(customArea.province || '').replace(/^(จังหวัด|จ\.)\s*/g, '').trim() || 'นครราชสีมา';
            var amp = String(customArea.amphoe || '').replace(/^(อำเภอ|อ\.|เขต)\s*/g, '').trim() || 'สีดา';
            var tam = String(customArea.officeTambon || '').replace(/^(ตำบล|ต\.|แขวง)\s*/g, '').trim() || amp;
            var offName = String(customArea.officeName || '').trim() || ('สำนักงานเกษตรอำเภอ' + amp);
            var isSida = (prov === 'นครราชสีมา' && amp === 'สีดา');

            ORG.province = prov;
            ORG.amphoe = amp;
            ORG.officeTambon = tam;
            ORG.officeName = offName;
            ORG.toTitle = 'ผู้ว่าราชการจังหวัด' + prov;
            ORG.bossTitle = 'เกษตรอำเภอ' + amp;
            ORG.vehicleFrom = '';
            ORG.id = slugifyAreaId(prov, amp);

            if (Array.isArray(customArea.tambons) && customArea.tambons.length) {
                ORG.tambons = normalizeTambonList(customArea.tambons);
            } else if (isSida) {
                ORG.tambons = listTambons('นครราชสีมา', 'สีดา');
            } else {
                var fromDict = listTambons(prov, amp);
                ORG.tambons = fromDict.length ? fromDict : [];
            }

            if (isSida) {
                if (!ORG.bossName) ORG.bossName = DEFAULT_SIDA_BOSS;
                if (!ORG.checkerName) ORG.checkerName = DEFAULT_SIDA_CHECKER;
            } else {
                if (ORG.bossName === DEFAULT_SIDA_BOSS) ORG.bossName = '';
                if (ORG.checkerName === DEFAULT_SIDA_CHECKER) ORG.checkerName = '';
            }

            if (!o.skipSave) {
                try {
                    __sidaLS.setItem(CUSTOM_AREA_STORAGE_KEY, JSON.stringify({
                        province: ORG.province,
                        amphoe: ORG.amphoe,
                        officeTambon: ORG.officeTambon,
                        officeName: ORG.officeName,
                        tambons: ORG.tambons
                    }));
                } catch (e) { /* ignore */ }
            }
        } else {
            if (!Array.isArray(ORG.tambons) || !ORG.tambons.length) {
                if (ORG.province === 'นครราชสีมา' && ORG.amphoe === 'สีดา') {
                    ORG.tambons = listTambons('นครราชสีมา', 'สีดา');
                }
            }
        }

        finalizeOrgDerived();
        rebuildDestRuntime();
        applyOrgDefaultsToForm();

        // อัปเดตช่องฟอร์มที่ยังเป็นค่าเก่าของอำเภอก่อนหน้าให้เปลี่ยนตามอัตโนมัติ
        if (customArea && (prevAmphoe !== ORG.amphoe || prevProvince !== ORG.province || prevOffice !== ORG.officeName)) {
            var forceSet = function (id, newVal, prevVal) {
                var el = document.getElementById(id);
                if (!el) return;
                var cur = (el.value || '').trim();
                if (!cur || cur === prevVal || !prevVal) el.value = newVal;
            };
            var setAlways = function (id, newVal) {
                var el = document.getElementById(id);
                if (el) el.value = newVal;
            };
            setAlways('in-amphoe', ORG.amphoe);
            setAlways('in-province', ORG.province);

    window.populateThAreaSelects = function (provSelId, ampSelId, tamSelId, initProv, initAmp, initTam, onAfterTambon) {
        var data = getThAreaData() || {};
        var provs = Object.keys(data);
        var pEl = document.getElementById(provSelId);
        var aEl = document.getElementById(ampSelId);
        var tEl = document.getElementById(tamSelId);
        if (!pEl || !aEl) return;

        var fillTambons = function (prov, amp, targetTam) {
            if (!tEl) {
                if (typeof onAfterTambon === 'function') onAfterTambon(prov, amp, []);
                return;
            }
            var tList = listTambons(prov, amp);
            tEl.innerHTML = '';
            if (!tList.length) {
                var opt0 = document.createElement('option');
                opt0.value = amp || '';
                opt0.textContent = amp || '-- ไม่พบข้อมูลตำบล --';
                tEl.appendChild(opt0);
            } else {
                tList.forEach(function (t) {
                    var opt = document.createElement('option');
                    opt.value = t.name;
                    opt.textContent = t.name;
                    if (targetTam && t.name === targetTam) opt.selected = true;
                    tEl.appendChild(opt);
                });
            }
            if (typeof onAfterTambon === 'function') onAfterTambon(prov, amp, tList);
        };

        var fillAmphoes = function (prov, targetAmp, targetTam) {
            var amps = (data[prov] && typeof data[prov] === 'object') ? Object.keys(data[prov]) : [];
            aEl.innerHTML = '';
            amps.forEach(function (a) {
                var opt = document.createElement('option');
                opt.value = a;
                opt.textContent = (prov === 'กรุงเทพมหานคร' ? 'เขต' : 'อำเภอ') + a;
                if (targetAmp && a === targetAmp) opt.selected = true;
                aEl.appendChild(opt);
            });
            var chosenAmp = aEl.value || amps[0] || '';
            fillTambons(prov, chosenAmp, targetTam);
        };

        pEl.innerHTML = '';
        provs.forEach(function (p) {
            var opt = document.createElement('option');
            opt.value = p;
            opt.textContent = p;
            if (initProv && p === initProv) opt.selected = true;
            pEl.appendChild(opt);
        });
        var chosenProv = pEl.value || provs[0] || 'นครราชสีมา';
        fillAmphoes(chosenProv, initAmp, initTam);

        pEl.onchange = function () {
            fillAmphoes(pEl.value, '', '');
        };

            fillTambons(pEl.value, aEl.value, '');
        };

    function toThaiNum(numStr) {

    /** เลขไทย/อารบิก → เฉพาะตัวเลขอารบิก (สำหรับ parse วันที่/เงิน) */
    function toArabicDigits(s) {
        return String(s == null ? '' : s).replace(/[๐-๙]/g, c => String('๐๑๒๓๔๕๖๗๘๙'.indexOf(c)));
    }

    function parseIntThai(s, fallback) {
        const n = parseInt(toArabicDigits(s).replace(/[^\d]/g, ''), 10);
        return isNaN(n) ? (fallback || 0) : n;
    }

    /** รับเฉพาะ src รูปแผนที่จริง — ไม่ดึงรูปจากฟอร์ม/พรีวิวอื่น */
    function isOkMapSrc(s) {
        if (!s || typeof s !== 'string') return false;
        var t = s.trim();
        return t.indexOf('data:image/') === 0 || /^https?:\/\//i.test(t) || t.indexOf('blob:') === 0;
    }

    /** รูปที่เก็บในฉบับร่างได้จริง (blob:/ลิงก์นอกหายหลังรีโหลด) */
    function isPersistableMapSrc(s) {
        if (!s || typeof s !== 'string') return false;
        return s.trim().indexOf('data:image/') === 0;
    }

    function escAttr(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function escHtml(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')

    function dayDateSortKey(dateStr) {
        var full = expandDayDateFull(dateStr || '');
        var p = parseFullThaiDateParts(full);
        var mi = thaiMonthsFull.indexOf(p.month);
        if (mi < 0) mi = thaiMonthsAbbr.indexOf(p.month);

        var d = parseIntThai(p.day, 0);
        return y * 10000 + (mi >= 0 ? mi + 1 : 0) * 100 + d;
    }

    function parseMoney(val) {
        if (val === null || val === undefined) return 0;
        let s = String(val).trim();
        // เลขไทย → อารบิก (เผื่อค่าจากพิมพ์/พรีวิว)
        s = s.replace(/[๐-๙]/g, c => String(c.charCodeAt(0) - '๐'.charCodeAt(0)));
        s = s.replace(/,/g, '');
        if (!s || s === '-') return 0;
        const n = parseFloat(s);
        return isNaN(n) ? 0 : n;
    }

    /** จัดรูปแบบยอดเงินด้วย comma เช่น 1560 → 1,560 (ว่างคงว่าง) */
    function formatMoney(val) {
        if (val === null || val === undefined || val === '') return '';
        if (val === '-') return '-';
        const n = (typeof val === 'number' && !isNaN(val)) ? val : parseMoney(val);
        if (isNaN(n)) return '';
        const rounded = Math.round(n * 100) / 100;
        const neg = rounded < 0;
        const abs = Math.abs(rounded);
        const isInt = Math.abs(abs - Math.round(abs)) < 1e-9;
        let intStr, decStr = null;
        if (isInt) {
            intStr = String(Math.round(abs));
        } else {
            const parts = abs.toFixed(2).split('.');
            intStr = parts[0];
            decStr = parts[1];
        }
        const grouped = intStr.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return (neg ? '-' : '') + grouped + (decStr != null ? '.' + decStr : '');
    }

    function toThaiBahtText(amount) {
        amount = Math.round((parseMoney(amount) || 0) * 100) / 100;
        if (isNaN(amount)) return "ศูนย์บาทถ้วน";
        if (amount === 0) return "ศูนย์บาทถ้วน";

        let str = amount.toFixed(2).split(".");
        let baht = str[0];
        let satang = str[1];

        const nums = ["ศูนย์", "หนึ่ง", "สอง", "สาม", "สี่", "ห้า", "หก", "เจ็ด", "แปด", "เก้า"];

        function convertGroup(numString) {
            let res = "";
            let len = numString.length;
            for (let i = 0; i < len; i++) {
                let d = parseInt(numString.charAt(i), 10);
                let p = len - 1 - i;
                if (d === 0) continue;
                if (p === 1 && d === 1) {
                    res += "สิบ";
                } else if (p === 1 && d === 2) {
                    res += "ยี่สิบ";
                } else if (p === 1) {
                    res += nums[d] + "สิบ";
                } else if (p === 0 && d === 1 && len > 1) {
                    res += "เอ็ด";
                } else {
                    const places = ["", "สิบ", "ร้อย", "พัน", "หมื่น", "แสน"];
                    res += nums[d] + (places[p] || "");
                }
            }
            return res;
        }

        function convert(numString) {
            numString = String(parseInt(numString, 10));
            if (numString === "0") return "";
            let res = "";
            while (numString.length > 0) {
                let chunk;
                if (numString.length > 6) {
                    chunk = numString.slice(0, numString.length - 6);
                    numString = numString.slice(numString.length - 6);
                    res += convertGroup(chunk) + "ล้าน";
                } else {
                    res += convertGroup(numString);
                    break;
                }
            }
            return res;
        }

        let result = convert(baht) + "บาท";
        if (satang && parseInt(satang, 10) > 0) {
            result += convert(satang) + "สตางค์";
        } else {
            result += "ถ้วน";
        }
        return result;
    }

    
    
    
    function calcTimeDiff(start, end) {
        if (!start || !end) return "-";
        const startMin = timeToMinutes(normalizeTimeStr(start));
        const endMin0 = timeToMinutes(normalizeTimeStr(end));
        if (startMin == null || endMin0 == null) return "-";
        let endMin = endMin0;
        if (endMin < startMin) endMin += 24 * 60;
        return minutesToTime(endMin - startMin);
    }

    
    
    
    function parseDateStr(dayStr, myStr) {
        if (dayStr == null || myStr == null) return null;
        let parts = String(myStr).trim().split(/\s+/);
        if (parts.length < 2) return null;
        let mStr = parts[0];
        let yStr = parts[parts.length - 1];

        let monthIdx = thaiMonthsFull.findIndex(m => m === mStr);
        if (monthIdx === -1) monthIdx = thaiMonthsAbbr.findIndex(m => m === mStr);
        if (monthIdx === -1) return null;

        let year = parseInt(yStr, 10) - 543;
        let day = parseInt(String(dayStr).replace(/[๐-๙]/g, c => String('๐๑๒๓๔๕๖๗๘๙'.indexOf(c))), 10);
        if (isNaN(year) || isNaN(day)) return null;
        return new Date(year, monthIdx, day);
    }

            const minBe = Math.min(beYear, todayBe) - 12;

            ).join('');

                '</div>';

        const first = new Date(y, m, 1);
        // Monday-first (จ=0 … อา=6) — ตรงกับปฏิทินไทยในเบราว์เซอร์
        let startPad = (first.getDay() + 6) % 7;
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const prevDays = new Date(y, m, 0).getDate();
        const cells = [];
        for (let i = 0; i < 42; i++) {
            let cellY = y, cellM = m, cellD, muted = false;
            if (i < startPad) {
                cellD = prevDays - startPad + i + 1;
                cellM = m - 1;
                if (cellM < 0) { cellM = 11; cellY = y - 1; }
                muted = true;
            } else if (i >= startPad + daysInMonth) {
                cellD = i - startPad - daysInMonth + 1;
                cellM = m + 1;
                if (cellM > 11) { cellM = 0; cellY = y + 1; }

            '<div class="th-be-days">' + cells.join('') + '</div>' +

            '<button type="button" class="th-be-clear">ล้างข้อมูล</button>' +

        };

            bePickerState.viewM += 1;

        const monthSel = pop.querySelector('.th-be-month');
        const yearSel = pop.querySelector('.th-be-year');

    function timeToMinutes(t) {
        if (!t) return null;
        const p = String(t).trim().replace(/[๐-๙]/g, c => '๐๑๒๓๔๕๖๗๘๙'.indexOf(c)).split('.');
        if (p.length !== 2) return null;
        const h = parseInt(p[0], 10);
        const m = parseInt(p[1], 10);
        if (isNaN(h) || isNaN(m)) return null;
        return h * 60 + m;
    }

    function minutesToTime(total) {
        const h = Math.floor(total / 60);
        const m = total % 60;
        // บังคับ 08.00 ไม่ใช่ 8.00
        return String(h).padStart(2, '0') + '.' + String(m).padStart(2, '0');
    }

    /** จัดรูปแบบเวลาเป็น HH.MM และปัดนาทีให้ลงท้ายด้วย 00 หรือ 30 เท่านั้น */
    function normalizeTimeStr(t) {
        if (t == null) return '';
        let s = String(t).trim();
        if (!s || s === '......') return s;
        // รองรับเลขไทยในช่องกรอก
        s = s.replace(/[๐-๙]/g, c => String('๐๑๒๓๔๕๖๗๘๙'.indexOf(c)));
        s = s.replace(':', '.');
        const m = s.match(/^(\d{1,2})\.(\d{1,2})$/);
        if (!m) return String(t).trim();
        let h = parseInt(m[1], 10);
        let min = parseInt(m[2], 10);
        if (isNaN(h) || isNaN(min)) return String(t).trim();
        if (min > 59) min = 59;
        if (h > 23) h = 23;
        // ปัดนาทีให้ลงท้ายด้วย 00 หรือ 30 เท่านั้น
        if (min < 15) {
            min = 0;
        } else if (min < 45) {
            min = 30;
        } else {
            min = 0;
            h += 1;
            if (h > 23) {
                h = 23;
                min = 30;
            }
        }
        const hh = String(h).padStart(2, '0');
        const mm = String(min).padStart(2, '0');
        return hh + '.' + mm;
    }

    /**
     * สุ่มเวลาวันกลาง:
     * - ออกไม่เกิน 09.30
     * - กลับไม่น้อยกว่า 16.30
     * - รวม 7.30–8.30 ชม. (450–510 นาที)
     * - ลงท้ายด้วยนาที 00 หรือ 30 เท่านั้น (ขั้นละ 30 นาที)
     */
    function randomMiddleDayTimes() {
        const depMax = timeToMinutes('09.30');   // ออกไม่เกิน
        const retMin = timeToMinutes('16.30');   // กลับไม่น้อยกว่า
        const durMin = 7 * 60 + 30;              // 7.30 ชม.
        const durMax = 8 * 60 + 30;              // 8.30 ชม.
        const step = 30;

        // สุ่มระยะเวลารวม (ขั้นละ 30 นาที → 7.30, 8.00, 8.30)
        const durSteps = Math.floor((durMax - durMin) / step);
        const duration = durMin + Math.floor(Math.random() * (durSteps + 1)) * step;

        // dep ต้องทำให้ ret = dep + duration >= 16.30 และ dep <= 09.30
        let depLo = retMin - duration;
        let depHi = depMax;
        // ปัดขึ้น/ลงให้เข้า step 30 นาที (ลงท้าย 00 หรือ 30)
        depLo = Math.ceil(depLo / step) * step;
        depHi = Math.floor(depHi / step) * step;
        if (depLo > depHi) {
            // fallback ปลอดภัย (ลงท้าย 00/30)
            return { tOut: '09.00', tIn: '16.30' };
        }

        const depOptions = Math.floor((depHi - depLo) / step);
        const dep = depLo + Math.floor(Math.random() * (depOptions + 1)) * step;
        const ret = dep + duration;

        return { tOut: minutesToTime(dep), tIn: minutesToTime(ret) };
    }

    /** วันเบิกน้ำมัน = ติ๊ก .day-fuel เท่านั้น (ไม่ใช้กม./ยอดเดา — กันยกเลิกติ๊กแล้วยังโผล่ใน บก.111) */
    function isFuelDayRow(row) {
        if (!row) return false;
        const chk = row.querySelector('.day-fuel');
        if (chk) return !!chk.checked;
        // ฉบับร่างเก่าที่ยังไม่มีช่องติ๊ก: ถือว่าเป็นวันเบิกน้ำมันถ้ามีกม. หรือยอด
        return parseMoney(row.querySelector('.day-km')?.value) > 0 || parseMoney(row.querySelector('.day-amount')?.value) > 0;
    }

    /** ผู้ใช้ปิดน้ำมันเอง → ห้ามให้กรอกกม./บาทติ๊กกลับอัตโนมัติ */
    function setFuelUserChoice(fuelInput, checked) {
        if (!fuelInput) return;
        fuelInput.checked = !!checked;
        fuelInput.dataset.fuelUser = checked ? '1' : '0';
    }

    function canAutoCheckFuel(fuelInput) {
        return fuelInput && fuelInput.dataset.fuelUser !== '0';
    }

    /** ติ๊ก/ยกเลิกน้ำมัน → คำนวณพาหนะ + สร้าง บก.111 / หน้างบ / แผนที่ใหม่ทันที */
    function onDayFuelChange(fuelInput) {
        if (fuelInput) fuelInput.dataset.fuelUser = fuelInput.checked ? '1' : '0';
        recalcVehicleFromDays(true);
        updatePreview();
        scheduleSave();
    }

    function createTravelDayRow(data = {}) {
        fillDestSuggestList();
        const idx = (document.querySelectorAll('.travel-day-row').length || 0) + 1;
        const dateStr = data.date || '';
        const tOut = normalizeTimeStr(data.out || '');
        const tIn = normalizeTimeStr(data.inn || data.in || '');
        const tSum = (tOut && tIn) ? calcTimeDiff(tOut, tIn) : normalizeTimeStr(data.sum || '');
        const dest = data.dest || '';
        // ลำดับติ๊ก = ลำดับเส้นทาง (ไม่เรียงเลขหมู่) — กู้จากฉบับร่าง หรือจากข้อความ
        let destOrder = Array.isArray(data.destOrder) ? data.destOrder.filter(function (id) { return !!DEST_BY_ID[id]; }) : [];
        if (!destOrder.length && dest) destOrder = parseDestOrderFromText(dest);
        const rawKm = data.km != null && String(data.km).trim() !== '' ? String(data.km).trim() : '';
        const km = rawKm ? (/[\d๐-๙]/.test(rawKm) ? String(typeof floorKm === 'function' ? floorKm(rawKm) : Math.floor(Math.max(0, parseMoney(rawKm)))) : '') : '';
        const amount = data.amount != null ? data.amount : '';
        // ฉบับร่าง: เก็บได้เฉพาะ data:image — ตัด blob:/http ที่พังหลังรีโหลด
        const mapData = isPersistableMapSrc(data.mapDataUrl) ? String(data.mapDataUrl).trim() : '';
        // ติ๊กเบิกน้ำมัน: ตามที่บันทึก หรือถ้ามีกม./ยอดจากฉบับเก่า
        let fuelChecked = false;
        let fuelUser = '';
        if (typeof data.fuel === 'boolean') {
            fuelChecked = data.fuel;
            fuelUser = data.fuel ? '1' : '0'; // จำว่าผู้ใช้ตั้งค่าไว้แล้ว (กัน auto-tick ทับตอนยกเลิก)
        } else if (data.fuelUser === '0' || data.fuelUser === '1') {
            fuelUser = data.fuelUser;
            fuelChecked = data.fuelUser === '1';
        } else if (parseMoney(km) > 0 || parseMoney(amount) > 0) {
            fuelChecked = true;
        }

        const amountShow = amount !== '' && amount != null ? formatMoney(amount) : '';
        const _exNow = new Date();
        const _exDatePlaceholder = `วันที่ เช่น 1 ${thaiMonthsAbbr[_exNow.getMonth()]} ${String(_exNow.getFullYear() + 543).slice(-2)}`;
        const row = document.createElement('div');
        row.className = 'travel-day-row bg-white border border-slate-200 rounded-lg p-2.5 space-y-2';
        row.innerHTML = `
            <div class="travel-day-meta grid grid-cols-12 gap-2 items-center">
                <div class="text-xs text-center col-span-1 row-num font-semibold">${idx}.</div>
                <div class="col-span-3 td-date"><input type="text" class="day-date w-full border rounded px-2 py-1 text-xs outline-none focus:border-blue-500" value="${escAttr(dateStr)}" placeholder="${escAttr(_exDatePlaceholder)}"></div>
                <div class="td-times">
                    <div class="col-span-2"><input type="text" class="day-out w-full border rounded px-2 py-1 text-xs text-center outline-none focus:border-blue-500" value="${escAttr(tOut)}" placeholder="ออก"></div>
                    <div class="col-span-2"><input type="text" class="day-in w-full border rounded px-2 py-1 text-xs text-center outline-none focus:border-blue-500" value="${escAttr(tIn)}" placeholder="กลับ"></div>
                    <div class="col-span-2"><input type="text" class="day-sum w-full border rounded px-2 py-1 text-xs text-center bg-gray-50 outline-none" value="${escAttr(tSum)}" placeholder="ชม."></div>
                </div>
                <label class="col-span-1 td-fuel flex items-center justify-center gap-0.5 text-[10px] text-amber-900 cursor-pointer" title="ใส่ในแบบ บก.111 / หน้างบ / แผนที่">
                    <input type="checkbox" class="day-fuel rounded border-amber-400" ${fuelChecked ? 'checked' : ''}${fuelUser ? ` data-fuel-user="${fuelUser}"` : ''}>
                    <span>น้ำมัน</span>
                </label>
                <div class="col-span-1 td-remove flex items-center justify-center gap-0.5"><button type="button" class="text-slate-500 hover:text-blue-700 font-bold text-xs px-0.5" onclick="moveTravelDay(this, -1)" title="เลื่อนวันขึ้นด้านบน" aria-label="เลื่อนขึ้น">▲</button><button type="button" class="text-slate-500 hover:text-blue-700 font-bold text-xs px-0.5" onclick="moveTravelDay(this, 1)" title="เลื่อนวันลงด้านล่าง" aria-label="เลื่อนลง">▼</button><button type="button" class="text-red-500 hover:text-red-700 font-bold pl-0.5" onclick="removeTravelDay(this)" title="ลบแถวนี้" aria-label="ลบแถว">✕</button></div>
            </div>
            <div class="travel-day-route grid grid-cols-12 gap-2 items-start">
                <div class="col-span-7 td-dest space-y-1 min-w-0">
                    ${destMultiPanelHtml(dest, destOrder)}
                    <input type="text" class="day-dest w-full border rounded px-2 py-1 text-xs outline-none focus:border-blue-500" value="${escAttr(dest)}" placeholder="รวมปลายทางอัตโนมัติ หรือพิมพ์เอง…" list="dest-suggest-list">
                    <div class="day-doh-stops hidden border border-amber-200 bg-amber-50/50 rounded p-1.5 mt-1"></div>
                </div>
                <div class="td-money">
                    <div class="col-span-2 pt-0.5">
                        <input type="text" class="day-km w-full border rounded px-2 py-1 text-xs text-center outline-none focus:border-blue-500" value="${escAttr(km)}" placeholder="กม." title="ระยะทางไป-กลับ (ระบบปัดลงเป็นจำนวนเต็มอัตโนมัติ)">
                        <div class="day-km-hint text-[9px] text-amber-800 leading-tight mt-0.5 text-center hidden"></div>
                    </div>
                    <div class="col-span-3 pt-0.5"><input type="text" class="day-amount w-full border rounded px-2 py-1 text-xs text-center bg-amber-50 outline-none focus:border-blue-500" value="${escAttr(amountShow)}" placeholder="บาท"></div>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-1.5 no-print">
                <a href="https://dohgis.doh.go.th/dohtotravel/" target="_blank" rel="noopener" onclick="window.__tvDoh?.markRowDohOpened?.(this)" class="day-doh-link inline-flex items-center gap-1 text-[11px] px-2 py-1 rounded border border-amber-400 bg-amber-100 text-amber-950 font-semibold hover:bg-amber-200 no-underline" title="ต้องเปิดลิงก์ระยะทางจาก https://dohgis.doh.go.th/dohtotravel/ เท่านั้น">🔗 ไปลิงก์ DOH TO TRAVEL ↗</a>
                <label class="text-[11px] px-2 py-1 rounded border border-teal-400 bg-teal-50 text-teal-900 font-medium cursor-pointer hover:bg-teal-100" title="อัปโหลด PDF ที่พิมพ์จาก DOH TO TRAVEL (ดึงระยะทาง+ครอปภาพอัตโนมัติ)">
                    อัปโหลด PDF จาก DOH
                    <input type="file" accept="application/pdf,.pdf" class="hidden day-pdf-file" onchange="onDayPdfFile(this)">
                </label>
                <label class="text-[11px] px-2 py-1 rounded border border-slate-300 bg-white cursor-pointer hover:bg-slate-50">
                    แนบรูปแคป DOH
                    <input type="file" accept="image/*" class="hidden day-map-file" onchange="onDayMapFile(this)">
                </label>
                <button type="button" onclick="promptDayMapPaste(this)" class="text-[11px] px-2 py-1 rounded border border-emerald-300 bg-emerald-50 text-emerald-900 hover:bg-emerald-100" title="แคปหน้าจอจาก DOH แล้วกด Ctrl+V">วางรูป (Ctrl+V)</button>
                <button type="button" onclick="clearDayMap(this)" class="text-[11px] px-2 py-1 rounded border border-slate-300 bg-white text-slate-600 hover:bg-slate-50">ลบรูป</button>
                <span class="text-[10px] text-slate-500">ลิงก์/แคปเฉพาะ dohgis.doh.go.th/dohtotravel/ เท่านั้น</span>
            </div>
            <div class="day-doh-status hidden text-[10px] font-semibold px-2 py-1 rounded border flex flex-wrap items-center justify-between gap-1 no-print"></div>
            <div class="day-map-wrap ${mapData ? '' : 'hidden'}">
                <img class="day-map-img block w-auto h-auto max-h-28 max-w-full rounded border border-slate-200" alt="แผนที่ DOH" src="">
                <div class="day-crop-bar hidden flex items-center gap-2 mt-1 text-[10px] text-slate-600 bg-slate-50 border border-slate-200 rounded px-2 py-1 no-print">
                    <span>ขอบตัด PDF:</span>
                    <input type="range" min="35" max="100" value="68" class="day-crop-range flex-1" oninput="window.__tvDoh?.onDayCropInput(this)">
                    <span class="day-crop-pct font-semibold">68%</span>
                </div>
                <input type="hidden" class="day-map-data" value="">
            </div>
        `;
        setRowDestOrder(row, destOrder);
        if (data.dohOpened) row.dataset.dohOpened = '1';
        if (Array.isArray(data.customStops) && data.customStops.length) {
            row.dataset.customStops = JSON.stringify(data.customStops);
        }
        if (data.tvMeta && typeof data.tvMeta === 'object') {
            row.dataset.tvMeta = JSON.stringify(data.tvMeta);
        }
        const hidden = row.querySelector('.day-map-data');
        const img = row.querySelector('.day-map-img');
        const wrap = row.querySelector('.day-map-wrap');
        if (mapData && hidden && img && wrap) {
            hidden.value = mapData;
            img.src = mapData;
            wrap.classList.remove('hidden');
        }
        row.addEventListener('dragover', (e) => {
            e.preventDefault();
            row.classList.add('ring-2', 'ring-teal-400');
        });
        row.addEventListener('dragleave', () => {
            row.classList.remove('ring-2', 'ring-teal-400');
        });
        row.addEventListener('drop', (e) => {
            e.preventDefault();
            row.classList.remove('ring-2', 'ring-teal-400');
            const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
            if (!file) return;
            markMapPasteRow(row);
            if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '')) {
                if (window.__tvDoh && typeof window.__tvDoh.processRowPdfFile === 'function') {
                    window.__tvDoh.processRowPdfFile(row, file);
                }
            } else {
                applyDayMapFile(row, file);
            }
        });
        attachRowListeners(row);
        if (window.__tvDoh && typeof window.__tvDoh.renderRowDohStops === 'function') {
            window.__tvDoh.renderRowDohStops(row);
        }
        return row;
    }

    function markMapPasteRow(row) {
        if (!row || !row.classList.contains('travel-day-row')) return;
        document.querySelectorAll('.travel-day-row.is-map-paste-target').forEach(r => {
            r.classList.remove('is-map-paste-target', 'ring-1', 'ring-amber-400');
        });
        lastMapPasteRow = row;
        row.classList.add('is-map-paste-target', 'ring-1', 'ring-amber-400');
    }

    function applyDayMapFile(row, file) {
        if (!row || !file) return;
        if (file.name && /\.pdf$/i.test(file.name) && (!file.type || file.type === 'application/pdf')) {
            if (window.__tvDoh && typeof window.__tvDoh.processRowPdfFile === 'function') {
                window.__tvDoh.processRowPdfFile(row, file);
                return;
            }
        }
        if (!file.type || !file.type.startsWith('image/')) {
            showToast('วางได้เฉพาะรูปภาพที่แคป หรือไฟล์ PDF จาก DOH TO TRAVEL เท่านั้น');
            return;
        }
        const finishWithDataUrl = (dataUrl) => {
            if (!isPersistableMapSrc(dataUrl)) {
                showToast('รูปแบบรูปไม่รองรับ');
                return;
            }
            const hidden = row.querySelector('.day-map-data');
            const img = row.querySelector('.day-map-img');
            const wrap = row.querySelector('.day-map-wrap');
            if (!hidden || !img || !wrap) return;
            row.__pdfFullCanvas = null;
            const cropBar = row.querySelector('.day-crop-bar');
            if (cropBar) cropBar.classList.add('hidden');
            hidden.value = dataUrl;
            img.src = dataUrl;
            wrap.classList.remove('hidden');
            row.dataset.dohOpened = '1';
            const fuelInput = row.querySelector('.day-fuel');
            if (fuelInput && !fuelInput.checked && typeof canAutoCheckFuel === 'function' && canAutoCheckFuel(fuelInput)) {
                if (typeof setFuelUserChoice === 'function') setFuelUserChoice(fuelInput, true);
                else fuelInput.checked = true;
            }
            const kmInput = row.querySelector('.day-km');
            if (kmInput && (!kmInput.value || parseMoney(kmInput.value) <= 0)) {
                setTimeout(() => {
                    try { kmInput.focus({ preventScroll: false }); kmInput.select?.(); } catch (e) {}
                }, 80);
            }
            if (typeof recalcVehicleFromDays === 'function') recalcVehicleFromDays(true);
            if (typeof refreshDohProgressUI === 'function') refreshDohProgressUI();
            updatePreview();
            scheduleSave();
            showToast('แนบรูปแผนที่ DOH แล้ว (ใช้เฉพาะเว็บ dohgis.doh.go.th/dohtotravel/)');
        };
        if (window.__tvDoh && typeof window.__tvDoh.optimizeImageFileToDataUrl === 'function') {
            window.__tvDoh.optimizeImageFileToDataUrl(file)
                .then(finishWithDataUrl)
                .catch(() => showToast('อ่านรูปไม่สำเร็จ'));
        } else {
            const reader = new FileReader();
            reader.onerror = () => showToast('อ่านรูปไม่สำเร็จ');
            reader.onload = () => finishWithDataUrl(reader.result);
            reader.readAsDataURL(file);
        }
    }

    function onDayMapFile(input) {
        const file = input.files && input.files[0];
        if (!file) return;
        const row = input.closest('.travel-day-row');
        if (!row) return;
        markMapPasteRow(row);
        applyDayMapFile(row, file);
        // อนุญาตเลือกไฟล์เดิมซ้ำได้
        try { input.value = ''; } catch (e) { /* ignore */ }
    }

    function onDayPdfFile(input) {
        const file = input && input.files && input.files[0];
        if (!file) return;
        const row = input.closest('.travel-day-row');
        if (!row) return;
        markMapPasteRow(row);
        if (window.__tvDoh && typeof window.__tvDoh.processRowPdfFile === 'function') {
            window.__tvDoh.processRowPdfFile(row, file);
        } else {
            showToast('ตัวอ่าน PDF ยังไม่พร้อม');
        }
        try { input.value = ''; } catch (e) { /* ignore */ }
    }

    function promptDayMapPaste(btn) {
        const row = btn && btn.closest ? btn.closest('.travel-day-row') : null;
        if (!row) return;
        markMapPasteRow(row);
        showToast('กด Ctrl+V เพื่อวางรูปที่แคปจากเว็บ DOH TO TRAVEL');
    }

    function getClipboardImageFile(clipboardData) {
        if (!clipboardData || !clipboardData.items) return null;
        for (let i = 0; i < clipboardData.items.length; i++) {
            const item = clipboardData.items[i];
            if (item.type && item.type.startsWith('image/')) {
                return item.getAsFile();
            }
        }
        return null;
    }

    function onDocumentPasteMap(e) {
        const file = getClipboardImageFile(e.clipboardData);
        if (!file) {
            const inTextControl = e.target && e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]');
            if (!inTextControl && e.clipboardData) {
                const txt = String(e.clipboardData.getData('text/plain') || '').trim();
                if (/google\.[^/\s]+\/maps|maps\.app\.goo\.gl|goo\.gl\/maps|bing\.com\/maps|here\.com|openstreetmap\.org|^https?:\/\//i.test(txt)) {
                    e.preventDefault();
                    showToast('⚠ ห้ามใช้ลิงก์จากเว็บอื่น! ต้องไปค้นหาและแคปภาพจาก https://dohgis.doh.go.th/dohtotravel/ มาวาง (Ctrl+V) เท่านั้น');
                }
            }
            return;
        }
        let row = (e.target && e.target.closest) ? e.target.closest('.travel-day-row') : null;
        if (!row) row = lastMapPasteRow;
        if (!row || !document.body.contains(row)) {
            e.preventDefault();
            showToast('คลิกแถววันก่อน แล้วกด Ctrl+V เพื่อวางรูปจาก DOH');
            return;
        }
        e.preventDefault();
        markMapPasteRow(row);
        applyDayMapFile(row, file);
    }

    function clearDayMap(btn) {
        const row = btn && btn.closest ? btn.closest('.travel-day-row') : null;
        if (!row) return;
        const hidden = row.querySelector('.day-map-data');
        const img = row.querySelector('.day-map-img');
        const wrap = row.querySelector('.day-map-wrap');
        if (hidden) hidden.value = '';
        if (img) img.removeAttribute('src');
        if (wrap) wrap.classList.add('hidden');
        row.__pdfFullCanvas = null;
        const cropBar = row.querySelector('.day-crop-bar');
        if (cropBar) cropBar.classList.add('hidden');
        const file = row.querySelector('.day-map-file');
        if (file) file.value = '';
        const pdfFile = row.querySelector('.day-pdf-file');
        if (pdfFile) pdfFile.value = '';
        if (typeof refreshDohProgressUI === 'function') refreshDohProgressUI();
        updatePreview();
        scheduleSave();
    }

    function getDohFuelEvidenceSummary() {
        const rows = Array.from(document.querySelectorAll('#travel-days-list .travel-day-row'));
        let fuelCount = 0;
        let completeCount = 0;
        let mapAttachedCount = 0;
        let missingMapCount = 0;
        let missingKmCount = 0;
        const missingMapRows = [];
        const incompleteRows = [];

        rows.forEach((row, index) => {
            if (!isFuelDayRow(row)) return;
            fuelCount++;
            const dateStr = (row.querySelector('.day-date')?.value || '').trim();
            const dateLabel = dateStr || ('วันที่ #' + (index + 1));
            const rawMap = row.querySelector('.day-map-data')?.value || '';
            const hasMap = isPersistableMapSrc(rawMap);
            const rawKm = (row.querySelector('.day-km')?.value || '').trim();
            const km = (typeof floorKm === 'function') ? floorKm(rawKm) : Math.floor(Math.max(0, parseMoney(rawKm)));
            const hasKm = km > 0;
            const opened = row.dataset.dohOpened === '1';

            if (hasMap) mapAttachedCount++;
            else {
                missingMapCount++;
                missingMapRows.push({ index, row, dateLabel, hasKm, opened });
            }
            if (!hasKm) missingKmCount++;
            if (hasMap && hasKm) {
                completeCount++;
            } else {
                incompleteRows.push({ index, row, dateLabel, hasMap, hasKm, opened });
            }
        });

        return {
            fuelCount,
            completeCount,
            mapAttachedCount,
            missingMapCount,
            missingKmCount,
            missingMapRows,
            incompleteRows
        };
    }

    function focusDohRowByIndex(idx) {
        const rows = document.querySelectorAll('#travel-days-list .travel-day-row');
        const row = rows[idx];
        if (!row) return;
        markMapPasteRow(row);
        try { row.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { /* ignore */ }
        const kmEl = row.querySelector('.day-km');
        if (kmEl && !kmEl.value) {
            try { kmEl.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
        }
    }

    function focusFirstMissingDohRow() {
        const sum = getDohFuelEvidenceSummary();
        const firstIdx = sum.missingMapRows.length ? sum.missingMapRows[0].index
            : (sum.incompleteRows.length ? sum.incompleteRows[0].index : 0);
        const wiz = document.getElementById('area-wizard');
        if (wiz && wiz.classList.contains('is-open') && typeof goAwStep === 'function') {
            goAwStep(5);
        } else if (typeof switchMobileTab === 'function') {
            try { switchMobileTab('form'); } catch (e) { /* ignore */ }
        }
        setTimeout(() => {
            focusDohRowByIndex(firstIdx);
            showToast('กรุณากดลิงก์ DOH TO TRAVEL แล้วแคปรูป (Ctrl+V) หรืออัปโหลด PDF มาวาง');
        }, 60);
    }

    function refreshDohProgressUI() {
        const rows = Array.from(document.querySelectorAll('#travel-days-list .travel-day-row'));
        rows.forEach((row) => {
            const statusEl = row.querySelector('.day-doh-status');
            if (!statusEl) return;
            if (!isFuelDayRow(row)) {
                statusEl.className = 'day-doh-status hidden text-[10px] font-semibold px-2 py-1 rounded border flex flex-wrap items-center justify-between gap-1 no-print';
                statusEl.textContent = '';
                return;
            }
            const rawMap = row.querySelector('.day-map-data')?.value || '';
            const hasMap = isPersistableMapSrc(rawMap);
            const rawKm = (row.querySelector('.day-km')?.value || '').trim();
            const km = (typeof floorKm === 'function') ? floorKm(rawKm) : Math.floor(Math.max(0, parseMoney(rawKm)));
            const opened = row.dataset.dohOpened === '1';

            let cls = 'border-amber-300 bg-amber-50 text-amber-900';
            let txt = '';
            if (hasMap && km > 0) {
                cls = 'border-emerald-300 bg-emerald-50 text-emerald-900';
                txt = `✓ แนบรูป DOH + ระยะทางครบแล้ว (ปัดลง ${km} กม.)`;
            } else if (hasMap) {
                cls = 'border-sky-300 bg-sky-50 text-sky-900';
                txt = '🖼 แนบรูปแคป DOH แล้ว — กรุณากรอกระยะทาง กม. จากรูป (ปัดลงอัตโนมัติ)';

            } else {
                cls = 'border-amber-300 bg-amber-50 text-amber-950';
                txt = '⏳ รอกดลิงก์ไปเว็บ DOH TO TRAVEL แล้วแคปรูประยะทางมาวาง';
            }
            statusEl.className = `day-doh-status text-[10px] font-semibold px-2 py-1 rounded border flex flex-wrap items-center justify-between gap-1 no-print ${cls}`;
            statusEl.textContent = txt;
        });

        const badge = document.getElementById('doh-progress-badge');
        const barFill = document.getElementById('doh-progress-bar-fill');
        const missingBox = document.getElementById('doh-missing-alert');
        const banner = document.getElementById('doh-progress-banner');

        if (badge) {
            if (sum.fuelCount === 0) {
                badge.textContent = 'ยังไม่มีวันที่ติ๊กเบิกน้ำมัน';
                badge.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold border border-slate-300 bg-white text-slate-600';
            } else if (sum.completeCount === sum.fuelCount) {
                badge.textContent = `✓ แนบหลักฐาน DOH ครบ ${sum.completeCount} / ${sum.fuelCount} วัน`;
                badge.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold border border-emerald-400 bg-emerald-100 text-emerald-900';
            } else {
                badge.textContent = `หลักฐาน DOH (รูป+ระยะ): ${sum.completeCount} / ${sum.fuelCount} วัน`;
                badge.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold border border-amber-400 bg-white text-amber-950';
            }
        }
        if (barFill) {
            const pct = sum.fuelCount > 0 ? Math.round((sum.completeCount / sum.fuelCount) * 100) : 0;
            barFill.style.width = pct + '%';

        if (banner) {
            banner.classList.toggle('border-emerald-400', sum.fuelCount > 0 && sum.completeCount === sum.fuelCount);
            banner.classList.toggle('bg-emerald-50/70', sum.fuelCount > 0 && sum.completeCount === sum.fuelCount);
        }
        if (missingBox) {

                    return `<button type="button" onclick="focusDohRowByIndex(${it.index})" class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded border border-amber-400 bg-white hover:bg-amber-100 text-amber-950 font-medium">${escHtml(it.dateLabel)} (${need})</button>`;
                }).join(' ');
                missingBox.innerHTML = `<div class="font-semibold text-amber-900 mb-1">⚠ วันที่เบิกน้ำมันที่ยังต้องไปลิงก์เว็บ DOH / แคปรูปมาวาง (${sum.incompleteRows.length} วัน) — คลิกวันที่เพื่อเลื่อนไปวางรูป:</div><div class="flex flex-wrap gap-1">${chips}</div>`;
                missingBox.classList.remove('hidden');

                missingBox.innerHTML = '';
                missingBox.classList.add('hidden');

    window.getDohFuelEvidenceSummary = getDohFuelEvidenceSummary;
    window.refreshDohProgressUI = refreshDohProgressUI;
