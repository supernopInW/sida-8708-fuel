    /** ปัดระยะทางลงเป็นจำนวนเต็มกิโลเมตร (เช่น 42.66 -> 42, ๔๒.๖๖ -> 42) */
    function floorKm(val) {
        if (val == null || val === '') return 0;
        let s = String(val).replace(/[๐-๙]/g, function (c) {
            return String('๐๑๒๓๔๕๖๗๘๙'.indexOf(c));
        }).replace(/,/g, '').trim();
        if (!s) return 0;
        const n = parseFloat(s);
        if (!isFinite(n) || n <= 0) return 0;
        return Math.floor(n);
    }

    function parseThaiDateCell(raw) {
        const s = String(raw || '').replace(/[๐-๙]/g, function (c) {
            return String('๐๑๒๓๔๕๖๗๘๙'.indexOf(c));
        }).replace(/\s+/g, ' ').trim();
        const m = s.match(/(\d{1,2})\s+([ก-ฮ\.]+)\s+(\d{2,4})/);
        if (!m) {
            return { raw: s, day: 0, monthIdx: -1, yearBE: 0, display8708: s || '', fullDate: s || '', iso: '', dateObj: null };
        }
        const day = parseInt(m[1], 10);
        const mKey = m[2].trim();
        const mIdx = THAI_MONTH_MAP[mKey] != null
            ? THAI_MONTH_MAP[mKey]
            : (THAI_MONTH_MAP[mKey.replace(/\.$/, '')] != null ? THAI_MONTH_MAP[mKey.replace(/\.$/, '')] : -1);
        let yearBE = parseInt(m[3], 10);
        if (yearBE < 100) yearBE += 2500;
        if (yearBE < 2400) yearBE += 543;
        const yearAD = yearBE - 543;
        if (mIdx < 0 || day <= 0) {
            return { raw: s, day: day, monthIdx: -1, yearBE: yearBE, display8708: s, fullDate: s, iso: '', dateObj: null };
        }
        const abbr = THAI_ABBR[mIdx];
        const fullM = THAI_FULL[mIdx];
        const yy = String(yearBE).slice(-2);
        const mm = String(mIdx + 1).padStart(2, '0');
        const dd = String(day).padStart(2, '0');
        return {
            raw: s,
            day: day,
            monthIdx: mIdx,
            yearBE: yearBE,
            monthFull: fullM,
            display8708: day + ' ' + abbr + ' ' + yy,
            fullDate: day + ' ' + fullM + ' ' + yearBE,
            iso: yearAD + '-' + mm + '-' + dd,
            dateObj: new Date(yearAD, mIdx, day)
        };
    }

    /**
     * ตัวอ่านไฟล์ ZIP แบบ Pure JS (Zero Dependency) รองรับ Method 0 (Store) และ Method 8 (Deflate ผ่าน DecompressionStream)
     */
    async function inflateRawBytes(u8) {
        if (typeof DecompressionStream === 'undefined') {
            throw new Error('เบราว์เซอร์ไม่รองรับ DecompressionStream สำหรับอ่านไฟล์ .docx');
        }
        const ds = new DecompressionStream('deflate-raw');
        const stream = new Blob([u8]).stream().pipeThrough(ds);
        const ab = await new Response(stream).arrayBuffer();
        return new Uint8Array(ab);
    }

    async function unzipXmlFiles(arrayBuffer) {
        const bytes = new Uint8Array(arrayBuffer);
        const view = new DataView(arrayBuffer);

        // หา End of Central Directory (0x06054b50) จากท้ายไฟล์
        let eocdOffset = -1;
        const minOffset = Math.max(0, bytes.length - 65558);
        for (let i = bytes.length - 22; i >= minOffset; i--) {
            if (view.getUint32(i, true) === 0x06054b50) {
                eocdOffset = i;
                break;
            }
        }
        if (eocdOffset < 0) throw new Error('ไฟล์นี้ไม่ใช่โครงสร้าง ZIP/.docx ที่ถูกต้อง');

        const totalEntries = view.getUint16(eocdOffset + 10, true);
        const cdOffset = view.getUint32(eocdOffset + 16, true);
        const dec = new TextDecoder('utf-8');
        const out = {};
        let ptr = cdOffset;

        for (let i = 0; i < totalEntries && ptr + 46 <= bytes.length; i++) {
            if (view.getUint32(ptr, true) !== 0x02014b50) break;
            const method = view.getUint16(ptr + 10, true);
            const compSize = view.getUint32(ptr + 20, true);
            const nameLen = view.getUint16(ptr + 28, true);
            const extraLen = view.getUint16(ptr + 30, true);
            const commentLen = view.getUint16(ptr + 32, true);
            const localHeaderOffset = view.getUint32(ptr + 42, true);
            const name = dec.decode(bytes.subarray(ptr + 46, ptr + 46 + nameLen));
            ptr += 46 + nameLen + extraLen + commentLen;

            if (name === 'word/document.xml' || /^word\/header\d*\.xml$/.test(name) ||
                name === 'xl/sharedStrings.xml' || /^xl\/worksheets\/sheet\d+\.xml$/.test(name)) {
                if (view.getUint32(localHeaderOffset, true) !== 0x04034b50) continue;
                const lNameLen = view.getUint16(localHeaderOffset + 26, true);
                const lExtraLen = view.getUint16(localHeaderOffset + 28, true);
                const dataStart = localHeaderOffset + 30 + lNameLen + lExtraLen;
                const compData = bytes.subarray(dataStart, dataStart + compSize);
                let plain;
                if (method === 0) plain = compData;
                else if (method === 8) plain = await inflateRawBytes(compData);
                else throw new Error('ไม่รองรับวิธีการบีบอัด ZIP #' + method);
                out[name] = dec.decode(plain);
            }
        }
        return out;
    }

    function xmlExtractParagraphText(pNode) {
        let txt = '';
        function walk(node) {
            if (!node || node.nodeType !== 1) return;
            const local = node.localName || node.nodeName.replace(/^.*:/, '');
            if (local === 'Fallback') return; // ข้าม mc:Fallback เพื่อไม่ให้ข้อความใน Text Box ซ้ำ
            if (local === 't') {
                txt += node.textContent || '';
                return;
            }
            if (local === 'tab') { txt += ' '; return; }
            if (local === 'br') { txt += ' '; return; }
            const kids = node.children || node.childNodes;
            for (let i = 0; i < kids.length; i++) {
                if (kids[i].nodeType === 1) walk(kids[i]);
            }
        }
        walk(pNode);
        return txt;
    }

    function xmlExtractAllParagraphTexts(rootEl) {
        const list = [];
        function walk(node) {
            if (!node || node.nodeType !== 1) return;
            const local = node.localName || node.nodeName.replace(/^.*:/, '');
            if (local === 'Fallback') return;
            if (local === 'p') {
                list.push(xmlExtractParagraphText(node));
                return;
            }
            const kids = node.children || node.childNodes;
            for (let i = 0; i < kids.length; i++) {
                if (kids[i].nodeType === 1) walk(kids[i]);
            }
        }
        walk(rootEl);
        return list;
    }

    /**
     * แปลง ArrayBuffer ของไฟล์ .docx T&V ให้เป็นโครงสร้างข้อมูลสำหรับระบบ
     */
    async function parseDocxPlanArrayBuffer(arrayBuffer, fileName) {
        const xmlFiles = await unzipXmlFiles(arrayBuffer);
        const docXmlStr = xmlFiles['word/document.xml'];
        if (!docXmlStr) throw new Error('ไม่พบ word/document.xml ในไฟล์ .docx');

        const parser = new DOMParser();
        let reportTitle = '';
        let officerName = '';
        let periodText = '';

        Object.keys(xmlFiles).sort().forEach(function (name) {
            if (!/^word\/header\d*\.xml$/.test(name)) return;
            const doc = parser.parseFromString(xmlFiles[name], 'text/xml');
            const lines = xmlExtractAllParagraphTexts(doc.documentElement)
                .map(function (s) { return s.replace(/\s+/g, ' ').trim(); })
                .filter(Boolean);
            lines.forEach(function (line) {
                if (line.indexOf('รายงานแผนการดำเนินงาน') !== -1) reportTitle = line;
                else if (line.indexOf('ประจำเดือน') !== -1) periodText = line;
                else if (!officerName && /^(นาย|นาง|นางสาว|ว่าที่)/.test(line)) {
                    officerName = line.replace(/\s*(?:หน่วยงาน|ตำแหน่ง|ตำบลที่รับผิดชอบ)[\s\S]*$/, '').trim();
                }
            });
        });

        const mainDoc = parser.parseFromString(docXmlStr, 'text/xml');
        const body = Array.from(mainDoc.documentElement.children || []).find(function (el) {
            return (el.localName || '') === 'body';
        }) || mainDoc.documentElement;

        const tables = Array.from(body.children || []).filter(function (el) {
            return (el.localName || '') === 'tbl';
        });
        const rawRows = [];
        if (tables.length > 0) {
            const trs = Array.from(tables[0].children || []).filter(function (el) {
                return (el.localName || '') === 'tr';
            });
            trs.forEach(function (tr) {
                const tcs = Array.from(tr.children || []).filter(function (el) {
                    return (el.localName || '') === 'tc';
                });
                const cells = tcs.map(function (tc) {
                    return xmlExtractAllParagraphTexts(tc).join(' ').replace(/\s+/g, ' ').trim();
                });
                if (cells.length >= 6 && /^\d+\.?$/.test(cells[0])) {
                    rawRows.push({
                        seq: cells[0],
                        seqNum: parseInt(cells[0].replace(/[^\d]/g, ''), 10) || (rawRows.length + 1),
                        category: cells[1] || '',
                        activity: cells[2] || '',
                        detail: cells[3] || '',
                        dateRaw: cells[4] || '',
                        locationRaw: cells[5] || '',
                        targetCount: cells[6] || '',
                        note: cells[7] || ''
                    });
                }
            });
        }

        if (!rawRows.length) {
            throw new Error('ไม่พบแถวตารางแผนการเดินทางในไฟล์ .docx (ต้องมีคอลัมน์ลำดับ, งาน/กิจกรรม, วันที่, สถานที่)');
        }

        // ดึงผู้บังคับบัญชา และผู้จัดทำจากท้ายหน้าเอกสาร
        let approverName = '';
        let approverPosition = '';
        let officerPosition = '';
        const bodyParas = Array.from(body.children || []).filter(function (el) {
            return (el.localName || '') === 'p';
        });
        const footerText = bodyParas.map(xmlExtractParagraphText).join(' ').replace(/\s+/g, ' ');
        const approverMatch = footerText.match(/ผู้บังคับบัญชา\/ผู้รับรอง[^()]*\(\s*([^)]+)\s*\)\s*ตำแหน่ง\s*([^\s].*?)(?=หน่วยงาน|ผู้จัดทำรายงาน|$)/);
        if (approverMatch) {
            approverName = approverMatch[1].trim();
            approverPosition = approverMatch[2].replace(/\s+/g, ' ').trim();
        }
        const authorMatch = footerText.match(/ผู้จัดทำรายงาน[^()]*\(\s*([^)]+)\s*\)\s*ตำแหน่ง\s*([^\s].*?)(?=หน่วยงาน|$)/);
        if (authorMatch) {
            const sigName = authorMatch[1].trim();
            if (sigName) officerName = sigName;
            officerPosition = authorMatch[2].replace(/\s+/g, ' ').trim();
        }

        // แปลงแต่ละแถวเป็นโครงสร้างพร้อม destOrder และจุดแวะ DOH
        const items = rawRows.map(function (row) {
            const dateParsed = parseThaiDateCell(row.dateRaw);
            const resolved = resolveTvLocationRaw(row.locationRaw);
            return Object.assign({}, row, {
                dateParsed: dateParsed,
                dateDisplay: dateParsed.display8708,
                dateIso: dateParsed.iso,
                isFieldTrip: resolved.isFieldTrip,
                destOrder: resolved.destOrder,
                destText: resolved.destText,
                customStops: resolved.customStops,
                stops: resolved.stops,
                routeSummary: resolved.routeSummary
            });
        });

        // ตรวจว่าใน Word มีการเรียงวันที่สลับกันหรือไม่ แล้วเรียงตามวันที่จริงสำหรับแบบ 8708 + บก.111
        let hadOutOfOrderDates = false;
        for (let i = 1; i < items.length; i++) {
            if (items[i].dateIso && items[i - 1].dateIso && items[i].dateIso < items[i - 1].dateIso) {
                hadOutOfOrderDates = true;
                break;
            }
        }
        const sortedItems = items.slice().sort(function (a, b) {
            const da = a.dateIso || '9999-99-99';
            const db = b.dateIso || '9999-99-99';
            return da === db ? (a.seqNum - b.seqNum) : da.localeCompare(db);
        });

        return {
            fileName: fileName || 'plan.docx',
            reportTitle: reportTitle,
            officerName: officerName,
            officerPosition: officerPosition,
            periodText: periodText,
            approverName: approverName,
            approverPosition: approverPosition,
            hadOutOfOrderDates: hadOutOfOrderDates,
            items: sortedItems
        };
    }

    /**
     * แปลงข้อความ "สถานที่ดำเนินการ" เช่น "หมู่ 2, 4, 8 ตำบลหนองตาดใหญ่"
     * เป็น destOrder ตามลำดับที่ไป (ไม่เรียงเลขหมู่) และรายชื่อจุดค้นหาใน DOH TO TRAVEL
     */
    function getActiveOrgConfig() {
        const org = global.ORG || {};
        const amphoeEl = typeof document !== 'undefined' ? document.getElementById('in-amphoe') : null;
        const provEl = typeof document !== 'undefined' ? document.getElementById('in-province') : null;
        const deptEl = typeof document !== 'undefined' ? document.getElementById('in-dept') : null;
        const officeEl = typeof document !== 'undefined' ? document.getElementById('in-office') : null;
        const amphoe = String((amphoeEl && amphoeEl.value) || org.amphoe || 'สีดา').replace(/^(อำเภอ|อ\.|เขต)\s*/g, '').trim() || 'สีดา';
        const province = String((provEl && provEl.value) || org.province || 'นครราชสีมา').replace(/^(จังหวัด|จ\.)\s*/g, '').trim() || 'นครราชสีมา';
        const officeTambon = String(org.officeTambon || amphoe).replace(/^(ตำบล|ต\.|แขวง)\s*/g, '').trim() || amphoe;
        const officeName = String((deptEl && deptEl.value) || (officeEl && officeEl.value) || org.officeName || ('สำนักงานเกษตรอำเภอ' + amphoe)).trim() || ('สำนักงานเกษตรอำเภอ' + amphoe);
        const isSida = (amphoe === 'สีดา' && province === 'นครราชสีมา');
        const fullAddress = isSida
            ? SIDA_VILLAGES_MAP.office.fullAddress
            : ('กรมส่งเสริมการเกษตร ' + officeName + ' ต.' + officeTambon + ' อ.' + amphoe + ' จ.' + province);
        return {
            amphoe: amphoe,
            province: province,
            officeTambon: officeTambon,
            officeName: officeName,
            isSida: isSida,
            fullAddress: fullAddress
        };
    }

    function resolveTvLocationRaw(locationRaw) {
        const raw = String(locationRaw || '').trim();
        const cfg = getActiveOrgConfig();
        const originStop = {
            role: 'origin',
            id: 'office',
            isOffice: true,
            amphoe: cfg.amphoe,
            province: cfg.province,
            officeName: cfg.officeName,
            label: cfg.officeName,
            searchKeyword: cfg.officeName,
            fullAddress: cfg.fullAddress
        };

        const isOfficeOnly = !raw || raw === cfg.officeName ||
            (/^(สำนักงานเกษตรอำเภอ|สนง\.?\s*กษอ\.?|สนง\.?\s*เกษตร)/.test(raw) && raw.indexOf('หมู่') === -1 && raw.indexOf('ตำบล') === -1 && raw.indexOf('ต.') === -1);
        if (isOfficeOnly) {
            return {
                isFieldTrip: false,
                destOrder: [],
                destText: raw || originStop.label,
                customStops: [],
                stops: [originStop],
                routeSummary: 'ปฏิบัติงาน ณ ' + cfg.officeName
            };
        }

        const destOrder = [];
        const customStops = [];
        const middleStops = [];
        const segmentRegex = /(?:หมู่ที่|หมู่|ม\.)\s*([\d,\sและ\-–]+?)\s*(?:ตำบล|ต\.)\s*([\u0E01-\u0E4E]+)(?:\s*(?:อำเภอ|อ\.)\s*([\u0E01-\u0E4E]+))?(?:\s*(?:จังหวัด|จ\.)\s*([\u0E01-\u0E4E]+))?/g;
        let match;

        while ((match = segmentRegex.exec(raw)) !== null) {
            const mooPart = match[1];
            const tambon = String(match[2] || '').replace(/^ตำบล|^ต\./, '').trim();
            const amphoe = match[3] ? match[3].trim() : cfg.amphoe;
            const province = match[4] ? match[4].trim() : cfg.province;
            const mooNums = mooPart.match(/\d+/g) || [];
            mooNums.forEach(function (mooStr) {
                const mooNum = parseInt(mooStr, 10);
                const id = tambon + '-m' + mooNum;
                const meta = cfg.isSida ? SIDA_VILLAGES_MAP[id] : null;
                if (meta && (!global.DEST_BY_ID || global.DEST_BY_ID[id])) {
                    if (destOrder.indexOf(id) < 0) destOrder.push(id);
                    middleStops.push({
                        role: 'waypoint',
                        id: id,
                        amphoe: cfg.amphoe,
                        province: cfg.province,
                        label: meta.villageName + ' (ม.' + mooNum + ')',
                        tambon: meta.tambon,
                        moo: mooNum,
                        searchKeyword: meta.searchKeyword,
                        fullAddress: meta.fullAddress
                    });
                } else {
                    const cs = {
                        role: 'waypoint',
                        id: '',
                        amphoe: amphoe,
                        province: province,
                        label: 'หมู่ ' + mooNum + ' ต.' + tambon,
                        tambon: tambon,
                        moo: mooNum,
                        searchKeyword: 'หมู่ที่ ' + mooNum + ' ต.' + tambon + ' อ.' + amphoe + ' จ.' + province,
                        fullAddress: 'หมู่ที่ ' + mooNum + ' ต.' + tambon + ' อ.' + amphoe + ' จ.' + province
                    };
                    customStops.push(cs);
                    middleStops.push(cs);
                }
            });
        }

        // กรณีเป็นสถานที่นอกรูปแบบ "หมู่ ... ตำบล ..."
        if (!middleStops.length) {
            const hasAreaHint = raw.indexOf('อำเภอ') !== -1 || raw.indexOf('อ.') !== -1 || raw.indexOf('จังหวัด') !== -1 || raw.indexOf('จ.') !== -1;
            const extStop = {
                role: 'waypoint',
                id: '',
                amphoe: cfg.amphoe,
                province: cfg.province,
                label: raw,
                tambon: '',
                moo: '',
                searchKeyword: hasAreaHint ? raw : (raw + ' อ.' + cfg.amphoe + ' จ.' + cfg.province),
                fullAddress: hasAreaHint ? raw : (raw + ' อ.' + cfg.amphoe + ' จ.' + cfg.province)
            };
            customStops.push(extStop);
            middleStops.push(extStop);
        }

        const returnStop = {
            role: 'return',
            id: 'office',
            isOffice: true,
            amphoe: cfg.amphoe,
            province: cfg.province,
            officeName: cfg.officeName,
            label: cfg.officeName + ' (กลับ)',
            searchKeyword: cfg.officeName,
            fullAddress: cfg.fullAddress
        };

        let destText = raw;
        const dynamicSuffix = ' อำเภอ' + cfg.amphoe + ' จังหวัด' + cfg.province;
        if (destOrder.length && !customStops.length && typeof global.combineDestFromOrder === 'function') {
            destText = global.combineDestFromOrder(destOrder);
        } else if (destOrder.length && customStops.length && typeof global.combineDestFromOrder === 'function') {
            destText = global.combineDestFromOrder(destOrder) + ' และ ' + customStops.map(function (c) { return c.label; }).join(', ');
        } else if (raw.indexOf('อำเภอ') === -1 && raw.indexOf('จังหวัด') === -1 && raw !== originStop.label) {
            destText = raw + (global.DEST_SUFFIX || dynamicSuffix);
        }

        const allStops = [originStop].concat(middleStops).concat([returnStop]);
        const routeSummary = ['สนง.เกษตรฯ'].concat(middleStops.map(function (s) { return s.label; })).concat(['สนง.เกษตรฯ']).join(' → ');

        return {
            isFieldTrip: true,
            destOrder: destOrder,
            destText: destText,
            customStops: customStops,
            stops: allStops,
            routeSummary: routeSummary
        };
    }

    /**
     * สร้างรายการจุดหยุดเรียงตามลำดับสำหรับแถว .travel-day-row:
     * สำนักงาน (จุดเริ่มต้น) -> หมู่บ้าน/สถานที่ตามลำดับ -> สำนักงาน (กลับ)
     */
    function buildStopsForRow(row) {
        const cfg = getActiveOrgConfig();
        const origin = {
            role: 'origin',
            id: 'office',
            isOffice: true,
            tambon: 'OFFICE',
            moo: cfg.isSida ? 1 : '',
            amphoe: cfg.amphoe,
            province: cfg.province,
            officeName: cfg.officeName,
            officeTambon: cfg.officeTambon,
            villageName: cfg.officeName,
            label: cfg.officeName,
            searchKeyword: cfg.officeName,
            fullAddress: cfg.fullAddress
        };
        const ret = {
            role: 'return',
            id: 'office',
            isOffice: true,
            tambon: 'OFFICE',
            moo: cfg.isSida ? 1 : '',
            amphoe: cfg.amphoe,
            province: cfg.province,
            officeName: cfg.officeName,
            officeTambon: cfg.officeTambon,
            villageName: cfg.officeName,
            label: cfg.officeName + ' (กลับ)',
            searchKeyword: cfg.officeName,
            fullAddress: cfg.fullAddress
        };

        let order = typeof global.getRowDestOrder === 'function' ? global.getRowDestOrder(row) : [];
        const destVal = (row.querySelector('.day-dest')?.value || '').trim();
        if (!order.length && destVal && typeof global.parseDestOrderFromText === 'function') {
            order = global.parseDestOrderFromText(destVal);
        }

        let customStops = [];
        try {
            const rawC = row.dataset.customStops;
            if (rawC) {
                const parsed = JSON.parse(rawC);
                if (Array.isArray(parsed)) customStops = parsed;
            }
        } catch (e) { /* ignore */ }

        const mids = [];
        order.forEach(function (id) {
            if (id === 'office') return;
            const meta = cfg.isSida ? SIDA_VILLAGES_MAP[id] : null;
            if (meta) {
                mids.push({
                    role: 'waypoint',
                    id: id,
                    isOffice: false,
                    amphoe: cfg.amphoe,
                    province: cfg.province,
                    tambon: meta.tambon,
                    moo: meta.moo,
                    villageName: meta.villageName,
                    label: meta.villageName + ' (ม.' + meta.moo + ')',
                    searchKeyword: meta.searchKeyword,
                    fullAddress: meta.fullAddress
                });
            } else if (global.DEST_BY_ID && global.DEST_BY_ID[id]) {
                const p = global.DEST_BY_ID[id];
                const mParts = String(id).match(/^(.+)-m(\d+)$/);
                mids.push({
                    role: 'waypoint',
                    id: id,
                    isOffice: false,
                    amphoe: cfg.amphoe,
                    province: cfg.province,
                    tambon: mParts ? mParts[1] : 'CUSTOM',
                    moo: mParts ? parseInt(mParts[2], 10) : '',
                    villageName: '',
                    label: p.short,
                    searchKeyword: p.short + ' อ.' + cfg.amphoe + ' จ.' + cfg.province,
                    fullAddress: p.full
                });
            }
        });
        customStops.forEach(function (cs) {
            if (!cs || !cs.label) return;
            mids.push({
                role: 'waypoint',
                id: '',
                isOffice: false,
                amphoe: cs.amphoe || cfg.amphoe,
                province: cs.province || cfg.province,
                tambon: cs.tambon || 'CUSTOM',
                moo: cs.moo || '',
                villageName: cs.villageName || '',
                label: cs.label,
                searchKeyword: cs.searchKeyword || cs.label,
                fullAddress: cs.fullAddress || cs.label
            });
        });

        // ถ้าพิมพ์ปลายทางเองแล้วยังไม่แมตช์ ให้แสดงจุดพิมพ์เองตรงกลางพร้อมระบุอำเภอ/จังหวัดปัจจุบัน
        if (!mids.length && destVal && destVal !== cfg.officeName && !(/^สำนักงานเกษตรอำเภอ/.test(destVal) && destVal.indexOf('หมู่') === -1 && destVal.indexOf('ตำบล') === -1 && destVal.indexOf('ต.') === -1)) {
            const suffixRe = new RegExp('\\s*อำเภอ' + cfg.amphoe.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*จังหวัด' + cfg.province.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*$', 'g');
            const cleanDest = destVal.replace(suffixRe, '').trim();
            if (cleanDest) {
                const hasAreaHint = cleanDest.indexOf('อำเภอ') !== -1 || cleanDest.indexOf('อ.') !== -1 || cleanDest.indexOf('จังหวัด') !== -1 || cleanDest.indexOf('จ.') !== -1;
                mids.push({
                    role: 'waypoint',
                    id: '',
                    isOffice: false,
                    amphoe: cfg.amphoe,
                    province: cfg.province,
                    tambon: 'CUSTOM',
                    moo: '',
                    villageName: '',
                    label: cleanDest,
                    searchKeyword: hasAreaHint ? cleanDest : (cleanDest + ' อ.' + cfg.amphoe + ' จ.' + cfg.province),
                    fullAddress: destVal
                });
            }
        }

        if (!mids.length) {
            return { stops: [], order: order };
        }
        return {
            stops: [origin].concat(mids).concat([ret]),
            order: order
        };
    }

    function copyTextToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text).catch(function () {
                return fallbackExecCopy(text);
            });
        }
        return Promise.resolve(fallbackExecCopy(text));
    }

    function fallbackExecCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
        document.body.appendChild(ta);
        try { ta.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
        ta.select();
        try { ta.setSelectionRange(0, text.length); } catch (e) { /* ignore */ }
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        ta.remove();
        if (!ok) throw new Error('copy failed');
        return true;
    }

    let _pdfJsPromise = null;
    const PDF_JS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';

    function ensurePdfJsLoaded() {
        if (global.pdfjsLib) return Promise.resolve(global.pdfjsLib);
        if (_pdfJsPromise) return _pdfJsPromise;
        _pdfJsPromise = new Promise(function (resolve, reject) {
            const sc = document.createElement('script');
            sc.src = PDF_JS_URL;
            sc.async = true;
            sc.onload = function () {
                if (global.pdfjsLib) resolve(global.pdfjsLib);
                else reject(new Error('โหลด pdf.js ไม่สำเร็จ'));
            };
            sc.onerror = function () {
                _pdfJsPromise = null;
                reject(new Error('ไม่สามารถโหลดตัวอ่าน PDF (ไม่มีอินเทอร์เน็ตหรือถูกบล็อก)'));
            };
            document.head.appendChild(sc);
        });
        return _pdfJsPromise;
    }

    /** บีบอัด canvas/รูปขนาดใหญ่ให้พอดี A4 และไม่เต็มโควต้า localStorage เมื่อแนบครบ 16+ วัน */
    function canvasToCompactDataUrl(canvas) {
        let target = canvas;
        const MAX_W = 1100;
        if (canvas.width > MAX_W) {
            const scale = MAX_W / canvas.width;
            target = document.createElement('canvas');
            target.width = Math.round(canvas.width * scale);
            target.height = Math.round(canvas.height * scale);
            const ctx = target.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, target.width, target.height);
            ctx.drawImage(canvas, 0, 0, target.width, target.height);
        }
        const pngUrl = target.toDataURL('image/png');
        if (pngUrl.length <= 260000) return pngUrl;
        // ถ้า PNG ใหญ่เกิน 260KB ใช้ JPEG พื้นหลังขาวเพื่อประหยัดพื้นที่เก็บหลายวัน
        const jpgCanvas = document.createElement('canvas');
        jpgCanvas.width = target.width;
        jpgCanvas.height = target.height;
        const jctx = jpgCanvas.getContext('2d');
        jctx.fillStyle = '#ffffff';
        jctx.fillRect(0, 0, jpgCanvas.width, jpgCanvas.height);
        jctx.drawImage(target, 0, 0);
        return jpgCanvas.toDataURL('image/jpeg', 0.88);
    }

    function optimizeImageFileToDataUrl(file) {
        return new Promise(function (resolve, reject) {
            const reader = new FileReader();
            reader.onerror = function () { reject(new Error('อ่านไฟล์รูปไม่สำเร็จ')); };
            reader.onload = function () {
                const rawUrl = reader.result;
                if (!rawUrl || typeof rawUrl !== 'string') {
                    reject(new Error('รูปแบบรูปไม่ถูกต้อง'));
                    return;
                }
                if (rawUrl.length <= 320000) {
                    resolve(rawUrl);
                    return;
                }
                const img = new Image();
                img.onload = function () {
                    const maxW = 1150;
                    let w = img.naturalWidth || img.width;
                    let h = img.naturalHeight || img.height;
                    if (w > maxW) {
                        h = Math.round((h * maxW) / w);
                        w = maxW;
                    }
                    const c = document.createElement('canvas');
                    c.width = w;
                    c.height = h;
                    const ctx = c.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, w, h);
                    ctx.drawImage(img, 0, 0, w, h);
                    resolve(c.toDataURL('image/jpeg', 0.88));
                };
                img.onerror = function () { resolve(rawUrl); };
                img.src = rawUrl;
            };
            reader.readAsDataURL(file);
        });
    }

    function cropRowPdfCanvas(row, pct) {
        const full = row && row.__pdfFullCanvas;
        if (!full) return '';
        const clamped = Math.min(100, Math.max(35, Number(pct) || 68));
        row.__pdfCropPct = clamped;
        const cropH = Math.round(full.height * (clamped / 100));
        const out = document.createElement('canvas');
        out.width = full.width;
        out.height = cropH;
        const ctx = out.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, out.width, out.height);
        ctx.drawImage(full, 0, 0, full.width, cropH, 0, 0, full.width, cropH);
        const dataUrl = canvasToCompactDataUrl(out);

        const hidden = row.querySelector('.day-map-data');
        const img = row.querySelector('.day-map-img');
        const wrap = row.querySelector('.day-map-wrap');
        const cropLbl = row.querySelector('.day-crop-pct');
        if (hidden) hidden.value = dataUrl;
        if (img) img.src = dataUrl;
        if (wrap) wrap.classList.remove('hidden');
        if (cropLbl) cropLbl.textContent = clamped + '%';
        return dataUrl;
    }

    async function processRowPdfFile(row, file) {
        if (!row || !file) return;
        const statusEl = row.querySelector('.day-km-hint');
        if (statusEl) statusEl.textContent = 'กำลังอ่านไฟล์ PDF...';

        try {
            const buf = await file.arrayBuffer();
            const pdfjsLib = await ensurePdfJsLoaded();
            const pdf = await pdfjsLib.getDocument({ data: buf, disableWorker: true }).promise;
            const page = await pdf.getPage(1);
            const textContent = await page.getTextContent();
            const scale = 2.0;
            const viewport = page.getViewport({ scale: scale });

            let fullText = '';
            let distLineBottomY = null;
            (textContent.items || []).forEach(function (item) {
                const str = item.str || '';
                fullText += str + ' ';
                if (/กิโลเมตร/.test(str) && item.transform) {
                    const pdfY = item.transform[5];
                    const canvasY = viewport.height - (pdfY * scale) + 28;
                    if (!distLineBottomY || canvasY > distLineBottomY) {
                        distLineBottomY = canvasY;
                    }
                }
            });

            const cleanText = fullText.replace(/\s+/g, ' ').trim();
            const distMatch = cleanText.match(/ระยะทาง\s*([\d,]+\.?\d*)\s*กิโลเมตร/);

            const fullCanvas = document.createElement('canvas');
            fullCanvas.width = viewport.width;
            fullCanvas.height = viewport.height;
            await page.render({ canvasContext: fullCanvas.getContext('2d'), viewport: viewport }).promise;

            row.__pdfFullCanvas = fullCanvas;
            let pct = 68;
            if (distLineBottomY && distLineBottomY > fullCanvas.height * 0.3 && distLineBottomY < fullCanvas.height * 0.95) {
                pct = Math.min(95, Math.max(40, Math.round((distLineBottomY / fullCanvas.height) * 100)));
            }
            cropRowPdfCanvas(row, pct);

            const cropBar = row.querySelector('.day-crop-bar');
            const cropRange = row.querySelector('.day-crop-range');
            if (cropBar) cropBar.classList.remove('hidden');
            if (cropRange) cropRange.value = String(pct);

            if (distMatch) {
                const rawDist = parseFloat(distMatch[1].replace(/,/g, '')) || 0;
                const floored = floorKm(rawDist);
                const kmEl = row.querySelector('.day-km');
                const fuelEl = row.querySelector('.day-fuel');
                if (kmEl) {
                    kmEl.value = floored > 0 ? String(floored) : '';
                }
                if (fuelEl && floored > 0 && typeof global.setFuelUserChoice === 'function') {
                    global.setFuelUserChoice(fuelEl, true);
                }
                if (statusEl) {
                    statusEl.textContent = rawDist !== floored
                        ? ('PDF ' + rawDist + ' กม. → ปัดลงเหลือ ' + floored + ' กม.')
                        : ('ระยะเต็มจาก PDF: ' + floored + ' กม.');
                    statusEl.classList.remove('hidden');
                }
                if (typeof global.showToast === 'function') {
                    global.showToast(rawDist !== floored
                        ? ('ดึงระยะทาง ' + rawDist + ' → ปัดลงเป็น ' + floored + ' กม. และครอปภาพแล้ว')
                        : ('ดึงระยะทาง ' + floored + ' กม. และครอปภาพจาก PDF แล้ว'));
                }
            } else {
                if (statusEl) statusEl.textContent = '';
                if (typeof global.showToast === 'function') {
                    global.showToast('ครอปภาพจาก PDF แล้ว กรุณากรอกระยะทาง กม.');
                }
            }

            row.dataset.dohOpened = '1';
            if (typeof global.recalcVehicleFromDays === 'function') global.recalcVehicleFromDays(true);
            if (typeof global.refreshDohProgressUI === 'function') global.refreshDohProgressUI();
            if (typeof global.updatePreview === 'function') global.updatePreview();
            if (typeof global.scheduleSave === 'function') global.scheduleSave();
        } catch (err) {
            if (statusEl) statusEl.textContent = '';
            if (typeof global.showToast === 'function') {
                global.showToast((err && err.message ? err.message : 'อ่าน PDF ไม่สำเร็จ') + ' · ใช้แคปภาพแล้วกด Ctrl+V วางได้เลย');
            }
        }
    }

    function excelColRefToIdx(ref) {
        const m = String(ref || '').match(/^([A-Z]+)/i);
        if (!m) return -1;
        let idx = 0;
        const letters = m[1].toUpperCase();
        for (let i = 0; i < letters.length; i++) {
            idx = idx * 26 + (letters.charCodeAt(i) - 64);
        }
        return idx - 1;
    }

    function excelSerialToThaiDate(val) {
        const n = Number(val);
        if (!Number.isFinite(n) || n < 35000 || n > 65000) return String(val || '').trim();
        const utcMs = Math.round((n - 25569) * 86400 * 1000);
        const dt = new Date(utcMs);
        if (isNaN(dt.getTime())) return String(val || '').trim();
        const mAbbr = ['', 'ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
        const d = dt.getUTCDate();
        const m = dt.getUTCMonth() + 1;
        const yBE = dt.getUTCFullYear() + 543;
        return d + ' ' + mAbbr[m] + ' ' + String(yBE).slice(-2);
    }

    function parseCsvTextToGrid(text) {
        const rows = [];
        let row = [], cell = '', inQ = false;
        const s = String(text || '').replace(/^\ufeff/, '');
        for (let i = 0; i < s.length; i++) {
            const ch = s[i];
            if (inQ) {
                if (ch === '"' && s[i + 1] === '"') { cell += '"'; i++; }
                else if (ch === '"') inQ = false;
                else cell += ch;
            } else {
                if (ch === '"') inQ = true;
                else if (ch === ',') { row.push(cell.trim()); cell = ''; }
                else if (ch === '\r') { /* ignore */ }
                else if (ch === '\n') { row.push(cell.trim()); rows.push(row); row = []; cell = ''; }
                else cell += ch;
            }
        }
        if (cell.length || row.length) { row.push(cell.trim()); rows.push(row); }
        return rows;
    }

    async function parseExcelPlanArrayBuffer(arrayBuffer, fileName) {
        const bytes = new Uint8Array(arrayBuffer);
        const isZip = bytes.length >= 4 && bytes[0] === 0x50 && bytes[1] === 0x4b && bytes[2] === 0x03 && bytes[3] === 0x04;
        const lowerName = String(fileName || '').toLowerCase();
        let grid = [];

        if (isZip) {
            // .xlsx (OOXML ZIP)
            const xmlFiles = await unzipXmlFiles(arrayBuffer);
            const parser = new DOMParser();
            const sharedStrings = [];
            if (xmlFiles['xl/sharedStrings.xml']) {
                const ssDoc = parser.parseFromString(xmlFiles['xl/sharedStrings.xml'], 'text/xml');
                Array.from(ssDoc.getElementsByTagName('si')).forEach(function (si) {
                    const tNodes = si.getElementsByTagName('t');
                    let s = '';
                    for (let i = 0; i < tNodes.length; i++) s += (tNodes[i].textContent || '');
                    sharedStrings.push(s.replace(/\s+/g, ' ').trim());
                });
            }
            const sheetKey = Object.keys(xmlFiles).sort().find(function (k) { return /^xl\/worksheets\/sheet\d+\.xml$/.test(k); });
            if (!sheetKey) throw new Error('ไม่พบชีตข้อมูลในไฟล์ .xlsx');
            const shDoc = parser.parseFromString(xmlFiles[sheetKey], 'text/xml');
            Array.from(shDoc.getElementsByTagName('row')).forEach(function (rowEl) {
                const rArr = [];
                Array.from(rowEl.getElementsByTagName('c')).forEach(function (cEl) {
                    const colIdx = excelColRefToIdx(cEl.getAttribute('r'));
                    const tAttr = cEl.getAttribute('t') || '';
                    let val = '';
                    if (tAttr === 's') {
                        const vEl = cEl.getElementsByTagName('v')[0];
                        const sIdx = vEl ? parseInt(vEl.textContent || '0', 10) : -1;
                        val = (sIdx >= 0 && sharedStrings[sIdx] != null) ? sharedStrings[sIdx] : '';
                    } else if (tAttr === 'inlineStr') {
                        const tNodes = cEl.getElementsByTagName('t');
                        for (let i = 0; i < tNodes.length; i++) val += (tNodes[i].textContent || '');
                    } else {
                        const vEl = cEl.getElementsByTagName('v')[0];
                        val = vEl ? (vEl.textContent || '') : '';
                    }
                    val = String(val || '').replace(/\s+/g, ' ').trim();
                    if (colIdx >= 0) rArr[colIdx] = val;
                    else rArr.push(val);
                });
                if (rArr.some(Boolean)) grid.push(rArr.map(function (x) { return x || ''; }));
            });
        } else {
            const dec = new TextDecoder('utf-8');
            const text = dec.decode(bytes);
            if (lowerName.endsWith('.csv') || (!/<table/i.test(text) && !/<Row/i.test(text))) {
                grid = parseCsvTextToGrid(text);
            } else if (/<table/i.test(text)) {
                // HTML-based .xls (เช่นไฟล์ที่ส่งออกจากระบบนี้ หรือเว็บกรมฯ)
                const doc = new DOMParser().parseFromString(text, 'text/html');
                const trs = Array.from(doc.querySelectorAll('tr'));
                trs.forEach(function (tr) {
                    const cells = Array.from(tr.children).map(function (td) {
                        return String(td.textContent || '').replace(/\s+/g, ' ').trim();
                    });
                    if (cells.some(Boolean)) grid.push(cells);
                });
            } else {
                // SpreadsheetML 2003 XML .xls
                const doc = new DOMParser().parseFromString(text, 'text/xml');
                Array.from(doc.getElementsByTagName('Row')).forEach(function (rowEl) {
                    const cells = Array.from(rowEl.getElementsByTagName('Cell')).map(function (cEl) {
                        return String(cEl.textContent || '').replace(/\s+/g, ' ').trim();
                    });
                    if (cells.some(Boolean)) grid.push(cells);
                });
            }
        }

        if (!grid.length) throw new Error('ไม่พบข้อมูลตารางในไฟล์ Excel');

        let reportTitle = '';
        let officerName = '';
        let periodText = '';
        let approverName = '';
        let approverPosition = '';
        let officerPosition = '';
        let isReport12Col = false;

        // ตรวจหัวเรื่องและคอลัมน์จากแถวส่วนหัว
        let colMap = { seq: 0, category: 1, activity: 2, detail: 3, date: 4, location: 5, target: 6, note: 7 };
        for (let r = 0; r < grid.length; r++) {
            const joined = grid[r].join(' ').replace(/\s+/g, ' ').trim();
            if (!joined) continue;
            if (joined.indexOf('แผนการปฏิบัติงาน') !== -1 || joined.indexOf('รายงานผลการปฏิบัติงาน') !== -1) reportTitle = joined;
            else if (joined.indexOf('ประจำเดือน') !== -1 && !periodText) periodText = joined;
            else if (!officerName && /^(นาย|นาง|นางสาว|ว่าที่)/.test(joined) && joined.length < 70 && joined.indexOf('ผู้บังคับบัญชา') === -1) {
                officerName = joined.replace(/\s*(?:หน่วยงาน|ตำแหน่ง|ตำบลที่รับผิดชอบ)[\s\S]*$/, '').trim();
            }
            if (joined.indexOf('ผลดำเนินงาน') !== -1 || joined.indexOf('ไม่ได้ดำเนินการ') !== -1) {
                isReport12Col = true;
            }
            if (joined.indexOf('ผู้บังคับบัญชา') !== -1) {
                const am = joined.match(/ผู้บังคับบัญชา\/ผู้รับรอง[^()]*\(\s*([^)]+)\s*\)/);
                if (am) approverName = am[1].trim();
            }
        }
        if (isReport12Col) {
            // ตารางรายงานผล 12 คอลัมน์: ลำดับ(0), ประเด็น(1), กิจกรรม(2), ดำเนินการ(3), ไม่ได้ดำเนินการ(4), ผล(5), วันที่(6), สถานที่(7), เป้าหมาย(8), ปัญหา(9)
            colMap = { seq: 0, category: 1, activity: 2, detail: 2, date: 6, location: 7, target: 8, note: 9 };
        }

        const rawRows = [];
        grid.forEach(function (cells) {
            const c0 = String(cells[colMap.seq] || '').replace(/[๐-๙]/g, function (c) { return String('๐๑๒๓๔๕๖๗๘๙'.indexOf(c)); }).trim();
            if (!/^\d+\.?$/.test(c0)) return;
            // ถ้าระบุ 12 คอลัมน์แต่แถวนี้มีแค่ 8 ช่อง ให้ปรับอัตโนมัติ
            const use12 = isReport12Col && cells.length >= 8 && !parseThaiDateCell(cells[4]).day && (parseThaiDateCell(cells[6]).day || /^\d{5}$/.test(cells[6] || ''));
            const dIdx = use12 ? 6 : 4;
            const lIdx = use12 ? 7 : 5;
            const tIdx = use12 ? 8 : 6;
            const nIdx = use12 ? 9 : 7;
            const detIdx = use12 ? 2 : 3;

            let dateRaw = String(cells[dIdx] || '').trim();
            if (/^\d{5}(\.\d+)?$/.test(dateRaw)) dateRaw = excelSerialToThaiDate(dateRaw);
            const locRaw = String(cells[lIdx] || '').trim();
            if (!dateRaw && !locRaw) return;

            rawRows.push({
                seq: c0,
                seqNum: parseInt(c0.replace(/[^\d]/g, ''), 10) || (rawRows.length + 1),
                category: String(cells[1] || '').trim(),
                activity: String(cells[2] || '').trim(),
                detail: String(cells[detIdx] || cells[2] || '').trim(),
                dateRaw: dateRaw,
                locationRaw: locRaw,
                targetCount: String(cells[tIdx] || '').trim(),
                note: String(cells[nIdx] || '').trim()
            });
        });

        if (!rawRows.length) {
            throw new Error('ไม่พบแถวรายการแผนในไฟล์ Excel (ต้องมีคอลัมน์ ลำดับ, ประเด็น, กิจกรรม, วันที่, สถานที่)');
        }

        const items = rawRows.map(function (row) {
            const dateParsed = parseThaiDateCell(row.dateRaw);
            const resolved = resolveTvLocationRaw(row.locationRaw);
            return Object.assign({}, row, {
                dateParsed: dateParsed,
                dateDisplay: dateParsed.display8708,
                dateIso: dateParsed.iso,
                isFieldTrip: resolved.isFieldTrip,
                destOrder: resolved.destOrder,
                destText: resolved.destText,
                customStops: resolved.customStops,
                stops: resolved.stops,
                routeSummary: resolved.routeSummary
            });
        });

        let hadOutOfOrderDates = false;
        for (let i = 1; i < items.length; i++) {
            if (items[i].dateIso && items[i - 1].dateIso && items[i].dateIso < items[i - 1].dateIso) {
                hadOutOfOrderDates = true;
                break;
            }
        }
        const sortedItems = items.slice().sort(function (a, b) {
            const da = a.dateIso || '9999-99-99';
            const db = b.dateIso || '9999-99-99';
            if (da !== db) return da < db ? -1 : 1;
            return (a.seqNum || 0) - (b.seqNum || 0);
        });

        return {
            fileName: fileName || 'plan.xlsx',
            reportTitle: reportTitle,
            officerName: officerName,
            officerPosition: officerPosition,
            periodText: periodText,
            approverName: approverName,
            approverPosition: approverPosition,
            hadOutOfOrderDates: hadOutOfOrderDates,
            items: sortedItems
        };
    }

    async function handleTvDocxInputChange(input) {
        const file = input && input.files && input.files[0];
        if (input) {
            try { input.value = ''; } catch (e) { /* ignore */ }
        }
        if (!file) return;
        try {
            if (typeof global.showToast === 'function') global.showToast('กำลังอ่านไฟล์แผนการเดินทาง ' + file.name + '...');
            const buf = await file.arrayBuffer();
            const isExcel = /\.(xlsx|xls|csv)$/i.test(file.name || '');
            const parsed = isExcel
                ? await parseExcelPlanArrayBuffer(buf, file.name)
                : await parseDocxPlanArrayBuffer(buf, file.name);
            _pendingPlan = parsed;
            openTvImportModal(parsed);
        } catch (err) {
            alert('อ่านไฟล์แผน (' + (file.name || '') + ') ไม่สำเร็จ: ' + (err && err.message ? err.message : err));
        }
    }

    function openTvImportModal(parsed) {
        const modal = document.getElementById('tv-import-modal');
        if (!modal || !parsed) return;

        const fieldCount = parsed.items.filter(function (x) { return x.isFieldTrip; }).length;
        const officeCount = parsed.items.length - fieldCount;

        document.getElementById('tv-meta-file').textContent = parsed.fileName;
        document.getElementById('tv-meta-officer').textContent = parsed.officerName || 'ไม่พบในไฟล์';
        document.getElementById('tv-meta-period').textContent = parsed.periodText || '-';
        document.getElementById('tv-meta-approver').textContent = parsed.approverName
            ? (parsed.approverName + (parsed.approverPosition ? ' (' + parsed.approverPosition + ')' : ''))
            : '-';
        document.getElementById('tv-meta-counts').textContent =
            'ออกพื้นที่ ' + fieldCount + ' วัน · ประชุม ณ สนง. ' + officeCount + ' วัน (รวม ' + parsed.items.length + ' แถว)';

        const warnEl = document.getElementById('tv-sort-warn');
        if (warnEl) warnEl.classList.toggle('hidden', !parsed.hadOutOfOrderDates);

        const optFieldOnly = document.getElementById('tv-mode-field');
        const optAll = document.getElementById('tv-mode-all');
        if (optFieldOnly) optFieldOnly.checked = true;
        if (optAll) optAll.checked = false;

        renderTvImportRows();
        modal.hidden = false;
        modal.removeAttribute('hidden');
    }

    function closeTvImportModal() {
        const modal = document.getElementById('tv-import-modal');
        if (modal) modal.hidden = true;
    }

    function renderTvImportRows() {
        const tbody = document.getElementById('tv-import-tbody');
        if (!tbody || !_pendingPlan) return;
        const fieldOnly = !!(document.getElementById('tv-mode-field')?.checked);

        tbody.innerHTML = _pendingPlan.items.map(function (it, idx) {
            const shouldCheck = !fieldOnly || it.isFieldTrip;
            const badgeCls = it.isFieldTrip
                ? 'bg-emerald-100 text-emerald-900 border-emerald-300'
                : 'bg-slate-100 text-slate-600 border-slate-300';
            const badgeTxt = it.isFieldTrip ? 'ออกพื้นที่ (เบิกน้ำมัน)' : 'ณ สนง. (0 กม.)';
            return `<tr class="border-b border-slate-200 hover:bg-amber-50/40 ${!shouldCheck ? 'opacity-50' : ''}">
                <td class="p-1.5 text-center"><input type="checkbox" class="tv-row-chk rounded border-emerald-500" data-tv-idx="${idx}" ${shouldCheck ? 'checked' : ''}></td>
                <td class="p-1.5 text-center text-slate-500 font-medium">#${escH(it.seqNum)}</td>
                <td class="p-1.5 whitespace-nowrap font-semibold text-slate-800">${escH(it.dateDisplay || it.dateRaw)}</td>
                <td class="p-1.5 text-xs text-slate-700">${escH(it.activity || it.detail)}</td>
                <td class="p-1.5 text-xs text-slate-800">${escH(it.routeSummary)}</td>
                <td class="p-1.5 whitespace-nowrap"><span class="text-[10px] px-1.5 py-0.5 rounded border ${badgeCls}">${badgeTxt}</span></td>
            </tr>`;
        }).join('');
    }

    function applyTvImportSelection() {
        if (!_pendingPlan) return;
        const checkedIndices = Array.from(document.querySelectorAll('#tv-import-tbody .tv-row-chk:checked'))
            .map(function (el) { return parseInt(el.getAttribute('data-tv-idx'), 10); })
            .filter(function (i) { return !isNaN(i) && _pendingPlan.items[i]; });

        if (!checkedIndices.length) {
            alert('กรุณาเลือกอย่างน้อย 1 วันก่อนนำเข้า');
            return;
        }

        const selected = checkedIndices.map(function (i) { return _pendingPlan.items[i]; });
        const fillOfficer = !!(document.getElementById('tv-opt-officer')?.checked);
        const fillApprover = !!(document.getElementById('tv-opt-approver')?.checked);
        const fillTripDates = !!(document.getElementById('tv-opt-dates')?.checked);
        const keepExistingByDate = !!(document.getElementById('tv-opt-keep-proof')?.checked);

        // เก็บกม./รูป/เวลาที่กรอกไว้แล้วในตารางเดิม (จับคู่ตามวันที่)
        const existingMap = {};
        if (keepExistingByDate) {
            document.querySelectorAll('#travel-days-list .travel-day-row').forEach(function (r) {
                const k = (r.querySelector('.day-date')?.value || '').trim();
                if (!k) return;
                existingMap[k] = {
                    km: r.querySelector('.day-km')?.value || '',
                    amount: r.querySelector('.day-amount')?.value || '',
                    mapDataUrl: r.querySelector('.day-map-data')?.value || '',
                    dohOpened: r.dataset.dohOpened === '1',
                    out: r.querySelector('.day-out')?.value || '',
                    inn: r.querySelector('.day-in')?.value || ''
                };
            });
        }

        // 1) เติมชื่อผู้เบิก & ตำแหน่ง
        if (fillOfficer && _pendingPlan.officerName) {
            const sel = document.getElementById('in-name');
            const custom = document.getElementById('in-name-custom');
            if (sel) {
                let opt = Array.from(sel.options).find(function (o) { return o.value === _pendingPlan.officerName; });
                if (!opt) {
                    opt = document.createElement('option');
                    opt.value = _pendingPlan.officerName;
                    opt.textContent = _pendingPlan.officerName;
                    sel.appendChild(opt);
                }
                sel.value = _pendingPlan.officerName;
            }
            if (custom) custom.value = '';
            if (_pendingPlan.officerPosition) {
                const posSel = document.getElementById('in-position');
                if (posSel) {
                    let pOpt = Array.from(posSel.options).find(function (o) { return o.value === _pendingPlan.officerPosition; });
                    if (!pOpt) {
                        pOpt = document.createElement('option');
                        pOpt.value = _pendingPlan.officerPosition;
                        pOpt.textContent = _pendingPlan.officerPosition;
                        posSel.appendChild(pOpt);
                    }
                    posSel.value = _pendingPlan.officerPosition;
                }
            }
            if (typeof global.onPersonChange === 'function') global.onPersonChange();
        }

        // 2) เติมผู้อนุมัติ/ผู้รับรอง (ช่องขวา)
        if (fillApprover && _pendingPlan.approverName) {
            const appN = document.getElementById('in-app-name');
            const appP = document.getElementById('in-app-pos');
            if (appN) appN.value = _pendingPlan.approverName;
            if (appP && _pendingPlan.approverPosition) appP.value = _pendingPlan.approverPosition;
        }

        // 3) เติมวันออก - วันกลับ จากรายการแรกและรายการสุดท้ายของแผนที่เลือก
        if (fillTripDates) {
            const dated = selected.filter(function (x) { return x.dateParsed && x.dateParsed.dateObj; });
            if (dated.length) {
                const first = dated[0].dateParsed;
                const last = dated[dated.length - 1].dateParsed;
                const depDayEl = document.getElementById('in-dep-day');
                const depMyEl = document.getElementById('in-dep-my');
                const retDayEl = document.getElementById('in-ret-day');
                const retMyEl = document.getElementById('in-ret-my');
                if (depDayEl) depDayEl.value = String(first.day);
                if (depMyEl) depMyEl.value = first.monthFull + ' ' + first.yearBE;
                if (retDayEl) retDayEl.value = String(last.day);
                if (retMyEl) retMyEl.value = last.monthFull + ' ' + last.yearBE;
                if (typeof global.syncBePickerLabel === 'function') {
                    global.syncBePickerLabel('dep', first.dateObj);
                    global.syncBePickerLabel('ret', last.dateObj);
                }
                if (typeof global.syncBudgetMonthFromTrip === 'function') {
                    global.syncBudgetMonthFromTrip(true);
                }
            }
        }

        // 4) สร้างแถวรายวันใน #travel-days-list
        const depTime = (document.getElementById('in-dep-time')?.value || '09.00').trim() || '09.00';
        const retTime = (document.getElementById('in-ret-time')?.value || '16.00').trim() || '16.00';
        const list = document.getElementById('travel-days-list');
        if (list && typeof global.createTravelDayRow === 'function') {
            list.innerHTML = '';
            selected.forEach(function (it, i) {
                const prev = existingMap[it.dateDisplay] || null;
                let tOut = '09.00';
                let tIn = '16.00';
                if (prev && prev.out && prev.inn) {
                    tOut = prev.out;
                    tIn = prev.inn;
                } else if (i === 0 && selected.length === 1) {
                    tOut = depTime; tIn = retTime;
                } else if (i === 0) {
                    tOut = depTime; tIn = '16.00';
                } else if (i === selected.length - 1) {
                    tOut = '09.00'; tIn = retTime;
                } else if (typeof global.randomMiddleDayTimes === 'function') {
                    const rnd = global.randomMiddleDayTimes();
                    tOut = rnd.tOut; tIn = rnd.tIn;
                }
                const sumT = typeof global.calcTimeDiff === 'function' ? global.calcTimeDiff(tOut, tIn) : '7.00';

                const kmVal = (prev && prev.km)
                    ? String(floorKm(prev.km) || '')
                    : (it.prefillKm > 0 ? String(floorKm(it.prefillKm)) : '');
                const mapVal = (prev && prev.mapDataUrl)
                    ? prev.mapDataUrl
                    : (it.prefillMapDataUrl || '');
                const row = global.createTravelDayRow({
                    date: it.dateDisplay,
                    out: tOut,
                    inn: tIn,
                    sum: sumT,
                    dest: it.destText,
                    destOrder: it.destOrder,
                    customStops: it.customStops,
                    tvMeta: {
                        seqNo: it.seqNum,
                        category: it.category,
                        activity: it.activity,
                        detail: it.detail,
                        locationRaw: it.locationRaw
                    },
                    km: kmVal,
                    amount: prev ? prev.amount : '',
                    fuel: !!it.isFieldTrip,
                    fuelUser: it.isFieldTrip ? '1' : '0',
                    dohOpened: !!(prev && prev.dohOpened),
                    mapDataUrl: mapVal
                });
                list.appendChild(row);
            });
            document.querySelectorAll('.travel-day-row').forEach(function (row, idx) {
                const num = row.querySelector('.row-num');
                if (num) num.textContent = (idx + 1) + '.';
            });
        }

        // บันทึกข้อมูลแผน T&V ครบทุกแถว (เรียงตามลำดับเดิมในแผน) สำหรับรายงานผลการปฏิบัติงาน T&V
        try {
            const rawPlanRows = (_pendingPlan.items || []).slice().sort(function (a, b) {
                return (a.seqNum || 0) - (b.seqNum || 0);
            }).map(function (it) {
                return {
                    seqNum: it.seqNum || 0,
                    category: String(it.category || '').replace(/^[\}\]\s]+/, '').trim(),
                    activity: String(it.activity || it.detail || '').trim(),
                    detail: String(it.detail || '').trim(),
                    note: String(it.note || '').trim(),
                    dateDisplay: it.dateDisplay || '',
                    dateRaw: it.dateRaw || '',
                    dateIso: it.dateIso || '',
                    dateParsed: it.dateParsed ? {
                        day: it.dateParsed.day,
                        monthAbbr: it.dateParsed.monthAbbr,
                        monthFull: it.dateParsed.monthFull,
                        yearBE: it.dateParsed.yearBE
                    } : null,
                    locationRaw: String(it.locationRaw || '').trim(),
                    targetCount: String(it.targetCount || '').trim(),
                    isFieldTrip: !!it.isFieldTrip
                };
            });
            global.__tvPlanStore = {
                fileName: _pendingPlan.fileName || '',
                officerName: _pendingPlan.officerName || '',
                officerPosition: _pendingPlan.officerPosition || '',
                approverName: _pendingPlan.approverName || '',
                approverPosition: _pendingPlan.approverPosition || '',
                monthHeader: _pendingPlan.monthHeader || '',
                items: rawPlanRows
            };
            localStorage.setItem('form8708_tv_report_plan_v1', JSON.stringify(global.__tvPlanStore));

    function isGasEnv() {

    function runGas(fnName) {
        const args = Array.prototype.slice.call(arguments, 1);
        return new Promise(function (resolve, reject) {
            if (!isGasEnv()) {
                reject(new Error('Not running inside Google Apps Script'));
                return;
            }
            const runner = global.google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(reject);
            runner[fnName].apply(runner, args);
        });
    }

                const da = a.dateIso || '9999-99-99';
                const db = b.dateIso || '9999-99-99';

                    seqNum: t.seqNo,
                    category: t.category,
                    activity: t.activity,
                    detail: t.detail,
                    dateRaw: t.dateDisplay,
                    locationRaw: t.locationRaw,
                    dateParsed: dp,
                    dateDisplay: dp.display8708 || t.dateDisplay,

                    isFieldTrip: !!t.isFieldTrip,
                    destOrder: resolved.destOrder,

                    prefillKm: floorKm(t.distanceKm),
                    prefillMapDataUrl: (t.imageFileId && imgMap && imgMap[t.imageFileId]) ? imgMap[t.imageFileId] : ''
                };

                fileName: plan.fileName || planId,
                reportTitle: plan.reportTitle || '',
                officerName: plan.officerName || '',
                officerPosition: plan.officerPosition || '',
                periodText: plan.periodText || '',

    function sendBotMessage(payload) {
        if (typeof window === 'undefined') return;
        const msg = Object.assign({ channel: BOT_TO_EXT }, payload);
        if (_botState.bridgeWin) {
            try { _botState.bridgeWin.postMessage(msg, '*'); return; } catch (e) {}
        }
        try { window.postMessage(msg, '*'); } catch (e) {}
        if (window.top && window.top !== window) {
            try { window.top.postMessage(msg, '*'); } catch (e) {}
        }
    }

    function checkExtension(userTriggered) {
        _botState.pendingNotifyOnPing = !!userTriggered;
        sendBotMessage({ type: 'PING', reqId: 'ping_' + Date.now() });
        if (_botState.pingTimer) clearTimeout(_botState.pingTimer);
        if (userTriggered) {
            _botState.pingTimer = setTimeout(function () {
                if (!_botState.connected && _botState.pendingNotifyOnPing) {
                    _botState.pendingNotifyOnPing = false;
                    if (typeof global.showToast === 'function') {
                        global.showToast('ยังไม่พบส่วนเสริม DOH Auto-Bot — ตรวจสอบว่าโหลดโฟลเดอร์และเปิด Allow access to file URLs แล้วกด F5');

        const dateText = (row.querySelector('.day-date')?.value || '').trim() || ('วันที่ #' + (idx + 1));
        return {
            rowId: rowId,
            dateText: dateText,
            stops: stops.map(function (st) {
                return {
                    id: st.id || '',
                    role: st.role || '',
                    isOffice: !!st.isOffice,
                    amphoe: st.amphoe || '',
                    province: st.province || '',
                    officeName: st.officeName || '',
                    officeTambon: st.officeTambon || '',
                    tambon: st.tambon || '',
                    moo: st.moo || '',
                    villageName: st.villageName || '',
                    label: st.label || '',
                    searchKeyword: st.searchKeyword || st.label || '',

    function tvrNormDateKey(str) {
        const s = String(str || '').replace(/[๐-๙]/g, function (c) {
            return String('๐๑๒๓๔๕๖๗๘๙'.indexOf(c));
        }).replace(/\s+/g, ' ').trim();
        const m = s.match(/(\d{1,2})\s*([ก-ฮ]+\.?)\s*(\d{2,4})/);
        if (!m) return s;
        const d = parseInt(m[1], 10);
        const mo = m[2].replace(/\.$/, '');
        const y = m[3].length === 2 ? ('25' + m[3]) : m[3];
        return d + '|' + mo + '|' + y;
    }

    function tvrFormatDateCell(dateParsed, dateDisplay, dateRaw) {
        if (dateParsed && dateParsed.day && dateParsed.monthAbbr && dateParsed.yearBE) {
            const d = String(parseInt(dateParsed.day, 10));
            const moBase = String(dateParsed.monthAbbr).replace(/\.$/, '');
            const mo = moBase.endsWith('.') ? moBase : (moBase + '.');
            const yr2 = String(dateParsed.yearBE).slice(-2);
            const str = d + ' ' + mo + ' ' + yr2;
            return '<span style="white-space:nowrap;">' + str + ' -</span><br><span style="white-space:nowrap;">' + str + '</span>';
        }
        const s = String(dateDisplay || dateRaw || '').replace(/[๐-๙]/g, function (c) {
            return String('๐๑๒๓๔๕๖๗๘๙'.indexOf(c));
        }).trim();
        const m = s.match(/(\d{1,2})\s*([ก-ฮ\.]+)\s*(\d{2,4})/);
        if (m) {
            const d = String(parseInt(m[1], 10));
            const moBase = m[2].replace(/\.$/, '');
            const mo = moBase + '.';
            const yr2 = String(m[3]).slice(-2);
            const str = d + ' ' + mo + ' ' + yr2;
            return '<span style="white-space:nowrap;">' + str + ' -</span><br><span style="white-space:nowrap;">' + str + '</span>';
        }
        return escH(s || '-');
    }

    function tvrGetDocDateIso() {
        const dRaw = (document.getElementById('in-doc-day')?.value || '').replace(/[๐-๙]/g, function (c) {
            return String('๐๑๒๓๔๕๖๗๘๙'.indexOf(c));
        }).replace(/\D+/g, '');
        const mRaw = (document.getElementById('in-doc-month')?.value || '').trim();
        const yRaw = (document.getElementById('in-doc-year')?.value || '').replace(/[๐-๙]/g, function (c) {
            return String('๐๑๒๓๔๕๖๗๘๙'.indexOf(c));
        }).replace(/\D+/g, '');
        const day = parseInt(dRaw, 10);
        const yearBE = parseInt(yRaw, 10);
        const mMap = {
            'มกราคม': 1, 'กุมภาพันธ์': 2, 'มีนาคม': 3, 'เมษายน': 4, 'พฤษภาคม': 5, 'มิถุนายน': 6,
            'กรกฎาคม': 7, 'สิงหาคม': 8, 'กันยายน': 9, 'ตุลาคม': 10, 'พฤศจิกายน': 11, 'ธันวาคม': 12
        };
        const month = mMap[mRaw] || 0;
        if (!day || !month || !yearBE) return '';
        const yCE = yearBE > 2400 ? (yearBE - 543) : yearBE;
        return String(yCE).padStart(4, '0') + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
    }

    function tvrToIso(dateIso, dateParsed, dateDisplay, dateRaw) {
        if (dateIso && /^\d{4}-\d{2}-\d{2}$/.test(dateIso)) return dateIso;
        const mAbbr = {
            'ม.ค': 1, 'ก.พ': 2, 'มี.ค': 3, 'เม.ย': 4, 'พ.ค': 5, 'มิ.ย': 6,
            'ก.ค': 7, 'ส.ค': 8, 'ก.ย': 9, 'ต.ค': 10, 'พ.ย': 11, 'ธ.ค': 12
        };
        const mFull = {
            'มกราคม': 1, 'กุมภาพันธ์': 2, 'มีนาคม': 3, 'เมษายน': 4, 'พฤษภาคม': 5, 'มิถุนายน': 6,
            'กรกฎาคม': 7, 'สิงหาคม': 8, 'กันยายน': 9, 'ตุลาคม': 10, 'พฤศจิกายน': 11, 'ธันวาคม': 12
        };
        if (dateParsed && dateParsed.day && dateParsed.yearBE) {
            const mo = mFull[dateParsed.monthFull] || mAbbr[String(dateParsed.monthAbbr || '').replace(/\.$/, '')] || 0;
            if (mo) {
                const yCE = dateParsed.yearBE > 2400 ? (dateParsed.yearBE - 543) : dateParsed.yearBE;
                return String(yCE).padStart(4, '0') + '-' + String(mo).padStart(2, '0') + '-' + String(dateParsed.day).padStart(2, '0');
            }
        }
        const s = String(dateDisplay || dateRaw || '').replace(/[๐-๙]/g, function (c) {
            return String('๐๑๒๓๔๕๖๗๘๙'.indexOf(c));
        }).trim();
        const m = s.match(/(\d{1,2})\s*([ก-ฮ]+\.?)\s*(\d{2,4})/);
        if (m) {
            const day = parseInt(m[1], 10);
            const mk = m[2].replace(/\.$/, '');
            const mo = mAbbr[mk] || mFull[mk] || 0;
            const yNum = parseInt(m[3], 10);
            const yBE = yNum < 100 ? (2500 + yNum) : yNum;
            const yCE = yBE > 2400 ? (yBE - 543) : yBE;
            if (day && mo && yCE) {
                return String(yCE).padStart(4, '0') + '-' + String(mo).padStart(2, '0') + '-' + String(day).padStart(2, '0');
            }
        }
        return '';
    }

    function tvrBuildRows(forceSyncFromClaim) {
        const edits = forceSyncFromClaim ? {} : tvrLoadEdits();
        if (forceSyncFromClaim) tvrSaveEdits({});
        const meetingDone = !!(document.getElementById('tvr-opt-meeting-done')?.checked);
        const onlyDone = !!(document.getElementById('tvr-opt-only-done')?.checked);
        const docDateIso = tvrGetDocDateIso();

        // เก็บวันที่ทั้งหมดในตารางวันเดินทางที่เบิก (แบบ 8708)
        const claimedDates = new Set();
        const claimedRowsList = [];
        document.querySelectorAll('#travel-days-list .travel-day-row').forEach(function (r, idx) {
            const dt = (r.querySelector('.day-date')?.value || '').trim();
            const dest = (r.querySelector('.day-dest')?.value || '').trim();
            if (!dt) return;
            const k = tvrNormDateKey(dt);
            claimedDates.add(k);
            claimedRowsList.push({
                seqNum: idx + 1,
                dateDisplay: dt,
                dateKey: k,
                dateIso: tvrToIso('', null, dt, dt),
                dest: dest
            });
        });

        const plan = tvrLoadPlan();
        let rows = [];

        if (plan && Array.isArray(plan.items) && plan.items.length) {
            rows = plan.items.map(function (it, idx) {
                const dKey = tvrNormDateKey(it.dateDisplay || it.dateRaw);
                const rIso = tvrToIso(it.dateIso, it.dateParsed, it.dateDisplay, it.dateRaw);
                const isAfterDocDate = !!(docDateIso && rIso && rIso > docDateIso);
                const isClaimed = claimedDates.has(dKey);
                const isMeeting = !it.isFieldTrip;
                const defaultDone = !isAfterDocDate && (isClaimed || (isMeeting && meetingDone));
                const rowKey = 'p_' + (it.seqNum || (idx + 1)) + '_' + dKey;
                const ed = edits[rowKey] || {};
                const done = (typeof ed.done === 'boolean') ? ed.done : defaultDone;
                return {
                    key: rowKey,
                    seq: it.seqNum || (idx + 1),
                    category: (ed.category != null ? ed.category : (it.category || (isMeeting ? 'การถ่ายทอดความรู้ (TRAINING)' : 'การเยี่ยมเยียน (VISITING)'))).replace(/^[\}\]\s]+/, '').trim(),
                    activity: ed.activity != null ? ed.activity : (it.activity || ''),
                    done: done,
                    result: ed.result != null ? ed.result : (done ? 'สำเร็จ' : ''),
                    dateHtml: tvrFormatDateCell(it.dateParsed, it.dateDisplay, it.dateRaw),
                    location: ed.location != null ? ed.location : (it.locationRaw || ''),
                    targetCount: ed.targetCount != null ? ed.targetCount : (it.targetCount || ''),
                    problem: ed.problem || '',
                    solution: ed.solution || '',
                    suggestion: ed.suggestion || ''
                };
            });
        } else {
            // กรณีไม่ได้นำเข้า .docx — สร้างจากวันที่เบิกในแบบ 8708 โดยตรง (ตัดยอดถึงวันที่หนังสือ)
            const cfg = getActiveOrgConfig();
            rows = claimedRowsList.map(function (cr, idx) {
                const rowKey = 'c_' + (idx + 1) + '_' + cr.dateKey;
                const ed = edits[rowKey] || {};
                const isAfterDocDate = !!(docDateIso && cr.dateIso && cr.dateIso > docDateIso);
                const done = (typeof ed.done === 'boolean') ? ed.done : !isAfterDocDate;
                const cleanLoc = cr.dest
                    .replace(new RegExp('\\s*อำเภอ' + cfg.amphoe.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*จังหวัด' + cfg.province.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*$', 'g'), '')
                    .trim() || cfg.officeName;
                return {
                    key: rowKey,
                    seq: idx + 1,
                    category: ed.category != null ? ed.category : 'การเยี่ยมเยียน (VISITING)',
                    activity: ed.activity != null ? ed.activity : 'ปฏิบัติงานส่งเสริมการเกษตรในพื้นที่',
                    done: done,
                    result: ed.result != null ? ed.result : (done ? 'สำเร็จ' : ''),
                    dateHtml: tvrFormatDateCell(null, cr.dateDisplay, cr.dateDisplay),
                    location: ed.location != null ? ed.location : cleanLoc,
                    targetCount: ed.targetCount != null ? ed.targetCount : '',
                    problem: ed.problem || '',
                    solution: ed.solution || '',
                    suggestion: ed.suggestion || ''
                };
            });
        }

        if (onlyDone) {
            rows = rows.filter(function (r) { return r.done; }).map(function (r, idx) {
                return Object.assign({}, r, { seq: idx + 1 });
            });
        }
        _tvrRowsState = rows;
        return rows;
    }

    }

            const tdDoneAttr = forExport ? ` style="${tdStyle}text-align:center;"` : clickDone;
            const tdNotAttr = forExport ? ` style="${tdStyle}text-align:center;"` : clickNotDone;
            const editAttr = function (field) {
                return forExport ? '' : (ce + ` onblur="window.__tvReport.updateField(${globalIdx}, '${field}', this.innerText)"`);

                <td style="${tdStyle}"${editAttr('suggestion')}>${escH(r.suggestion)}</td>

            return `<div class="tvr-doc" style="font-family:'TH SarabunIT๙','TH SarabunPSK','TH Sarabun New',sans-serif;color:#000;width:100%;">
                <div class="tvr-page">${header4LinesHtml}
                    <table style="width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #000;">
                        ${tableHeadHtml}
                        <tbody><tr><td colspan="12" style="${tdStyle}text-align:center;padding:16px;color:#64748b;">ยังไม่มีข้อมูลวันเดินทาง (กรุณานำเข้าแผน T&amp;V (.docx) หรือเพิ่มวันเดินทางในฟอร์มด้านซ้าย)</td></tr></tbody>
                    </table>

        const MAX_WEIGHT_PER_PAGE = 15;
        const pages = [];
        let curPage = [];
        let curWeight = 0;
        rows.forEach(function (r, idx) {
            const actLines = Math.max(1, Math.ceil(String(r.activity || '').length / 18));
            const locLines = Math.max(1, Math.ceil(String(r.location || '').length / 22));
            const w = Math.max(2, actLines, locLines);
            if (curPage.length > 0 && (curWeight + w > MAX_WEIGHT_PER_PAGE || curPage.length >= 6)) {
                pages.push(curPage);
                curPage = [];
                curWeight = 0;
            }
            curPage.push({ row: r, idx: idx, weight: w });
            curWeight += w;
        });
        if (curPage.length) pages.push(curPage);

        // ถ้าหน้าสุดท้ายมีแถวเยอะจนใส่ลายเซ็นไม่พอ ให้ขึ้นหน้าลงนามแยกพร้อมหัวรายงาน 4 บรรทัดเหมือนต้นฉบับหน้า 8
        const lastPageWeight = pages[pages.length - 1].reduce(function (acc, x) { return acc + x.weight; }, 0);
        const separateSignPage = lastPageWeight > 9;

        const pageBreakHtml = forExport === 'word'
            ? '<br clear="all" style="page-break-before:always;mso-break-type:page-break;mso-special-character:line-break" />'
            : (forExport === 'print'
