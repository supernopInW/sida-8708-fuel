            loadActiveMeta();
            bindKeyboardShortcuts();
            await refreshJobsCache();
            pushHistorySnapshot('เริ่มต้นหน้างาน');
            updateActiveJobBarUI();
        }

        return {
            init: init,
            onFormMutated: onFormMutated,
            pushHistoryNow: pushHistorySnapshot,
            undo: undo,
            redo: redo,
            saveCurrentJob: saveCurrentJob,
            openSaveAsModal: openSaveAsModal,
            closeSaveModal: closeSaveModal,
            confirmSaveModal: confirmSaveModal,
            renameActiveJob: renameActiveJob,
            openNewJobModal: openNewJobModal,
            closeNewJobModal: closeNewJobModal,
            confirmNewJob: confirmNewJob,
            openJobsModal: openJobsModal,
            closeJobsModal: closeJobsModal,
            renderJobsList: renderJobsList,
            openJob: openJob,
            duplicateJob: duplicateJob,
            renameJobById: renameJobById,
            deleteJob: deleteJob,
            exportBackupJson: exportBackupJson,
            triggerImportBackup: triggerImportBackup,
            handleImportBackupFile: handleImportBackupFile
        };
    })();

    /* =========================================================================
     * ระบบงบประมาณแยกตามโครงการ & ดักทุกสถานการณ์การเบิก (สำนักงานเกษตรอำเภอ)
     * ========================================================================= */
    window.__budgetPro = (function () {
        const CUSTOM_PROJ_KEY = 'form8708_custom_projects_v1';
        const DEFAULT_PROJECTS = [
            { id: 'tv_regular', name: 'งานประจำ / ระบบส่งเสริมการเกษตร (T&V)', text: 'ปฏิบัติงานตามระบบส่งเสริมการเกษตร (T&V) เยี่ยมเยียนเกษตรกร และติดตามสถานการณ์การผลิต' },
            { id: 'eco_agri', name: 'โครงการส่งเสริมการเกษตรที่เป็นมิตรกับสิ่งแวดล้อม', text: 'โครงการส่งเสริมการเกษตรที่เป็นมิตรกับสิ่งแวดล้อม กิจกรรมส่งเสริมการเกษตรที่เป็นมิตรกับสิ่งแวดล้อม และโครงการอื่น ๆ ตามที่ได้รับมอบหมาย' },
            { id: 'large_plot', name: 'โครงการระบบส่งเสริมเกษตรแบบแปลงใหญ่', text: 'โครงการระบบส่งเสริมเกษตรแบบแปลงใหญ่ ติดตามให้คำแนะนำและพัฒนาศักยภาพเกษตรกรแปลงใหญ่' },
            { id: 'alc_center', name: 'โครงการศูนย์เรียนรู้การเพิ่มประสิทธิภาพการผลิตสินค้าเกษตร (ศพก.)', text: 'โครงการศูนย์เรียนรู้การเพิ่มประสิทธิภาพการผลิตสินค้าเกษตร (ศพก.)' },
            { id: 'farmer_reg', name: 'โครงการขึ้นทะเบียนและปรับปรุงทะเบียนเกษตรกร', text: 'งานขึ้นทะเบียนและปรับปรุงทะเบียนเกษตรกร และตรวจสอบพื้นที่เพาะปลูก' },
            { id: 'smart_farmer', name: 'โครงการพัฒนาเกษตรกรปราดเปรื่อง (Smart Farmer / YSF)', text: 'โครงการพัฒนาเกษตรกรปราดเปรื่อง (Smart Farmer / Young Smart Farmer)' },
            { id: 'community_ent', name: 'โครงการส่งเสริมวิสาหกิจชุมชน / องค์กรเกษตรกร', text: 'โครงการส่งเสริมและพัฒนาวิสาหกิจชุมชนและองค์กรเกษตรกร' },
            { id: 'plant_protect', name: 'โครงการอารักขาพืช / จัดการศัตรูพืชและภัยพิบัติ', text: 'งานอารักขาพืช สำรวจติดตามศัตรูพืช และช่วยเหลือเกษตรกรผู้ประสบภัยพิบัติด้านการเกษตร' },
            { id: 'other_custom', name: 'โครงการอื่น / งบเฉพาะกิจ (กำหนดเอง)', text: '' }
        ];

        let _activeScenario = '';

        function loadCustomProjects() {
            try {
                const raw = __sidaLS.getItem(CUSTOM_PROJ_KEY);
                const arr = raw ? JSON.parse(raw) : [];
                return Array.isArray(arr) ? arr : [];
            } catch (e) { return []; }
        }

        function saveCustomProjects(arr) {
            try { __sidaLS.setItem(CUSTOM_PROJ_KEY, JSON.stringify(arr || [])); } catch (e) {}
        }

        function getAllProjects() {
            return DEFAULT_PROJECTS.concat(loadCustomProjects());
        }

        function getCurrentProjectObj() {
            const id = document.getElementById('in-budget-project')?.value || 'tv_regular';
            return getAllProjects().find(function (p) { return p.id === id; }) || DEFAULT_PROJECTS[0];
        }

        function computeThaiFiscalYear() {
            const now = new Date();
            const m = now.getMonth() + 1;
            return String(now.getFullYear() + 543 + (m >= 10 ? 1 : 0));
        }

        function renderProjectSelect(preserveVal) {
            const sel = document.getElementById('in-budget-project');
            if (!sel) return;
            const cur = preserveVal || sel.value || 'tv_regular';
            const all = getAllProjects();
            sel.innerHTML = all.map(function (p) {
                const tag = p.custom ? ' ★' : '';
                return '<option value="' + escAttr(p.id) + '">' + escHtml(p.name + tag) + '</option>';
            }).join('');
            if (all.some(function (p) { return p.id === cur; })) sel.value = cur;
            else sel.value = 'tv_regular';
            updateProjectBadgeUI();
        }

        function updateProjectBadgeUI() {
            const proj = getCurrentProjectObj();
            const pill = document.getElementById('budget-project-pill');
            const delBtn = document.getElementById('btn-del-custom-project');
            const fy = (document.getElementById('in-budget-fiscal-year')?.value || '').trim();
            if (pill) pill.textContent = proj.name + (fy ? ' · ปีงบ ' + fy : '');
            if (delBtn) delBtn.classList.toggle('hidden', !proj.custom);
        }

        function syncProjectTextToForm(forceToast) {
            const chk = document.getElementById('in-budget-sync-project-text');
            if (chk && !chk.checked) return;
            const proj = getCurrentProjectObj();
            const projInput = document.getElementById('in-project');
            if (projInput && proj && proj.text) {
                projInput.value = proj.text;
                if (typeof updatePreview === 'function') updatePreview();
                if (typeof scheduleSave === 'function') scheduleSave();
                if (forceToast && typeof showToast === 'function') {
                    showToast('อัปเดตชื่อโครงการลงแบบ 8708 แล้ว');
                }
            }
        }

        function onProjectChange() {
            updateProjectBadgeUI();
            const { month, yearBe } = getBudgetYearMonthFromUI();
            const person = getBudgetPersonName();
            const profile = loadBudgetProfileObject(yearBe, month, person);
            applyBudgetFieldsToUI(profile);
            syncProjectTextToForm(false);
            if (typeof applyAllowanceBudgetCap === 'function') applyAllowanceBudgetCap();
            if (typeof refreshVehicleBudgetTarget === 'function') refreshVehicleBudgetTarget();
            if (typeof recalcVehicleFromDays === 'function') recalcVehicleFromDays(false);
            if (typeof refreshBudgetStatusUI === 'function') refreshBudgetStatusUI();
            refreshProgressBarUI();
            if (typeof scheduleSave === 'function') scheduleSave();
        }

        function onFiscalYearChange() {
            updateProjectBadgeUI();
            if (typeof scheduleSave === 'function') scheduleSave();
        }

        function addCustomProject() {
            const name = window.prompt('ชื่อโครงการ / ก้อนงบประมาณใหม่ (เช่น โครงการส่งเสริมเกษตรอินทรีย์):', '');
            if (!name || !name.trim()) return;
            const cleanName = name.trim();
            const docText = window.prompt('ข้อความที่จะเติมลงช่อง「เพื่อปฏิบัติงาน」ในแบบ 8708 (เว้นว่างใช้ชื่อโครงการ):', cleanName);
            const custom = loadCustomProjects();
            const newId = 'proj_' + Date.now().toString(36);
            custom.push({
                id: newId,
                name: cleanName,
                text: (docText != null && docText.trim()) ? docText.trim() : cleanName,
                custom: true
            });
            saveCustomProjects(custom);
            renderProjectSelect(newId);
            onProjectChange();
            if (typeof showToast === 'function') showToast('➕ เพิ่มโครงการ "' + cleanName + '" แล้ว');
        }

        function deleteCustomProject() {
            const proj = getCurrentProjectObj();
            if (!proj || !proj.custom) return;
            if (!window.confirm('ต้องการลบโครงการ "' + proj.name + '" ออกจากรายการใช่หรือไม่?')) return;
            const custom = loadCustomProjects().filter(function (p) { return p.id !== proj.id; });
            saveCustomProjects(custom);
            renderProjectSelect('tv_regular');
            onProjectChange();
            if (typeof showToast === 'function') showToast('🗑️ ลบโครงการแล้ว');
        }

        function highlightScenarioBtn(scenario) {
            _activeScenario = scenario || '';
            document.querySelectorAll('.js-budget-scenario-btn').forEach(function (btn) {
                const active = btn.getAttribute('data-scenario') === _activeScenario;
                btn.classList.toggle('ring-2', active);
                btn.classList.toggle('ring-teal-600', active);
                btn.classList.toggle('bg-teal-100', active);
                btn.classList.toggle('bg-white', !active);
            });
        }

        function onCutPriorityChange() {
            const mode = document.getElementById('in-budget-cut-priority')?.value || 'vehicle-first';
            const rateClaimEl = document.getElementById('in-rate-claim');
            const vehClaimEl = document.getElementById('in-vehicle-claim');
            const syncClaimEl = document.getElementById('in-sync-claim');
            if (mode !== 'manual') {
                if (rateClaimEl) rateClaimEl.dataset.manual = '0';
                if (vehClaimEl) vehClaimEl.dataset.manual = '0';
                if (syncClaimEl) syncClaimEl.checked = true;
            }
            if (mode === 'allowance-first') {
                // คำนวณพาหนะก่อน แล้วค่อยจำกัดเบี้ยเลี้ยงตามงบที่เหลือ
                if (typeof refreshVehicleBudgetTarget === 'function') refreshVehicleBudgetTarget();
                if (typeof recalcVehicleFromDays === 'function') recalcVehicleFromDays(false);
                if (typeof applyAllowanceBudgetCap === 'function') applyAllowanceBudgetCap();
                if (typeof recalcAllExpenses === 'function') recalcAllExpenses(false);
            } else {
                if (typeof applyAllowanceBudgetCap === 'function') applyAllowanceBudgetCap();
                if (typeof refreshVehicleBudgetTarget === 'function') refreshVehicleBudgetTarget();
                if (typeof recalcVehicleFromDays === 'function') recalcVehicleFromDays(false);
            }
            refreshProgressBarUI();
            if (typeof scheduleSave === 'function') scheduleSave();
        }

        function applyScenario(kind) {
            highlightScenarioBtn(kind);
            const cutSel = document.getElementById('in-budget-cut-priority');
            const capChk = document.getElementById('in-budget-cap');
            const rateClaimEl = document.getElementById('in-rate-claim');
            const vehClaimEl = document.getElementById('in-vehicle-claim');
            const syncClaimEl = document.getElementById('in-sync-claim');

            if (kind === 'full') {
                if (cutSel) cutSel.value = 'vehicle-first';
                if (capChk) capChk.checked = false;
                if (rateClaimEl) rateClaimEl.dataset.manual = '0';
                if (vehClaimEl) vehClaimEl.dataset.manual = '0';
                if (syncClaimEl) syncClaimEl.checked = true;
                if (typeof applyAllowanceBudgetCap === 'function') applyAllowanceBudgetCap();
                if (typeof refreshVehicleBudgetTarget === 'function') refreshVehicleBudgetTarget();
                if (typeof recalcVehicleFromDays === 'function') recalcVehicleFromDays(false);
                if (typeof showToast === 'function') showToast('✅ โหมดเบิกเต็มสิทธิ (เบี้ยเลี้ยงเต็ม + ค่าน้ำมันเต็ม)');
            } else if (kind === 'allowance-only') {
                // เอาติ๊กเบิกน้ำมันออกทุกวัน เหลือเฉพาะเบี้ยเลี้ยง
                document.querySelectorAll('.travel-day-row .day-fuel').forEach(function (chk) {
                    chk.checked = false;
                    chk.dataset.fuelUser = '0';
                });
                if (cutSel) cutSel.value = 'vehicle-first';
                if (rateClaimEl) rateClaimEl.dataset.manual = '0';
                if (syncClaimEl) syncClaimEl.checked = true;
                if (typeof applyAllowanceBudgetCap === 'function') applyAllowanceBudgetCap();
                if (typeof refreshVehicleBudgetTarget === 'function') refreshVehicleBudgetTarget();
                if (typeof recalcVehicleFromDays === 'function') recalcVehicleFromDays(false);
                if (typeof showToast === 'function') showToast('🍽️ โหมดเบี้ยเลี้ยงอย่างเดียว (ปิดค่าน้ำมันทุกวันแล้ว)');
            } else if (kind === 'vehicle-only') {
                // ไม่เบิกเบี้ยเลี้ยง (ตั้งขอเบิกเบี้ยเลี้ยงเป็น 0) + เบิกเฉพาะค่าน้ำมัน
                if (cutSel) cutSel.value = 'allowance-first';
                if (syncClaimEl) syncClaimEl.checked = false;
                if (rateClaimEl) {
                    rateClaimEl.value = '0';
                    rateClaimEl.dataset.manual = '1';
                }
                const rateText = document.getElementById('in-rate-text');
                if (rateText) rateText.value = toThaiBahtText(0);
                const allowTotal = document.getElementById('in-allowance-total');
                if (allowTotal) allowTotal.value = '0';
                if (vehClaimEl) vehClaimEl.dataset.manual = '0';
                if (typeof refreshVehicleBudgetTarget === 'function') refreshVehicleBudgetTarget();
                if (typeof recalcVehicleFromDays === 'function') recalcVehicleFromDays(false);
                if (typeof showToast === 'function') showToast('⛽ โหมดค่าน้ำมันอย่างเดียว (เบี้ยเลี้ยง = 0 บาท)');
            } else if (kind === 'cut-vehicle') {
                if (cutSel) cutSel.value = 'vehicle-first';
                if (capChk) capChk.checked = true;
                onCutPriorityChange();
                if (typeof showToast === 'function') showToast('✂️ ตัดค่าน้ำมันก่อน — เบี้ยเลี้ยงเต็ม และค่าน้ำมันใส่「ขอเบิกเพียง」ตามงบเหลือ');
            } else if (kind === 'cut-allowance') {
                if (cutSel) cutSel.value = 'allowance-first';
                if (capChk) capChk.checked = true;
                onCutPriorityChange();
                if (typeof showToast === 'function') showToast('✂️ ตัดเบี้ยเลี้ยงก่อน — ค่าน้ำมันเต็ม และเบี้ยเลี้ยงใส่「ขอเบิกเพียง」ตามงบเหลือ');
            } else if (kind === 'separate') {
                if (cutSel) cutSel.value = 'separate';
                if (capChk) capChk.checked = true;
                onCutPriorityChange();
                const ca = document.getElementById('in-budget-ceil-allow');
                if (ca) ca.focus();
                if (typeof showToast === 'function') showToast('🎛️ โหมดแยกวงเงิน 2 ก้อน — กรอกเพดานเบี้ยเลี้ยงและเพดานค่าน้ำมันด้านล่างได้เลย');
            }
            refreshProgressBarUI();
        }

        function refreshProgressBarUI() {
            const barWrap = document.getElementById('budget-bar-wrap');
            const barFill = document.getElementById('budget-bar-fill');
            const barText = document.getElementById('budget-bar-text');
            const afterWrap = document.getElementById('budget-after-wrap');
            const afterLabel = document.getElementById('budget-after-label');
            const warnEl = document.getElementById('budget-warn');
            if (!barWrap || typeof getBudgetSummarySnapshot !== 'function') return;

            const snap = getBudgetSummarySnapshot();
            const curClaim = parseMoney(document.getElementById('in-grand-total')?.value);
            if (!snap.ceilingSpecified || !snap.ceiling || snap.ceiling <= 0) {
                barWrap.classList.add('hidden');
                if (afterWrap) afterWrap.classList.add('hidden');
                return;
            }
            const usedAfter = snap.totalUsed + curClaim;
            const remainAfter = snap.ceiling - usedAfter;
            const pct = Math.min(100, Math.round((usedAfter / snap.ceiling) * 100));

            barWrap.classList.remove('hidden');
            if (barFill) {
                barFill.style.width = pct + '%';
                barFill.className = 'h-full transition-all duration-200 ' +
                    (remainAfter < 0 ? 'bg-rose-600' : (pct >= 85 ? 'bg-amber-500' : 'bg-emerald-600'));
            }
            if (barText) {
                barText.textContent = 'ใช้ไปรวมฉบับนี้ ' + formatMoney(usedAfter) + ' / ' + formatMoney(snap.ceiling) + ' บาท (' + pct + '%)';
            }
            if (afterWrap && afterLabel) {
                afterWrap.classList.remove('hidden');
                afterLabel.textContent = formatMoney(Math.max(0, remainAfter)) + ' บาท';
                afterLabel.className = remainAfter < 0 ? 'text-rose-700 font-bold' : (remainAfter === 0 ? 'text-amber-800 font-bold' : 'text-emerald-800 font-bold');
            }
            if (warnEl && snap.remain <= 0) {
                warnEl.classList.remove('hidden');
                warnEl.textContent = '⚠️ งบโครงการนี้ใช้หมดแล้ว (คงเหลือ 0 บาท) — กรุณาสลับไปโครงการอื่นหรือเพิ่มวงเงินงบ';
            }
        }

        function renderAllProjectsOverview() {
            const box = document.getElementById('budget-projects-overview');
            if (!box) return;
            box.classList.toggle('hidden');
            if (box.classList.contains('hidden')) return;
            const { month, yearBe } = getBudgetYearMonthFromUI();
            const person = getBudgetPersonName();
            const all = getAllProjects();
            const rows = all.map(function (p) {
                const key = getBudgetStorageKey(yearBe, month, person, p.id);
                let prof = null;
                try {
                    const raw = __sidaLS.getItem(key);
                    if (raw) prof = JSON.parse(raw);
                } catch (e) {}
                const ceil = (prof && prof.ceilingTotal !== '' && prof.ceilingTotal != null) ? parseMoney(prof.ceilingTotal) : null;
                const used = prof ? (parseMoney(prof.prevUsed) + sumBudgetLedgerUsed(prof)) : 0;
                const rem = ceil != null ? Math.max(0, ceil - used) : null;
                const active = (document.getElementById('in-budget-project')?.value === p.id);
                return '<div class="flex flex-wrap items-center justify-between gap-2 py-1 border-b border-slate-100 last:border-0 ' + (active ? 'font-bold text-emerald-900 bg-emerald-50/70 px-1.5 rounded' : '') + '">' +
                    '<span>' + escHtml(p.name) + '</span>' +
                    '<span>งบ: ' + (ceil != null ? formatMoney(ceil) : 'ไม่จำกัด') + ' · ใช้แล้ว: ' + formatMoney(used) + ' · เหลือ: ' + (rem != null ? formatMoney(rem) : 'ไม่จำกัด') + '</span>' +
                '</div>';
            }).join('');
            box.innerHTML = '<div class="font-bold text-emerald-900 mb-1">📊 ภาพรวมงบทุกโครงการ (' + escHtml(person) + ')</div>' + rows;
        }

        function init() {
            const fyEl = document.getElementById('in-budget-fiscal-year');
            if (fyEl && !fyEl.value) fyEl.value = computeThaiFiscalYear();
            renderProjectSelect();
            refreshProgressBarUI();
            // ซิงค์แถบความคืบหน้าทุกครั้งที่ refreshBudgetStatusUI ทำงาน
            if (typeof window.refreshBudgetStatusUI === 'function' && !window.__budgetProHooked) {
                window.__budgetProHooked = true;
                const origRefresh = window.refreshBudgetStatusUI;
                window.refreshBudgetStatusUI = function () {
                    const r = origRefresh.apply(this, arguments);
                    refreshProgressBarUI();
                    return r;
                };
            }
        }

        return {
            init: init,
            addCustomProject: addCustomProject,
            deleteCustomProject: deleteCustomProject,
            onProjectChange: onProjectChange,
            onFiscalYearChange: onFiscalYearChange,
            syncProjectTextToForm: syncProjectTextToForm,
            onCutPriorityChange: onCutPriorityChange,
            applyScenario: applyScenario,
            refreshProgressBarUI: refreshProgressBarUI,
            renderAllProjectsOverview: renderAllProjectsOverview
        };
    })();

</script>
