    function hasVehicleClaim() {
        // ต้องมีวันที่ติ๊กน้ำมัน — กันยอดพาหนะค้างจากงบ/ฉบับร่างทั้งที่ไม่มีวันเบิก
        const anyFuel = Array.from(document.querySelectorAll('.travel-day-row')).some(isFuelDayRow);
        if (!anyFuel) return false;
        const calc = parseMoney(document.getElementById('in-vehicle-calc-total')?.value);
        const claim = parseMoney(document.getElementById('in-vehicle-claim')?.value);
        return claim > 0 || calc > 0 || anyFuel;
    }

    /** มีเป้าพาหนะจากงบ (รวมกรณีเป้า = 0) — แยกจาก「ยังไม่เคยจัดสรรงบ」 */
    function hasVehicleBudgetTarget(claimEl) {
        if (!claimEl) return false;
        const raw = claimEl.dataset.budgetTarget;
        return raw !== undefined && raw !== null && String(raw).trim() !== '';
    }

    /**
     * เป้าขอเบิกพาหนะจากงบคงเหลือ (หลังหักเบี้ยเลี้ยงฉบับนี้)
     * คืน null ถ้าไม่ได้คุมงบ (เช่น ช่องงบว่าง หรือปิดจำกัดยอด)
     */
    function computeVehicleBudgetSuggest() {
        if (typeof readBudgetFieldsFromUI !== 'function') return null;
        const fields = readBudgetFieldsFromUI();
        const cutMode = document.getElementById('in-budget-cut-priority')?.value || 'vehicle-first';
        if (cutMode === 'manual') return null;
        const ceilVehSet = fields.ceilingVehicle !== '' && fields.ceilingVehicle != null;
        const capActive = (typeof isBudgetCapActive === 'function') && isBudgetCapActive();
        if (!capActive && !ceilVehSet) return null;

        const snap = (typeof getBudgetSummarySnapshot === 'function') ? getBudgetSummarySnapshot() : null;
        const remainTotal = (capActive && snap && snap.ceilingSpecified) ? Math.max(0, snap.remain) : Infinity;
        let suggest;
        if (cutMode === 'allowance-first' || cutMode === 'separate') {
            suggest = remainTotal;
        } else {
            const allowanceClaim = parseMoney(document.getElementById('in-rate-claim')?.value);
            suggest = isFinite(remainTotal) ? Math.max(0, remainTotal - allowanceClaim) : Infinity;
        }
        if (ceilVehSet) suggest = Math.min(suggest, Math.max(0, parseMoney(fields.ceilingVehicle)));
        if (!isFinite(suggest)) return null;
        return Math.round(suggest);
    }

    /** รีเฟรช dataset.budgetTarget จากงบคงเหลือ (ลบออกถ้าไม่ได้คุมงบ) */
    function refreshVehicleBudgetTarget() {
        const claimEl = document.getElementById('in-vehicle-claim');
        if (!claimEl) return;
        const suggest = computeVehicleBudgetSuggest();
        if (suggest == null) {
            delete claimEl.dataset.budgetTarget;
            claimEl.dataset.budgetCapped = '0';
            return;
        }
        claimEl.dataset.budgetTarget = String(suggest);
    }

    /**
     * รวมบาทเฉพาะวันที่ติ๊กน้ำมัน → in-vehicle-calc / claim / total → ยอดรวมเอกสาร
     * keepClaim: คงยอด「ขอเบิกเพียง」ที่ผู้ใช้พิมพ์เองไว้เมื่อยังต่ำกว่าหรือเท่าคำนวณ (ไม่ล็อกกรณีระบบจำกัดงบให้)
     */
    function recalcVehicleFromDays(keepClaim) {
        if (typeof _budgetJustRecordedHold !== 'undefined') _budgetJustRecordedHold = false;
        const rateEl = document.getElementById('in-vehicle-rate');
        const calcEl = document.getElementById('in-vehicle-calc-total');
        const claimEl = document.getElementById('in-vehicle-claim');
        const claimTextEl = document.getElementById('in-vehicle-claim-text');
        const vehTotalEl = document.getElementById('in-vehicle-total');
        if (!claimEl || !calcEl) return;

        const rate = parseMoney(rateEl?.value) || 4;
        const budgetFuelEl = document.getElementById('in-budget-fuel-rate');
        if (budgetFuelEl && document.activeElement === rateEl && document.activeElement !== budgetFuelEl && rate > 0) {
            budgetFuelEl.value = formatMoney(rate);
        }

        let sum = 0;
        let anyFuel = false;
        document.querySelectorAll('.travel-day-row').forEach(row => {
            const kmEl = row.querySelector('.day-km');
            const amtEl = row.querySelector('.day-amount');
            const hintEl = row.querySelector('.day-km-hint');
            const rawKmVal = kmEl ? (kmEl.value || '').trim() : '';
            const rawKmNum = kmEl ? parseMoney(rawKmVal) : 0;
            const kmFloored = (typeof floorKm === 'function')
                ? floorKm(rawKmVal)
                : Math.floor(Math.max(0, isFinite(rawKmNum) ? rawKmNum : 0));
            if (hintEl && !/^กำลังอ่าน/.test(hintEl.textContent || '')) {
                if (rawKmVal !== '' && isFinite(rawKmNum) && rawKmNum >= 0 && rawKmNum !== kmFloored) {
                    hintEl.textContent = 'ปัดลงเป็น ' + kmFloored + ' กม.';
                    hintEl.classList.remove('hidden');
                } else if (!/^(PDF |ระยะเต็ม|🤖 DOH|⚠️ )/.test(hintEl.textContent || '')) {
                    hintEl.textContent = '';
                    hintEl.classList.add('hidden');
                }
            }
            if (!isFuelDayRow(row)) return; // วันไม่ติ๊กน้ำมัน: ไม่นับยอด (แม้ช่องบาทยังมีเลข)
            anyFuel = true;
            if (!kmEl || !amtEl) return;
            if (document.activeElement !== amtEl) {
                const autoAmt = Math.round(kmFloored * rate);
                if (rawKmVal !== '' && !isNaN(rawKmNum)) amtEl.value = formatMoney(autoAmt);
            }
            sum += parseMoney(amtEl.value);
        });
        calcEl.value = formatMoney(sum);
        const prevClaim = parseMoney(claimEl.value);

        // ไม่มีวันเบิกน้ำมัน / ยอด 0 → ศูนย์ทั้งชุด
        if (!anyFuel || sum <= 0) {
            claimEl.value = formatMoney(0);
            claimEl.dataset.manual = '0';
            claimEl.dataset.budgetCapped = '0';
            claimEl.dataset.tied = '1';
        } else {
            refreshVehicleBudgetTarget();
            const hasTarget = hasVehicleBudgetTarget(claimEl);
            const budgetTarget = hasTarget ? Math.max(0, parseMoney(claimEl.dataset.budgetTarget)) : null;
            let next = sum;
            if (budgetTarget != null) next = Math.min(sum, budgetTarget);

            if (!keepClaim || claimEl.value === '' || claimEl.dataset.manual !== '1') {
                claimEl.value = formatMoney(Math.max(0, next));
                claimEl.dataset.manual = '0';
                claimEl.dataset.tied = (next === sum) ? '1' : '0';
                claimEl.dataset.budgetCapped = (budgetTarget != null && next < sum) ? '1' : '0';
            } else {
                let kept = Math.min(prevClaim, sum);
                if (budgetTarget != null) kept = Math.min(kept, budgetTarget);
                kept = Math.max(0, kept);
                claimEl.value = formatMoney(kept);
                claimEl.dataset.tied = (kept === sum) ? '1' : '0';
                if (prevClaim > sum && kept === sum) claimEl.dataset.manual = '0';
                claimEl.dataset.budgetCapped = (budgetTarget != null && kept < sum && kept >= budgetTarget) ? '1' : '0';
            }
        }
        const claim = parseMoney(claimEl.value);
        if (claimTextEl) claimTextEl.value = toThaiBahtText(claim);
        if (vehTotalEl && document.activeElement !== vehTotalEl) vehTotalEl.value = formatMoney(claim);
        if (typeof refreshDohProgressUI === 'function') refreshDohProgressUI();
        recalcAllExpenses(true);
    }

    function onVehicleClaimInput() {
        if (typeof _budgetJustRecordedHold !== 'undefined') _budgetJustRecordedHold = false;
        const claimEl = document.getElementById('in-vehicle-claim');
        if (!claimEl) return;
        const raw = (claimEl.value || '').trim();
        let claim = parseMoney(raw);
        const calc = parseMoney(document.getElementById('in-vehicle-calc-total')?.value);
        if (raw !== '' && raw !== '-' && claim > calc) {
            claim = Math.max(0, calc);
            claimEl.value = formatMoney(claim);
        }
        const budgetTarget = computeVehicleBudgetSuggest();
        if (budgetTarget != null && raw !== '' && raw !== '-' && claim > budgetTarget) {
            claim = budgetTarget;
            claimEl.value = formatMoney(claim);
        }
        claimEl.dataset.manual = '1';
        claimEl.dataset.tied = (claim === calc) ? '1' : '0';
        claimEl.dataset.budgetCapped = (budgetTarget != null && claim < calc) ? '1' : '0';
        const claimTextEl = document.getElementById('in-vehicle-claim-text');
        const vehTotalEl = document.getElementById('in-vehicle-total');
        if (claimTextEl) claimTextEl.value = toThaiBahtText(claim);
        if (vehTotalEl) vehTotalEl.value = formatMoney(claim);
        recalcAllExpenses(false);
    }

    /** แก้จำนวนวันในแผงค่าใช้จ่าย → อัตรา × วัน (เคารพเพดานงบคงเหลืออัตโนมัติ) */
    function onAllowanceDaysInput() {
        if (typeof _budgetJustRecordedHold !== 'undefined') _budgetJustRecordedHold = false;
        const days = parseMoney(document.getElementById('in-allowance-days')?.value);
        const rate = parseMoney(document.getElementById('in-rate')?.value) || 120;
        const total = Math.round(days * rate);
        const setVal = (id, v) => {
            const el = document.getElementById(id);
            if (el) el.value = v;
        };
        setVal('in-rate-days', String(days || ''));
        setVal('in-total-days', String(days || ''));
        setVal('in-rate-total', formatMoney(total));
        setVal('in-rate-total-text', toThaiBahtText(total));
        if (typeof applyAllowanceBudgetCap === 'function') applyAllowanceBudgetCap();
        // งบคงเหลือเปลี่ยนเมื่อเบี้ยเปลี่ยน → รีคำนวณพาหนะตามเป้า
        refreshVehicleBudgetTarget();
        recalcVehicleFromDays(true);
    }

    /** แก้ยอดเบี้ยในแผงค่าใช้จ่าย → ซิงค์ขอเบิกเบี้ย + รวมทั้งสิ้น (ถือว่าเป็น override แต่ไม่เกินคำนวณ/งบ) */
    function onAllowanceTotalInput() {
        if (typeof _budgetJustRecordedHold !== 'undefined') _budgetJustRecordedHold = false;
        const allowEl = document.getElementById('in-allowance-total');
        const raw = (allowEl?.value || '').trim();
        const claim = parseMoney(raw);
        const calc = parseMoney(document.getElementById('in-rate-total')?.value);
        const cap = (typeof getAllowanceBudgetCap === 'function') ? getAllowanceBudgetCap() : null;
        let next = claim;
        let clamped = false;
        if (raw !== '' && raw !== '-' && calc > 0 && next > calc) {
            next = calc;
            clamped = true;
        }
        if (raw !== '' && raw !== '-' && cap != null && next > cap) {
            next = cap;
            clamped = true;
        }
        if (clamped && allowEl) allowEl.value = formatMoney(next);
        const rateClaim = document.getElementById('in-rate-claim');
        const rateText = document.getElementById('in-rate-text');
        if (rateClaim) {
            rateClaim.value = formatMoney(next);
            rateClaim.dataset.manual = '1';
            rateClaim.dataset.budgetCapped = (cap != null && next < calc) ? '1' : '0';
        }
        if (rateText) rateText.value = toThaiBahtText(next);
        const syncClaim = document.getElementById('in-sync-claim');
        if (syncClaim) syncClaim.checked = false;
        refreshVehicleBudgetTarget();
        recalcVehicleFromDays(true);
    }

    function expandDayDateFull(dateStr) {
        // "1 ก.ค. 69" / "๑ ก.ค. ๖๙" -> "1 กรกฎาคม 2569"
        const parts = toArabicDigits(dateStr || '').trim().split(/\s+/);
        if (parts.length < 3) return (dateStr || '').trim();
        let d = parts[0], m = parts[1], y = parts[2];
        const miFull = thaiMonthsFull.indexOf(m);
        const mi = miFull !== -1 ? miFull : thaiMonthsAbbr.indexOf(m);
        if (mi !== -1) m = thaiMonthsFull[mi];
        y = y.replace(/[^\d]/g, '');
        if (y.length === 2) y = '25' + y;
        return `${d} ${m} ${y}`;
    }

    function parseFullThaiDateParts(fullDate) {
        // "1 กรกฎาคม 2569" -> {day, month, year}
        const parts = toArabicDigits(fullDate || '').trim().split(/\s+/);
        if (parts.length >= 3) {
            return { day: parts[0], month: parts[1], year: parts[2] };
        }
        return { day: '..', month: '........', year: '....' };
    }

    function getVehicleSignDate() {
        const day = document.getElementById('in-doc-day')?.value;
        const month = document.getElementById('in-doc-month')?.value;
        const year = document.getElementById('in-doc-year')?.value;
        if (day && month && year) return `${day} ${month} ${year}`;
        return document.getElementById('in-boss-date')?.value || document.getElementById('in-chk-date')?.value || '';
    }

    function expandDayDateFullThai(dateStr) {
        // "1 ก.ค. 69" -> "๑ กรกฎาคม ๒๕๖๙"
        const full = expandDayDateFull(dateStr);
        const p = parseFullThaiDateParts(full);
        if (!p.day || p.day === '..') return full;
        return `${toThaiNum(p.day)} ${p.month} ${toThaiNum(p.year)}`;
    }

    /** วัดความกว้างด้วย DOM + ฟอนต์จริงบนจอ (canvas มัก fallback ฟอนต์กว้างกว่า → ตัดบรรทัดก่อนสุดบรรทัด) */
    function measureNoteFooterWidth(el) {
        if (!el) return 0;
        const probe = document.createElement('div');
        probe.setAttribute('aria-hidden', 'true');
        probe.style.cssText = 'display:block;width:100%;height:0;margin:0;padding:0;border:0;overflow:hidden;';
        el.appendChild(probe);
        const w = probe.getBoundingClientRect().width;
        el.removeChild(probe);
        if (w >= 40) return w;
        const page = el.closest('.page-box');
        if (page) {
            const cs = getComputedStyle(page);
            const padL = parseFloat(cs.paddingLeft) || 0;
            const padR = parseFloat(cs.paddingRight) || 0;
            const pw = page.getBoundingClientRect().width - padL - padR;
            if (pw >= 40) return pw;
        }
        return 620;
    }

    /** ขีดจำกัดบีบ/ขยายบรรทัด 8708 (em / scaleX) — ไม่ให้ดูบี้หรือยืดเกิน */
    const F8708_WRAP_FIT = {
        maxLetterSpacingEm: 0.035,
        minLetterSpacingEm: -0.025,
        minScaleX: 0.97
    };
    /**
     * หมายเหตุเส้นจุด:
     * — ตัดบรรทัด: ไม่บีบ scale/letter-spacing เพื่อยัดคำขึ้นบรรทัดก่อน (กัน snap กลับหลัง blur)
     * — ยืดบรรทัดบนหลัง hard Enter ได้มากขึ้นให้เต็มเส้นจุด
     */
    const F8708_NOTE_WRAP_FIT = {
        expandLastLine: false,
        maxLetterSpacingEm: 0.14,
        minLetterSpacingEm: 0,
        minScaleX: 1
    };
    /** ช่วง hard ที่ไม่ใช่ท้ายก้อน — บังคับยืดเข้าใกล้ความกว้างเต็ม */
    const F8708_NOTE_HARD_UPPER_FIT = {
        maxLetterSpacingEm: 0.18,
        minLetterSpacingEm: -0.015,
        minScaleX: 0.99
    };
    /** ฟอนต์เนื้อหา 8708 — ต้องตรงพรีวิว/พิมพ์/วัดตัดบรรทัด (16pt) */
    const F8708_BODY_FONT_SPEC = '16pt "TH SarabunIT๙", "TH SarabunPSK", "TH Sarabun New", Sarabun, sans-serif';
    /** เยื้องบรรทัดแรกของบรรยาย — ให้「ตาม」ตรง「ผู้」หลังป้ายเรียน (= ความกว้างป้ายเรียน+ช่องว่าง) */
    const F8708_TO_PREFIX_FALLBACK = 'เรียน\u00a0\u00a0\u00a0';
    /** ≈ advance width ของ「เรียน」+ 3nbsp ที่ 16pt TH SarabunIT๙ (96dpi) */
    const F8708_TO_PREFIX_FALLBACK_PX = 41.98;

    function measureF8708ToPrefixWidthPx() {
        const line = document.querySelector('.doc-section-8708 .f8708-to-line');
        const dyn = line ? line.querySelector('.dyn-to') : null;
        const prefix = line
            ? line.querySelector('.f8708-to-prefix')
            : document.querySelector('.doc-section-8708 .f8708-to-prefix');

        /* 1) ตำแหน่งจริงของ「ผู้」เทียบต้นบรรทัดเรียน — แม่นสุด */
        if (line && dyn) {
            const lr = line.getBoundingClientRect();
            const dr = dyn.getBoundingClientRect();
            const w = dr.left - lr.left;
            if (w > 1 && Number.isFinite(w)) return w;
        }

        /* 2) ความกว้าง span ป้ายเรียน ที่เรนเดอร์แล้ว */
        if (prefix) {
            const w = prefix.getBoundingClientRect().width;
            if (w > 1) return w;
        }

        /* 3) โพรบ DOM ด้วยฟอนต์เดียวกับเอกสาร (กัน canvas วัดเพี้ยน) */
        try {
            const probe = document.createElement('span');
            probe.textContent = (prefix && prefix.textContent) ? prefix.textContent : F8708_TO_PREFIX_FALLBACK;
            probe.style.cssText = [
                'position:absolute', 'visibility:hidden', 'white-space:pre',
                'left:-99999px', 'top:0', 'pointer-events:none',
                'display:inline-block', 'margin:0', 'padding:0', 'border:0',
                'font:' + F8708_BODY_FONT_SPEC, 'letter-spacing:normal', 'word-spacing:normal'
            ].join(';');
            document.body.appendChild(probe);
            const w = probe.getBoundingClientRect().width;
            document.body.removeChild(probe);
            if (w > 1) return w;
        } catch (e) { /* ignore */ }

        try {
            const c = document.createElement('canvas');
            const ctx = c.getContext('2d');
            if (ctx) {
                ctx.font = F8708_BODY_FONT_SPEC;
                const m = ctx.measureText(F8708_TO_PREFIX_FALLBACK);
                if (m && m.width > 1) return m.width;
            }
        } catch (e) { /* ignore */ }
        return F8708_TO_PREFIX_FALLBACK_PX;
    }

    function syncF8708BodyIndent() {
        const px = Math.round(measureF8708ToPrefixWidthPx() * 100) / 100;
        const val = px + 'px';
        document.querySelectorAll('.doc-section-8708').forEach((el) => {
            el.style.setProperty('--f8708-body-indent', val);
        });
        const stage = document.getElementById('pdf-export-stage');
        if (stage) stage.style.setProperty('--f8708-body-indent', val);
        /* Word/PDF: text-indent เป็นตัวจัดแนว (ไม่มี ::before ในสไตล์ export) */
        document.querySelectorAll('.doc-section-8708 .f8708-narrative').forEach((el) => {
            el.style.setProperty('--f8708-body-indent', val);
            /* สำรองเมื่อไม่มีคลาส spacer / หรือ export ถอด ::before */
            if (!el.classList.contains('f8708-narrative-align-spacer')) {
                el.style.setProperty('text-indent', val);
            } else {
                el.style.removeProperty('text-indent');
            }
        });
        return val;
    }

    /** วลีที่ต้องไม่ผ่ากลาง — จากฟอร์ม + ค่าคงที่ (ยาวก่อนสั้น) */
    function collectProtectedWrapPhrases() {
        const val = (id) => (document.getElementById(id)?.value || '').trim();
        const set = new Set();
        const add = (s) => {
            const t = String(s || '').trim();
            if (!t || t.length < 2) return;
            if (/^[.\u2026…\s]+$/.test(t)) return;
            set.add(t);
        };

        [
            'โครงการส่งเสริมการเกษตรที่เป็นมิตรกับสิ่งแวดล้อม',
            'กิจกรรมส่งเสริมการเกษตรเป็นมิตรกับสิ่งแวดล้อม',
            'นักวิชาการส่งเสริมการเกษตรปฏิบัติการ',
            'นักวิชาการส่งเสริมการเกษตรชำนาญการ',
            'ส่งเสริมการเกษตรปฏิบัติการ',
            'นักวิชาการส่งเสริมการเกษตร',
            DEFAULT_OFFICE,
            'จังหวัด' + (ORG.province || ''),
            'อำเภอ' + (ORG.amphoe || ''),
            /* กัน Segmenter ผ่า ปฏิบัติ|งาน / ปฏิบัติ|การ */
            'เพื่อปฏิบัติงาน', 'ปฏิบัติงาน',
            'ปฏิบัติราชการ', 'ปฏิบัติการ', 'ท้องที่', 'หมายเหตุ', 'ตำแหน่ง', 'ระหว่างวันที่',
            'ในระหว่างวันที่',
            ORG.toTitle || '',
            'ธันวาคม', 'พฤศจิกายน', 'กันยายน', 'กุมภาพันธ์', 'มกราคม', 'มีนาคม', 'เมษายน',
            'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'ตุลาคม'
        ].forEach(add);

        if (typeof DEST_TAMBONS !== 'undefined') {
            DEST_TAMBONS.forEach((t) => add('ตำบล' + t.name));
        }
        if (typeof personPositions === 'object' && personPositions) {
            Object.keys(personPositions).forEach((full) => {
                add(full);
                /* กันผ่าชื่อ/นามสกุลจากรายชื่อในฟอร์ม (เช่น น้อยเล็น) */
                const bare = String(full || '').replace(/^(นางสาว|นาย|นาง)\s*/, '').trim();
                bare.split(/\s+/).filter(Boolean).forEach(add);
            });
        }


        const name = personNameFromForm();
        add(name);
        if (name) {
            const tm = name.match(/^(นางสาว|นาย|นาง)([\s\S]*)$/);
            if (tm) {
                const title = tm[1];
                const rest = String(tm[2] || '').trim();
                const bits = rest.split(/\s+/).filter(Boolean);
                if (bits[0]) {
                    add(bits[0]);
                    add(title + bits[0]);
                    add(title + ' ' + bits[0]);
                }
                bits.forEach(add);
                if (bits.length >= 2) {
                    add(bits[bits.length - 1]); /* นามสกุล */
                    add(title + ' ' + rest);
                    add(title + rest);
                    add(bits.join(' '));
                } else if (rest) {
                    add(title + rest);
                }
            } else {
                name.split(/\s+/).filter(Boolean).forEach(add);
            }
        }

        add(val('in-position'));
        add(val('in-dept'));
        add(val('in-office'));
        const amphoe = val('in-amphoe');
        const province = val('in-province');
        add(amphoe);
        add(province);
        if (amphoe) add('อำเภอ' + amphoe);
        if (province) add('จังหวัด' + province);

        const project = val('in-project');
        if (project) {
            add(project);
            const knownProj = [
                'โครงการส่งเสริมการเกษตรที่เป็นมิตรกับสิ่งแวดล้อม',
                'กิจกรรมส่งเสริมการเกษตรเป็นมิตรกับสิ่งแวดล้อม'
            ];
            knownProj.forEach((p) => { if (project.indexOf(p) !== -1) add(p); });
        }

        const dest = val('in-destination');
        if (dest) {
            dest.split(/\s+/).forEach((w) => {
                if (/^(ตำบล|อำเภอ|จังหวัด)/.test(w) && w.length >= 4) add(w);
            });
        }

        return Array.from(set).sort((a, b) => b.length - a.length);
    }

    function glueProtectedTokenParts(parts, phrases) {
        if (!parts.length) return parts;
        const out = [];
        let i = 0;
        while (i < parts.length) {
            let best = '';
            let bestEnd = i;
            let acc = '';
            for (let j = i; j < parts.length; j++) {
                acc += parts[j];
                if (phrases.indexOf(acc) !== -1 && acc.length > best.length) {
                    best = acc;
                    bestEnd = j + 1;
                }
                const couldGrow = phrases.some((ph) => ph.length > acc.length && ph.startsWith(acc));
                if (!couldGrow) break;
                if (acc.length > 240) break;
            }
            if (best) {
                out.push(best);
                i = bestEnd;
            } else {
                out.push(parts[i]);
                i++;
            }
        }
        return out;
    }

    /**
     * จุดตัดบรรทัดตามความหมาย (ไทยไม่มีช่องว่าง):
     * 1) Intl.Segmenter('th', {granularity:'word'}) เมื่อมี แล้วรวมวลีที่ต้องไม่ผ่า
     * 2) fallback — คำที่รู้จัก / ช่องว่าง / จุลภาค / ๆ / และ
     * ไม่ผ่ากลางคำ เช่น น้อย|เล็น, จังหวัด|นครราชสีมา
     */
    function tokenizeForLineWrap(text) {
        const s = String(text || '');
        if (!s) return [];
        const phrases = collectProtectedWrapPhrases();

        if (typeof Intl !== 'undefined' && typeof Intl.Segmenter === 'function') {
            try {
                const seg = new Intl.Segmenter('th', { granularity: 'word' });
                const parts = Array.from(seg.segment(s), (x) => x.segment);
                if (parts.length) return glueProtectedTokenParts(parts, phrases);
            } catch (e) { /* fall through */ }
        }

        const keep = phrases.slice();
        const out = [];
        let i = 0;
        const isSpace = (ch) => ch === ' ' || ch === '\u00a0' || ch === '\t';
        while (i < s.length) {
            if (isSpace(s[i]) || s[i] === ',' || s[i] === '\u0E46') {
                out.push(s[i]);
                i++;
                continue;
            }
            if (s.slice(i, i + 3) === 'และ') {
                out.push('และ');
                i += 3;
                continue;
            }
            let matched = '';
            for (let k = 0; k < keep.length; k++) {
                const w = keep[k];
                if (s.startsWith(w, i)) { matched = w; break; }
            }
            if (matched) {
                out.push(matched);
                i += matched.length;
                continue;
            }
            let j = i + 1;
            while (j < s.length && !isSpace(s[j]) && s[j] !== ',' && s[j] !== '\u0E46'
                && s.slice(j, j + 3) !== 'และ') {
                let hitKeep = false;
                for (let k = 0; k < keep.length; k++) {
                    if (s.startsWith(keep[k], j)) { hitKeep = true; break; }
                }
                if (hitKeep) break;
                j++;
            }
            out.push(s.slice(i, j));
            i = j;
        }
        return out;
    }

    function createWrapMeasureEl(fontSpec, sampleEl) {
        const measureEl = document.createElement('span');
        measureEl.setAttribute('aria-hidden', 'true');
        measureEl.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;left:-99999px;top:0;pointer-events:none;display:inline-block;transform-origin:left center;';
        const defaultSpec = F8708_BODY_FONT_SPEC;
        const sizeFromSpec = (spec) => {
            const m = String(spec || '').match(/^(\d+(?:\.\d+)?(?:pt|px|em|rem))\b/i);
            return m ? m[1] : null;
        };
        if (sampleEl) {
            const cs = getComputedStyle(sampleEl);
            measureEl.style.fontFamily = cs.fontFamily;
            measureEl.style.fontWeight = cs.fontWeight;
            measureEl.style.fontStyle = cs.fontStyle;
            /* ถ้ามี fontSpec ให้ใช้ขนาดจาก spec (เช่น 16pt) — ให้ตัดบรรทัดตรงกับเรนเดอร์ */
            measureEl.style.fontSize = sizeFromSpec(fontSpec) || cs.fontSize || '16pt';
            measureEl.style.letterSpacing = '0';
            measureEl.style.wordSpacing = cs.wordSpacing;
        } else {
            measureEl.style.font = fontSpec || defaultSpec;
            measureEl.style.letterSpacing = '0';
        }
        document.body.appendChild(measureEl);
        return measureEl;
    }

    function measureWrapWidth(measureEl, s, letterSpacingEm, scaleX) {
        measureEl.style.letterSpacing = (letterSpacingEm || 0) + 'em';
        measureEl.style.transform = (scaleX && scaleX !== 1) ? ('scaleX(' + scaleX + ')') : 'none';
        measureEl.textContent = s || '';
        return measureEl.getBoundingClientRect().width;
    }

    /** คำนวณบีบ/ขยายให้ความกว้างเข้าใกล้ target (ไม่เกินขีดจำกัด) */
    function fitWrapLineStyle(measureEl, lineText, limit, opts) {
        const maxLs = (opts && opts.maxLetterSpacingEm != null) ? opts.maxLetterSpacingEm : F8708_WRAP_FIT.maxLetterSpacingEm;
        const minLs = (opts && opts.minLetterSpacingEm != null) ? opts.minLetterSpacingEm : F8708_WRAP_FIT.minLetterSpacingEm;
        const minScale = (opts && opts.minScaleX != null) ? opts.minScaleX : F8708_WRAP_FIT.minScaleX;
        const allowExpand = !opts || opts.allowExpand !== false;
        const forceExpand = !!(opts && opts.forceExpand);
        const text = String(lineText || '');
        const natural = measureWrapWidth(measureEl, text, 0, 1);
        if (!text || natural <= 0 || limit <= 0) {
            return { text: text, letterSpacingEm: 0, scaleX: 1 };
        }
        if (natural > limit) {
            let lo = minLs, hi = 0, bestLs = minLs;
            for (let n = 0; n < 10; n++) {
                const mid = (lo + hi) / 2;
                if (measureWrapWidth(measureEl, text, mid, 1) <= limit) { bestLs = mid; lo = mid; }
                else hi = mid;
            }
            if (measureWrapWidth(measureEl, text, bestLs, 1) <= limit) {
                return { text: text, letterSpacingEm: Math.round(bestLs * 1000) / 1000, scaleX: 1 };
            }
            let scale = limit / measureWrapWidth(measureEl, text, minLs, 1);
            if (scale < minScale) scale = minScale;
            if (scale > 1) scale = 1;
            return { text: text, letterSpacingEm: minLs, scaleX: Math.round(scale * 1000) / 1000 };
        }
        /* forceExpand = บรรทัดบนหลัง hard Enter — ยืดแม้เหลือช่องว่างน้อย */
        if (!allowExpand || (!forceExpand && natural >= limit * 0.985)) {
            return { text: text, letterSpacingEm: 0, scaleX: 1 };
        }
        if (forceExpand && natural >= limit * 0.998) {
            return { text: text, letterSpacingEm: 0, scaleX: 1 };
        }
        let lo = 0, hi = maxLs, bestLs = 0;
        for (let n = 0; n < 12; n++) {
            const mid = (lo + hi) / 2;
            const w = measureWrapWidth(measureEl, text, mid, 1);
            if (w <= limit) { bestLs = mid; lo = mid; }
            else hi = mid;
        }
        return { text: text, letterSpacingEm: Math.round(bestLs * 1000) / 1000, scaleX: 1 };
    }

    function f8708FitInlineStyle(fit, extra) {
        const parts = [];
        if (extra) parts.push(extra);
        if (fit && fit.letterSpacingEm) parts.push('letter-spacing:' + fit.letterSpacingEm + 'em');
        if (fit && fit.scaleX && fit.scaleX !== 1) {
            parts.push('transform:scaleX(' + fit.scaleX + ')');
            parts.push('transform-origin:left center');
        }
        return parts.join(';');
    }

    /**
     * ตัดบรรทัดทั้งโทเคน (วลีที่ป้องกันไม่ผ่า) แล้วบีบ/ขยายเล็กน้อยให้เต็มความกว้าง
     * คืน [{ text, letterSpacingEm, scaleX }, ...]
     */
    function wrapTextToWidthFitted(text, maxWidthPx, fontSpec, sampleEl, opts) {
        const limit = Math.max(40, Number(maxWidthPx) || 0);
        const minLs = (opts && opts.minLetterSpacingEm != null) ? opts.minLetterSpacingEm : F8708_WRAP_FIT.minLetterSpacingEm;
        const minScale = (opts && opts.minScaleX != null) ? opts.minScaleX : F8708_WRAP_FIT.minScaleX;
        const expandLast = !!(opts && opts.expandLastLine);
        const firstIndentPx = Math.max(0, Number(opts && opts.firstIndentPx) || 0);
        const measureEl = createWrapMeasureEl(fontSpec, sampleEl);
        const widthOf = (s, ls, sc) => measureWrapWidth(measureEl, s, ls || 0, sc == null ? 1 : sc);

        const canFitWidth = (s, lineLimit) => {
            if (widthOf(s) <= lineLimit) return true;
            if (widthOf(s, minLs, 1) <= lineLimit) return true;
            if (widthOf(s, minLs, minScale) <= lineLimit) return true;
            return false;
        };

        const hardSplitToken = (tok, lineLimit) => {
            const chars = Array.from(tok);
            const pieces = [];
            let piece = '';
            for (let c = 0; c < chars.length; c++) {
                const ch = chars[c];
                if (piece && !canFitWidth(piece + ch, lineLimit)) {
                    pieces.push(piece);
                    piece = ch;
                } else {
                    piece += ch;
                }
            }
            if (piece) pieces.push(piece);
            return pieces.length ? pieces : [tok];
        };

        /** โทเคนยาวเกินบรรทัด: ผ่าที่ช่องว่างเท่านั้น — ไม่ผ่าคำไทยติดกัน (เช่น น้อยเล็น) */
        const expandToken = (tok, lineLimit) => {
            if (canFitWidth(tok, lineLimit)) return [tok];
            if (!/\s/.test(tok)) {
                /* คำติดกันทั้งก้อน — บีบสูงสุดแล้วคงทั้งโทเคน (ไม่ hard-split กลางคำ) */
                return [tok];
            }
            const bits = tok.split(/(\s+)/).filter((x) => x !== '');
            const out = [];
            let cur = '';
            for (let b = 0; b < bits.length; b++) {
                const bit = bits[b];
                const test = cur + bit;
                if (!cur) {
                    if (canFitWidth(bit, lineLimit) || /^\s+$/.test(bit)) cur = bit;
                    else {
                        hardSplitToken(bit, lineLimit).forEach((p) => out.push(p));
                        cur = '';
                    }
                    continue;
                }
                if (canFitWidth(test, lineLimit)) cur = test;
                else {
                    out.push(cur.replace(/[ \u00a0]+$/, ''));
                    cur = /^\s+$/.test(bit) ? '' : bit.replace(/^[ \u00a0]+/, '');
                    if (cur && !canFitWidth(cur, lineLimit) && !/\s/.test(cur)) {
                        const parts = hardSplitToken(cur, lineLimit);
                        for (let p = 0; p < parts.length - 1; p++) out.push(parts[p]);
                        cur = parts[parts.length - 1] || '';
                    }
                }
            }
            if (cur) out.push(cur.replace(/[ \u00a0]+$/, ''));
            return out.length ? out : [tok];
        };

        const rawTokens = tokenizeForLineWrap(text);
        const tokens = [];
        rawTokens.forEach((tok) => {
            if (!tok) return;
            /* ขยายโทเคนยาวด้วยความกว้างบรรทัดเต็ม (indent ใช้ตอนจัดบรรทัด) */
            expandToken(tok, limit).forEach((p) => tokens.push(p));
        });

        const lines = [];
        let cur = '';
        let lineIdx = 0;
        const lineLimitNow = () => (lineIdx === 0 && firstIndentPx > 0) ? Math.max(40, limit - firstIndentPx) : limit;

        const pushLine = (s) => {
            lines.push(s);
            lineIdx++;
            cur = '';
        };

        const placeTokenOnEmptyLine = (tok, ll) => {
            if (canFitWidth(tok, ll) || !/\s/.test(tok)) {
                cur = tok;
                return;
            }
            const parts = hardSplitToken(tok, ll);
            for (let p = 0; p < parts.length - 1; p++) pushLine(parts[p]);
            cur = parts[parts.length - 1] || '';
        };

        for (let t = 0; t < tokens.length; t++) {
            let tok = tokens[t];
            if (!tok) continue;
            const ll = lineLimitNow();
            const test = cur + tok;
            if (!cur) {
                placeTokenOnEmptyLine(tok, ll);
                continue;
            }
            if (canFitWidth(test, ll)) {
                cur = test;
                continue;
            }
            pushLine(cur.replace(/[ \u00a0]+$/, ''));
            tok = tok.replace(/^[ \u00a0]+/, '');
            if (!tok) continue;
            placeTokenOnEmptyLine(tok, lineLimitNow());
        }
        if (cur) lines.push(cur.replace(/[ \u00a0]+$/, ''));

        /* ตัดบรรทัดว่าง + ดึงโทเคนก่อนหน้าลงมาถ้าบรรทัดใหม่สั้นเกินไป (กันกำพร้า 1–3 ตัว เช่น «งาน») */
        const isShortOrphanLine = (s) => {
            const t = String(s || '').replace(/[\s\u00a0]+/g, '');
            if (!t) return true;
            return Array.from(t).length <= 3;
        };
        const mergeOrphanLines = (raw) => {
            const out = raw.map((x) => String(x || '').replace(/[ \u00a0]+$/, '')).filter((x) => x.replace(/[\s\u00a0]/g, '') !== '');
            for (let i = 1; i < out.length; ) {
                if (!isShortOrphanLine(out[i])) { i++; continue; }
                /* รวมขึ้นบรรทัดก่อน — บีบตัวอักษรตอน fit รับช่วงล้นเล็กน้อย */
                out[i - 1] = (out[i - 1] + out[i]).replace(/[ \u00a0]+$/, '');
                out.splice(i, 1);
            }
            return out.length ? out : [''];
        };
        const mergedLines = mergeOrphanLines(lines);

        const fitted = (mergedLines.length ? mergedLines : ['']).map((line, idx, arr) => {
            const isLast = idx === arr.length - 1;
            const ll = (idx === 0 && firstIndentPx > 0) ? Math.max(40, limit - firstIndentPx) : limit;
            return fitWrapLineStyle(measureEl, line, ll, {
                allowExpand: expandLast || !isLast,
                maxLetterSpacingEm: opts && opts.maxLetterSpacingEm,
                minLetterSpacingEm: opts && opts.minLetterSpacingEm,
                minScaleX: opts && opts.minScaleX
            });
        });

        document.body.removeChild(measureEl);
        return fitted;
    }

    function wrapTextToWidth(text, maxWidthPx, fontSpec, sampleEl, opts) {
        return wrapTextToWidthFitted(text, maxWidthPx, fontSpec, sampleEl, opts).map((x) => x.text);
    }

    /** แถวเส้นจุด: กล่องสูงคงที่ + ข้อความชิดล่าง (เส้น = CSS border-bottom) */
    function f8708DotRow(innerHtml, rightAlign, fitStyle) {
        const cls = rightAlign ? 'f8708-dot-row f8708-dot-row-right' : 'f8708-dot-row';
        const st = fitStyle ? ` style="${fitStyle}"` : '';
        const text = `<span class="f8708-dot-text"${st}>${innerHtml || '&nbsp;'}</span>`;
        return `<div class="${cls}">${text}</div>`;
    }

    function buildF8708BodyNarrativeText() {
        const val = (id) => (document.getElementById(id)?.value || '').trim();
        const refNo = val('in-ref-no') || '....................';
        const refDate = val('in-ref-date') || '....................';
        const name = personNameFromForm() || '...........................................';
        const pos = val('in-position') || '...........................................';
        const dept = val('in-dept') || '....................';
        const amphoe = val('in-amphoe') || '................';
        const province = val('in-province') || '................';
        const dest = val('in-destination') || '........................................................................';
        const projectRaw = val('in-project') || '........................................................................';
        /* ฟอร์มมักขึ้นต้นด้วย «เพื่อปฏิบัติงาน» อยู่แล้ว — ตัดคำนำซ้ำออกก่อนต่อ */
        const projectBody = projectRaw.replace(/^\s*เพื่อปฏิบัติงาน/, '').trim();
        return (
            'ตามคำสั่ง/บันทึกที่ ' + refNo +
            ' ลงวันที่ ' + refDate +
            ' ได้อนุมัติให้ ข้าพเจ้า ' + name +
            ' ตำแหน่ง ' + pos +
            ' สังกัด' + dept +
            ' อำเภอ' + amphoe +
            ' จังหวัด' + province +
            ' เดินทางไปปฏิบัติราชการใน' + dest +
            ' เพื่อปฏิบัติงาน' + projectBody +
            ' โดยออกเดินทางจาก'
        );
    }

    /** true = ผู้ใช้แก้ข้อความบรรยายในพรีวิวแล้ว — อย่าทับจนกว่าจะรีเซ็ตหรือฟอร์มต้นทางเปลี่ยน */
    let f8708NarrativeUserEdited = false;

    function isF8708NarrativeUserEdited(el) {
        return !!(f8708NarrativeUserEdited || (el && el.getAttribute('data-user-edited') === '1'));
    }

    function markF8708NarrativeUserEdited() {
        const el = document.getElementById('f8708-body-narrative');
        f8708NarrativeUserEdited = true;
        if (el) el.setAttribute('data-user-edited', '1');
    }

    function clearF8708NarrativeUserEdited(el) {
        f8708NarrativeUserEdited = false;
        if (el) el.removeAttribute('data-user-edited');
    }

    /**
     * เก็บข้อความล้วน + บรรทัดที่ผู้ใช้กด Enter (\n)
     * — ยุบช่องว่างแนวนอน / บรรทัดว่างเกิน / ไม่กลืน \n เป็นช่องว่าง
     */
    function normalizeF8708NarrativePlain(text) {
        return String(text || '')
            .replace(/\u00a0/g, ' ')
            .replace(/\r\n/g, '\n')
            .replace(/[\u2028\u2029]/g, '\n')
            .replace(/[ \t]+/g, ' ')
            .replace(/ *\n */g, '\n')
            .replace(/\n{3,}/g, '\n\n')
            .replace(/^\n+|\n+$/g, '')
            .trim();
    }

    /** ข้อความใน .f8708-hard-line — <br> ว่างล้วน = '' ; <br> คั่นกลาง = \n */
    function plainTextFromHardLineEl(line) {
        if (!line) return '';
        const onlyBr = line.childNodes.length === 1
            && line.firstChild
            && line.firstChild.nodeName === 'BR';
        if (onlyBr) return '';
        const clone = line.cloneNode(true);
        clone.querySelectorAll('br').forEach((br) => {
            br.parentNode.replaceChild(document.createTextNode('\n'), br);
        });
        return String(clone.textContent || '').replace(/\u00a0/g, ' ');
    }

    /** ความยาว plain ในโหนด (นับ <br> เป็น \n; บรรทัดว่างที่มีแค่ <br> = 0) */
    function plainLengthWithinNode(node) {
        if (node && node.classList && node.classList.contains('f8708-hard-line')) {
            const onlyBr = node.childNodes.length === 1
                && node.firstChild
                && node.firstChild.nodeName === 'BR';
            if (onlyBr) return 0;
        }
        if (!node) return 0;
        let n = 0;
        const walk = (root) => {
            for (let c = root.firstChild; c; c = c.nextSibling) {
                if (c.nodeType === 3) n += (c.nodeValue || '').length;
                else if (c.nodeName === 'BR') n += 1;
                else if (c.nodeType === 1) walk(c);
            }
        };
        walk(node);
        return n;
    }

    /** offset plain ภายในโหนดจนถึง endNode/endOffset */
    function plainOffsetWithinNode(root, endNode, endOffset) {
        if (root && root.classList && root.classList.contains('f8708-hard-line')) {
            const onlyBr = root.childNodes.length === 1
                && root.firstChild
                && root.firstChild.nodeName === 'BR';
            if (onlyBr) return 0;
        }
        let n = 0;
        let found = false;
        const walk = (node) => {
            if (found) return;
            for (let c = node.firstChild; c && !found; c = c.nextSibling) {
                if (c === endNode) {
                    if (c.nodeType === 3) n += Math.max(0, Math.min(endOffset, (c.nodeValue || '').length));
                    else if (c.nodeName === 'BR') n += endOffset > 0 ? 1 : 0;
                    else n += plainOffsetWithinNode(c, endNode, endOffset);
                    found = true;
                    return;
                }
                if (c.nodeType === 3) {
                    n += (c.nodeValue || '').length;
                } else if (c.nodeName === 'BR') {
                    n += 1;
                } else if (c.nodeType === 1) {
                    if (endNode && c.contains(endNode)) {
                        walk(c);
                        return;
                    }
                    n += plainLengthWithinNode(c);
                }
            }
        };
        if (endNode === root) {
            /* offset นับ child */
            let i = 0;
            for (let c = root.firstChild; c && i < endOffset; c = c.nextSibling, i++) {
                if (c.nodeType === 3) n += (c.nodeValue || '').length;
                else if (c.nodeName === 'BR') n += 1;
                else if (c.nodeType === 1) n += plainLengthWithinNode(c);
            }
            return n;
        }
        walk(root);
        return n;
    }

    /**
     * อ่าน plain + ตำแหน่ง caret จากกล่องแก้ไข (นับ hard-line / <br> เป็น \n)
     */
    function readEditablePlainAndCaret(el) {
        if (!el) return { plain: '', caret: 0 };
        const sel = window.getSelection && window.getSelection();
        const hardLines = el.querySelectorAll(':scope > .f8708-hard-line');
        let plain = '';
        let caret = 0;
        let caretSet = false;

        const caretIn = (node) => !!(sel && sel.rangeCount && node && (
            node === sel.anchorNode || node.contains(sel.anchorNode)
        ));

        if (hardLines.length) {
            Array.prototype.forEach.call(hardLines, (line, i) => {
                if (i > 0) {
                    plain += '\n';
                    if (!caretSet) caret += 1;
                }
                const piece = plainTextFromHardLineEl(line);
                if (!caretSet && caretIn(line)) {
                    caret += plainOffsetWithinNode(line, sel.anchorNode, sel.anchorOffset);
                    caretSet = true;
                } else if (!caretSet) {
                    caret += piece.length;
                }
                plain += piece;
            });
            if (!caretSet) caret = plain.length;
            return { plain: plain, caret: caret };
        }

        const clone = el.cloneNode(true);
        clone.querySelectorAll('br').forEach((br) => {
            br.parentNode.replaceChild(document.createTextNode('\n'), br);
        });
        plain = String(clone.innerText != null ? clone.innerText : clone.textContent || '')
            .replace(/\u00a0/g, ' ')
            .replace(/\r\n/g, '\n');
        if (sel && sel.rangeCount && el.contains(sel.anchorNode)) {
            caret = plainOffsetWithinNode(el, sel.anchorNode, sel.anchorOffset);
        } else {
            caret = plain.length;
        }
        return { plain: plain, caret: caret };
    }

    /** วาง caret ตาม offset ใน plain (hard-line / ข้อความ) */
    function setEditableCaretPlainOffset(el, offset) {
        if (!el) return;
        const target = Math.max(0, Number(offset) || 0);
        const sel = window.getSelection && window.getSelection();
        if (!sel) return;

        const placeAt = (node, off) => {
            const range = document.createRange();
            range.setStart(node, off);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
        };

        const hardLines = el.querySelectorAll(':scope > .f8708-hard-line');
        if (hardLines.length) {
            let remain = target;
            for (let i = 0; i < hardLines.length; i++) {
                if (i > 0) {
                    if (remain <= 0) {
                        const line = hardLines[i];
                        const tw = document.createTreeWalker(line, NodeFilter.SHOW_TEXT, null);
                        const first = tw.nextNode();
                        if (first) placeAt(first, 0);
                        else placeAt(line, 0);
                        return;
                    }
                    remain -= 1;
                }
                const line = hardLines[i];
                const len = plainLengthWithinNode(line);
                if (remain <= len || i === hardLines.length - 1) {
                    let left = Math.min(remain, len);
                    const walk = document.createTreeWalker(line, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
                        acceptNode: (n) => {
                            if (n.nodeType === 3) return NodeFilter.FILTER_ACCEPT;
                            if (n.nodeName === 'BR') return NodeFilter.FILTER_ACCEPT;
                            return NodeFilter.FILTER_SKIP;
                        }
                    });
                    let n;
                    while ((n = walk.nextNode())) {
                        if (n.nodeName === 'BR') {
                            if (left <= 0) {
                                placeAt(n.parentNode, Array.prototype.indexOf.call(n.parentNode.childNodes, n));
                                return;
                            }
                            left -= 1;
                            continue;
                        }
                        const L = (n.nodeValue || '').length;
                        if (left <= L) {
                            placeAt(n, left);
                            return;
                        }
                        left -= L;
                    }
                    placeAt(line, line.childNodes.length);
                    return;
                }
                remain -= len;
            }
            return;
        }

        let left = target;
        const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, {
            acceptNode: (n) => {
                if (n.nodeType === 3) return NodeFilter.FILTER_ACCEPT;
                if (n.nodeName === 'BR') return NodeFilter.FILTER_ACCEPT;
                return NodeFilter.FILTER_SKIP;
            }
        });
        let n;
        while ((n = walk.nextNode())) {
            if (n.nodeName === 'BR') {
                if (left <= 0) {
                    placeAt(n.parentNode, Array.prototype.indexOf.call(n.parentNode.childNodes, n));
                    return;
                }
                left -= 1;
                continue;
            }
            const L = (n.nodeValue || '').length;
            if (left <= L) {
                placeAt(n, left);
                return;
            }
            left -= L;
        }
    }

    /** plain (\n) → แต่ละบรรทัด hard เป็น <div class="f8708-hard-line"> (ท้ายก้อน = last / ชิดซ้าย) */
    function plainTextToHardLineHtml(text) {
        const lines = String(text || '').split('\n');
        if (!lines.length) lines.push('');
        return lines.map((line, i, arr) => {
            const isLast = i === arr.length - 1;
            const cls = 'f8708-hard-line' + (isLast ? ' f8708-hard-line-last' : '');
            const inner = escHtml(line);
            return `<div class="${cls}">${inner || '<br>'}</div>`;
        }).join('');
    }

    /** legacy: <br> คั่นบรรทัด (ยังใช้ตอนอ่าน fallback) */
    function plainTextToBrHtml(text) {
        return escHtml(text).replace(/\n/g, '<br>');
    }

    /**
     * อ่านข้อความจาก contenteditable คง hard-line / <br>/บล็อกเป็น \n
     * — clone+innerText กัน ::before「เรียน」ปน; wrap-line เก่า = ตัดอัตโนมัติ (ไม่ใช่ hard break)
     */
    function readDomPlainPreservingBreaks(el) {
        if (!el) return '';
        const hardLines = el.querySelectorAll(':scope > .f8708-hard-line');
        if (hardLines.length) {
            return Array.prototype.map.call(hardLines, plainTextFromHardLineEl).join('\n');
        }
        const wrapLines = el.querySelectorAll('.f8708-wrap-line');
        if (wrapLines.length) {
            return Array.prototype.map
                .call(wrapLines, (n) => (n.textContent || '').replace(/\u00a0/g, ' '))
                .join('');
        }
        const clone = el.cloneNode(true);
        return String(clone.innerText != null ? clone.innerText : clone.textContent || '')
            .replace(/\u00a0/g, ' ')
            .replace(/\r\n/g, '\n');
    }

    function applyPlainWithBreaks(el, plain) {
        if (!el) return;
        el.innerHTML = plainTextToHardLineHtml(plain);
    }

    /**
     * แทรก hard \n ที่ caret แล้ววาด hard-line ใหม่ (บรรทัดบน justify เต็มความกว้าง)
     * คืน true ถ้าจัดการแล้ว
     */
    function insertEditableHardBreakAndReflow(el) {
        if (!el) return false;
        const norm = (el.id === 'p3-intro' || el.getAttribute('data-f8708-note-flow'))
            ? (el.getAttribute('data-f8708-note-flow') ? normalizeF8708NotePlain : normalizeF8708P3IntroPlain)
            : normalizeF8708NarrativePlain;
        const cur = readEditablePlainAndCaret(el);
        const plain0 = String(cur.plain || '');
        const at = Math.max(0, Math.min(plain0.length, cur.caret));
        const left = norm(plain0.slice(0, at));
        const right = norm(plain0.slice(at));
        let normalized = norm(left + '\n' + right);
        /* ถ้ารก Enter ท้ายก้อน — เก็บบรรทัดว่างท้ายไว้หนึ่งบรรทัด (normalize ปกติตัด \n ท้าย) */
        if (!right && left && normalized === left) normalized = left + '\n';
        const caretAfter = left.length + 1;
        applyPlainWithBreaks(el, normalized);
        el.dataset.editedPlain = normalized;
        setEditableCaretPlainOffset(el, Math.min(caretAfter, normalized.length));
        return true;
    }

    /** อ่านข้อความล้วนจาก DOM (รองรับบรรทัด fitted เก่า / <br>) */
    function readF8708BodyNarrativePlainFromDom(el) {
        if (!el) return '';
        return normalizeF8708NarrativePlain(readDomPlainPreservingBreaks(el));
    }

    /** ข้อความล้วนบนจอ (สำหรับ PDF/Word ที่อ่านจาก DOM) — คง \n ที่ผู้ใช้ตัด */
    function getF8708BodyNarrativePlainText() {
        const el = document.getElementById('f8708-body-narrative');
        if (!el) return '';
        if (el.dataset.editedPlain != null && el.dataset.editedPlain !== '') {
            return normalizeF8708NarrativePlain(el.dataset.editedPlain);
        }
        return readF8708BodyNarrativePlainFromDom(el);
    }

    function syncF8708BodyNarrativeFromDom() {
        const el = document.getElementById('f8708-body-narrative');
        if (!el) return;
        el.dataset.editedPlain = readF8708BodyNarrativePlainFromDom(el);
    }

    /**
     * คงข้อความ + บรรทัดที่ผู้ใช้ตัด (โฟกัส/เลิกโฟกัส/Word/PDF)
     * — ล้าง wrap-line เก่า; วาดเป็น .f8708-hard-line (บรรทัดบน justify เต็มแถว)
     */
    function normalizeF8708BodyNarrativeDisplay() {
        const el = document.getElementById('f8708-body-narrative');
        if (!el) return;
        const plain = normalizeF8708NarrativePlain(
            el === document.activeElement
                ? readF8708BodyNarrativePlainFromDom(el)
                : getF8708BodyNarrativePlainText()
        );
        el.classList.remove('f8708-narrative-fitted');
        const hardLines = el.querySelectorAll(':scope > .f8708-hard-line');
        const hasLegacyLines = !!el.querySelector('.f8708-wrap-line');
        const curPlain = readF8708BodyNarrativePlainFromDom(el);
        const needPaint = hasLegacyLines || curPlain !== plain || !hardLines.length
            || (plain.indexOf('\n') >= 0 && hardLines.length < 2)
            || (hardLines.length >= 2 && !hardLines[hardLines.length - 1].classList.contains('f8708-hard-line-last'));
        if (needPaint) applyPlainWithBreaks(el, plain);
        el.dataset.editedPlain = plain;
    }

    /** ชื่อเดิม — เรียก normalize ย่อหน้าเดียว (ไม่สลับโหมดจัดบรรทัด) */
    function fitF8708BodyNarrativeLines() {
        if (document.activeElement && document.activeElement.id === 'f8708-body-narrative') return;
        normalizeF8708BodyNarrativeDisplay();
    }

    function ensureF8708BodyNarrativeFitted() {
        const el = document.getElementById('f8708-body-narrative');
        if (!el) return;
        if (el === document.activeElement) {
            syncF8708BodyNarrativeFromDom();
            el.blur();
        }
        normalizeF8708BodyNarrativeDisplay();
    }

    function resetF8708BodyNarrativeFromForm() {
        const el = document.getElementById('f8708-body-narrative');
        clearF8708NarrativeUserEdited(el);
        if (el) {
            delete el.dataset.autoSource;
            delete el.dataset.editedPlain;
            el.classList.remove('f8708-narrative-fitted');
        }
        renderF8708BodyNarrative();
        if (typeof showToast === 'function') showToast('สร้างข้อความบรรยายใหม่จากฟอร์มแล้ว');
    }

    function bindF8708BodyNarrativeEditor() {
        const el = document.getElementById('f8708-body-narrative');
        if (!el || el.dataset.editBound === '1') return;
        el.dataset.editBound = '1';
        setF8708EditableAttr(el);
        /* ถอด ::before ก่อน hit-test/selection — กันเลือกทั้งก้อนตอนคลิก */
        el.addEventListener('pointerdown', () => {
            el.classList.add('f8708-narrative-editing');
        }, true);
        /* โฟกัส: คง hard-line; ล้าง wrap-line มรดกถ้ามี */
        el.addEventListener('focus', () => {
            el.classList.add('f8708-narrative-editing');
            if (el.querySelector('.f8708-wrap-line') || !el.querySelector(':scope > .f8708-hard-line')) {
                const plain = normalizeF8708NarrativePlain(getF8708BodyNarrativePlainText());
                el.classList.remove('f8708-narrative-fitted');
                applyPlainWithBreaks(el, plain);
                el.dataset.editedPlain = plain;
            }
        });
        el.addEventListener('input', () => {
            markF8708NarrativeUserEdited();
            syncF8708BodyNarrativeFromDom();
        });
        /* blur: เก็บ \n + วาด hard-line (บรรทัดบน justify เต็มความกว้าง) */
        el.addEventListener('blur', () => {
            syncF8708BodyNarrativeFromDom();
            el.classList.remove('f8708-narrative-editing');
            normalizeF8708BodyNarrativeDisplay();
        });
        /* Enter = hard \n คงหลัง blur + ยืดบรรทัดบนทันที */
        el.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            markF8708NarrativeUserEdited();
            insertEditableHardBreakAndReflow(el);
        });
        if (!window.__f8708NarrativePrintBound) {
            window.__f8708NarrativePrintBound = true;
            window.addEventListener('beforeprint', () => ensureF8708BodyNarrativeFitted());
        }
    }

    function renderF8708BodyNarrative() {
        const el = document.getElementById('f8708-body-narrative');
        if (!el) return;
        bindF8708BodyNarrativeEditor();

        const narrative = buildF8708BodyNarrativeText();
        const prevSource = el.dataset.autoSource || '';

        /* ผู้ใช้แก้แล้ว และค่าฟอร์มต้นทางยังเท่าเดิม → คงข้อความ (ย่อหน้าเดียว + CSS เดิม) */
        if (isF8708NarrativeUserEdited(el) && prevSource === narrative) {
            setF8708EditableAttr(el);
            if (el !== document.activeElement) normalizeF8708BodyNarrativeDisplay();
            return;
        }

        /* ฟอร์มเปลี่ยน (หรือยังไม่เคยแก้) → เขียนจากฟอร์ม ไม่ micro-fit */
        clearF8708NarrativeUserEdited(el);
        el.classList.remove('f8708-narrative-fitted');
        applyPlainWithBreaks(el, narrative);
        el.dataset.autoSource = narrative;
        el.dataset.editedPlain = narrative;
        setF8708EditableAttr(el);
        if (el !== document.activeElement) {
            requestAnimationFrame(() => normalizeF8708BodyNarrativeDisplay());
        }
    }

    /** หน้า ๓ ย่อหน้าหมายเหตุ (ใต้หัวข้อ「หมายเหตุ」) — จากฟอร์ม */
    function buildF8708P3IntroText() {
        const val = (id) => (document.getElementById(id)?.value || '').trim();
        const name = personNameFromForm() || '....................';
        const pos = val('in-position') || '....................';
        const tDates = val('in-travel-dates-summary');
        const datesTh = (typeof toThaiNum === 'function' ? toThaiNum(tDates) : tDates) || '..................................';
        const tDays = val('in-total-days');
        const daysTh = (typeof toThaiNum === 'function' ? toThaiNum(tDays) : tDays) || '....';
        return (
            'เดินทางไปปฏิบัติราชการท้องที่ ของ' + name +
            ' ตำแหน่ง ' + pos +
            ' ในระหว่างวันที่ ' + datesTh +
            ' รวม ' + daysTh +
            ' วัน รายละเอียดดังนี้'
        );
    }

    let f8708P3IntroUserEdited = false;

    function isF8708P3IntroUserEdited(el) {
        return !!(f8708P3IntroUserEdited || (el && el.getAttribute('data-user-edited') === '1'));
    }

    function markF8708P3IntroUserEdited() {
        const el = document.getElementById('p3-intro');
        f8708P3IntroUserEdited = true;
        if (el) el.setAttribute('data-user-edited', '1');
    }

    function clearF8708P3IntroUserEdited(el) {
        f8708P3IntroUserEdited = false;
        if (el) el.removeAttribute('data-user-edited');
    }

    function normalizeF8708P3IntroPlain(text) {
        return normalizeF8708NarrativePlain(text);
    }

    function readF8708P3IntroPlainFromDom(el) {
        if (!el) return '';
        return normalizeF8708P3IntroPlain(readDomPlainPreservingBreaks(el));
    }

    function getF8708P3IntroPlainText() {
        const el = document.getElementById('p3-intro');
        if (!el) return '';
        if (el.dataset.editedPlain != null && el.dataset.editedPlain !== '') {
            return normalizeF8708P3IntroPlain(el.dataset.editedPlain);
        }
        return readF8708P3IntroPlainFromDom(el);
    }

    function syncF8708P3IntroFromDom() {
        const el = document.getElementById('p3-intro');
        if (!el) return;
        el.dataset.editedPlain = readF8708P3IntroPlainFromDom(el);
    }

    function normalizeF8708P3IntroDisplay() {
        const el = document.getElementById('p3-intro');
        if (!el) return;
        const plain = normalizeF8708P3IntroPlain(
            el === document.activeElement
                ? readF8708P3IntroPlainFromDom(el)
                : getF8708P3IntroPlainText()
        );
        const hardLines = el.querySelectorAll(':scope > .f8708-hard-line');
        const curPlain = readF8708P3IntroPlainFromDom(el);
        const needPaint = curPlain !== plain || !hardLines.length
            || (plain.indexOf('\n') >= 0 && hardLines.length < 2)
            || (hardLines.length >= 2 && !hardLines[hardLines.length - 1].classList.contains('f8708-hard-line-last'));
        if (needPaint) applyPlainWithBreaks(el, plain);
        el.dataset.editedPlain = plain;
    }

    function ensureF8708P3IntroReady() {
        const el = document.getElementById('p3-intro');
        if (!el) return;
        if (el === document.activeElement) {
            syncF8708P3IntroFromDom();
            el.blur();

    function resetF8708P3IntroFromForm() {
        const el = document.getElementById('p3-intro');
        clearF8708P3IntroUserEdited(el);
        if (el) {
            delete el.dataset.autoSource;
            delete el.dataset.editedPlain;
        }
        renderF8708P3Intro();
        if (typeof showToast === 'function') showToast('สร้างข้อความหมายเหตุหน้า ๓ ใหม่จากฟอร์มแล้ว');
    }

    function bindF8708P3IntroEditor() {
        const el = document.getElementById('p3-intro');
        if (!el || el.dataset.editBound === '1') return;
        el.dataset.editBound = '1';
        setF8708EditableAttr(el);
        el.addEventListener('input', () => {
            markF8708P3IntroUserEdited();
            syncF8708P3IntroFromDom();
        });
        el.addEventListener('blur', () => {
            syncF8708P3IntroFromDom();
            normalizeF8708P3IntroDisplay();
        });
        el.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            markF8708P3IntroUserEdited();
            insertEditableHardBreakAndReflow(el);
        });

            window.addEventListener('beforeprint', () => ensureF8708P3IntroReady());
        }
    }

    /** true = ผู้ใช้แก้หมายเหตุ/ลายเซ็นในพรีวิวแล้ว — อย่าทับจนกว่าจะรีเซ็ตหรือฟอร์มต้นทางเปลี่ยน */
    let f8708NoteFooterUserEdited = false;

    function normalizeF8708NotePlain(text) {
        /* คง hard \n ระหว่างช่วง — ตัดช่องว่างรายบรรทัด ไม่กลืนบรรทัดด้วย trim ทั้งก้อน */
        const raw = String(text || '')
            .replace(/\u00a0/g, ' ')
            .replace(/\r\n/g, '\n')
            .replace(/[\u2028\u2029]/g, '\n');
        const keepTrail = /\S\n\s*$/.test(raw);
        let s = raw
            .replace(/[ \t]+/g, ' ')
            .replace(/\n{3,}/g, '\n\n')
            .replace(/[ \t]+\n/g, '\n')
            .replace(/\n[ \t]+/g, '\n');
        s = s
            .split('\n')
            .map((line) => line.replace(/^[ \t]+|[ \t]+$/g, ''))
            .join('\n')
            .replace(/^\n+/, '')
            .replace(/\n+$/, '');
        if (keepTrail && s) s += '\n';
        return s;
    }

    function normalizeF8708SigPlain(text) {
        return String(text || '')
            .replace(/\u00a0/g, ' ')
            .replace(/[\r\n\u2028\u2029]+/g, ' ')
            .replace(/[ \t]+/g, ' ')
            .trim();
    }

    /**
     * รวมข้อความจากแถวหมายเหตุในหนึ่งช่วง soft-wrap
     * — คืนช่องว่างที่ตัดบรรทัดกลืนกิน (เช่น รวม|๑๙, ตำแหน่ง|นักวิชาการ)
     * — ไม่ใช้กับข้าม hard \n (คนละช่วง seg)
     */
    function joinF8708NoteLineTexts(parts) {
        let out = '';
        Array.prototype.forEach.call(parts, (part) => {
            const t = String(part || '').replace(/\u00a0/g, ' ');
            if (!t) return;
            if (!out) {
                out = t;
                return;
            }
            if (!/\s$/.test(out) && !/^\s/.test(t)) {
                const a = out.charAt(out.length - 1);
                const b = t.charAt(0);
                if (/[0-9๐-๙]$/.test(out) && /^[0-9๐-๙ก-ฮa-zA-Z]/.test(t)) out += ' ';
                else if (/[ก-ฮa-zA-Z]$/.test(out) && /^[0-9๐-๙]/.test(t)) out += ' ';
                else if (/[,]$/.test(out) && !/^[,.]/.test(t)) out += ' ';
                else if (/[ก-ฮa-zA-Z0-9๐-๙]$/.test(out) && /^[ก-ฮa-zA-Z0-9๐-๙]/.test(t)) {
                    /* soft-wrap ตัดระหว่างคำ — คืนช่องว่าง (กัน ตำแหน่งนักวิชาการ) */
                    out += ' ';
                } else if (a && b && /[.]/.test(a) === false) {
                    /* อื่นๆ (เช่น จบด้วย …) ต่อติดได้ */
                }
            }
            out += t;
        });
        return normalizeF8708NotePlain(out);
    }

    function readF8708NotePlainFromLines(root) {
        if (!root) return '';
        /* โหมดใหม่: ข้อความต่อเนื่องก้อนเดียว (soft-wrap ไหลรวม) */
        const flow = root.querySelector('[data-f8708-note-flow]');
        if (flow) {
            return normalizeF8708NotePlain(readDomPlainPreservingBreaks(flow));
        }
        /* legacy: กลุ่ม data-f8708-note-seg = hard break; ในกลุ่ม = soft wrap แยก element */
        const segs = root.querySelectorAll('[data-f8708-note-seg]');
        if (segs.length) {
            return normalizeF8708NotePlain(
                Array.prototype.map
                    .call(segs, (seg) =>
                        joinF8708NoteLineTexts(
                            Array.prototype.map.call(
                                seg.querySelectorAll('[data-f8708-note-line]'),
                                (n) => (n.textContent || '').replace(/\u00a0/g, ' ')
                            )
                        )
                    )
                    .join('\n')
            );
        }
        const lines = root.querySelectorAll('[data-f8708-note-line]');
        if (!lines.length) return '';
        return joinF8708NoteLineTexts(
            Array.prototype.map.call(lines, (n) => (n.textContent || '').replace(/\u00a0/g, ' '))
        );
    }

    /** จำนวนแถวเส้นประ underlay ให้พอดีกับข้อความหมายเหตุที่ wrap */
    function countF8708NoteFlowVisualLines(root, notePlain) {
        const note = normalizeF8708NotePlain(notePlain);
        const fits = wrapF8708NoteLinesFitted(note, root);
        let n = Math.max(2, fits.length || 1);
        if (/\n\s*$/.test(String(notePlain || '')) || String(note || '').endsWith('\n')) {
            n = Math.max(n, fits.length + 1);
        }
        return n;
    }

    function syncF8708NoteFlowUnderlay(root, notePlain) {
        if (!root) return;
        const host = root.querySelector('.f8708-note-flow-host');
        const flow = root.querySelector('[data-f8708-note-flow]');
        if (!host || !flow) return;
        const plain = notePlain != null ? notePlain : readF8708NotePlainFromLines(root);
        const n = countF8708NoteFlowVisualLines(root, plain);
        let rows = host.querySelectorAll(':scope > .f8708-dot-row');
        while (rows.length < n) {
            const d = document.createElement('div');
            d.className = 'f8708-dot-row';
            d.setAttribute('aria-hidden', 'true');
            host.insertBefore(d, flow);
            rows = host.querySelectorAll(':scope > .f8708-dot-row');
        }
        while (rows.length > n) {
            rows[rows.length - 1].remove();
            rows = host.querySelectorAll(':scope > .f8708-dot-row');
        }
    }

            f8708DotRow('', false);

        const flow = el.querySelector('[data-f8708-note-flow]');

        if (nameNode) nameNode.textContent = nameLine;

    function setF8708EditableAttr(node) {
        if (!node) return;
        node.setAttribute('contenteditable', 'true');
        node.setAttribute('spellcheck', 'false');

    /**
     * ตัด/จัดบรรทัดหมายเหตุในหนึ่งช่วง (ไม่มี hard \n ในช่วง) — วลีที่กันผ่า + ยืด letter-spacing
     * opts.expandLastLine = true เมื่อเป็นช่วง hard ก่อนท้ายก้อน (บรรทัดบนต้องเต็มความกว้าง)
     * — ไม่รวมกำพร้าข้ามช่วง hard; ไม่บีบยัดคำขึ้นบรรทัดก่อน
     */
    function wrapF8708NoteSegmentFitted(segText, el, measureElShared, opts) {
        const seg = String(segText || '');
        const expandSegLast = !!(opts && opts.expandLastLine);
        const maxW = measureNoteFooterWidth(el);
        const sample = (el && el.closest('.page-box')) || el || document.body;
        const limit = Math.max(40, maxW - 1);
        const wrapOpts = Object.assign({}, F8708_NOTE_WRAP_FIT, { expandLastLine: expandSegLast });
        let fits = wrapTextToWidthFitted(seg, limit, F8708_BODY_FONT_SPEC, sample, wrapOpts);
        const ownMeasure = !measureElShared;
        const measureEl = measureElShared || createWrapMeasureEl(F8708_BODY_FONT_SPEC, sample);
        const fitOpts = expandSegLast
            ? {
                maxLetterSpacingEm: F8708_NOTE_HARD_UPPER_FIT.maxLetterSpacingEm,
                minLetterSpacingEm: F8708_NOTE_HARD_UPPER_FIT.minLetterSpacingEm,
                minScaleX: F8708_NOTE_HARD_UPPER_FIT.minScaleX,
                forceExpand: true
            }
            : {
                maxLetterSpacingEm: F8708_NOTE_WRAP_FIT.maxLetterSpacingEm,
                minLetterSpacingEm: F8708_NOTE_WRAP_FIT.minLetterSpacingEm,
                minScaleX: F8708_NOTE_WRAP_FIT.minScaleX
            };

        /* รวมกำพร้าเฉพาะช่วงท้ายก้อนที่ soft-wrap ≥ 2 บรรทัด — ห้ามดึงข้าม hard \n */
        if (!expandSegLast && fits.length >= 2) {
            const last = fits[fits.length - 1];
            const prev = fits[fits.length - 2];
            const lastW = measureWrapWidth(measureEl, last.text, 0, 1);

            if (lastW > 0 && lastW < limit * 0.45) {
                const merged = joinF8708NoteLineTexts([prev.text, last.text]);
                if (measureWrapWidth(measureEl, merged, 0, 1) <= limit) {
                    fits = fits.slice(0, -2).concat([
                        fitWrapLineStyle(measureEl, merged, limit, Object.assign({ allowExpand: false }, fitOpts))
                    ]);
                }
            }
        }

        fits = fits.map((fit, idx, arr) => {
            const isLast = idx === arr.length - 1;
            const allowExpand = expandSegLast || !isLast;
            return fitWrapLineStyle(
                measureEl,
                fit.text,
                limit,
                Object.assign({
                    allowExpand: allowExpand,
                    /* ช่วง hard บน: ยืดทุก soft-line ในช่วงให้เต็มเส้นจุด */
                    forceExpand: !!expandSegLast
                }, fitOpts)
            );
        });

        if (ownMeasure && measureEl && measureEl.parentNode) document.body.removeChild(measureEl);
        return fits.length ? fits : [{ text: seg || '', letterSpacingEm: 0, scaleX: 1 }];
    }

    /**
     * ตัด/จัดบรรทัดหมายเหตุ: คง hard break (\n) จากผู้ใช้ — soft-wrap ทีละช่วง
     * ช่วง hard ที่ไม่ใช่ท้ายก้อน → ยืดบรรทัดสุดท้ายของช่วงให้เต็มความกว้าง
     */
    function wrapF8708NoteLinesFitted(noteText, el) {
        const note = normalizeF8708NotePlain(noteText);
        const segments = note.length ? note.split('\n') : [''];
        const sample = (el && el.closest('.page-box')) || el || document.body;
        const measureEl = createWrapMeasureEl(F8708_BODY_FONT_SPEC, sample);
        let all = [];
        try {
            segments.forEach((seg, si) => {
                all = all.concat(wrapF8708NoteSegmentFitted(seg, el, measureEl, {
                    expandLastLine: si < segments.length - 1
                }));
            });
        } finally {
            if (measureEl && measureEl.parentNode) document.body.removeChild(measureEl);
        }
        return all.length ? all : [{ text: note || '', letterSpacingEm: 0, scaleX: 1 }];
    }

    /** คืนช่วงข้อความหมายเหตุ (แยกด้วย \n) พร้อมบรรทัด fitted ในแต่ละช่วง */
    function wrapF8708NoteSegmentsFitted(noteText, el) {
        const note = normalizeF8708NotePlain(noteText);
        const segments = note.length ? note.split('\n') : [''];
        const sample = (el && el.closest('.page-box')) || el || document.body;
        const measureEl = createWrapMeasureEl(F8708_BODY_FONT_SPEC, sample);
        let out;
        try {
            out = segments.map((seg, si) => wrapF8708NoteSegmentFitted(seg, el, measureEl, {
                expandLastLine: si < segments.length - 1
            }));
        } finally {
            if (measureEl && measureEl.parentNode) document.body.removeChild(measureEl);
        }
        return out;
    }

    /**
     * caret offset ในโหนดข้อความ (นับเป็นความยาว text)
     * preferStart=true → ใช้จุดต้น selection (Enter แยกบรรทัด ไม่กลืนทั้งบรรทัดที่เลือกเข้าบรรทัดบน)
     */
    function f8708CaretTextOffsetIn(el, preferStart) {
        const sel = window.getSelection && window.getSelection();
        if (!sel || !sel.rangeCount || !el) return (el.textContent || '').length;
        const range = sel.getRangeAt(0);
        const endNode = preferStart ? range.startContainer : range.endContainer;
        const endOff = preferStart ? range.startOffset : range.endOffset;
        if (!el.contains(endNode) && el !== endNode) return (el.textContent || '').length;
        const pre = range.cloneRange();
        pre.selectNodeContents(el);
        try {
            pre.setEnd(endNode, endOff);
        } catch (err) {
            return (el.textContent || '').length;
        }
        return pre.toString().length;
    }

    /** Enter ในแถวหมายเหตุ → hard \n ใน notePlain แล้ววาดใหม่ (ไม่กลืนเป็นช่องว่าง) */
    function insertF8708NoteHardBreakAtTarget(root, lineEl) {
        if (!root || !lineEl) return;
        const text = (lineEl.textContent || '').replace(/\u00a0/g, ' ');
        /* แยกที่ต้น selection — ถ้าเลือกทั้งบรรทัดแล้วกด Enter ต้องไม่รวมกลับเข้าบรรทัดบน */
        const offset = Math.max(0, Math.min(text.length, f8708CaretTextOffsetIn(lineEl, true)));
        const before = text.slice(0, offset);
        const after = text.slice(offset);
        const seg = lineEl.closest('[data-f8708-note-seg]');
        const segs = Array.prototype.slice.call(root.querySelectorAll('[data-f8708-note-seg]'));
        const segIdx = seg ? segs.indexOf(seg) : -1;
        const linesInSeg = seg
            ? Array.prototype.slice.call(seg.querySelectorAll('[data-f8708-note-line]'))
            : [lineEl];
        const lineIdx = linesInSeg.indexOf(lineEl);

        const left = joinF8708NoteLineTexts(
            linesInSeg
                .slice(0, lineIdx)
                .map((n) => (n.textContent || '').replace(/\u00a0/g, ' '))
                .concat([before])
        );
        const right = joinF8708NoteLineTexts(
            [after].concat(
                linesInSeg.slice(lineIdx + 1).map((n) => (n.textContent || '').replace(/\u00a0/g, ' '))
            )
        );

        const parts = [];
        if (segIdx < 0) {
            parts.push(left, right);
        } else {
            segs.forEach((s, si) => {
                if (si < segIdx) {
                    parts.push(
                        joinF8708NoteLineTexts(
                            Array.prototype.map.call(
                                s.querySelectorAll('[data-f8708-note-line]'),
                                (n) => (n.textContent || '').replace(/\u00a0/g, ' ')
                            )
                        )
                    );
                } else if (si === segIdx) {
                    parts.push(left, right);
                } else {
                    parts.push(
                        joinF8708NoteLineTexts(
                            Array.prototype.map.call(
                                s.querySelectorAll('[data-f8708-note-line]'),
                                (n) => (n.textContent || '').replace(/\u00a0/g, ' ')
                            )
                        )
                    );
                }
            });
        }

        /* hard \n คั่นช่วง — normalize แบบคงบรรทัด (รวมท้ายว่างหลัง Enter) */
        let note = normalizeF8708NotePlain(parts.map((p) => String(p || '')).join('\n'));
        if (note.indexOf('\n') < 0) {
            note = String(left || '') + '\n' + String(right || '');
        }
        root.dataset.notePlain = note;
        markF8708NoteFooterUserEdited();
        paintF8708NoteFooterHtml(root, getF8708NoteFooterParts());

        /* โฟกัสต้นบรรทัดช่วงหลังจุดตัด */
        const newSegs = root.querySelectorAll('[data-f8708-note-seg]');
        const focusSeg = newSegs[segIdx < 0 ? 1 : segIdx + 1] || newSegs[newSegs.length - 1];
        const focusLine = focusSeg && focusSeg.querySelector('[data-f8708-note-line]');
        if (focusLine) {
            focusLine.focus();
            const sel = window.getSelection && window.getSelection();
            if (sel) {
                const r = document.createRange();
                r.selectNodeContents(focusLine);
                r.collapse(true);
                sel.removeAllRanges();
                sel.addRange(r);
            }
        }
    }
