    function ensureF8708NoteFooterReady() {
        const el = document.getElementById('f8708-note-footer');
        if (!el) return;
        if (f8708NoteFooterHasFocus(el)) {
            syncF8708NoteFooterFromDom();
            const ae = document.activeElement;
            if (ae && typeof ae.blur === 'function') ae.blur();
        }
        syncF8708NoteFooterFromDom();
        /* ก่อน Word/PDF: จัดบรรทัดใหม่ให้เต็มความกว้างจากข้อความบนจอ */
        paintF8708NoteFooterHtml(el, getF8708NoteFooterParts());
    }

    function bindF8708NoteFooterEditor() {
        const el = document.getElementById('f8708-note-footer');
        if (!el || el.dataset.editBound === '1') return;
        el.dataset.editBound = '1';

        el.addEventListener('input', (e) => {
            const t = e.target;
            if (!t || !el.contains(t)) return;
            markF8708NoteFooterUserEdited();
            const flow = t.closest ? t.closest('[data-f8708-note-flow]') : null;
            if (flow || (t.getAttribute && t.getAttribute('data-f8708-note-flow'))) {
                const note = readF8708NotePlainFromLines(el);
                el.dataset.notePlain = note;
                syncF8708NoteFlowUnderlay(el, note);
            } else if (t.getAttribute && t.getAttribute('data-f8708-note-line')) {
                el.dataset.notePlain = readF8708NotePlainFromLines(el);
            } else if (t.getAttribute && t.getAttribute('data-f8708-sig')) {
                const key = t.getAttribute('data-f8708-sig');
                const plain = normalizeF8708SigPlain(t.textContent || '');
                if (key === 'sig') el.dataset.sigPlain = plain;
                else if (key === 'name') el.dataset.namePlain = plain;
                else if (key === 'pos') el.dataset.posPlain = plain;
            }
        });

        el.addEventListener('blur', (e) => {
            if (!e.target || !el.contains(e.target)) return;
            requestAnimationFrame(() => {
                if (f8708NoteFooterHasFocus(el)) return;
                syncF8708NoteFooterFromDom();
                /* เลิกโฟกัส: จัดเส้นประ underlay ให้พอดีกับข้อความ (ข้อความยังเป็นก้อนเดียว) */
                paintF8708NoteFooterHtml(el, getF8708NoteFooterParts());
            });
        }, true);

        el.addEventListener('keydown', (e) => {
            const t = e.target;
            if (!t || !el.contains(t)) return;
            if (e.key !== 'Enter') return;
            e.preventDefault();
            const flow = (t.getAttribute && t.getAttribute('data-f8708-note-flow'))
                ? t
                : (t.closest && t.closest('[data-f8708-note-flow]'));
            if (flow) {
                markF8708NoteFooterUserEdited();
                insertEditableHardBreakAndReflow(flow);
                const note = readF8708NotePlainFromLines(el);
                el.dataset.notePlain = note;
                syncF8708NoteFlowUnderlay(el, note);
                return;
            }
            /* legacy: Enter ในแถวหมายเหตุแยก element */
            if (t.getAttribute && t.getAttribute('data-f8708-note-line')) {
                insertF8708NoteHardBreakAtTarget(el, t);
                return;
            }
            if (document.queryCommandSupported && document.queryCommandSupported('insertText')) {
                document.execCommand('insertText', false, ' ');
            }
            markF8708NoteFooterUserEdited();
        });

        if (!window.__f8708NoteFooterPrintBound) {
            window.__f8708NoteFooterPrintBound = true;
            window.addEventListener('beforeprint', () => ensureF8708NoteFooterReady());
        }
    }

    function renderF8708NoteFooter(remeasured) {
        const el = document.getElementById('f8708-note-footer');
        if (!el) return;
        bindF8708NoteFooterEditor();

        const run = () => {
            if (f8708NoteFooterHasFocus(el)) {
                syncF8708NoteFooterFromDom();
                return;
            }

            const fromForm = buildF8708NoteFooterFromForm();
            const sourceKey = f8708NoteFooterSourceKey(fromForm);
            const prevSource = el.dataset.autoSource || '';

            if (isF8708NoteFooterUserEdited(el) && prevSource === sourceKey) {
                /* วาดใหม่เสมอ (ตอนไม่โฟกัส) — คง hard \n + ยืดบรรทัดบนเต็มเส้นหลังวัดความกว้าง/ฟอนต์ */
                paintF8708NoteFooterHtml(el, getF8708NoteFooterParts());
                return;
            }

            clearF8708NoteFooterUserEdited(el);
            el.dataset.autoSource = sourceKey;
            paintF8708NoteFooterHtml(el, fromForm);

            if (!remeasured) {
                requestAnimationFrame(() => renderF8708NoteFooter(true));
            }
        };

        /* วาดทันที — อย่ารอฟอนต์จน footer ว่าง; พอฟอนต์พร้อมค่อยวัดใหม่ */
        run();
        if (!remeasured && document.fonts && document.fonts.status !== 'loaded') {
            document.fonts.ready.then(() => {
                if (!f8708NoteFooterHasFocus(el)) renderF8708NoteFooter(true);
            }).catch(() => {});
        }
    }

            cell.style.fontSize = fs;
            cell.style.lineHeight = lh;
            cell.style.msoLineHeightRule = 'exactly';
            cell.style.padding = isDense ? '0 1px' : '0 2px';
            cell.style.height = 'auto';
            var noGrid = cell.classList.contains('bg111-title-right') || cell.classList.contains('bg111-title-center') ||
                cell.classList.contains('bg111-noborder') || cell.classList.contains('bg111-cert') ||
                cell.classList.contains('bg111-claim') || cell.classList.contains('bg111-text-indent') ||
                cell.classList.contains('bg111-total-words') ||
                (cell.parentElement && cell.parentElement.classList.contains('bg111-total-words-row'));
            if (noGrid) {
                // ไม่ใช้ border-style:hidden — ใน border-collapse จะกินเส้นแถวบน
                cell.style.setProperty('border', 'none', 'important');
                cell.style.setProperty('border-width', '0', 'important');
                cell.style.setProperty('border-style', 'none', 'important');
                if (cell.classList.contains('bg111-total-words')) {
                    cell.style.textAlign = 'center';
                    cell.style.fontWeight = '700';
                    cell.style.verticalAlign = 'middle';
                }
            } else if (cell.classList.contains('bg111-day-span')) {
                cell.style.setProperty('border', '1px solid #000', 'important');
                cell.style.verticalAlign = 'top';
            } else {
                // คงเส้นกรอบทุกแถวใน Word (รวม day-top/mid/bot + รวมทั้งสิ้น)
                cell.style.setProperty('border', '1px solid #000', 'important');
                if (cell.parentElement && cell.parentElement.classList.contains('bg111-total-row')) {
                    cell.style.setProperty('border-bottom', '1px solid #000', 'important');
                }
                if (cell.classList.contains('bg111-total-num') || cell.classList.contains('bg111-total-sat')) {
                    cell.style.setProperty('border-bottom', '1px solid #000', 'important');
                    cell.style.textAlign = 'center';
                }
                if (cell.classList.contains('bg111-num')) {
                    cell.style.textAlign = 'center';
                }
                if (cell.classList.contains('bg111-total-label')) {
                    cell.style.textAlign = 'center';
                    cell.style.fontWeight = '700';
                }
            }
            if (cell.classList.contains('bg111-noborder')) {
                cell.style.height = isDense ? '1mm' : '2mm';
                cell.style.lineHeight = isDense ? '1mm' : '2mm';
                cell.style.fontSize = '1pt';
            }
        });
        var tbl = page.querySelector('.bg111-table');
        if (tbl) {
            tbl.setAttribute('border', '1');
            tbl.style.borderCollapse = 'collapse';
            tbl.style.border = '1px solid #000';
        }
        var under = page.querySelector('.bg111-under');
        if (under) {
            under.style.border = 'none';
            under.style.marginTop = '2mm';
            under.querySelectorAll('.bg111-cert, .bg111-claim, .bg111-gap, .bg111-total-words').forEach(function (n) {
                n.style.border = 'none';
                n.style.display = 'block';
                n.style.fontSize = fs;
                n.style.lineHeight = lh;
                if (n.classList.contains('bg111-total-words')) {
                    n.style.textAlign = 'center';
                    n.style.fontWeight = '700';
                    n.style.padding = '2px 0';
                }
            });
        }

        var footer = page.querySelector('.bg111-footer');
        if (!footer) return;
        var esc = function (s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        };
        var left = footer.querySelector('.sign-l');
        var right = footer.querySelector('.sign-r');
        if (!left && !right) return;
        var colHtml = function (block) {
            if (!block) return '&nbsp;';
            var parts = [];
            block.querySelectorAll('div').forEach(function (d) {
                parts.push('<div style="text-align:center;font-size:' + fs + ';line-height:1.2;margin:0;padding:0;">' + esc(d.textContent || '') + '</div>');
            });
            return parts.join('') || '&nbsp;';
        };
        footer.className = 'bg111-footer bg111-footer-word';
        footer.style.cssText = 'position:static;height:auto;margin-top:2mm;width:100%;';
        footer.innerHTML =
            '<table width="100%" cellspacing="0" cellpadding="0" style="width:100%;border:none;border-collapse:collapse;">' +
                '<tr>' +
                    '<td width="50%" valign="top" style="border:none;width:50%;text-align:center;vertical-align:top;padding:1mm 2mm;font-size:' + fs + ';">' + colHtml(left) + '</td>' +
                    '<td width="50%" valign="top" style="border:none;width:50%;text-align:center;vertical-align:top;padding:1mm 2mm;font-size:' + fs + ';">' + colHtml(right) + '</td>' +
                '</tr>' +
            '</table>';
        });
    }

    /** Word-safe หมายเหตุ/ลายเซ็น: ตารางแถวละเส้นประ — ข้อความ+การตัดบรรทัดเดียวกับจอ */
    function buildF8708NoteFooterWordHtml() {
        ensureF8708NoteFooterReady();
        const parts = getF8708NoteFooterParts();
        const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const screen = document.getElementById('f8708-note-footer');
        const noteLines = wrapF8708NoteLinesFitted(parts.note, screen);

        /* Word: ตาราง fixed 100% — กันหดตามความยาวข้อความ; เส้นประ = border-bottom เต็มแถว ข้อความนั่งบนเส้นเหมือน PDF */
        const cellStyle =
            'border:none;border-left:none;border-right:none;border-top:none;' +
            'border-bottom:1pt dotted #000;padding:0 0 3.5pt 0;margin:0;height:20pt;line-height:15pt;' +
            'vertical-align:bottom;mso-padding-alt:0pt 0pt 3.5pt 0pt;width:100%;';
        const sigCellStyle =
            'border:none;border-left:none;border-right:none;border-top:none;border-bottom:1pt dotted #000;' +
            'padding:0 0 3.5pt 0;margin:0;height:20pt;line-height:15pt;vertical-align:bottom;mso-padding-alt:0pt 0pt 3.5pt 0pt;width:100%;';
        const sigSpan = (inner) =>
            `<span style="display:inline-block;width:105mm;max-width:100%;text-align:center;border:none;background:transparent;line-height:15pt;vertical-align:bottom;">${inner}</span>`;
        const row = (inner, alignRight, isSig) => {
            const align = alignRight ? 'right' : 'left';
            const st = isSig ? sigCellStyle : cellStyle;
            return `<tr><td width="100%" align="${align}" valign="bottom" style="${st}">${inner || '&nbsp;'}</td></tr>`;
        };

        let rows = '';
        noteLines.forEach((fit) => {
            const st = f8708FitInlineStyle(fit, 'white-space:nowrap');
            rows += row(st ? `<span style="${st}">${esc(fit.text)}</span>` : esc(fit.text), false, false);
        });
        rows += row('&nbsp;', false, false);
        rows += row(sigSpan(esc(parts.sig || '(ลงชื่อ).................................................ผู้ขอเบิก')), true, true);
        rows += row(sigSpan(esc(parts.nameLine || '')), true, true);
        rows += row(sigSpan(esc(parts.posLine || '')), true, true);
        rows += row('&nbsp;', false, false);

        return (
            `<table class="f8708-w-dots" width="100%" border="0" cellspacing="0" cellpadding="0" ` +
            `style="width:100%;max-width:100%;table-layout:fixed;border:none;border-collapse:collapse;` +
            `mso-table-lspace:0pt;mso-table-rspace:0pt;mso-padding-alt:0 0 0 0;">` +
            `<colgroup><col style="width:100%;" /></colgroup>${rows}</table>`
        );
    }

    function buildBg111AndMaps() {
        const tbody = document.getElementById('preview-bg111-body');
        const maps = document.getElementById('preview-map-pages');
        if (!tbody || !maps) return;

        const reg = document.getElementById('in-vehicle-reg')?.value || '........................';
        const from = document.getElementById('in-vehicle-from')?.value || '........................';
        const rate = parseMoney(document.getElementById('in-vehicle-rate')?.value) || 4;
        // บก.111 / หน้างบ / แผนที่: เฉพาะแถวที่ .day-fuel ถูกติ๊ก (ห้ามใช้ทุก travel-day-row)
        const rows = Array.from(document.querySelectorAll('.travel-day-row'))
            .filter(isFuelDayRow)
            .sort(function (a, b) {
                var da = (a.querySelector('.day-date') || {}).value || '';
                var db = (b.querySelector('.day-date') || {}).value || '';
                return dayDateSortKey(da) - dayDateSortKey(db);
            });
        const dayBlockHtmls = [];
        let mapHtml = '';
        let calcSum = 0;
        const fullDates = [];

        const name = personNameFromForm() || '....................';
        const pos = document.getElementById('in-position')?.value || '....................';
        const dept = document.getElementById('in-dept')?.value || '....................';
        const province = document.getElementById('in-province')?.value || '....................';
        const claim = document.getElementById('in-vehicle-claim')?.value || '0';
        const claimAmt = parseMoney(claim);
        const claimText = document.getElementById('in-vehicle-claim-text')?.value || toThaiBahtText(claim);
        const signFull = getVehicleSignDate() || '....................';
        const escAttrLocal = escAttr;
        const nameH = escHtml(name);
        const posH = escHtml(pos);
        const deptH = escHtml(dept);
        const provinceH = escHtml(province);
        const regH = escHtml(reg);
        const fromH = escHtml(from);

        rows.forEach((row) => {
            const dateStr = row.querySelector('.day-date')?.value || '................';
            const dest = row.querySelector('.day-dest')?.value || '................';
            const amount = parseMoney(row.querySelector('.day-amount')?.value);
            /* ใช้เฉพาะ .day-map-data ของแถวนี้ — ห้ามดึง img จากที่อื่นในเอกสาร */
            const rawMap = (row.querySelector('.day-map-data')?.value || '').trim();
            const mapSrc = isOkMapSrc(rawMap) ? rawMap : '';
            calcSum += amount;
            const fullDate = expandDayDateFull(dateStr);
            const fullDateTh = expandDayDateFullThai(dateStr);
            fullDates.push(fullDate);
            const kmRaw = (row.querySelector('.day-km')?.value || '').trim();
            const kmNum = (typeof floorKm === 'function')
                ? floorKm(kmRaw)
                : Math.floor(Math.max(0, parseMoney(kmRaw)));
            const kmShow = (!kmRaw || kmNum === 0) ? '....' : (toThaiNum(kmNum) || String(kmNum));
            const rateTh = rate > 0 ? (toThaiNum(formatMoney(rate)) || formatMoney(rate)) : '....';
            const amtShow = amount ? (toThaiNum(formatMoney(amount)) || formatMoney(amount)) : '';
            const destH = escHtml(dest);

            // 4 แถว/วัน + rowspan ช่องวัน (เก็บเป็นบล็อกต่อวัน เพื่อไม่ให้ตัดวันครึ่งหน้า)
            dayBlockHtmls.push(`
            <tr>
                <td class="bg111-date bg111-day-span" rowspan="4">${fullDateTh}</td>
                <td class="bg111-detail bg111-day-top">ค่าชดเชยพาหนะรถยนต์ส่วนตัว หมายเลขทะเบียน ${regH}</td>
                <td class="bg111-num bg111-day-top">&nbsp;</td>
                <td class="bg111-num bg111-day-top">&nbsp;</td>
                <td class="bg111-num bg111-day-top">&nbsp;</td>
            </tr>
            <tr>
                <td class="bg111-detail bg111-day-mid">จาก ${fromH}</td>
                <td class="bg111-num bg111-day-mid">&nbsp;</td>
                <td class="bg111-num bg111-day-mid">&nbsp;</td>
                <td class="bg111-num bg111-day-mid">&nbsp;</td>
            </tr>
            <tr>
                <td class="bg111-detail bg111-day-mid">ถึง ${destH}</td>
                <td class="bg111-num bg111-day-mid">&nbsp;</td>
                <td class="bg111-num bg111-day-mid">&nbsp;</td>
                <td class="bg111-num bg111-day-mid">&nbsp;</td>
            </tr>
            <tr>
                <td class="bg111-detail bg111-day-bot">ระยะทางไป - กลับ ${kmShow} กิโลเมตร กิโลเมตรละ ${rateTh} บาท&nbsp;&nbsp;เป็นเงิน</td>
                <td class="bg111-num bg111-day-bot">${amtShow}</td>
                <td class="bg111-num bg111-day-bot">-</td>
                <td class="bg111-num bg111-day-bot">&nbsp;</td>
            </tr>`);

            const frameInner = mapSrc
                ? `<img src="${escAttrLocal(mapSrc)}" alt="แผนที่ DOH To Travel">`
                : `วางแผนที่จาก<br>https://dohgis.doh.go.th/dohtotravel/<br>(แนบรูปจากฟอร์มซ้าย)`;

            mapHtml += `
            <br class="doc-pagebreak doc-pagebreak-map" clear="all" style="page-break-before:always;mso-break-type:page-break;mso-special-character:line-break" />
            <div class="page-box page-box-map doc-section-map">
                <div class="map-title">แผนที่ระยะทางสำหรับขอเบิกค่าใช้จ่ายในการเดินทางไปราชการ</div>
                <div class="map-who">ของ ${nameH} ตำแหน่ง ${posH}</div>
                <div class="map-dept">สังกัด${deptH} จังหวัด${provinceH}</div>
                <div class="map-date">วันที่ ${fullDateTh}</div>
                <div class="map-stack">
                    <div class="map-frame">${frameInner}</div>
                    <div class="map-sign">
                        <div class="sig-line">(ลงชื่อ)........................................................ ผู้เบิก</div>
                        <div>(${nameH})</div>
                        <div class="sig-pos">ตำแหน่ง ${posH}</div>
                    </div>
                </div>
            </div>`;
        });

        const vehBudgetZero = rows.length > 0 && calcSum > 0 && claimAmt === 0 && typeof isBudgetCapActive === 'function' && isBudgetCapActive();
        const calcText = calcSum > 0 ? toThaiBahtText(calcSum) : '';
        const calcSumTh = calcSum ? (toThaiNum(formatMoney(calcSum)) || formatMoney(calcSum)) : '';
        const claimFmtRaw = claimAmt > 0 ? (formatMoney(claim) || '') : (vehBudgetZero ? '0' : '');
        const claimThAmt = claimAmt > 0 ? (toThaiNum(claimFmtRaw) || claimFmtRaw) : (vehBudgetZero ? '๐' : '');
        const claimWordsDisp = (claimAmt > 0 || vehBudgetZero) ? (claimText || toThaiBahtText(claimAmt)) : '';
        const signPartsForBg = parseFullThaiDateParts(signFull);
        const signFullTh = (signFull && signPartsForBg.day !== '..')
            ? `${toThaiNum(signPartsForBg.day)} ${signPartsForBg.month} ${toThaiNum(signPartsForBg.year)}`
            : signFull;

        const totalRowHtml = rows.length ? `
            <tr class="bg111-total-row">
                <td class="bg111-date">&nbsp;</td>
                <td class="bg111-total-label">รวมทั้งสิ้น</td>
                <td class="bg111-total-num">${calcSumTh || '&nbsp;'}</td>
                <td class="bg111-total-sat">&nbsp;</td>
                <td class="bg111-num">&nbsp;</td>
            </tr>` : '';

        let underHtml = '';
        if (rows.length) {
            underHtml =
                `<div class="bg111-total-words">รวมทั้งสิ้น&nbsp;&nbsp;(ตัวอักษร)&nbsp;&nbsp;(${escHtml(calcText || '................................')})</div>` +
                `<div class="bg111-gap">&nbsp;</div>` +
                `<div class="bg111-cert">ขอรับรองว่า รายจ่ายข้างต้นนี้ไม่อาจเรียกใบเสร็จรับเงินจากผู้รับได้&nbsp;&nbsp;และข้าพเจ้าได้จ่ายในงานราชการโดยแท้</div>`;
            if (claimAmt > 0 || vehBudgetZero) {
                underHtml +=
                    `<div class="bg111-gap">&nbsp;</div>` +
                    `<div class="bg111-claim">ข้าพเจ้า ขอเบิกเพียง ${claimThAmt} บาท (${escHtml(claimWordsDisp)})</div>`;
            }
        }

        let footerHtml = '';
        if (rows.length) {
            if (claimAmt > 0 || vehBudgetZero) {
                footerHtml += `
            <div class="sign-l">
                <div>ลงชื่อ...........................................................</div>
                <div>(${nameH})</div>
                <div>ตำแหน่ง ${posH}</div>
                <div>วันที่&nbsp;&nbsp;${signFullTh}</div>
            </div>`;
            }
            footerHtml += `
            <div class="sign-r">
                <div>ลงชื่อ.............................................................</div>
                <div>(${nameH})</div>
                <div>ตำแหน่ง ${posH}</div>
                <div>วันที่&nbsp;&nbsp;${signFullTh}</div>
            </div>`;
        }

        // ล้างหน้าต่อ บก.111 เก่าก่อนสร้างใหม่ทุกครั้ง
        document.querySelectorAll('.page-box-bg111-cont, .doc-pagebreak-bg111-cont').forEach(el => el.remove());

        // แบ่งหน้าอัตโนมัติ: เติมหน้าแรกให้เต็ม (~11 วัน/หน้า) ไม่ให้เหลือช่องว่างเยอะ + ล็อกหัวตารางทุกหน้า + ลายเซ็นอยู่หน้าสุดท้ายเท่านั้น
        const MAX_SINGLE_BG = 10;
        const MAX_MID_BG = 11;
        const MAX_LAST_BG = 9;
        const pagesDays = [];
        if (dayBlockHtmls.length <= MAX_SINGLE_BG) {
            pagesDays.push(dayBlockHtmls);
        } else {
            let idx = 0;
            while (idx < dayBlockHtmls.length) {
                const rem = dayBlockHtmls.length - idx;
                if (rem <= MAX_LAST_BG) {
                    pagesDays.push(dayBlockHtmls.slice(idx));
                    break;
                }
                const take = Math.min(MAX_MID_BG, rem - 1);
                pagesDays.push(dayBlockHtmls.slice(idx, idx + take));
                idx += take;
            }
        }

        const isMultiPageBg = pagesDays.length > 1;
        const pageBg = document.getElementById('page-bg111');
        const under = document.getElementById('bg111-under');
        let footer = document.getElementById('bg111-footer');
        if (!footer && pageBg) {
            footer = document.createElement('div');
            footer.id = 'bg111-footer';
            footer.className = 'bg111-footer';
            pageBg.appendChild(footer);
        }

        const firstBodyHtml = (pagesDays[0] || []).join('') + (isMultiPageBg ? '' : totalRowHtml);
        tbody.innerHTML = firstBodyHtml || `<tr><td colspan="5" class="bg111-num">ยังไม่มีวันที่ติ๊กเบิกน้ำมัน</td></tr>`;
        if (under) under.innerHTML = isMultiPageBg ? '' : underHtml;
        if (footer) footer.innerHTML = isMultiPageBg ? '' : footerHtml;

        if (pageBg) {
            pageBg.style.display = rows.length ? '' : 'none';
            pageBg.classList.remove('bg111-roomy', 'bg111-compact', 'bg111-dense', 'bg111-overflow');
            if (!isMultiPageBg) {
                if (rows.length <= 6) pageBg.classList.add('bg111-roomy');
                else pageBg.classList.add('bg111-compact');
            } else {
                pageBg.classList.add('bg111-compact');
            }

            // สร้างหน้าต่อของ บก.111 (หน้า 2..N) โดยล็อกหัวเอกสารและหัวตารางครบทุกหน้า และวางยอดรวม+ลายเซ็นเฉพาะหน้าสุดท้าย
            if (isMultiPageBg && rows.length) {
                const officeDisp = escHtml((document.getElementById('in-office')?.value || '').trim() || DEFAULT_OFFICE);
                let anchor = pageBg;
                for (let p = 1; p < pagesDays.length; p++) {
                    const isLast = (p === pagesDays.length - 1);
                    const br = document.createElement('br');
                    br.className = 'doc-pagebreak doc-pagebreak-bg111 doc-pagebreak-bg111-cont';
                    br.setAttribute('clear', 'all');
                    br.setAttribute('style', 'page-break-before:always;mso-break-type:page-break;mso-special-character:line-break');

                    const cont = document.createElement('div');
                    const contDensity = (isLast && pagesDays[p].length >= 9) ? 'bg111-dense' : 'bg111-compact';
                    cont.className = 'page-box page-box-bg111 page-box-bg111-cont doc-section-bg111 ' + contDensity;
                    cont.innerHTML = `
                        <div class="bg111-head">
                            <div class="bg111-title-right">แบบ บก.๑๑๑</div>
                            <div class="bg111-title-center">ใบรับรองแทนใบเสร็จรับเงิน</div>
                            <div class="bg111-title-center">ส่วนราชการ&nbsp;&nbsp;<span class="dyn-office">${officeDisp}</span></div>
                        </div>
                        <table class="bg111-table" border="1" cellspacing="0" cellpadding="0">
                            <colgroup>
                                <col class="c-date"><col class="c-detail"><col class="c-baht"><col class="c-sat"><col class="c-note">
                            </colgroup>
                            <tbody>
                                <tr>
                                    <th rowspan="2" class="bg111-h">วัน เดือน ปี</th>
                                    <th rowspan="2" class="bg111-h">รายละเอียดการจ่าย</th>
                                    <th colspan="2" class="bg111-h">จำนวนเงิน</th>
                                    <th rowspan="2" class="bg111-h">หมาย<br>เหตุ</th>
                                </tr>
                                <tr>
                                    <th class="bg111-h">บาท</th>
                                    <th class="bg111-h">ส.ต.</th>
                                </tr>
                            </tbody>
                            <tbody>${pagesDays[p].join('')}${isLast ? totalRowHtml : ''}</tbody>
                        </table>
                        ${isLast ? `<div class="bg111-under">${underHtml}</div><div class="bg111-footer">${footerHtml}</div>` : ''}
                    `;
                    anchor.insertAdjacentElement('afterend', br);
                    br.insertAdjacentElement('afterend', cont);
                    anchor = cont;
                }
            }
        }
        const pageCover = document.getElementById('page-vehicle-cover');
        if (pageCover) pageCover.style.display = rows.length ? '' : 'none';
        document.body.classList.toggle('no-vehicle', rows.length === 0);
        ensureDocFilterMatchesVehicle();

        maps.innerHTML = mapHtml;

        const claimFmt = claimFmtRaw;
        const claimTextDisp = (claimAmt > 0 || vehBudgetZero) ? claimWordsDisp : '';
        const calcTextDisp = calcSum > 0 ? calcText : '';
        document.querySelectorAll('.dyn-vehicle-claim').forEach(el => el.textContent = claimFmt);
        document.querySelectorAll('.dyn-vehicle-claim-text').forEach(el => el.textContent = claimTextDisp);
        document.querySelectorAll('.dyn-vehicle-calc-text').forEach(el => el.textContent = calcTextDisp);

        // หน้างบ: เลขไทย — ค่าศูนย์ปกติไม่ใส่ ๐ (เว้นแต่ถูกจำกัดจากงบเหลือ 0)
        const claimTh = (claimAmt > 0 || vehBudgetZero) ? (claimThAmt || '') : '';
        const daysTh = rows.length > 0 ? (toThaiNum(rows.length) || '') : '';
        document.querySelectorAll('.dyn-cover-claim').forEach(el => el.textContent = claimTh);
        document.querySelectorAll('.dyn-cover-claim-text').forEach(el => el.textContent = claimTextDisp);

    function formatTravelDayLabel(d) {
        const day = d.getDate();

    /** นับ/ลิสต์วันใช้ได้ตามกฎเดิม: ไม่นับ อา.(0) จ.(1) ส.(6) */
    function listEligibleTravelDates(startDate, endDate, skipWeekdays) {
        const skip = skipWeekdays || BUDGET_SKIP_WEEKDAYS;
        const dates = [];
        let currentDate = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
        const end = new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate());
        while (currentDate <= end) {
            if (skip.indexOf(currentDate.getDay()) === -1) {
                dates.push(new Date(currentDate.getTime()));
            }
            currentDate.setDate(currentDate.getDate() + 1);
        }
        return dates;
    }

    function fillTravelDaysFromDateObjs(dateObjs) {
        const depTime = document.getElementById('in-dep-time')?.value || '09.00';
        const retTime = document.getElementById('in-ret-time')?.value || '16.00';
        const workStart = '09.00';
        const workEnd = '16.00';
        const list = document.getElementById('travel-days-list');
        if (!list) return;
        list.innerHTML = '';
        (dateObjs || []).forEach((dObj, i) => {
            const dateStr = (dObj instanceof Date) ? formatTravelDayLabel(dObj) : String(dObj);
            const isFirst = i === 0;
            const isLast = i === dateObjs.length - 1;
            let tOut = workStart;
            let tIn = workEnd;
            if (isFirst && isLast) {
                tOut = depTime;
                tIn = retTime;
            } else if (isFirst) {
                tOut = depTime;
                tIn = workEnd;
            } else if (isLast) {
                tOut = workStart;
                tIn = retTime;
            } else {
                const rnd = randomMiddleDayTimes();
                tOut = rnd.tOut;
                tIn = rnd.tIn;
            }
            list.appendChild(createTravelDayRow({
                date: dateStr,
                out: tOut,
                inn: tIn,
                sum: calcTimeDiff(tOut, tIn)
            }));
        });
        document.querySelectorAll('.travel-day-row').forEach((row, index) => {
            const num = row.querySelector('.row-num');
            if (num) num.textContent = (index + 1) + '.';
        });
    }

    function parseTravelDateToJsDate(dateStr) {
        const s = toArabicDigits(dateStr || '').trim();
        const parts = s.split(/\s+/);
        if (parts.length < 3) return null;
        const d = parseInt(parts[0], 10);
        const mStr = parts[1];
        let yStr = parts[2].replace(/[^\d]/g, '');
        if (!d || !yStr) return null;
        if (yStr.length === 2) yStr = '25' + yStr;
        const yBe = parseInt(yStr, 10);
        let mIdx = thaiMonthsAbbr.indexOf(mStr);
        if (mIdx === -1) mIdx = thaiMonthsFull.indexOf(mStr);
        if (mIdx === -1 || !yBe) return null;
        const dt = new Date(yBe - 543, mIdx, d);
        if (isNaN(dt.getTime()) || dt.getMonth() !== mIdx || dt.getDate() !== d) return null;
        return dt;
    }

    function isTravelDateMonday(dateStr) {
        const dt = parseTravelDateToJsDate(dateStr);
        return !!(dt && dt.getDay() === 1);
    }

    function refreshMondayBadges() {
        const rows = document.querySelectorAll('.travel-day-row');
        let monCount = 0;
        rows.forEach(row => {
            const dateVal = row.querySelector('.day-date')?.value || '';
            const isMon = isTravelDateMonday(dateVal);
            if (isMon) monCount++;
            let badge = row.querySelector('.day-monday-badge');
            if (isMon) {
                if (!badge) {
                    badge = document.createElement('div');
                    badge.className = 'day-monday-badge no-print text-[10px] font-semibold text-rose-800 bg-rose-50 border border-rose-200 rounded px-2 py-0.5 inline-flex items-center gap-1';
                    badge.textContent = '🚫 วันจันทร์ — ไม่นับเบี้ยเลี้ยงอัตโนมัติ';
                    const meta = row.querySelector('.travel-day-meta');
                    if (meta) meta.insertAdjacentElement('afterend', badge);
                    else row.prepend(badge);
                }
            } else if (badge) {
                badge.remove();
            }
        });
        return monCount;
    }

    function syncRowsToSummaryAndTotals() {
        _budgetJustRecordedHold = false;
        const rows = document.querySelectorAll('.travel-day-row');
        const count = rows.length;
        const monCount = refreshMondayBadges();
        const allowCount = Math.max(0, count - monCount);

        const setVal = (id, v) => {
            const el = document.getElementById(id);
            if (el) el.value = v;
        };
        setVal('in-total-days', count);
        setVal('in-allowance-days', allowCount);
        setVal('in-rate-days', allowCount);

        const rate = parseMoney(document.getElementById('in-rate')?.value);
        const totalMoney = Math.round(rate * allowCount);

        setVal('in-rate-total', formatMoney(totalMoney));
        setVal('in-rate-total-text', toThaiBahtText(totalMoney));

        applyAllowanceBudgetCap();

        let groups = {};
        rows.forEach(row => {
            const dateEl = row.querySelector('.day-date');
            let dateStr = toArabicDigits(dateEl && dateEl.value ? dateEl.value : '').trim();
            let parts = dateStr.split(/\s+/);
            if (parts.length >= 3) {
                let d = parts[0];
                let mStr = parts[1];
                let yStr = parts[2].replace(/[^\d]/g, '');

                if (yStr.length === 2) yStr = '25' + yStr;
                let mIdx = thaiMonthsAbbr.indexOf(mStr);
                if (mIdx === -1) mIdx = thaiMonthsFull.indexOf(mStr);
                if (mIdx !== -1) mStr = thaiMonthsFull[mIdx];

                let key = `${mStr} ${yStr}`;
                if (!groups[key]) groups[key] = [];
                groups[key].push(d);
            }
        });

        let summaryParts = [];
        for (let key in groups) {
            let days = groups[key].slice();
            let dayStr = '';
            if (days.length === 1) {
                dayStr = days[0];
            } else if (days.length > 1) {
                let last = days.pop();
                dayStr = days.join(', ') + ' และ ' + last;
            }
            summaryParts.push(`${dayStr} ${key}`);
        }

        if (summaryParts.length > 0) {
            setVal('in-travel-dates-summary', summaryParts.join(' และ '));
        } else {
            setVal('in-travel-dates-summary', '');
        }

        recalcVehicleFromDays(true);
    }

    function loadBudgetProfileObject(yearBe, month, personName) {
        const key = getBudgetStorageKey(yearBe, month, personName);
        try {
            const raw = __sidaLS.getItem(key);
            if (!raw) return emptyBudgetProfile({ yearBe, month, personName: personName || getBudgetPersonName() });
            const data = JSON.parse(raw);
            if (!Array.isArray(data.ledger)) data.ledger = [];
            if (!Array.isArray(data.skipWeekdays)) data.skipWeekdays = BUDGET_SKIP_WEEKDAYS.slice();
            if (data.prevUsed == null) data.prevUsed = 0;
            if (data.fuelRate == null) data.fuelRate = 4;
            if (typeof data.capEnabled !== 'boolean') data.capEnabled = true;
            data.personName = data.personName || personName || getBudgetPersonName();
            return data;
        } catch (e) {
            return emptyBudgetProfile({ yearBe, month, personName: personName || getBudgetPersonName() });
        }
    }

    function sumBudgetLedgerUsed(profile) {
        const ledger = (profile && profile.ledger) || [];
        return ledger.reduce((s, e) => s + (parseMoney(e.allowanceClaim) + parseMoney(e.vehicleClaim)), 0);
    }

    function getBudgetSummarySnapshot() {
        const fields = readBudgetFieldsFromUI();
        const profile = loadBudgetProfileObject(fields.yearBe, fields.month, fields.personName);
        const ledgerUsed = sumBudgetLedgerUsed(profile);
        const prevUsed = Math.max(0, parseMoney(fields.prevUsed));
        const totalUsed = prevUsed + ledgerUsed;
        const ceilingSpecified = isBudgetCeilingSpecified();
        const ceiling = ceilingSpecified ? Math.max(0, parseMoney(fields.ceilingTotal)) : null;
        const remain = ceilingSpecified ? Math.max(0, ceiling - totalUsed) : Infinity;
        return {
            fields,
            profile,
            ceilingSpecified,
            ceiling,
            prevUsed,
            ledgerUsed,
            monthUsed: ledgerUsed,
            totalUsed,
            remain
        };
    }

    function getAllowanceBudgetCap() {
        const cutMode = document.getElementById('in-budget-cut-priority')?.value || 'vehicle-first';
        if (cutMode === 'manual') return null;
        const snap = getBudgetSummarySnapshot();
        const ceilAllowSet = snap.fields.ceilingAllowance !== '' && snap.fields.ceilingAllowance != null;
        const capActive = isBudgetCapActive();
        if (!capActive && !ceilAllowSet) return null;

        let cap = (capActive && snap.ceilingSpecified) ? Math.max(0, snap.remain) : Infinity;
        if (cutMode === 'allowance-first' && isFinite(cap)) {
            const vehCalc = parseMoney(document.getElementById('in-vehicle-calc-total')?.value);
            const vehClaimEl = document.getElementById('in-vehicle-claim');
            const vehTarget = hasVehicleClaim() ? (vehClaimEl?.dataset.manual === '1' ? parseMoney(vehClaimEl.value) : vehCalc) : 0;
            cap = Math.max(0, cap - vehTarget);
        }
        if (ceilAllowSet) {
            cap = Math.min(cap, Math.max(0, parseMoney(snap.fields.ceilingAllowance)));
        }
        return isFinite(cap) ? Math.round(cap) : null;
    }

    function applyAllowanceBudgetCap() {
        const calcEl = document.getElementById('in-rate-total');
        const claimEl = document.getElementById('in-rate-claim');
        const rateTextEl = document.getElementById('in-rate-text');
        const allowTotalEl = document.getElementById('in-allowance-total');
        const syncClaim = document.getElementById('in-sync-claim');
        if (!calcEl || !claimEl) return;

        const calcTotal = Math.round(parseMoney(calcEl.value));
        const cap = getAllowanceBudgetCap();
        const isAuto = (!syncClaim || syncClaim.checked) && claimEl.dataset.manual !== '1';

        let nextClaim;
        if (isAuto) {
            nextClaim = calcTotal;
            if (cap != null) nextClaim = Math.min(nextClaim, cap);
        } else {
            nextClaim = Math.round(parseMoney(claimEl.value));
            if (calcTotal > 0 && nextClaim > calcTotal) nextClaim = calcTotal;
            if (cap != null && nextClaim > cap) nextClaim = cap;
        }
        nextClaim = Math.max(0, nextClaim);

        claimEl.dataset.budgetCapped = (cap != null && nextClaim < calcTotal) ? '1' : '0';
        if (document.activeElement !== claimEl) claimEl.value = formatMoney(nextClaim);
        if (rateTextEl) rateTextEl.value = toThaiBahtText(nextClaim);
        if (allowTotalEl && document.activeElement !== allowTotalEl) allowTotalEl.value = formatMoney(nextClaim);
    }

    function findLatestPriorBudgetProfile(yearBe, month, personName) {
        const targetPerson = personName || getBudgetPersonName();
        const targetYm = yearBe * 12 + month;
        let best = null;
        let bestYm = -1;
        try {
            for (let i = 0; i < __sidaLS.length; i++) {
                const k = __sidaLS.key(i);
                if (!k || k.indexOf(BUDGET_PROFILE_PREFIX) !== 0) continue;
                const raw = __sidaLS.getItem(k);
                if (!raw) continue;
                let data;
                try { data = JSON.parse(raw); } catch (e) { continue; }
                if (!data) continue;
                if ((data.personName || '') !== targetPerson) continue;
                const py = parseInt(data.yearBe, 10) || 0;
                const pm = parseInt(data.month, 10) || 0;
                if (!py || !pm) continue;
                const ym = py * 12 + pm;
                if (ym >= targetYm) continue;
                const hasCeiling = data.ceilingTotal !== '' && data.ceilingTotal != null;
                const usedInThatMonth = (parseMoney(data.prevUsed) || 0) + sumBudgetLedgerUsed(data);
                if (!hasCeiling && usedInThatMonth <= 0) continue;
                if (ym > bestYm) {
                    bestYm = ym;
                    best = data;
                }
            }
        } catch (e) { /* ignore */ }
        return best;
    }

    function syncBudgetMonthFromTrip(silent) {
        const dep = parseDateStr(

            document.getElementById('in-dep-my')?.value
        );
        if (!dep) return false;
        const month = dep.getMonth() + 1;

        const mEl = document.getElementById('in-budget-month');
        const yEl = document.getElementById('in-budget-year');
        if (!mEl || !yEl) return false;
        const changed = String(mEl.value) !== String(month) || String(parseIntThai(yEl.value, 0)) !== String(yearBe);
        if (changed) {
            mEl.value = String(month);
            yEl.value = String(yearBe);
            if (!silent && !_inBudgetProfileChange) onBudgetProfileChange('month');
        }
        return changed;
    }

    function onBudgetProfileChange(reason) {
        if (_inBudgetProfileChange) return;
        _inBudgetProfileChange = true;
        try {
            _budgetJustRecordedHold = false;
            reason = reason || 'month';
            const { month, yearBe } = getBudgetYearMonthFromUI();
            const personName = getBudgetPersonName();
            const key = getBudgetStorageKey(yearBe, month, personName);
            const had = !!__sidaLS.getItem(key);
            const prevEl = document.getElementById('in-budget-prev-used');

            if (had) {
                const profile = loadBudgetProfileObject(yearBe, month, personName);
                applyBudgetFieldsToUI(profile);
                if (prevEl) prevEl.dataset.manual = '0';
            } else {
                const prior = findLatestPriorBudgetProfile(yearBe, month, personName);
                if (reason === 'person') {
                    if (prevEl) prevEl.dataset.manual = '0';
                    if (prior) {
                        const priorUsed = Math.max(0, parseMoney(prior.prevUsed)) + sumBudgetLedgerUsed(prior);
                        applyBudgetFieldsToUI(emptyBudgetProfile({
                            yearBe,
                            month,
                            personName,
                            ratePerDay: prior.ratePerDay != null ? prior.ratePerDay : 120,
                            fuelRate: prior.fuelRate != null ? prior.fuelRate : 4,
                            ceilingTotal: (prior.ceilingTotal === '' || prior.ceilingTotal == null) ? '' : prior.ceilingTotal,
                            prevUsed: priorUsed,
                            capEnabled: prior.capEnabled !== false,
                            carryFrom: {
                                yearBe: prior.yearBe,
                                month: prior.month,
                                ceilingTotal: prior.ceilingTotal,
                                prevUsed: priorUsed
                            }
                        }));
                    } else {
                        const curVehRate = parseMoney(document.getElementById('in-vehicle-rate')?.value) || 4;
                        applyBudgetFieldsToUI(emptyBudgetProfile({ yearBe, month, personName, fuelRate: curVehRate }));
                    }
                } else {
                    if (prior && (!prevEl || prevEl.dataset.manual !== '1')) {
                        const priorUsed = Math.max(0, parseMoney(prior.prevUsed)) + sumBudgetLedgerUsed(prior);
                        const carried = emptyBudgetProfile({
                            yearBe,
                            month,
                            personName,
                            ratePerDay: prior.ratePerDay != null ? prior.ratePerDay : 120,
                            fuelRate: prior.fuelRate != null ? prior.fuelRate : 4,
                            ceilingTotal: (prior.ceilingTotal === '' || prior.ceilingTotal == null) ? '' : prior.ceilingTotal,
                            prevUsed: priorUsed,
                            capEnabled: prior.capEnabled !== false,
                            carryFrom: {
                                yearBe: prior.yearBe,
                                month: prior.month,
                                ceilingTotal: prior.ceilingTotal,
                                prevUsed: priorUsed
                            }
                        });
                        applyBudgetFieldsToUI(carried);
                        try {
                            __sidaLS.setItem(key, JSON.stringify(carried));
                        } catch (e) { /* ignore */ }
                        if (prevEl) prevEl.dataset.manual = '0';
                    } else {
                        applyBudgetFieldsToUI(Object.assign(emptyBudgetProfile(), readBudgetFieldsFromUI()));
                    }
                }
            }
            syncExpensesAfterBudgetChange();
            refreshBudgetStatusUI();
            scheduleSave();
        } finally {
            _inBudgetProfileChange = false;
        }
    }

    function getBudgetMonthBounds(yearBe, month) {
        const y = yearBe - 543;
        const start = new Date(y, month - 1, 1);
        const end = new Date(y, month, 0);
        return { start, end };
    }

    function tripDatesOutsideBudgetMonth(startDate, endDate, yearBe, month) {
        if (!startDate || !endDate) return false;
        const { start, end } = getBudgetMonthBounds(yearBe, month);
        const s = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
        const e = new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate());
        return s < start || e > end;
    }

        const bounds = getBudgetMonthBounds(fields.yearBe, fields.month);

        if (!startDate || !endDate || startDate > endDate) {
            // ถ้ายังไม่มีช่วงวัน — ใช้ทั้งเดือนงบ
            startDate = bounds.start;
            endDate = bounds.end;
            document.getElementById('in-dep-day').value = String(startDate.getDate());
            document.getElementById('in-dep-my').value = thaiMonthsFull[startDate.getMonth()] + ' ' + fields.yearBe;
            document.getElementById('in-ret-day').value = String(endDate.getDate());
            document.getElementById('in-ret-my').value = thaiMonthsFull[endDate.getMonth()] + ' ' + fields.yearBe;
            if (typeof syncAllBePickerLabels === 'function') syncAllBePickerLabels();
        }

        const skip = profile.skipWeekdays || BUDGET_SKIP_WEEKDAYS;
        let eligible = listEligibleTravelDates(startDate, endDate, skip);
        if (!eligible.length) {
            alert('ไม่พบวันใช้ได้ในช่วงที่เลือก (ข้าม จ./ส./อา.)');
            refreshBudgetStatusUI();
            return;
        }

        let maxDaysByMoney = Math.floor(remainTotal / rate);
        if (fields.ceilingAllowance !== '' && fields.ceilingAllowance != null) {
            maxDaysByMoney = Math.min(maxDaysByMoney, Math.floor(parseMoney(fields.ceilingAllowance) / rate));
        }
        if (mode === 'vehicle-partial' && maxDaysByMoney < 1 && remainTotal > 0) {
            maxDaysByMoney = 0;
        }

        let useDays = Math.min(eligible.length, Math.max(0, maxDaysByMoney));
        if (mode === 'allowance' || mode === 'full') {
            if (useDays < 1) {
                alert('เงินเบิกคงเหลือไม่พอสำหรับอย่างน้อย 1 วัน (อัตรา ' + formatMoney(rate) + ' บาท/วัน · คงเหลือ ' + formatMoney(Math.round(remainTotal)) + ' บาท)');
                refreshBudgetStatusUI();
                return;
            }
        }

        if (useDays > 0) {
            fillTravelDaysFromDateObjs(eligible.slice(0, useDays));
        }

        document.getElementById('in-rate').value = formatMoney(rate);
        document.getElementById('in-budget-rate').value = formatMoney(rate);
        if (fields.fuelRate > 0) {
            document.getElementById('in-vehicle-rate').value = formatMoney(fields.fuelRate);
        }
        const syncClaim = document.getElementById('in-sync-claim');
        if (syncClaim) syncClaim.checked = true;
        const rateClaimEl = document.getElementById('in-rate-claim');
        if (rateClaimEl) rateClaimEl.dataset.manual = '0';

        const allowanceClaim = useDays * rate;
        if (useDays > 0) {
            syncRowsToSummaryAndTotals();
        } else {
            document.getElementById('in-rate-days').value = '0';
            document.getElementById('in-allowance-days').value = '0';
            document.getElementById('in-rate-total').value = '0';
            document.getElementById('in-rate-total-text').value = toThaiBahtText(0);
            document.getElementById('in-rate-claim').value = '0';
            document.getElementById('in-rate-text').value = toThaiBahtText(0);
            document.getElementById('in-allowance-total').value = '0';
        }

        let vehicleSuggest = Math.max(0, remainTotal - allowanceClaim);
        if (fields.ceilingVehicle !== '' && fields.ceilingVehicle != null) {
            vehicleSuggest = Math.min(vehicleSuggest, parseMoney(fields.ceilingVehicle));
        }

        const claimEl = document.getElementById('in-vehicle-claim');
        if (mode === 'allowance') {
            vehicleSuggest = 0;
            document.querySelectorAll('.travel-day-row').forEach(row => {
                const fuel = row.querySelector('.day-fuel');
                const km = row.querySelector('.day-km');
                const amt = row.querySelector('.day-amount');
                if (fuel) setFuelUserChoice(fuel, false);
                if (km) km.value = '';
                if (amt) amt.value = '';
            });
            document.getElementById('in-vehicle-calc-total').value = '0';
            if (claimEl) {
                claimEl.value = '0';
                claimEl.dataset.manual = '0';
                claimEl.dataset.budgetCapped = '0';
                claimEl.dataset.tied = '1';
                delete claimEl.dataset.budgetTarget;
            }
            document.getElementById('in-vehicle-claim-text').value = toThaiBahtText(0);
            document.getElementById('in-vehicle-total').value = '0';
        } else if (mode === 'full') {
            const calc = parseMoney(document.getElementById('in-vehicle-calc-total')?.value);
            let target = vehicleSuggest;
            if (calc > 0) target = Math.min(calc, vehicleSuggest);
            if (claimEl) {
                claimEl.dataset.manual = '0';
                claimEl.dataset.budgetTarget = String(Math.round(vehicleSuggest));
                if (calc > 0) {
                    claimEl.value = formatMoney(Math.round(target));
                    claimEl.dataset.budgetCapped = (target < calc) ? '1' : '0';
                    claimEl.dataset.tied = (target === calc) ? '1' : '0';
                    document.getElementById('in-vehicle-claim-text').value = toThaiBahtText(target);
                    document.getElementById('in-vehicle-total').value = formatMoney(Math.round(target));
                } else {
                    claimEl.value = formatMoney(0);
                    claimEl.dataset.budgetCapped = '0';
                    claimEl.dataset.tied = '1';
                    document.getElementById('in-vehicle-claim-text').value = toThaiBahtText(0);
                    document.getElementById('in-vehicle-total').value = '0';
                }
            }
        } else {
            if (useDays === 0) {
                const existingCount = document.querySelectorAll('.travel-day-row').length;
                if (existingCount > 0) {
                    document.getElementById('in-total-days').value = String(existingCount);
                    document.getElementById('in-allowance-days').value = String(existingCount);
                    document.getElementById('in-rate-days').value = String(existingCount);
                    const rateNow = parseMoney(document.getElementById('in-rate')?.value) || rate;
                    const calcAllow = rateNow * existingCount;
                    document.getElementById('in-rate-total').value = formatMoney(calcAllow);
                    document.getElementById('in-rate-total-text').value = toThaiBahtText(calcAllow);
                    document.getElementById('in-rate-claim').value = formatMoney(0);
                    if (rateClaimEl) rateClaimEl.dataset.manual = '1';
                    document.getElementById('in-rate-text').value = toThaiBahtText(0);
                    document.getElementById('in-allowance-total').value = formatMoney(0);
                }
            }
            if (claimEl) {
                claimEl.dataset.manual = '0';
                claimEl.dataset.budgetTarget = String(Math.round(vehicleSuggest));
                const calc = parseMoney(document.getElementById('in-vehicle-calc-total')?.value);
                if (calc > 0) {
                    const target = Math.min(calc, Math.round(vehicleSuggest));
                    claimEl.value = formatMoney(target);
                    claimEl.dataset.budgetCapped = (target < calc) ? '1' : '0';
                    claimEl.dataset.tied = (target === calc) ? '1' : '0';
                    document.getElementById('in-vehicle-claim-text').value = toThaiBahtText(target);
                    document.getElementById('in-vehicle-total').value = formatMoney(target);
                } else {
                    claimEl.value = formatMoney(0);
                    claimEl.dataset.budgetCapped = '0';
                    claimEl.dataset.tied = '1';
                    document.getElementById('in-vehicle-claim-text').value = toThaiBahtText(0);
                    document.getElementById('in-vehicle-total').value = '0';
                }
            }
        }

        recalcVehicleFromDays(false);
        refreshBudgetStatusUI();

        const outside = tripDatesOutsideBudgetMonth(startDate, endDate, fields.yearBe, fields.month);
        let msg = 'จัดสรรแล้ว ' + useDays + ' วัน · เบี้ย ' + formatMoney(allowanceClaim) + ' บาท';
        if (mode !== 'allowance') msg += ' · เป้าพาหนะ ' + formatMoney(Math.round(vehicleSuggest)) + ' บาท';
        if (outside) msg += ' (⚠ วันหลุดนอกเดือนงบ)';
        showToast(msg);
    }

    function attachRowListeners(row) {
        if (!row) return;
        const outInput = row.querySelector('.day-out');
        const inInput = row.querySelector('.day-in');
        const sumInput = row.querySelector('.day-sum');
        const dateInput = row.querySelector('.day-date');
        const kmInput = row.querySelector('.day-km');
        const amtInput = row.querySelector('.day-amount');
        const destInput = row.querySelector('.day-dest');
        const fuelInput = row.querySelector('.day-fuel');

        row.addEventListener('focusin', () => markMapPasteRow(row));
        row.addEventListener('pointerdown', () => markMapPasteRow(row));

        const calculateSum = () => {
            if (!outInput || !inInput || !sumInput) return;
            const calculated = calcTimeDiff(outInput.value, inInput.value);
            if (calculated !== "-") sumInput.value = calculated;
            updatePreview();
            scheduleSave();
        };

        if (outInput) {
            outInput.addEventListener('input', () => {
                syncDayRowsToTripTimes(outInput);
                calculateSum();
            });
        }
        if (inInput) {
            inInput.addEventListener('input', () => {
                syncDayRowsToTripTimes(inInput);
                calculateSum();
            });
        }
        const padTime = (el) => {
            if (!el) return;
            el.addEventListener('blur', () => {
                const n = normalizeTimeStr(el.value);
                if (n && n !== el.value) {
                    el.value = n;
                    calculateSum();
                    syncDayRowsToTripTimes(el);
                }
            });
        };
        padTime(outInput);
        padTime(inInput);
        padTime(sumInput);
        if (dateInput) dateInput.addEventListener('input', syncRowsToSummaryAndTotals);
        if (kmInput) {
            kmInput.addEventListener('input', () => {
                const hintEl = row.querySelector('.day-km-hint');
                if (hintEl && /^(PDF |ระยะเต็ม)/.test(hintEl.textContent || '')) {
                    hintEl.textContent = '';
                    hintEl.classList.add('hidden');
                }
                // กรอกกม. แล้วติ๊กเบิกน้ำมันให้อัตโนมัติ — ยกเว้นผู้ใช้เคยกดยกเลิกเอง
                if (canAutoCheckFuel(fuelInput) && parseMoney(kmInput.value) > 0) {
                    setFuelUserChoice(fuelInput, true);
                }
                recalcVehicleFromDays(true);
                updatePreview();
                scheduleSave();
            });
            kmInput.addEventListener('blur', () => {
                const raw = (kmInput.value || '').trim();
                if (!raw || raw === '-' || !/[\d๐-๙]/.test(raw)) return;
                const floored = (typeof floorKm === 'function')
                    ? floorKm(raw)
                    : Math.floor(Math.max(0, parseMoney(raw)));
                if (String(floored) !== raw) {
                    kmInput.value = String(floored);
                }
                const hintEl = row.querySelector('.day-km-hint');
                if (hintEl && !/^(PDF |ระยะเต็ม)/.test(hintEl.textContent || '')) {
                    hintEl.textContent = '';
                    hintEl.classList.add('hidden');
                }
                recalcVehicleFromDays(true);
                updatePreview();
                scheduleSave();
            });
        }
        if (amtInput) {
            amtInput.addEventListener('input', () => {
                if (canAutoCheckFuel(fuelInput) && parseMoney(amtInput.value) > 0) {
                    setFuelUserChoice(fuelInput, true);
                }
                recalcVehicleFromDays(true);
                updatePreview();
                scheduleSave();
            });
            amtInput.addEventListener('blur', () => {
                if (amtInput.value === '' || amtInput.value === '-') return;
                const f = formatMoney(amtInput.value);
                if (f !== '' && f !== amtInput.value) amtInput.value = f;
                updatePreview();
                scheduleSave();
            });
        }
        if (destInput) {
            destInput.addEventListener('input', () => {
                const parsedOrder = parseDestOrderFromText(destInput.value);
                setRowDestOrder(row, parsedOrder);
                row.dataset.dohCopied = '{}';
                if (window.__tvDoh && typeof window.__tvDoh.renderRowDohStops === 'function') {
                    window.__tvDoh.renderRowDohStops(row);
                }
                updatePreview();
                scheduleSave();
            });
        }
        if (fuelInput) fuelInput.addEventListener('change', () => onDayFuelChange(fuelInput));
    }

    function moveTravelDay(btn, dir) {
        const row = btn && btn.closest ? btn.closest('.travel-day-row') : null;
        const list = document.getElementById('travel-days-list');
        if (!row || !list) return;
        const sibling = dir < 0 ? row.previousElementSibling : row.nextElementSibling;
        if (!sibling || !sibling.classList.contains('travel-day-row')) return;
        if (window.__jobMgr && typeof window.__jobMgr.pushHistoryNow === 'function') {
            window.__jobMgr.pushHistoryNow('เลื่อนลำดับวัน');
        }
        if (dir < 0) list.insertBefore(row, sibling);
        else list.insertBefore(sibling, row);
        renumberTravelDays();
        syncRowsToSummaryAndTotals();
        row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function sortTravelDaysByDate() {
        const list = document.getElementById('travel-days-list');
        if (!list) return;
        const rows = Array.from(list.querySelectorAll('.travel-day-row'));
        if (rows.length <= 1) return;
        if (window.__jobMgr && typeof window.__jobMgr.pushHistoryNow === 'function') {
            window.__jobMgr.pushHistoryNow('เรียงวันตามปฏิทิน');
        }
        rows.sort(function (a, b) {
            const da = (a.querySelector('.day-date') || {}).value || '';
            const db = (b.querySelector('.day-date') || {}).value || '';
            const ka = da.trim() ? dayDateSortKey(da) : 99999999;
            const kb = db.trim() ? dayDateSortKey(db) : 99999999;
            return ka - kb;
        });
        rows.forEach(r => list.appendChild(r));
        renumberTravelDays();
        syncRowsToSummaryAndTotals();
        if (typeof showToast === 'function') showToast('📅 เรียงลำดับวันตามปฏิทิน (1 → 31) เรียบร้อยแล้ว');
    }

    function removeTravelDay(btn) {

        if (!row) return;
        const list = document.getElementById('travel-days-list');
        const count = list ? list.querySelectorAll('.travel-day-row').length : 0;

        });
        syncRowsToSummaryAndTotals();
    }

    /** mm → px ตามเรนเดอร์จริงของเบราว์เซอร์ */
    function mmToPx(mm) {
        const d = document.createElement('div');
        d.style.cssText = 'position:absolute;left:-99999px;top:0;height:' + mm + 'mm;width:1px;visibility:hidden;pointer-events:none;';
        document.body.appendChild(d);
        const px = d.offsetHeight;
        d.remove();
        return px || (mm * 96 / 25.4);
    }

    /** ความสูงจริงของ .page-box (ไม่บังคับ min-height 297mm) */
    function measurePageBoxHeight(pageEl) {
        if (!pageEl) return 0;
        const prevMin = pageEl.style.minHeight;
        const prevH = pageEl.style.height;
        const prevOv = pageEl.style.overflow;
        pageEl.style.minHeight = '0';
        pageEl.style.height = 'auto';
        pageEl.style.overflow = 'visible';
        const h = pageEl.getBoundingClientRect().height;
        pageEl.style.minHeight = prevMin;
        pageEl.style.height = prevH;
        pageEl.style.overflow = prevOv;
        return h;
    }

    /**
     * ถ้าหมายเหตุ+รายวัน+ขอเบิกสูงเกิน 1 หน้า A4 (ขอบบน 1.5cm / ล่าง 2cm)
     * → แยกเป็น .page-box ต่อเนื่อง (padding เดียวกัน) แล้ววางบล็อกขอเบิก/ลายเซ็นที่หน้าสุดท้าย
     */
    function layout8708DetailPages() {
        const main = document.getElementById('page-8708-detail');
        const daysHost = document.getElementById('preview-travel-days');
        const claim = document.getElementById('p3-claim-block');
        if (!main || !daysHost || !claim) return;

        remove8708DetailContinuations();
        clearPageBoxLock(main);
        if (claim.parentElement !== main) main.appendChild(claim);
        claim.hidden = false;

        const dayNodes = Array.prototype.slice.call(daysHost.querySelectorAll('.p3-day-line'));
        setDayNodesIn(daysHost, dayNodes);

        const a4 = mmToPx(297);
        const fits = function (pageEl) {
            return measurePageBoxHeight(pageEl) <= a4 + 1.5;
        };

        if (!dayNodes.length || fits(main)) {
            clearPageBoxLock(main);
            return;
        }

        // แยกหน้า: ใส่รายวันก่อน แล้วค่อยวางขอเบิกที่หน้าสุดท้าย
        claim.hidden = true;

        function maxDaysFit(pageEl, host, nodes, withClaim) {
            claim.hidden = !withClaim;
            if (withClaim && claim.parentElement !== pageEl) pageEl.appendChild(claim);
            if (!withClaim && claim.parentElement === pageEl && pageEl !== main) {
                main.appendChild(claim);
            }
            if (!nodes.length) {
                setDayNodesIn(host, []);
                return 0;
            }
            let lo = 0;
            let hi = nodes.length;
            while (lo < hi) {
                const mid = Math.ceil((lo + hi) / 2);
                setDayNodesIn(host, nodes.slice(0, mid));
                if (fits(pageEl)) lo = mid;
                else hi = mid - 1;
            }
            setDayNodesIn(host, nodes.slice(0, lo));
            return lo;
        }

        let remaining = dayNodes.slice();
        let n = maxDaysFit(main, daysHost, remaining, false);
        if (n === 0 && remaining.length) {
            n = 1;
            setDayNodesIn(daysHost, remaining.slice(0, 1));
        }
        remaining = remaining.slice(n);
        lockPageBoxToA4(main, a4);

        let insertAfter = main;
        while (remaining.length) {
            const cont = make8708DetailContinuation();
            insertAfter.after(cont.br);
            cont.br.after(cont.page);

            // ลองใส่ทั้งที่เหลือ + ขอเบิกในหน้านี้
            setDayNodesIn(cont.daysHost, remaining);
            cont.page.appendChild(claim);
            claim.hidden = false;
            if (fits(cont.page)) {
                remaining = [];
                lockPageBoxToA4(cont.page, a4);
                insertAfter = cont.page;
                break;
            }

            // ไม่พอ — ใส่เฉพาะรายวัน แล้วค่อยตัดสินใจเรื่องขอเบิก
            main.appendChild(claim);
            claim.hidden = true;
            n = maxDaysFit(cont.page, cont.daysHost, remaining, false);
            if (n === 0) n = 1;
            setDayNodesIn(cont.daysHost, remaining.slice(0, n));
            remaining = remaining.slice(n);
            insertAfter = cont.page;

            if (!remaining.length) {
                cont.page.appendChild(claim);
                claim.hidden = false;
                if (fits(cont.page)) {
                    lockPageBoxToA4(cont.page, a4);
                } else {
                    main.appendChild(claim);
                    claim.hidden = true;
                    lockPageBoxToA4(cont.page, a4);
                    const claimOnly = make8708DetailContinuation();
                    set8708ClaimContLabel(claimOnly.page);
                    insertAfter.after(claimOnly.br);
                    claimOnly.br.after(claimOnly.page);
                    claimOnly.page.appendChild(claim);
                    claim.hidden = false;
                    lockPageBoxToA4(claimOnly.page, a4);
                    insertAfter = claimOnly.page;
                }
            } else {
                lockPageBoxToA4(cont.page, a4);
            }
        }

        // รายวันจบที่หน้าแรก — วางขอเบิกที่หน้าแรกถ้าพอ ไม่พอก็เปิดหน้าต่อ
        if (claim.hidden || (claim.parentElement === main && remaining.length === 0)) {
            claim.hidden = false;
            if (claim.parentElement !== main) main.appendChild(claim);
            clearPageBoxLock(main);
            if (fits(main)) {
                /* ขอเบิกอยู่หน้าแรกได้ */
            } else {
                lockPageBoxToA4(main, a4);
                const claimOnly = make8708DetailContinuation();
                set8708ClaimContLabel(claimOnly.page);
                insertAfter.after(claimOnly.br);
                claimOnly.br.after(claimOnly.page);
                claimOnly.page.appendChild(claim);
                lockPageBoxToA4(claimOnly.page, a4);
            }
        }
    }

    /** หา/สร้าง .doc-page-num เป็นลูกตรงของ .page-box (วางหัวแผ่นสำหรับ Word flow) */
    function ensureDocPageNumEl(page) {
        let el = null;
        for (let c = 0; c < page.children.length; c++) {
            if (page.children[c].classList && page.children[c].classList.contains('doc-page-num')) {
                el = page.children[c];
                break;
            }
        }
        if (!el) {
            el = document.createElement('div');
            el.className = 'doc-page-num';
        }
        if (page.firstChild !== el) {
            page.insertBefore(el, page.firstChild);
        }
        return el;
    }

    function removeDocPageNumEl(page) {
        for (let c = page.children.length - 1; c >= 0; c--) {
            if (page.children[c].classList && page.children[c].classList.contains('doc-page-num')) {
                page.children[c].remove();
            }
        }
    }

    /**
     * เลขหน้าเฉพาะแบบ 8708 — หน้าแรกไม่มีเลข; หน้า 2 ขึ้นต้นที่ ๒ …
     * ไม่ใส่เลขบน บก.111 / หน้างบ / แผนที่
     * รูปแบบ: - ๒ -  (กลางขอบบน ในระยะ ~0.55cm จากขอบกระดาษ)
     */
    function updatePackPageNumbers() {
        const root = document.getElementById('word-content');
        if (!root) return;
        const all = root.querySelectorAll('.page-box');
        let f8708 = 0;
        Array.prototype.forEach.call(all, function (p) {
            const is8708 = p.classList.contains('doc-section-8708');
            if (!is8708) {
                removeDocPageNumEl(p);
                return;
            }
            f8708 += 1;
            if (f8708 === 1) {
                removeDocPageNumEl(p);
                return;
            }
            const el = ensureDocPageNumEl(p);
            el.textContent = '- ' + toThaiNum(f8708) + ' -';
        });
    }

    /** วาดเลขหน้าบนแคนวาส PDF — มุมบนกลาง (เริ่มตั้งแต่หน้า 2 เป็นต้นไป; หน้า 1 ไม่ใส่เลขหน้า) */
    function stampPdfPageNumber(canvas, pageNo) {
        if (!pageNo || pageNo < 2) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        const text = '- ' + toThaiNum(pageNo) + ' -';
        const fontPx = Math.max(16, Math.round(canvas.width * (14 / 595.3)));
        ctx.save();
        ctx.font = fontPx + 'px "TH SarabunIT๙", "TH SarabunPSK", "Sarabun", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        /* 0.55cm จากขอบบน — สเกลจากความกว้าง A4 210mm */
        const y = Math.round(canvas.width * (5.5 / 210));
        const band = Math.round(fontPx * 1.6);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, Math.max(0, y - band / 2), canvas.width, band);
        ctx.fillStyle = '#000000';
        ctx.fillText(text, canvas.width / 2, y);
        ctx.restore();
    }

    function collectFormState() {
        const data = { fields: {}, radios: {}, travelDays: [], autoGrand: true, budgetKey: '', claimMeta: {} };
        document.querySelectorAll('#doc-form input[id], #doc-form select[id], #doc-form textarea[id], [data-fw-section] input[id], [data-fw-section] select[id], [data-fw-section] textarea[id]').forEach(el => {
            if (el.type === 'checkbox') data.fields[el.id] = el.checked;
            else if (el.type !== 'radio' && el.type !== 'date' && el.type !== 'file') data.fields[el.id] = el.value;
        });
        data.autoGrand = !!(document.getElementById('in-auto-grand') && document.getElementById('in-auto-grand').checked);
        data.budgetKey = (typeof getBudgetStorageKey === 'function') ? getBudgetStorageKey() : '';
        const claimEl = document.getElementById('in-vehicle-claim');
        const rateClaimEl = document.getElementById('in-rate-claim');
        const prevUsedEl = document.getElementById('in-budget-prev-used');
        data.claimMeta = {
            hasMeta: true,
            dateSeedVer: 2,
            manual: claimEl ? (claimEl.dataset.manual || '0') : '0',
            allowManual: rateClaimEl ? (rateClaimEl.dataset.manual || '0') : '0',
            prevUsedManual: prevUsedEl ? (prevUsedEl.dataset.manual || '0') : '0',
            tied: claimEl ? (claimEl.dataset.tied || '1') : '1',
            budgetTarget: claimEl ? (claimEl.dataset.budgetTarget || '') : ''
        };
        ['depart_from', 'return_to', 'claim_for'].forEach(name => {
            const checked = document.querySelector(`input[name="${name}"]:checked`);
            if (checked) data.radios[name] = checked.value;
        });
        document.querySelectorAll('.travel-day-row').forEach(row => {
            const fuelEl = row.querySelector('.day-fuel');
            const rawMap = row.querySelector('.day-map-data')?.value || '';
            const destVal = row.querySelector('.day-dest')?.value || '';
            let destOrder = getRowDestOrder(row);
            if (!destOrder.length && destVal) destOrder = parseDestOrderFromText(destVal);
            let customStops = [];
            try {
                if (row.dataset.customStops) {
                    const parsedCs = JSON.parse(row.dataset.customStops);
                    if (Array.isArray(parsedCs)) customStops = parsedCs;
                }
            } catch (e) { /* ignore */ }
            let tvMeta = null;
            try {
                if (row.dataset.tvMeta) tvMeta = JSON.parse(row.dataset.tvMeta);
            } catch (e) { /* ignore */ }
            const rawKm = (row.querySelector('.day-km')?.value || '').trim();
            const saveKm = rawKm
                ? (/[\d๐-๙]/.test(rawKm) ? String(typeof floorKm === 'function' ? floorKm(rawKm) : Math.floor(Math.max(0, parseMoney(rawKm)))) : '')
                : '';
            data.travelDays.push({
                date: row.querySelector('.day-date')?.value || '',
                out: row.querySelector('.day-out')?.value || '',
                inn: row.querySelector('.day-in')?.value || '',
                sum: row.querySelector('.day-sum')?.value || '',
                dest: destVal,
                destOrder: destOrder,
                customStops: customStops,
                tvMeta: tvMeta,
                km: saveKm,
                amount: row.querySelector('.day-amount')?.value || '',
                fuel: !!(fuelEl && fuelEl.checked),
                fuelUser: fuelEl ? (fuelEl.dataset.fuelUser || (fuelEl.checked ? '1' : '')) : '',
                dohOpened: row.dataset.dohOpened === '1',
                mapDataUrl: isPersistableMapSrc(rawMap) ? rawMap : ''
            });
        });
        return data;
    }

    function normalizeOfficeName(val) {
        const v = (val || '').trim();
        if (!v || OLD_OFFICE_ALIASES.includes(v)) return DEFAULT_OFFICE;
        return v;
