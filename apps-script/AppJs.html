    function applyFormState(data) {
        if (!data) return;
        Object.keys(data.fields || {}).forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            if (el.type === 'checkbox') el.checked = !!data.fields[id];
            else {
                if (id === 'in-name' && data.fields[id]) {
                    const v = String(data.fields[id]).trim();
                    if (v && !Array.from(el.options).some(o => o.value === v)) {
                        const opt = document.createElement('option');
                        opt.value = v;
                        opt.textContent = v;
                        el.appendChild(opt);
                    }
                }
                el.value = data.fields[id];
            }
        });
        const flds = data.fields || {};
        const meta = data.claimMeta || {};
        const hasDec68TravelRows = Array.isArray(data.travelDays) &&
            data.travelDays.some(d => /ธ\.ค\.\s*68|ธันวาคม\s*2568/.test(String(d && d.date || '')));
        if (!meta.dateSeedVer && !hasDec68TravelRows) {
            const legacyDoc =
                String(flds['in-doc-day'] || '').trim() === '9' &&
                String(flds['in-doc-month'] || '').trim() === 'มกราคม' &&
                String(flds['in-doc-year'] || '').trim() === '2569';
            const legacyTrip =
                String(flds['in-dep-day'] || '').trim() === '16' &&
                String(flds['in-dep-my'] || '').trim() === 'ธันวาคม 2568' &&
                String(flds['in-ret-day'] || '').trim() === '23' &&
                String(flds['in-ret-my'] || '').trim() === 'ธันวาคม 2568';
            if ((legacyDoc || legacyTrip) && typeof applyCurrentDateDefaults === 'function') {
                applyCurrentDateDefaults(new Date(), { doc: legacyDoc, trip: legacyTrip, budget: false });
            }
            if (legacyTrip && String(flds['in-travel-dates-summary'] || '').trim() === '16, 17, 19 และ 23 ธันวาคม 2568') {
                const sumEl = document.getElementById('in-travel-dates-summary');
                if (sumEl) sumEl.value = '';
            }
        }
        if (!data.fields || data.fields['in-budget-fuel-rate'] === undefined) {
            const bf = document.getElementById('in-budget-fuel-rate');
            const vr = document.getElementById('in-vehicle-rate');
            if (bf && vr) bf.value = vr.value || '4';
        }
        // ล็อกพื้นที่เฉพาะอำเภอสีดา จังหวัดนครราชสีมา
        const ampEl = document.getElementById('in-amphoe');
        if (ampEl) ampEl.value = ORG.amphoe || 'สีดา';
        const provEl = document.getElementById('in-province');
        if (provEl) provEl.value = ORG.province || 'นครราชสีมา';
        // บังคับแก้ชื่อที่ทำการเก่าที่ค้างในฉบับร่าง + เติมชื่อผู้ตรวจสอบ/เกษตรอำเภอเริ่มต้นหากว่าง
        const officeEl = document.getElementById('in-office');
        if (officeEl) officeEl.value = normalizeOfficeName(officeEl.value);
        const chkNameEl = document.getElementById('in-chk-name');
        if (chkNameEl && !chkNameEl.value.trim() && ORG && ORG.checkerName) chkNameEl.value = ORG.checkerName;
        const chkPosEl = document.getElementById('in-chk-pos');
        if (chkPosEl && !chkPosEl.value.trim() && ORG && ORG.checkerPos) chkPosEl.value = ORG.checkerPos;
        const bossNameEl = document.getElementById('in-boss-name');
        if (bossNameEl && !bossNameEl.value.trim() && ORG && ORG.bossName) bossNameEl.value = ORG.bossName;
        const bossPosEl = document.getElementById('in-boss-pos');
        if (bossPosEl && !bossPosEl.value.trim() && ORG && ORG.bossTitle) bossPosEl.value = ORG.bossTitle;
        if (typeof data.autoGrand === 'boolean') {
            const ag = document.getElementById('in-auto-grand');
            if (ag) ag.checked = data.autoGrand;
        }
        Object.keys(data.radios || {}).forEach(name => {
            const el = document.querySelector(`input[name="${name}"][value="${data.radios[name]}"]`);
            if (el) el.checked = true;
        });
        if (Array.isArray(data.travelDays)) {
            const list = document.getElementById('travel-days-list');
            if (list) {
                list.innerHTML = '';
                if (data.travelDays.length) {
                    data.travelDays.forEach((day) => {
                        list.appendChild(createTravelDayRow(day));
                    });
                } else {
                    list.appendChild(createTravelDayRow({ date: '', out: '09.00', inn: '16.00', sum: '7.00' }));
                }
                document.querySelectorAll('.travel-day-row').forEach((row, index) => {
                    const num = row.querySelector('.row-num');
                    if (num) num.textContent = (index + 1) + '.';
                });
            }
        }
        // ซิงค์เบี้ยเลี้ยงและพาหนะจากฉบับร่าง — แยกกรณีผู้ใช้แก้เอง vs ระบบจำกัดตามงบ
        const claimEl = document.getElementById('in-vehicle-claim');
        const rateClaimEl = document.getElementById('in-rate-claim');
        const prevUsedEl = document.getElementById('in-budget-prev-used');
        const savedClaim = parseMoney(claimEl?.value);
        const savedAllowClaim = parseMoney(rateClaimEl?.value);
        if (rateClaimEl) rateClaimEl.dataset.manual = meta.allowManual === '1' ? '1' : '0';
        if (prevUsedEl) prevUsedEl.dataset.manual = meta.prevUsedManual === '1' ? '1' : '0';
        if (claimEl) {
            claimEl.dataset.manual = meta.manual === '1' ? '1' : '0';
            if (meta.budgetTarget) claimEl.dataset.budgetTarget = String(meta.budgetTarget);
        }

        if (typeof applyAllowanceBudgetCap === 'function') applyAllowanceBudgetCap();
        const calcAllow = parseMoney(document.getElementById('in-rate-total')?.value);
        if (rateClaimEl && meta.allowManual === '1' && savedAllowClaim >= 0 && (calcAllow <= 0 || savedAllowClaim <= calcAllow)) {
            const capAllow = (typeof getAllowanceBudgetCap === 'function') ? getAllowanceBudgetCap() : null;
            const finalAllow = (capAllow != null) ? Math.min(savedAllowClaim, capAllow) : savedAllowClaim;
            rateClaimEl.value = formatMoney(finalAllow);
            const rateTextEl = document.getElementById('in-rate-text');
            const allowTotalEl = document.getElementById('in-allowance-total');
            if (rateTextEl) rateTextEl.value = toThaiBahtText(finalAllow);
            if (allowTotalEl) allowTotalEl.value = formatMoney(finalAllow);
        }

        recalcVehicleFromDays(false);
        const calcNow = parseMoney(document.getElementById('in-vehicle-calc-total')?.value);
        const capActiveNow = (typeof isBudgetCapActive === 'function') && isBudgetCapActive();
        const vehManual = meta.manual === '1' || (!meta.hasMeta && savedClaim > 0 && savedClaim < calcNow && !capActiveNow);
        if (claimEl && calcNow > 0 && vehManual && savedClaim >= 0 && savedClaim <= calcNow) {
            const vehCap = (typeof computeVehicleBudgetSuggest === 'function') ? computeVehicleBudgetSuggest() : null;
            const finalVeh = (vehCap != null) ? Math.min(savedClaim, vehCap) : savedClaim;
            claimEl.value = formatMoney(finalVeh);
            claimEl.dataset.manual = '1';
            claimEl.dataset.tied = (finalVeh === calcNow) ? '1' : '0';
            if (meta.budgetTarget) claimEl.dataset.budgetTarget = String(meta.budgetTarget);
            const claimTextEl = document.getElementById('in-vehicle-claim-text');
            const vehTotalEl = document.getElementById('in-vehicle-total');
            if (claimTextEl) claimTextEl.value = toThaiBahtText(finalVeh);
            if (vehTotalEl) vehTotalEl.value = formatMoney(finalVeh);
            recalcAllExpenses(true);
        } else if (claimEl && !vehManual) {
            claimEl.dataset.manual = '0';
        }
        if (typeof syncAllBePickerLabels === 'function') syncAllBePickerLabels();
        if (typeof refreshMondayBadges === 'function') refreshMondayBadges();
        if (typeof refreshBudgetStatusUI === 'function') refreshBudgetStatusUI();
        updatePreview();
    }

    function saveDraft(showMsg) {
        try {
            __sidaLS.setItem(DRAFT_KEY, JSON.stringify(collectFormState()));
            if (showMsg) showToast('บันทึกฉบับร่างแล้ว');

            // แผนที่ dataURL ใหญ่เกินโควต้า → ลองตัดรูปแล้วบันทึกต่อ
            try {

                let stripped = 0;
                (data.travelDays || []).forEach(d => {
                    if (d.mapDataUrl) { d.mapDataUrl = ''; stripped++; }
                });
                data._mapsOmitted = stripped > 0;
                __sidaLS.setItem(DRAFT_KEY, JSON.stringify(data));
                showToast(stripped
                    ? 'พื้นที่เก็บเต็ม — บันทึกแล้วแต่ตัดรูปแผนที่ออก ' + stripped + ' วัน'
                    : 'บันทึกฉบับร่างแล้ว');
            } catch (e2) {
                if (showMsg) showToast('บันทึกไม่สำเร็จ (พื้นที่เบราว์เซอร์เต็ม)');

        }
    }

    function sanitizeFilenamePart(s) {
        return String(s || '')
            .replace(/[\\/:*?"<>|]/g, '')
            .trim()
            .replace(/\s+/g, '_');
    }

    /** ชื่อไฟล์ดาวน์โหลด: ชื่อคนขอเบิก_เดือน_ปี (พ.ศ.) — ใช้เดือนงบเป็นหลัก ไม่งบใช้เดือนเอกสาร */
    function buildDownloadFilename(ext) {
        ext = (ext || 'doc').replace(/^\./, '');
        let name = personNameFromForm();
        if (!name) name = 'ผู้เบิก';

        let month = '';
        let year = '';
        const budgetMonthNum = parseInt(document.getElementById('in-budget-month')?.value, 10);
        const budgetYear = String(document.getElementById('in-budget-year')?.value || '').trim().replace(/[^\d]/g, '');
        if (budgetMonthNum >= 1 && budgetMonthNum <= 12 && budgetYear) {
            month = thaiMonthsFull[budgetMonthNum - 1];
            year = budgetYear;
        } else {
            month = (document.getElementById('in-doc-month')?.value || '').trim();
            year = String(document.getElementById('in-doc-year')?.value || '').trim().replace(/[^\d]/g, '');
        }
        if (!month) month = 'ไม่ระบุเดือน';
        if (!year) year = String(new Date().getFullYear() + 543);

        return [name, month, year].map(sanitizeFilenamePart).filter(Boolean).join('_') + '.' + ext;
    }

    /**

     * ไม่พึ่ง @media print ของแอปหลัก (แถบมือถือ/flex shell ทับ cascade)

     */
    var _printOpening = false;

    function _printAbsUrl(href) {
        try { return new URL(href, location.href).href; } catch (e) { return href; }
    }

    function _printBaseHref() {
        try {
            var u = new URL('.', location.href);
            var s = u.href;
            return /\/$/.test(s) ? s : (s + '/');
        } catch (e) {
            return location.href.replace(/[#?].*$/, '').replace(/[^/]+$/, '');
        }
    }

    function _clonePageBoxForPrint(src) {
        var c = src.cloneNode(true);
        c.removeAttribute('id');
        c.querySelectorAll('[id]').forEach(function (el) { el.removeAttribute('id'); });
        c.querySelectorAll('.no-print, .f8708-narrative-toolbar, .p3-intro-toolbar').forEach(function (n) {
            n.remove();
        });
        c.querySelectorAll('[contenteditable]').forEach(function (n) {
            n.removeAttribute('contenteditable');
            n.removeAttribute('spellcheck');
            n.removeAttribute('title');
            if (n.style) {
                n.style.boxShadow = '';
                n.style.background = '';
            }
        });
        c.querySelectorAll('img[src]').forEach(function (img) {
            var s = img.getAttribute('src');
            if (s && !/^(data:|blob:)/i.test(s)) img.setAttribute('src', _printAbsUrl(s));
        });
        c.style.setProperty('display', 'block', 'important');
        c.style.setProperty('visibility', 'visible', 'important');
        c.style.setProperty('width', '210mm', 'important');
        c.style.setProperty('margin', '0', 'important');
        c.style.setProperty('box-shadow', 'none', 'important');
        c.style.setProperty('transform', 'none', 'important');
        return c;
    }

    function _buildIsolatedPrintHeadHtml() {
        var parts = [];
        var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;'); };
        parts.push('<meta charset="UTF-8">');
        parts.push('<meta name="viewport" content="width=device-width, initial-scale=1">');
        parts.push('<title>พิมพ์เอกสาร</title>');
        if (/^https?:/i.test(location.protocol)) parts.push('<base href="' + esc(_printBaseHref()) + '">');
        parts.push('<style>:root{--form-font:\'TH SarabunIT๙\',\'TH SarabunPSK\',\'TH Sarabun New\',\'Sarabun\',sans-serif;}</style>');
        Array.prototype.forEach.call(document.querySelectorAll('link[rel="stylesheet"]'), function (link) {
            var href = link.getAttribute('href');
            if (!href) return;
            parts.push('<link rel="stylesheet" href="' + esc(_printAbsUrl(href)) + '">');
        });
        Array.prototype.forEach.call(document.querySelectorAll('style'), function (st) {
            var css = st.textContent || '';
            if (!css.trim()) return;
            parts.push('<style>' + css.replace(/<\/style/gi, '<\\/style') + '</style>');
        });
        /* ล็อกท้ายสุด — A4 + page-break / ไม่มี chrome */
        parts.push(
            '<style id="isolated-print-lock">' +
            '@page{size:A4 portrait;margin:0;}' +
            'html,body{margin:0!important;padding:0!important;background:#fff!important;' +
            'width:auto!important;height:auto!important;max-height:none!important;' +
            'overflow:visible!important;font-family:var(--form-font)!important;}' +
            '.mobile-action-bar,header,.form-area,.no-print,#toast,.f8708-narrative-toolbar,' +
            '.p3-intro-toolbar,#pdf-export-stage,.th-be-pop,.doc-tab-btn,' +
            '.preview-area>.no-print,.preview-area>.sticky{display:none!important;visibility:hidden!important;}' +
            '.page-box{display:block!important;visibility:visible!important;' +
            'width:210mm!important;max-width:210mm!important;' +
            'height:297mm!important;min-height:297mm!important;max-height:none!important;' +
            'padding:1.5cm 1.5cm 2cm 2.15cm!important;margin:0!important;' +
            'box-shadow:none!important;transform:none!important;overflow:visible!important;' +
            'box-sizing:border-box!important;background:#fff!important;color:#000!important;' +
            'font-family:var(--form-font)!important;' +
            'page-break-after:always;break-after:page;' +
            'page-break-before:auto;break-before:auto;}' +
            '.page-box:last-child{page-break-after:auto!important;break-after:auto!important;}' +
            '.page-box-bg111{min-height:0!important;height:auto!important;}' +
            '.page-box-bg111.bg111-overflow,.page-box-map{height:auto!important;min-height:297mm!important;}' +

            '</style>'
        );
        return parts.join('\n');
    }

    function _openIsolatedPrintTarget() {
        var w = null;
        try { w = window.open('', '_blank'); } catch (e) { w = null; }
        if (w) return { win: w, iframe: null };
        var iframe = document.createElement('iframe');
        iframe.setAttribute('aria-hidden', 'true');

    async function printDocument() {
        if (_printOpening) return;

        var restore = {
            mode: body.classList.contains('filter-8708') ? '8708'
                : body.classList.contains('filter-bg111') ? 'bg111'

                : 'all',
            hidePreview: !!(appMain && appMain.classList.contains('mobile-hide-preview')),
            hideForm: !!(appMain && appMain.classList.contains('mobile-hide-form'))
        };
        var applyRestore = function () {
            try { switchDocFilter(restore.mode); } catch (e) { /* ignore */ }
            if (!appMain) return;
            if (restore.hidePreview) {
                appMain.classList.add('mobile-hide-preview');
                appMain.classList.remove('mobile-hide-form');
            } else if (restore.hideForm) {
                appMain.classList.add('mobile-hide-form');
                appMain.classList.remove('mobile-hide-preview');
            } else {
                appMain.classList.remove('mobile-hide-preview', 'mobile-hide-form');
            }
        };
        var target = null;
        var released = false;
        var release = function () {
            if (released) return;
            released = true;
            _printOpening = false;
            if (target && target.iframe && target.iframe.parentNode) {
                try { target.iframe.parentNode.removeChild(target.iframe); } catch (e) { /* ignore */ }
            }
        };

        try {
            try {
                ensureF8708BodyNarrativeFitted();
                ensureF8708NoteFooterReady();
                ensureF8708P3IntroReady();
            } catch (e) { /* จัดข้อความพลาดก็พิมพ์ต่อ */ }

            /* แสดงทุกแผ่น + เปิดพรีวิว (เคารพ body.no-vehicle ผ่าน CSS display:none) */
            body.classList.remove('filter-8708', 'filter-bg111', 'filter-vehicle');
            if (appMain) appMain.classList.remove('mobile-hide-preview');
            try { if (typeof updatePreview === 'function') updatePreview(); } catch (e) { /* ignore */ }
            try { if (typeof layout8708DetailPages === 'function') layout8708DetailPages(); } catch (e) { /* ignore */ }
            await new Promise(function (r) {
                requestAnimationFrame(function () { requestAnimationFrame(r); });
            });

            var root = document.getElementById('word-content');
            var boxes = root ? Array.prototype.filter.call(
                root.querySelectorAll('.page-box'),
                function (el) { return el.offsetParent !== null && el.getClientRects().length > 0; }
            ) : [];
            if (!boxes.length) {
                showToast('ไม่มีหน้าเอกสารให้พิมพ์');
                applyRestore();
                release();
                return;
            }

            target = _openIsolatedPrintTarget();
            if (!target.win || !target.win.document) {
                showToast('เปิดหน้าต่างพิมพ์ไม่ได้ — อนุญาตป๊อปอัปแล้วลองใหม่');
                applyRestore();
                release();
                return;
            }

            var doc = target.win.document;
            doc.open();
            doc.write(
                '<!DOCTYPE html><html lang="th"><head>' +
                _buildIsolatedPrintHeadHtml() +
                '</head><body><div id="word-content" class="isolated-print-root"></div></body></html>'
            );
            doc.close();

            var mount = doc.getElementById('word-content') || doc.body;
            boxes.forEach(function (b) {
                mount.appendChild(_clonePageBoxForPrint(b));
            });

            /* คืนแท็บ/ฟิลเตอร์แอปหลักทันที — หน้าต่างพิมพ์แยกแล้ว */
            applyRestore();

            var doPrint = function () {
                try {
                    target.win.focus();
                    target.win.print();
                } catch (err) {
                    showToast('พิมพ์ไม่สำเร็จ — ลองปุ่มพิมพ์อีกครั้ง');
                    if (target.win && !target.iframe) {
                        try { target.win.close(); } catch (e2) { /* ignore */ }
                    }
                    release();
                    return;
                }
                if (!target.iframe) {
                    try {
                        target.win.addEventListener('afterprint', function () {
                            try { target.win.close(); } catch (e) { /* ignore */ }
                            release();
                        });
                    } catch (e) { /* ignore */ }
                    setTimeout(function () {
                        try { target.win.close(); } catch (e) { /* ignore */ }
                        release();
                    }, 120000);
                } else {
                    try { target.win.addEventListener('afterprint', release); } catch (e) { /* ignore */ }
                    setTimeout(release, 120000);
                }
            };

            var fontsReady = (doc.fonts && doc.fonts.ready) ? doc.fonts.ready : Promise.resolve();
            fontsReady
                .then(function () {
                    return Promise.all(Array.prototype.map.call(doc.images || [], function (im) {
                        return (im.decode ? im.decode() : Promise.resolve()).catch(function () {});
                    }));
                })
                .then(function () {
                    return new Promise(function (r) {
                        requestAnimationFrame(function () { requestAnimationFrame(r); });
                    });
                })
                .then(doPrint)
                .catch(doPrint);
        } catch (err) {
            console.error('[printDocument]', err);
            showToast('พิมพ์ไม่สำเร็จ — ลองใหม่อีกครั้ง');
            try { applyRestore(); } catch (e2) { /* ignore */ }
            release();
        }
    }

    /**
     * แบ่งแคนวาสของแผ่นที่สูงเกิน 1 หน้า A4 (เช่น บก.111 ≥14 วัน) เป็นหลายหน้า
     * เลือกจุดตัดตรงแถวพิกเซลที่ "มืดน้อยที่สุด" ในช่วงท้ายหน้า → ไม่ผ่ากลางบรรทัดตัวหนังสือ
     * (แถวที่มีแต่เส้นตารางแนวตั้งมีจุดมืดไม่กี่จุด ส่วนแถวที่มีตัวหนังสือมืดหลายร้อยจุด)
     */
    function slicePdfPageCanvas(canvas, pageHpx) {
        // สูงเกินนิดเดียว (คลาดเคลื่อนจากปัด px) = ย่อให้พอดีหน้าเดียวเหมือนเดิม
        if (canvas.height <= pageHpx * 1.02) return [canvas];
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const slices = [];
        let y = 0;
        while (y < canvas.height) {
            let end = Math.min(y + pageHpx, canvas.height);
            if (end < canvas.height) {
                // หา "แถวว่าง" ในช่วง 25% ท้ายหน้า เพื่อเป็นรอยตัดที่ไม่โดนตัวหนังสือ
                const from = Math.max(y + Math.floor(pageHpx * 0.6), end - Math.floor(pageHpx * 0.25));
                const img = ctx.getImageData(0, from, canvas.width, end - from).data;
                let bestRow = end, bestDark = Infinity;
                for (let row = end - from - 1; row >= 0; row--) {
                    let dark = 0;
                    const base = row * canvas.width * 4;
                    for (let px = 0; px < canvas.width; px++) {
                        const o = base + px * 4;
                        if (img[o] < 220 || img[o + 1] < 220 || img[o + 2] < 220) {
                            dark++;
                            if (dark >= bestDark) break;
                        }
                    }
                    if (dark < bestDark) {
                        bestDark = dark;
                        bestRow = from + row + 1;
                        if (dark === 0) break; // แถวขาวล้วน = จุดตัดสมบูรณ์
                    }
                }
                end = bestRow;
            }
            const part = document.createElement('canvas');
            part.width = canvas.width;
            part.height = end - y;
            part.getContext('2d').drawImage(canvas, 0, y, canvas.width, end - y, 0, 0, canvas.width, end - y);
            slices.push(part);
            y = end;
        }
        return slices;
    }

    /**
     * ดาวน์โหลด PDF ของชุดเอกสาร (8708 + บก.111 + หน้างบ + แผนที่)
     * แนวคิด: โคลนเฉพาะแผ่นเอกสาร (.page-box) ที่มองเห็น ไปไว้ใน "เวทีนอกจอ" ขนาด A4 คงที่
     * (#pdf-export-stage — ไม่โดน media query จอแคบ / สกรอลล์ / ฟิลเตอร์แท็บ) แล้วรอฟอนต์+รูปพร้อม
     * ก่อนเรนเดอร์ทีละแผ่นด้วย html2canvas → วางลง jsPDF แผ่นละ 1 หน้า A4 (210×297มม.) ตรงตามพรีวิว
     * ทำงานแบบออฟไลน์ได้ (ไลบรารีอยู่ใน vendor/) และแสดง toast ระหว่างสร้าง
     */
    async function downloadPdf() {
        const btn = document.getElementById('btn-download-pdf');
        const btnMobile = document.getElementById('btn-download-pdf-mobile');
        const setPdfBusy = function (busy) {
            if (btn) btn.disabled = !!busy;
            if (btnMobile) btnMobile.disabled = !!busy;
        };
        const jsPDFCtor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
        if (typeof window.html2canvas !== 'function' || typeof jsPDFCtor !== 'function') {
            showToast('โหลดตัวสร้าง PDF ไม่สำเร็จ — ลองต่อเน็ตแล้วรีเฟรช');
            return;
        }

        const body = document.body;
        const appMain = document.getElementById('app-main');
        const restore = {
            f8708: body.classList.contains('filter-8708'),
            bg111: body.classList.contains('filter-bg111'),
            vehicle: body.classList.contains('filter-vehicle'),
            // จอมือถือ: แท็บ "กรอกฟอร์ม" ซ่อนพรีวิวทั้งแผง → ต้องเปิดชั่วคราวไม่งั้นไม่พบแผ่นเอกสาร
            hidePreview: !!(appMain && appMain.classList.contains('mobile-hide-preview')),
        };
        const applyRestore = function () {
            if (restore.f8708) body.classList.add('filter-8708');
            else if (restore.bg111) body.classList.add('filter-bg111');
            else if (restore.vehicle) body.classList.add('filter-vehicle');
            if (restore.hidePreview && appMain) appMain.classList.add('mobile-hide-preview');
        };

        setPdfBusy(true);
        showToast('กำลังสร้าง PDF …');

        let stage = null;
        try {
            ensureF8708BodyNarrativeFitted();
            ensureF8708NoteFooterReady();
            ensureF8708P3IntroReady();
            updatePackPageNumbers();
            // สลับเป็น «ทั้งหมด» + เปิดพรีวิวชั่วคราว เพื่อเก็บรายชื่อแผ่นครบชุดเหมือน Word (เคารพ no-vehicle)
            body.classList.remove('filter-8708', 'filter-bg111', 'filter-vehicle');
            if (appMain) appMain.classList.remove('mobile-hide-preview');
            await new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); });

            const root = document.getElementById('word-content');
            const boxes = Array.prototype.filter.call(
                root.querySelectorAll('.page-box'),
                function (el) { return el.offsetParent !== null && el.getClientRects().length > 0; }
            );
            if (!boxes.length) {
                showToast('ไม่มีหน้าเอกสารให้บันทึกเป็น PDF');
                return;
            }

            // โคลนแผ่นทั้งหมดไปเวทีนอกจอ — ตัด id ซ้ำออกกันชนกับฟอร์มจริง
            stage = document.createElement('div');
            stage.id = 'pdf-export-stage';
            stage.setAttribute('aria-hidden', 'true');
            boxes.forEach(function (b) {
                const c = b.cloneNode(true);
                c.removeAttribute('id');
                c.querySelectorAll('[id]').forEach(function (el) { el.removeAttribute('id'); });
                c.querySelectorAll('.no-print').forEach(function (n) { n.remove(); });
                c.querySelectorAll('[contenteditable]').forEach(function (n) {
                    n.removeAttribute('contenteditable');
                    n.removeAttribute('spellcheck');
                    n.removeAttribute('title');
                    if (n.style) {
                        n.style.boxShadow = '';
                        n.style.background = '';
                    }
                });
                stage.appendChild(c);
            });
            body.appendChild(stage);
            // คืนแท็บพรีวิวทันที — แผ่นในเวทีมี display:block !important ไม่โดนฟิลเตอร์
            applyRestore();

            // รอฟอนต์เอกสารและรูปแผนที่ให้พร้อมก่อนแรสเตอร์ (กันฟอนต์สำรอง/รูปครึ่งเดียว)
            try { await document.fonts.ready; } catch (e) { /* ไม่รองรับก็ข้าม */ }
            await Promise.all(Array.prototype.map.call(stage.querySelectorAll('img'), function (im) {
                return (im.decode ? im.decode() : Promise.resolve()).catch(function () {});
            }));
            await new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); });

            const pdf = new jsPDFCtor({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
            const pageW = pdf.internal.pageSize.getWidth();   // 210
            const pageH = pdf.internal.pageSize.getHeight();  // 297
            const pages = stage.children;
            let pdfPageCount = 0;
            let f8708Index = 0;

            for (let i = 0; i < pages.length; i++) {
                showToast('กำลังสร้าง PDF … หน้า ' + (i + 1) + '/' + pages.length);
                const pageEl = pages[i];
                const is8708 = pageEl.classList && pageEl.classList.contains('doc-section-8708');
                if (is8708) f8708Index += 1;
                const stampNo = (is8708 && f8708Index >= 2) ? f8708Index : 0;
                const canvas = await html2canvas(pageEl, {
                    scale: 2,
                    useCORS: true,
                    allowTaint: false,
                    backgroundColor: '#ffffff',
                    logging: false,
                    imageTimeout: 0,
                    // ล็อกขนาดหน้าต่างของสำเนาที่ html2canvas ใช้เรนเดอร์ — กัน media query จอแคบ
                    windowWidth: 1280,
                    windowHeight: 1832,
                });
                // ปกติ 1 แผ่น = 1 หน้า A4 พอดี (เลขหน้า .doc-page-num แสดงใน DOM ของแต่ละแผ่นแล้ว)
                const slices = slicePdfPageCanvas(canvas, Math.round(canvas.width * (pageH / pageW)));
                for (let s = 0; s < slices.length; s++) {
                    const part = slices[s];
                    if (pdfPageCount > 0) pdf.addPage();
                    pdfPageCount++;
                    // วาดเลขหน้าซ้ำบนแคนวาสด้วยเพื่อให้ชัวร์ว่าติด 100% ทุกหน้าแบบ 8708 (๑, ๒, ๓, ...)
                    if (stampNo) stampPdfPageNumber(part, stampNo + s);
                    const drawH = Math.min((part.height * pageW) / part.width, pageH);
                    pdf.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, pageW, drawH, undefined, 'FAST');
                }
            }

            pdf.save(buildDownloadFilename('pdf'));
            showToast('บันทึก PDF สำเร็จ');
        } catch (err) {
            console.error('[downloadPdf]', err);
            const msg = (err && /size|memory|canvas|allocation/i.test(String(err.message || err)))
                ? 'สร้าง PDF ไม่สำเร็จ — รูปแผนที่อาจใหญ่เกินไป ลองลดขนาด/จำนวนรูปแล้วลองใหม่'
                : 'สร้าง PDF ไม่สำเร็จ — ลองใหม่อีกครั้ง (หรือใช้ปุ่มพิมพ์ → บันทึกเป็น PDF)';
            showToast(msg);
        } finally {
            if (stage && stage.parentNode) stage.parentNode.removeChild(stage);
            applyRestore();
            setPdfBusy(false);
        }
    }

    /**
     * Word-native hard page break (HTML→.doc) — กลไกเดียว: BEFORE เท่านั้น
     * รูปแบบที่ Word ยอมรับจริง (ไม่ใช่แค่ CSS page-break บน div)
     */
    function wordHardPageBreakEl() {
        var p = document.createElement('p');
        p.className = 'doc-pagebreak-wrap';
        p.setAttribute(
            'style',
            'margin:0;padding:0;font-size:1pt;line-height:1pt;mso-line-height-rule:exactly;page-break-before:auto;'
        );
        var br = document.createElement('br');
        br.className = 'doc-pagebreak';
        br.setAttribute('clear', 'all');
        br.setAttribute(
            'style',
            'page-break-before:always;mso-break-type:page-break;'
        );
        p.appendChild(br);
        return p;
    }

    /** ห่อ .page-box เป็นตารางเต็มความกว้าง — Word ไม่ทำ float/absolute */
    function wrapWordPageBox(page) {
        if (page.parentNode && page.parentNode.classList && page.parentNode.classList.contains('word-page-cell')) {
            return page.closest('table.word-page-wrap') || page;
        }
        var table = document.createElement('table');
        table.className = 'word-page-wrap';
        table.setAttribute('width', '100%');
        table.setAttribute('border', '0');
        table.setAttribute('cellspacing', '0');
        table.setAttribute('cellpadding', '0');
        /* break อยู่ที่ br.doc-pagebreak ก่อนตารางเท่านั้น — ห้ามซ้ำบน table (กันหน้าเปล่า) */
        table.setAttribute(
            'style',
            'width:100%;border:none;border-collapse:collapse;' +
            'position:static !important;float:none !important;' +
            'mso-table-lspace:0pt;mso-table-rspace:0pt;' +
            'page-break-before:auto;page-break-after:auto;'
        );
        var tr = document.createElement('tr');
        var td = document.createElement('td');
        td.className = 'word-page-cell';
        td.setAttribute(
            'valign',
            'top'
        );
        td.setAttribute(
            'style',
            'border:none;padding:0;margin:0;position:static !important;float:none !important;vertical-align:top;'
        );
        if (page.parentNode) {
            page.parentNode.insertBefore(table, page);
        }
        td.appendChild(page);
        tr.appendChild(td);
        table.appendChild(tr);
        return table;
    }

    /**
     * ยืนยันว่ามี hard break ก่อน #page-bg111 / .page-box-bg111
     */
    function wordBreakSitsBeforeBg111(cloneRoot) {
        var bg = cloneRoot.querySelector('#page-bg111') || cloneRoot.querySelector('.page-box-bg111');
        if (!bg) return false;
        var node = bg;
        /* ถ้าห่อด้วย word-page-wrap ให้เช็คก่อนตารางห่อ */
        var wrap = bg.closest && bg.closest('table.word-page-wrap');
        if (wrap) node = wrap;
        var prev = node.previousSibling;
        while (prev && prev.nodeType === 3 && !(prev.textContent || '').trim()) {
            prev = prev.previousSibling;
        }
        if (!prev) return false;
        if (prev.nodeName === 'BR' && prev.classList && prev.classList.contains('doc-pagebreak')) {
            var st = (prev.getAttribute('style') || '').toLowerCase();
            return st.indexOf('page-break-before') !== -1 && st.indexOf('always') !== -1;
        }
        if (prev.nodeName === 'P' && prev.classList &&
            (prev.classList.contains('doc-pagebreak-wrap') || prev.classList.contains('WordPageBreak'))) {
            return true;
        }
        return false;
    }

    /**
     * บังคับคนละหน้า: 8708 → บก.111 → หน้างบ → แผนที่แต่ละวัน
     * - ใส่ Word-native <br mso-… page-break> ก่อนทุก .page-box (ยกเว้นหน้าแรก) — หนึ่งตัวเท่านั้น
     * - ห่อแต่ละหน้าเป็นตาราง static (ไม่มี float/absolute)
     * - ล้าง page-break บน .page-box เอง (กัน blank จาก before+after ซ้อน)
     * - ตัด wrapper #preview-map-pages ออก (กัน Word รวมหน้า)
     */
    function enforceWordPageBreaks(cloneRoot) {
        cloneRoot.querySelectorAll('br.doc-pagebreak, p.doc-pagebreak-wrap, p.WordPageBreak').forEach(function (n) { n.remove(); });
        /* คลายห่อเก่าถ้ามี (กันซ้อนเมื่อเรียกซ้ำ) */
        cloneRoot.querySelectorAll('table.word-page-wrap').forEach(function (tbl) {
            var cell = tbl.querySelector('td.word-page-cell');
            if (!cell || !tbl.parentNode) return;
            while (cell.firstChild) {
                tbl.parentNode.insertBefore(cell.firstChild, tbl);
            }
            tbl.remove();
        });

        var mapWrap = cloneRoot.querySelector('#preview-map-pages');
        if (mapWrap && mapWrap.parentNode) {
            while (mapWrap.firstChild) {
                mapWrap.parentNode.insertBefore(mapWrap.firstChild, mapWrap);
            }
            mapWrap.remove();
        }

        /* ตัด absolute/float ค้าง — ห้ามลบลายเซ็นหน้างบหลัง transform (ไม่มี .cover-sign-zone แล้ว) */
        cloneRoot.querySelectorAll('.xy').forEach(function (n) { n.remove(); });
        cloneRoot.querySelectorAll('.page-box-cover:not(.page-box-cover-word) .cover-sign-zone').forEach(function (n) {
            n.remove();
        });
        cloneRoot.querySelectorAll('.page-box-map:not(.page-box-map-word)').forEach(function (n) {
            var prev = n.previousSibling;
            if (prev && ((prev.nodeName === 'BR' && prev.classList && prev.classList.contains('doc-pagebreak')) ||
                (prev.nodeName === 'P' && prev.classList &&
                    (prev.classList.contains('doc-pagebreak-wrap') || prev.classList.contains('WordPageBreak'))))) {
                prev.remove();
            }
            n.remove();
        });
        cloneRoot.querySelectorAll('#page-vehicle-cover, .page-box-cover, #page-bg111, .page-box-bg111').forEach(function (n) {
            if (n.style.display === 'none') n.remove();
        });

        var pages = Array.prototype.slice.call(cloneRoot.querySelectorAll('.page-box')).filter(function (p) {
            return !p.style || p.style.display !== 'none';
        });

        pages.forEach(function (page, i) {
            var isFirst = i === 0;
            /* ล้าง break บนกล่อง — ใช้ br.doc-pagebreak ตัวเดียวระหว่างหน้า */
            var st = page.getAttribute('style') || '';
            st = st
                .replace(/page-break-before\s*:\s*[^;]+;?/gi, '')
                .replace(/page-break-after\s*:\s*[^;]+;?/gi, '')
                .replace(/break-before\s*:\s*[^;]+;?/gi, '')
                .replace(/break-after\s*:\s*[^;]+;?/gi, '')
                .replace(/position\s*:\s*[^;]+;?/gi, '')
                .replace(/float\s*:\s*[^;]+;?/gi, '')
                .replace(/padding\s*:\s*[^;]+;?/gi, '')
                .replace(/padding-(top|right|bottom|left)\s*:\s*[^;]+;?/gi, '')
                .replace(/min-height\s*:\s*[^;]+;?/gi, '')
                .replace(/(?:^|;)\s*height\s*:\s*[^;]+;?/gi, ';')
                .replace(/width\s*:\s*[^;]+;?/gi, '')
                .replace(/margin\s*:\s*[^;]+;?/gi, '')
                .replace(/overflow\s*:\s*[^;]+;?/gi, '');
            page.setAttribute(
                'style',
                st +
                ';position:static !important;float:none !important;left:auto;top:auto;' +
                'width:100% !important;max-width:173.5mm;margin:0 !important;padding:0 !important;' +
                'min-height:0 !important;height:auto !important;overflow:visible;' +
                'page-break-before:auto;break-before:auto;' +
                'page-break-after:auto;break-after:auto;'
            );
            /* บังคับลูกทุกโหนดเป็น static — กัน Word ทำ floating object
             * ยกเว้น .doc-page-num (relative + top ติดขอบบน — ห้ามรีเซ็ต) */
            page.querySelectorAll('*').forEach(function (el) {
                if (!el.style) return;
                if (el.classList && el.classList.contains('doc-page-num')) return;
                if (el.style.position && el.style.position !== 'static') {
                    el.style.position = 'static';
                    el.style.left = 'auto';
                    el.style.top = 'auto';
                }
                if (el.style.float && el.style.float !== 'none') {
                    el.style.float = 'none';
                }
            });
            page.querySelectorAll('table').forEach(function (t) {
                t.style.position = 'static';
                t.style.float = 'none';
            });

            var wrap = wrapWordPageBox(page);
            if (!isFirst && wrap.parentNode) {
                wrap.parentNode.insertBefore(wordHardPageBreakEl(), wrap);
            }
        });
    }

    function stripUiChromeFromWordClone(cloneRoot) {
        cloneRoot.querySelectorAll(
            '.no-print, .travel-day-row, button, input, select, textarea, ' +
            'label.day-fuel, .day-fuel, .day-map-wrap, .day-map-img, .day-map-file, ' +

        cloneRoot.querySelectorAll('[contenteditable]').forEach(function (n) {
            n.removeAttribute('contenteditable');
            n.removeAttribute('spellcheck');
            n.removeAttribute('title');
        });
        /* ลบเฉพาะโหนดใบที่ข้อความตรงปุ่ม UI — ห้ามลบ ancestor ที่ห่อ .page-box */
        var uiLabels = {
            'ดาวน์โหลด Word': 1,

            'เปิดแผนที่ DOH': 1,
            'บันทึก': 1,
            'พิมพ์ทั้งชุด': 1
        };
        Array.prototype.slice.call(cloneRoot.querySelectorAll('a, button, span')).forEach(function (n) {
            if (n.querySelector && n.querySelector('.page-box')) return;
            if (n.closest && n.closest('.page-box')) return;
            var t = (n.textContent || '').replace(/\s+/g, ' ').trim();
            if (uiLabels[t]) n.remove();
        });
        /* กันรูปนอก .map-frame / นอก page-box หลุดเข้า Word */
        Array.prototype.slice.call(cloneRoot.querySelectorAll('img')).forEach(function (img) {
            if (img.closest && img.closest('.map-frame, .map-word-outer')) return;
            if (img.closest && img.closest('.page-box-map, .page-box-map-word')) {
                img.remove();
                return;
            }
            /* รูปในฟอร์ม/พรีวิว UI ที่ไม่ใช่แผนที่ */
            if (!img.closest || !img.closest('.page-box')) img.remove();
        });
    }

    function exportToWord(elementId, filename = '') {

            td.setAttribute('style', 'text-align:left !important;padding:0;mso-padding-alt:0 0 0 0;text-indent:' + datePosPt + 'pt;mso-char-indent-count:0;white-space:nowrap;font-size:16pt;');
        });
        /* 8708: พรีวิวใช้ ::before spacer — Word ใช้ text-indent เท่าความกว้างป้ายเรียน */
        clone.querySelectorAll('.doc-section-8708 .f8708-narrative').forEach(function (el) {
            el.style.setProperty('text-indent', f8708BodyIndentPt, 'important');
            el.style.removeProperty('--f8708-body-indent');
        });
        /* เลขหน้า: ดึงขึ้นแถบขอบบน ไม่ดันเนื้อหา */
        clone.querySelectorAll('.page-box > .doc-page-num').forEach(function (el) {
            el.setAttribute(
                'style',
                'text-align:center;font-size:14pt;line-height:14pt;font-weight:400;' +
                'height:0;max-height:0;margin:0;padding:0;overflow:visible;' +
                'position:relative;top:-26.925pt;float:none;'
            );
        });
        // หน้างบ + แผนที่ + บก.111: แปลงเป็น flow layout (Word ไม่รองรับ .xy absolute)
        transformCoverPageForWord(clone);
        transformMapPagesForWord(clone);
        transformBg111ForWord(clone);
        // กันหัวแผนที่ .xy หลงเหลือหลังแปลง (สาเหตุหัวข้อซ้ำท้ายหน้าใน Word)
        clone.querySelectorAll('.page-box-map .xy, .page-box-map-word .xy, .page-box-cover .xy, .page-box-cover-word .xy').forEach(function (n) { n.remove(); });
        // บังคับ hard page break ระหว่างทุกหน้าเอกสาร (เรียกท้ายสุดหลัง transforms)
        enforceWordPageBreaks(clone);
        stripUiChromeFromWordClone(clone);

        /* กัน br ติดกัน / ซ้อน (ควรเหลือ 1 ต่อช่องว่างระหว่าง .page-box) */
        clone.querySelectorAll('br.doc-pagebreak').forEach(function (br) {
            var next = br.nextSibling;
            while (next && next.nodeType === 3 && !(next.textContent || '').trim()) {
                var blank = next;
                next = next.nextSibling;
                blank.remove();
            }
            while (next && next.nodeName === 'BR' && next.classList && next.classList.contains('doc-pagebreak')) {
                var dup = next;
                next = next.nextSibling;
                dup.remove();
            }
        });

        /* ยืนยัน: มี hard break ก่อน BG111 ใน markup ที่จะส่งเข้า Word */
        if (!wordBreakSitsBeforeBg111(clone)) {
            var bgNeed = clone.querySelector('#page-bg111') || clone.querySelector('.page-box-bg111');
            if (bgNeed) {
                var anchor = (bgNeed.closest && bgNeed.closest('table.word-page-wrap')) || bgNeed;
                if (anchor.parentNode) {
                    anchor.parentNode.insertBefore(wordHardPageBreakEl(), anchor);
                }
            }
        }

        var sourceHTML = header + clone.innerHTML + footer;

        /* ตรวจสตริง HTML สุดท้าย: ระหว่างท้าย 8708 กับ BG111 ต้องมี page-break element */
        (function verifyBg111BreakInExportHtml() {
            var marker = 'id="page-bg111"';
            var idx = sourceHTML.indexOf(marker);
            if (idx < 0) idx = sourceHTML.indexOf('page-box-bg111');
            if (idx < 0) return;
            /* หน้าต่างกว้าง — มี table.word-page-wrap คั่นระหว่าง br กับ id */
            var windowHtml = sourceHTML.slice(Math.max(0, idx - 2500), idx);
            var ok =
                /<br[^>]*class="[^"]*doc-pagebreak[^"]*"[^>]*page-break-before\s*:\s*always/i.test(windowHtml) ||
                /<br[^>]*page-break-before\s*:\s*always[^>]*mso-break-type\s*:\s*page-break/i.test(windowHtml) ||
                /<br[^>]*mso-break-type\s*:\s*page-break[^>]*page-break-before\s*:\s*always/i.test(windowHtml);
            try {
                window.__wordExportBg111BreakOk = !!ok;
                window.__wordExportBg111BreakSnippet = windowHtml.slice(-500);
            } catch (e) { /* ignore */ }
            if (!ok) {
                console.warn('[exportToWord] BG111 page-break missing in export HTML — injecting');
                var bgNeed2 = clone.querySelector('#page-bg111') || clone.querySelector('.page-box-bg111');
                if (bgNeed2) {
                    var anchor2 = (bgNeed2.closest && bgNeed2.closest('table.word-page-wrap')) || bgNeed2;
                    if (anchor2.parentNode) {
                        anchor2.parentNode.insertBefore(wordHardPageBreakEl(), anchor2);
                        sourceHTML = header + clone.innerHTML + footer;
                        try { window.__wordExportBg111BreakOk = true; } catch (e2) { /* ignore */ }
                    }
                }
            }
        })();
        
        var blob = new Blob(['\ufeff', sourceHTML], {
            type: 'application/msword'
        });
        
        var fileDownload = document.createElement("a");
        document.body.appendChild(fileDownload);
        
        if (navigator.msSaveOrOpenBlob) {
            navigator.msSaveOrOpenBlob(blob, filename);
        } else {
            var url = URL.createObjectURL(blob);
            fileDownload.href = url;
            fileDownload.download = filename ? filename : 'document.doc';
            fileDownload.click();
            setTimeout(function () {
                try { URL.revokeObjectURL(url); } catch (e) { /* ignore */ }
            }, 4000);
        }
        
        document.body.removeChild(fileDownload);
    }

    /* =========================================================================
     * ระบบจัดการงานเบิก (บันทึกงานเบิกนี้ / งานเบิกใหม่ / กลับมาแก้ไข / ย้อนกลับ-ทำซ้ำ)
     * รองรับ IndexedDB (เก็บรูปแผนที่ DOH ได้หลายงาน) พร้อม Fallback localStorage
     * ========================================================================= */
    window.__jobMgr = (function () {
        const DB_NAME = 'sida_8708_jobs_db';
        const DB_VER = 1;
        const STORE_NAME = 'jobs';
        const FALLBACK_LS_KEY = 'form8708_jobs_fallback_v1';
        const ACTIVE_META_KEY = 'form8708_active_job_meta_v1';
        const MAX_HISTORY = 30;

        let _dbPromise = null;
        let _useFallback = false;
        let _jobsCache = [];
        let _activeJobId = '';
        let _activeJobTitle = '';
        let _activeJobNote = '';
        let _activeJobUpdatedAt = '';
        let _isDirty = false;
        let _saveModalMode = 'save'; // 'save' | 'saveAs'

        // Undo / Redo state
        let _history = [];
        let _historyIndex = -1;
        let _historyTimer = null;
        let _isRestoring = false;
        let _initialized = false;

        function openDb() {
            if (_useFallback) return Promise.resolve(null);
            if (_dbPromise) return _dbPromise;
            _dbPromise = new Promise(function (resolve) {
                try {
                    if (typeof window.indexedDB === 'undefined' || !window.indexedDB) {
                        _useFallback = true;
                        resolve(null);
                        return;
                    }
                    const req = window.indexedDB.open(DB_NAME, DB_VER);
                    req.onupgradeneeded = function (ev) {
                        const db = ev.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                        }
                    };
                    req.onsuccess = function (ev) {
                        resolve(ev.target.result);
                    };
                    req.onerror = function () {
                        _useFallback = true;
                        resolve(null);
                    };
                } catch (e) {
                    _useFallback = true;
                    resolve(null);
                }
            });
            return _dbPromise;
        }

        function readFallbackJobs() {
            try {
                const raw = __sidaLS.getItem(FALLBACK_LS_KEY);
                const arr = raw ? JSON.parse(raw) : [];
                return Array.isArray(arr) ? arr : [];
            } catch (e) {
                return [];
            }
        }

        function writeFallbackJobs(list) {
            try {
                __sidaLS.setItem(FALLBACK_LS_KEY, JSON.stringify(list));
                return true;
            } catch (e) {
                // ถ้ารูปแผนที่ใหญ่เกินโควต้า localStorage ให้ตัดรูปออกเฉพาะตัวที่ใหญ่สุด
                try {
                    const slim = list.map(function (job) {
                        const copy = JSON.parse(JSON.stringify(job));
                        if (copy.formState && Array.isArray(copy.formState.travelDays)) {
                            copy.formState.travelDays.forEach(function (d) { d.mapDataUrl = ''; });
                        }
                        return copy;
                    });
                    __sidaLS.setItem(FALLBACK_LS_KEY, JSON.stringify(slim));
                    if (typeof showToast === 'function') showToast('พื้นที่เบราว์เซอร์จำกัด — บันทึกข้อมูลงานแล้ว (ตัดรูปแผนที่ออก)');
                    return true;
                } catch (e2) {
                    return false;
                }
            }
        }

        async function dbGetAll() {
            const db = await openDb();
            if (!db) return readFallbackJobs();
            return new Promise(function (resolve) {
                try {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const req = tx.objectStore(STORE_NAME).getAll();
                    req.onsuccess = function () {
                        resolve(Array.isArray(req.result) ? req.result : []);
                    };
                    req.onerror = function () { resolve(readFallbackJobs()); };
                } catch (e) {
                    resolve(readFallbackJobs());
                }
            });
        }

        async function dbPut(job) {
            const db = await openDb();
            if (!db) {
                const list = readFallbackJobs().filter(function (j) { return j.id !== job.id; });
                list.unshift(job);
                return writeFallbackJobs(list);
            }
            return new Promise(function (resolve) {
                try {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    tx.objectStore(STORE_NAME).put(job);
                    tx.oncomplete = function () { resolve(true); };
                    tx.onerror = function () { resolve(false); };
                } catch (e) {
                    resolve(false);
                }
            });
        }

        async function dbDelete(id) {
            const db = await openDb();
            if (!db) {
                const list = readFallbackJobs().filter(function (j) { return j.id !== id; });
                return writeFallbackJobs(list);
            }
            return new Promise(function (resolve) {
                try {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    tx.objectStore(STORE_NAME).delete(id);
                    tx.oncomplete = function () { resolve(true); };
                    tx.onerror = function () { resolve(false); };
                } catch (e) {
                    resolve(false);
                }
            });
        }

        function persistActiveMeta() {
            try {
                if (_activeJobId) {
                    __sidaLS.setItem(ACTIVE_META_KEY, JSON.stringify({
                        id: _activeJobId,
                        title: _activeJobTitle,
                        note: _activeJobNote,
                        updatedAt: _activeJobUpdatedAt
                    }));
                } else {
                    __sidaLS.removeItem(ACTIVE_META_KEY);
                }
            } catch (e) { /* ignore */ }
        }

        function loadActiveMeta() {
            try {
                const raw = __sidaLS.getItem(ACTIVE_META_KEY);
                if (!raw) return;
                const m = JSON.parse(raw);
                if (m && m.id) {
                    _activeJobId = String(m.id);
                    _activeJobTitle = String(m.title || '');
                    _activeJobNote = String(m.note || '');
                    _activeJobUpdatedAt = String(m.updatedAt || '');
                }
            } catch (e) { /* ignore */ }
        }

        function formatThaiDateTime(iso) {
            if (!iso) return '';
            try {
                const d = new Date(iso);
                if (isNaN(d.getTime())) return String(iso);
                const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
                const hh = String(d.getHours()).padStart(2, '0');
                const mm = String(d.getMinutes()).padStart(2, '0');
                return d.getDate() + ' ' + months[d.getMonth()] + ' ' + (d.getFullYear() + 543) + ' เวลา ' + hh + ':' + mm + ' น.';
            } catch (e) {
                return String(iso);
            }
        }

        function extractSummaryFromState(state) {
            const f = (state && state.fields) || {};
            const officer = (String(f['in-name-custom'] || '').trim() || String(f['in-name'] || '').trim() || 'ไม่ระบุผู้เบิก');
            let period = String(f['in-dep-my'] || '').trim();
            if (!period) {
                const m = String(f['in-doc-month'] || '').trim();
                const y = String(f['in-doc-year'] || '').trim();
                period = [m, y].filter(Boolean).join(' ');
            }
            const subject = String(f['in-subject'] || '').trim();
            const days = Array.isArray(state && state.travelDays) ? state.travelDays : [];
            const validDays = days.filter(function (d) {
                return d && (String(d.date || '').trim() || String(d.dest || '').trim() || String(d.km || '').trim());
            });
            const fuelDays = validDays.filter(function (d) { return !!d.fuel; });
            const mapCount = validDays.filter(function (d) { return !!(d.mapDataUrl && d.mapDataUrl.length > 30); }).length;
            const grandTotal = String(f['in-grand-total'] || '').trim() || '0.00';
            return {
                officerName: officer,
                periodText: period || 'ไม่ระบุเดือน',
                subject: subject,
                dayCount: validDays.length,
                fuelDayCount: fuelDays.length,
                mapCount: mapCount,
                grandTotal: grandTotal
            };
        }

        function buildAutoJobTitle(state) {
            const s = extractSummaryFromState(state);
            const parts = [s.officerName];
            if (s.periodText && s.periodText !== 'ไม่ระบุเดือน') parts.push(s.periodText);
            let title = parts.join(' — ');
            if (s.dayCount > 0) title += ' (' + s.dayCount + ' วัน)';
            return title.slice(0, 120);
        }

        function hasMeaningfulFormData() {
            try {
                const st = collectFormState();
                const s = extractSummaryFromState(st);
                if (s.officerName && s.officerName !== 'ไม่ระบุผู้เบิก') return true;
                if (s.dayCount > 0) return true;
                if (parseMoney(s.grandTotal) > 0) return true;
                return false;
            } catch (e) {
                return false;
            }
        }

        function updateJobsCountUI() {
            const count = _jobsCache.length;
            document.querySelectorAll('.js-saved-jobs-count').forEach(function (el) {
                el.textContent = String(count);
            });
        }

        function updateActiveJobBarUI() {
            const badge = document.getElementById('active-job-badge');
            const titleEl = document.getElementById('active-job-title-label');
            const dirtyEl = document.getElementById('active-job-dirty-dot');
            const timeEl = document.getElementById('active-job-saved-time');
            const renameBtn = document.getElementById('btn-rename-active-job');

            if (_activeJobId) {
                if (badge) {
                    badge.textContent = '📌 กำลังแก้ไข';
                    badge.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-sky-100 text-sky-900 border border-sky-300 shrink-0';
                }
                if (titleEl) {
                    titleEl.textContent = _activeJobTitle || 'งานเบิกที่บันทึกไว้';
                    titleEl.title = _activeJobTitle + (_activeJobNote ? ' — ' + _activeJobNote : '');
                }
                if (timeEl) timeEl.textContent = _activeJobUpdatedAt ? ('บันทึกล่าสุด ' + formatThaiDateTime(_activeJobUpdatedAt)) : '';
                if (renameBtn) renameBtn.classList.remove('hidden');
            } else {
                if (badge) {
                    badge.textContent = '📝 งานเบิกใหม่';
                    badge.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-900 border border-amber-300 shrink-0';
                }
                if (titleEl) {
                    titleEl.textContent = 'ยังไม่ได้บันทึกเป็นรายการงาน';
                    titleEl.title = 'กด "บันทึกงานเบิกนี้" เพื่อเก็บไว้กลับมาแก้ไขภายหลัง';
                }
                if (timeEl) timeEl.textContent = '';
                if (renameBtn) renameBtn.classList.add('hidden');
            }
            if (dirtyEl) dirtyEl.classList.toggle('hidden', !_isDirty);
            updateUndoRedoButtons();
        }

        function updateUndoRedoButtons() {
            const canUndo = _historyIndex > 0;
            const canRedo = _historyIndex >= 0 && _historyIndex < _history.length - 1;
            document.querySelectorAll('.js-btn-undo').forEach(function (btn) {
                btn.disabled = !canUndo;
                btn.title = canUndo
                    ? ('ย้อนกลับ: ' + (_history[_historyIndex].label || 'การแก้ไขล่าสุด') + ' (Ctrl+Z · เหลือ ' + _historyIndex + ' ขั้น)')
                    : 'ยังไม่มีรายการให้ย้อนกลับ';
            });
            document.querySelectorAll('.js-btn-redo').forEach(function (btn) {
                btn.disabled = !canRedo;
                btn.title = canRedo
                    ? ('ทำซ้ำ: ' + (_history[_historyIndex + 1].label || 'การแก้ไขถัดไป') + ' (Ctrl+Y)')
                    : 'ยังไม่มีรายการให้ทำซ้ำ';
            });
        }

        function pushHistorySnapshot(label) {
            if (_isRestoring || typeof collectFormState !== 'function') return;
            try {
                const stateJson = JSON.stringify(collectFormState());
                const cur = _history[_historyIndex];
                if (cur && cur.stateJson === stateJson && cur.activeJobId === _activeJobId) {
                    return;
                }
                if (_historyIndex < _history.length - 1) {
                    _history = _history.slice(0, _historyIndex + 1);
                }
                _history.push({
                    stateJson: stateJson,
                    activeJobId: _activeJobId,
                    activeJobTitle: _activeJobTitle,
                    activeJobNote: _activeJobNote,
                    activeJobUpdatedAt: _activeJobUpdatedAt,
                    label: label || 'แก้ไขข้อมูล',
                    ts: Date.now()
                });
                if (_history.length > MAX_HISTORY) {
                    _history.shift();
                }
                _historyIndex = _history.length - 1;
                updateUndoRedoButtons();
            } catch (e) { /* ignore */ }
        }

        function onFormMutated() {
            if (_isRestoring || !_initialized) return;
            _isDirty = true;
            updateActiveJobBarUI();
            clearTimeout(_historyTimer);
            _historyTimer = setTimeout(function () {
                pushHistorySnapshot('แก้ไขข้อมูลในฟอร์ม');
            }, 700);
        }

        function restoreFromSnapshot(snap, directionText) {
            if (!snap) return;
            _isRestoring = true;
            try {
                clearTimeout(_historyTimer);
                const parsed = JSON.parse(snap.stateJson);
                _activeJobId = snap.activeJobId || '';
                _activeJobTitle = snap.activeJobTitle || '';
                _activeJobNote = snap.activeJobNote || '';
                _activeJobUpdatedAt = snap.activeJobUpdatedAt || '';
                persistActiveMeta();
                applyFormState(parsed);
                if (typeof saveDraft === 'function') saveDraft(false);
                _isDirty = true;
                updateActiveJobBarUI();
                if (typeof showToast === 'function') showToast(directionText);
            } catch (e) {
                if (typeof showToast === 'function') showToast('ย้อนกลับไม่สำเร็จ');
            } finally {
                setTimeout(function () { _isRestoring = false; }, 120);
            }
        }

        function undo() {
            // บันทึกสถานะปัจจุบันก่อนถอย เผื่อเพิ่งพิมพ์ยังไม่ครบ debounce 700ms
            if (!_isRestoring) {
                clearTimeout(_historyTimer);
                pushHistorySnapshot('แก้ไขล่าสุด');
            }
            if (_historyIndex <= 0) {
                if (typeof showToast === 'function') showToast('ไม่มีรายการก่อนหน้าให้ย้อนกลับแล้ว');
                return;
            }
            _historyIndex--;
            const snap = _history[_historyIndex];
            restoreFromSnapshot(snap, '↩️ ย้อนกลับแล้ว (เหลืออีก ' + _historyIndex + ' ขั้น)');
        }

        function redo() {
            if (_historyIndex < 0 || _historyIndex >= _history.length - 1) {
                if (typeof showToast === 'function') showToast('ไม่มีรายการถัดไปให้ทำซ้ำ');
                return;
            }
            _historyIndex++;
            const snap = _history[_historyIndex];
            const remain = (_history.length - 1) - _historyIndex;
            restoreFromSnapshot(snap, '↪️ ทำซ้ำแล้ว' + (remain > 0 ? ' (เหลืออีก ' + remain + ' ขั้น)' : ''));
        }

        async function refreshJobsCache() {
            const list = await dbGetAll();
            list.sort(function (a, b) {
                return String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''));
            });
            _jobsCache = list;
            // ถ้า activeJobId ถูกลบไปแล้วให้เคลียร์ออก
            if (_activeJobId && !_jobsCache.some(function (j) { return j.id === _activeJobId; })) {
                _activeJobId = '';
                _activeJobTitle = '';
                _activeJobNote = '';
                _activeJobUpdatedAt = '';
                persistActiveMeta();
            }
            updateJobsCountUI();
            updateActiveJobBarUI();
            return _jobsCache;
        }

        async function saveJobRecord(opts) {
            opts = opts || {};
            const state = collectFormState();
            const sum = extractSummaryFromState(state);
            const nowIso = new Date().toISOString();
            const isUpdate = !!(opts.id && !opts.forceNew);
            const existing = isUpdate ? _jobsCache.find(function (j) { return j.id === opts.id; }) : null;
            const id = isUpdate ? opts.id : ('job_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7));
            const title = String(opts.title || '').trim() || buildAutoJobTitle(state);
            const note = String(opts.note != null ? opts.note : (existing ? existing.note : '')).trim();

            const record = {
                id: id,
                title: title,
                note: note,
                officerName: sum.officerName,
                periodText: sum.periodText,
                subject: sum.subject,
                dayCount: sum.dayCount,
                fuelDayCount: sum.fuelDayCount,
                mapCount: sum.mapCount,
                grandTotal: sum.grandTotal,
                createdAt: (existing && existing.createdAt) ? existing.createdAt : nowIso,
                updatedAt: nowIso,
                formState: state
            };

            const ok = await dbPut(record);
            if (!ok) {
                if (typeof showToast === 'function') showToast('บันทึกงานเบิกไม่สำเร็จ');
                return null;
            }
            _activeJobId = record.id;
            _activeJobTitle = record.title;
            _activeJobNote = record.note;
            _activeJobUpdatedAt = record.updatedAt;
            _isDirty = false;
            persistActiveMeta();
            if (typeof saveDraft === 'function') saveDraft(false);
            await refreshJobsCache();
            pushHistorySnapshot('บันทึกงาน: ' + record.title);
            return record;
        }

        async function saveCurrentJob() {
            if (_activeJobId) {
                const rec = await saveJobRecord({
                    id: _activeJobId,
                    title: _activeJobTitle,
                    note: _activeJobNote
                });
                if (rec && typeof showToast === 'function') {
                    showToast('💾 บันทึกงานเบิก "' + rec.title + '" แล้ว');
                }
                return;
            }

        async function exportBackupJson() {
            await refreshJobsCache();
            if (!_jobsCache.length) {
                if (typeof showToast === 'function') showToast('ยังไม่มีงานเบิกให้ส่งออก');
                return;
            }
            const payload = {
                app: 'sida_8708_jobs_backup',
                version: 1,
                exportedAt: new Date().toISOString(),
                jobs: _jobsCache
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const d = new Date();
            const stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            a.href = url;
            a.download = 'งานเบิก_แบบ8708_อสีดา_' + stamp + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 3000);
            if (typeof showToast === 'function') showToast('📤 ส่งออกไฟล์สำรอง ' + _jobsCache.length + ' งานแล้ว');
        }

        async function handleImportBackupFile(input) {
            const file = input && input.files && input.files[0];
            if (!file) return;
            try {
                const text = await file.text();
                const parsed = JSON.parse(text);
                const jobs = Array.isArray(parsed) ? parsed : (Array.isArray(parsed && parsed.jobs) ? parsed.jobs : []);
                if (!jobs.length) {
                    if (typeof showToast === 'function') showToast('ไม่พบรายการงานเบิกในไฟล์นี้');
                    return;
                }
                let imported = 0;
                for (let i = 0; i < jobs.length; i++) {
                    const j = jobs[i];
                    if (!j || !j.formState) continue;
                    if (!j.id) j.id = 'job_' + Date.now() + '_' + i;
                    await dbPut(j);
                    imported++;
                }
                await refreshJobsCache();
                renderJobsList();
                if (typeof showToast === 'function') showToast('📥 นำเข้างานเบิกสำเร็จ ' + imported + ' รายการ');
            } catch (e) {
                if (typeof showToast === 'function') showToast('อ่านไฟล์สำรองไม่สำเร็จ กรุณาตรวจสอบไฟล์ .json');
            } finally {
                if (input) input.value = '';
            }
        }

        function bindKeyboardShortcuts() {
            document.addEventListener('keydown', function (ev) {
                if (ev.key === 'Escape') {
                    closeSaveModal();
                    closeNewJobModal();
                    closeJobsModal();
                    return;
                }
                if ((ev.ctrlKey || ev.metaKey) && !ev.altKey) {
                    const k = String(ev.key || '').toLowerCase();
                    if (k === 's') {
                        ev.preventDefault();
                        saveCurrentJob();
                        return;
                    }
                    const active = document.activeElement;
                    const isTextEditing = active && (
                        active.tagName === 'TEXTAREA' ||
                        (active.tagName === 'INPUT' && !/^(checkbox|radio|button|submit|reset)$/i.test(active.type)) ||
                        active.isContentEditable
                    );
                    if (!isTextEditing) {
                        if (k === 'z' && !ev.shiftKey) {
                            ev.preventDefault();
                            undo();
                        } else if (k === 'y' || (k === 'z' && ev.shiftKey)) {
                            ev.preventDefault();
                            redo();
                        }
                    }
                }
            });

            // Enter ในช่องตั้งชื่องานเบิก = บันทึกทันที
            ['job-save-title-input', 'job-save-note-input'].forEach(function (id) {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('keydown', function (ev) {
                        if (ev.key === 'Enter') {
                            ev.preventDefault();
                            confirmSaveModal();
                        }
                    });
                }
            });
        }

            if (_initialized) return;
